name: Electron Full Harness CI

on:
  workflow_dispatch:
  push:
    branches:
      - release/v0.6.0
    paths:
      - .github/workflows/electron-full-harness-ci.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: electron-full-harness-ci-v0.6.0
  cancel-in-progress: false

env:
  BUN_VERSION: '1.4.0'
  NODE_VERSION: '22'
  RUST_TOOLCHAIN: '1.98.1'
  RELEASE_VERSION: '0.6.0'
  RELEASE_TAG: 'v0.6.0'
  SOURCE_SHA: ${{ github.sha }}
  WINDOWS_INSTALLER: Coding.Tools_0.6.0_windows_x64_setup.exe
  TUNNEL_ARCHIVE: tunnel-client-v0.0.12-windows-amd64.zip
  TUNNEL_ARCHIVE_SHA256: '2a2804933924e38a502d62b61f0266cb80d56d65744f4c29876b2bf9c1544356'
  TUNNEL_RELEASE_URL: https://github.com/openai/tunnel-client/releases/download/v0.0.12
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source_contract:
    name: Stable source and release contract
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Verify exact stable source identity
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/tmp aiTemp/Trash/v060-stable-source
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin \
            refs/heads/release/v0.6.0:refs/remotes/origin/release/v0.6.0
          node scripts/release/verify-source-scope-v0.6.0.mjs \
            --tag "$RELEASE_TAG" \
            --source "$SOURCE_SHA" \
            --allowed-ref origin/release/v0.6.0 \
            --json-out aiTemp/evidence/source-scope.json
          node --input-type=module <<'NODE' | tee aiTemp/evidence/product-identity.json
          import fs from 'node:fs';
          const desktop = JSON.parse(fs.readFileSync('desktop-electron/package.json', 'utf8'));
          const integration = JSON.parse(fs.readFileSync('runtime-web/CODING_TOOLS_INTEGRATION.json', 'utf8'));
          const expected = {
            version: '0.6.0',
            appId: 'dev.codingtools.fullharness',
            productName: 'Coding Tools',
            electron: '41.10.7',
            upstreamTag: 'v5.0.6',
            upstreamCommit: 'e85e3693fdb4e3e033348c08df0298c20fcdb612',
          };
          const actual = {
            version: desktop.version,
            appId: desktop.build?.appId,
            productName: desktop.build?.productName,
            electron: desktop.devDependencies?.electron,
            upstreamTag: integration.upstream?.tag,
            upstreamCommit: integration.upstream?.commit,
          };
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`STABLE_PRODUCT_IDENTITY_MISMATCH: ${JSON.stringify(actual)}`);
          }
          if (desktop.build?.nsis?.perMachine !== false || desktop.build?.nsis?.allowElevation !== false) {
            throw new Error('WINDOWS_INSTALLER_MUST_REMAIN_PER_USER_WITHOUT_ELEVATION');
          }
          process.stdout.write(`${JSON.stringify(actual, null, 2)}\n`);
          NODE

      - name: Run focused release-policy verification
        run: |
          set -euo pipefail
          node --check scripts/release/verify-source-scope-v0.6.0.mjs
          node --check scripts/release/verify-assets-v0.6.0.mjs
          node --check scripts/release/publish-v0.6.0.mjs
          node scripts/verify-vendored-upstream.mjs \
            2>&1 | tee aiTemp/evidence/upstream-verification.txt
          node --test \
            tests/no-delete-policy.test.mjs \
            desktop-electron/tests/product-identity.test.cjs \
            desktop-electron/tests/package-resource-preparation.test.cjs \
            desktop-electron/tests/package-contents.test.cjs \
            2>&1 | tee aiTemp/evidence/focused-release-tests.txt
          grep -F '# fail 0' aiTemp/evidence/focused-release-tests.txt
          cargo metadata --locked \
            --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            --format-version 1 > aiTemp/evidence/headless-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('aiTemp/evidence/headless-metadata.json').read_text(encoding='utf-8'))
          versions = sorted({p['version'] for p in metadata['packages'] if p['name'] == 'rustls'})
          if versions != ['0.23.45']:
              raise SystemExit(f'Unexpected rustls lock: {versions}')
          print('RUSTLS_LOCK_OK', versions)
          PY
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git diff --diff-filter=D --name-only)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: electron-source-contract-${{ github.sha }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14

  windows_installer:
    name: Windows x64 integrated installer
    if: github.actor == github.repository_owner
    needs: source_contract
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/v060-stable-cargo-target
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/v060-stable-bun-cache
      CODING_TOOLS_RETENTION_ROOT: ${{ github.workspace }}/aiTemp/source/aiTemp/Trash/v060-stable-package
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install exact dependencies into retained temporary roots
        run: |
          set -euo pipefail
          mkdir -p \
            aiTemp/evidence \
            aiTemp/tmp \
            aiTemp/Trash/v060-stable-package \
            aiTemp/release-output
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          preload="$(node -e 'const { pathToFileURL } = require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href);' "$preload")"
          export NODE_OPTIONS="--import=$preload"
          absolute_tmp="$PWD/aiTemp/tmp"
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd runtime-web \
            2>&1 | tee aiTemp/evidence/runtime-install.txt
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd runtime-web/launcher \
            2>&1 | tee aiTemp/evidence/runtime-launcher-install.txt
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd desktop-electron \
            2>&1 | tee aiTemp/evidence/desktop-install.txt

      - name: Run focused integrated harness checks
        run: |
          set -euo pipefail
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          preload="$(node -e 'const { pathToFileURL } = require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href);' "$preload")"
          export NODE_OPTIONS="--import=$preload"
          node --test \
            desktop-electron/tests/no-delete-preload.test.cjs \
            desktop-electron/tests/product-identity.test.cjs \
            desktop-electron/tests/package-resource-preparation.test.cjs \
            desktop-electron/tests/package-contents.test.cjs \
            2>&1 | tee aiTemp/evidence/desktop-focused-tests.txt
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron typecheck \
            2>&1 | tee aiTemp/evidence/desktop-typecheck.txt
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun test --cwd runtime-web \
              tests/codex-smoke-path.test.ts \
              tests/codex-integration.test.ts \
              tests/chatgpt-web-models.test.ts \
            2>&1 | tee aiTemp/evidence/runtime-focused-tests.txt
          cargo test --locked \
            --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            2>&1 | tee aiTemp/evidence/headless-tests.txt
          bun audit --cwd runtime-web \
            2>&1 | tee aiTemp/evidence/runtime-audit.txt
          bun audit --cwd desktop-electron \
            2>&1 | tee aiTemp/evidence/desktop-audit.txt

      - name: Acquire checksum-pinned official tunnel client
        run: |
          set -euo pipefail
          input_dir="aiTemp/input/tunnel-client/v0.0.12/windows-amd64"
          archive="$input_dir/$TUNNEL_ARCHIVE"
          partial="$archive.partial"
          url="$TUNNEL_RELEASE_URL/$TUNNEL_ARCHIVE"
          mkdir -p "$input_dir"
          test ! -e "$archive"
          test ! -e "$partial"
          curl.exe --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$partial" "$url"
          test -s "$partial"
          actual="$(sha256sum "$partial" | awk '{print $1}')"
          test "$actual" = "$TUNNEL_ARCHIVE_SHA256"
          mv --no-clobber "$partial" "$archive"
          test -s "$archive"
          echo "CODING_TOOLS_TUNNEL_CLIENT_ARCHIVE=$PWD/$archive" >> "$GITHUB_ENV"
          printf 'url=%s\nsha256=%s\n' "$url" "$actual" \
            > aiTemp/evidence/tunnel-client.txt

      - name: Build Rust sidecar and Electron installer
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            2>&1 | tee aiTemp/evidence/headless-build.txt
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          preload="$(node -e 'const { pathToFileURL } = require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href);' "$preload")"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron package:win \
            2>&1 | tee aiTemp/evidence/windows-package.txt

      - name: Verify packaged harness and materialize stable EXE
        run: |
          set -euo pipefail
          mapfile -t roots < <(
            for candidate in desktop-electron/artifacts desktop-electron/release; do
              test -d "$candidate" && printf '%s\n' "$candidate"
            done
          )
          test "${#roots[@]}" -eq 1
          package_root="${roots[0]}"
          node desktop-electron/scripts/verify-package.cjs "$package_root" \
            --source "$SOURCE_SHA" \
            --json-out aiTemp/evidence/package-verification.json \
            2>&1 | tee aiTemp/evidence/package-verification.txt
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          preload="$(node -e 'const { pathToFileURL } = require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href);' "$preload")"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron smoke:package \
            2>&1 | tee aiTemp/evidence/package-smoke.txt
          mapfile -t installers < <(find "$package_root" -maxdepth 1 -type f -iname '*.exe' -print)
          test "${#installers[@]}" -eq 1
          output="aiTemp/release-output/$WINDOWS_INSTALLER"
          test ! -e "$output"
          cp --no-clobber "${installers[0]}" "$output"
          node --input-type=module <<'NODE' | tee aiTemp/evidence/installer-verification.json
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const path = `aiTemp/release-output/${process.env.WINDOWS_INSTALLER}`;
          const bytes = fs.readFileSync(path);
          if (bytes.length < 100000) throw new Error(`INSTALLER_TOO_SMALL: ${bytes.length}`);
          if (bytes.subarray(0, 2).toString('ascii') !== 'MZ') throw new Error('INSTALLER_MZ_HEADER_MISSING');
          const result = {
            name: process.env.WINDOWS_INSTALLER,
            size: bytes.length,
            sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
            source_sha: process.env.SOURCE_SHA,
          };
          process.stdout.write(`${JSON.stringify(result, null, 2)}\n`);
          NODE
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git diff --diff-filter=D --name-only)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: electron-windows-installer-${{ github.sha }}
          path: aiTemp/source/aiTemp/release-output/Coding.Tools_0.6.0_windows_x64_setup.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: electron-windows-evidence-${{ github.sha }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14

  publish_release:
    name: Publish and independently verify latest v0.6.0
    if: github.actor == github.repository_owner
    needs:
      - source_contract
      - windows_installer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: electron-windows-installer-${{ github.sha }}
          path: aiTemp/source/aiTemp/downloaded-installer

      - name: Build exact release evidence and verify local assets
        run: |
          set -euo pipefail
          mkdir -p aiTemp/release-assets aiTemp/publication-evidence aiTemp/readback aiTemp/Trash/v060-publication
          mapfile -t installers < <(find aiTemp/downloaded-installer -type f -name "$WINDOWS_INSTALLER" -print)
          test "${#installers[@]}" -eq 1
          cp --no-clobber "${installers[0]}" "aiTemp/release-assets/$WINDOWS_INSTALLER"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'aiTemp/release-assets';
          const installerName = process.env.WINDOWS_INSTALLER;
          const installer = fs.readFileSync(path.join(root, installerName));
          const sha256 = crypto.createHash('sha256').update(installer).digest('hex');
          const provenance = {
            schema: 1,
            release_tag: process.env.RELEASE_TAG,
            version: process.env.RELEASE_VERSION,
            source_sha: process.env.SOURCE_SHA,
            product: { name: 'Coding Tools', app_id: 'dev.codingtools.fullharness' },
            upstream: {
              repository: 'miuuyy/codex-chatgpt-web',
              version: 'v5.0.6',
              commit: 'e85e3693fdb4e3e033348c08df0298c20fcdb612',
            },
            validation_run: {
              id: Number(process.env.GITHUB_RUN_ID),
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              workflow: '.github/workflows/electron-full-harness-ci.yml',
            },
            assets: [{ name: installerName, sha256, size: installer.length }],
          };
          const validation = {
            automated_gates: 'passed',
            live_account_acceptance: 'pending_manual',
            source_sha: process.env.SOURCE_SHA,
            validation_run_id: Number(process.env.GITHUB_RUN_ID),
            validation_workflow: '.github/workflows/electron-full-harness-ci.yml',
            validation_conclusion: 'success',
          };
          fs.writeFileSync(path.join(root, 'provenance.json'), `${JSON.stringify(provenance, null, 2)}\n`);
          fs.writeFileSync(path.join(root, 'validation-evidence.json'), `${JSON.stringify(validation, null, 2)}\n`);
          const names = fs.readdirSync(root).filter((name) => name !== 'SHA256SUMS.txt').sort();
          const sums = names.map((name) => {
            const bytes = fs.readFileSync(path.join(root, name));
            return `${crypto.createHash('sha256').update(bytes).digest('hex')}  ${name}`;
          });
          fs.writeFileSync(path.join(root, 'SHA256SUMS.txt'), `${sums.join('\n')}\n`);
          NODE
          node scripts/release/verify-assets-v0.6.0.mjs \
            --directory aiTemp/release-assets \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --source "$SOURCE_SHA" \
            --json-out aiTemp/publication-evidence/prepublish-assets.json

      - name: Publish stable release after remote asset readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release/publish-v0.6.0.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --source "$SOURCE_SHA" \
            --assets aiTemp/release-assets \
            --notes docs/releases/v0.6.0.md \
            --json-out aiTemp/publication-evidence/publication.json

      - name: Independently re-download and verify latest release EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            > aiTemp/readback/latest-release.json
          asset_id="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('aiTemp/readback/latest-release.json', 'utf8'));
          if (release.tag_name !== process.env.RELEASE_TAG || release.draft || release.prerelease) {
            throw new Error(`LATEST_RELEASE_MISMATCH: ${release.tag_name}`);
          }
          const names = release.assets.map((asset) => asset.name).sort();
          const expected = [
            process.env.WINDOWS_INSTALLER,
            'SHA256SUMS.txt',
            'provenance.json',
            'validation-evidence.json',
          ].sort();
          if (JSON.stringify(names) !== JSON.stringify(expected)) {
            throw new Error(`LATEST_ASSET_INVENTORY_MISMATCH: ${JSON.stringify(names)}`);
          }
          const installer = release.assets.find((asset) => asset.name === process.env.WINDOWS_INSTALLER);
          process.stdout.write(String(installer.id));
          NODE
          )"
          gh api \
            -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            > "aiTemp/readback/$WINDOWS_INSTALLER"
          node --input-type=module <<'NODE' | tee aiTemp/readback/independent-verification.json
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const installerPath = `aiTemp/readback/${process.env.WINDOWS_INSTALLER}`;
          const bytes = fs.readFileSync(installerPath);
          const sums = fs.readFileSync('aiTemp/release-assets/SHA256SUMS.txt', 'utf8');
          const expected = sums.split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean)
            .map((line) => line.split(/\s{2}/))
            .find(([, name]) => name === process.env.WINDOWS_INSTALLER)?.[0];
          const actual = crypto.createHash('sha256').update(bytes).digest('hex');
          if (!expected || actual !== expected) throw new Error(`READBACK_SHA256_MISMATCH: ${actual}`);
          if (bytes.length < 100000) throw new Error(`READBACK_INSTALLER_TOO_SMALL: ${bytes.length}`);
          if (bytes.subarray(0, 2).toString('ascii') !== 'MZ') throw new Error('READBACK_MZ_HEADER_MISSING');
          const result = {
            release_tag: process.env.RELEASE_TAG,
            latest: true,
            name: process.env.WINDOWS_INSTALLER,
            size: bytes.length,
            sha256: actual,
            source_sha: process.env.SOURCE_SHA,
          };
          process.stdout.write(`${JSON.stringify(result, null, 2)}\n`);
          NODE
          git fetch --tags origin
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$SOURCE_SHA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: electron-v060-publication-${{ github.sha }}
          path: |
            aiTemp/source/aiTemp/publication-evidence/
            aiTemp/source/aiTemp/readback/
          if-no-files-found: error
          retention-days: 14
