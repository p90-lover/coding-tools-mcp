name: Materialize v0.6 Rust lockfiles

on:
  push:
    branches:
      - feature/electron-full-codex-harness-0.6.0
    paths:
      - .github/workflows/v060-materialize-lockfiles.yml

permissions:
  contents: write

concurrency:
  group: v060-materialize-lockfiles
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/v060-lock-target
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Generate exact lockfiles and verify them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/v060-lock-evidence Trash/v060-release-bootstrap/${GITHUB_RUN_ID}
          cargo generate-lockfile --manifest-path rust-core/coding-tools-core/Cargo.toml
          cargo generate-lockfile --manifest-path rust-core/coding-tools-headless/Cargo.toml
          cargo metadata --locked --manifest-path rust-core/coding-tools-core/Cargo.toml --format-version 1 \
            > aiTemp/v060-lock-evidence/core-metadata.json
          cargo metadata --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml --format-version 1 \
            > aiTemp/v060-lock-evidence/headless-metadata.json
          test -s rust-core/coding-tools-core/Cargo.lock
          test -s rust-core/coding-tools-headless/Cargo.lock
          grep -F 'name = "coding-tools-core"' rust-core/coding-tools-core/Cargo.lock
          grep -F 'name = "coding-tools-headless"' rust-core/coding-tools-headless/Cargo.lock
          sha256sum \
            rust-core/coding-tools-core/Cargo.lock \
            rust-core/coding-tools-headless/Cargo.lock \
            > aiTemp/v060-lock-evidence/SHA256SUMS.txt
      - name: Retain this one-shot workflow and commit only release inputs
        shell: bash
        run: |
          set -euo pipefail
          retained="Trash/v060-release-bootstrap/${GITHUB_RUN_ID}/v060-materialize-lockfiles.yml"
          git mv .github/workflows/v060-materialize-lockfiles.yml "$retained"
          git add -- \
            rust-core/coding-tools-core/Cargo.lock \
            rust-core/coding-tools-headless/Cargo.lock \
            "$retained"
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          expected=$(printf '%s\n' \
            rust-core/coding-tools-core/Cargo.lock \
            rust-core/coding-tools-headless/Cargo.lock \
            .github/workflows/v060-materialize-lockfiles.yml \
            "$retained" | sort)
          actual=$(git diff --cached --name-only --no-renames | sort)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: materialize verified v0.6 Rust lockfiles'
          git push origin "HEAD:feature/electron-full-codex-harness-0.6.0"
          git rev-parse HEAD > aiTemp/v060-lock-evidence/source.commit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v060-lockfiles-${{ github.run_id }}
          path: aiTemp/v060-lock-evidence/
          if-no-files-found: error
          retention-days: 14
