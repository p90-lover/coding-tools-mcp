name: Archive completed Provider Hub current materializer

on:
  push:
    branches:
      - integration/v0.7.0-rc.2-provider-hub-current
    paths:
      - .github/workflows/apply-provider-hub-current.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-provider-hub-current-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive-preserved-materializer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - name: Move completed materializer into aiTemp Trash
        run: |
          set -euo pipefail
          workflows="aiTemp/Trash/provider-hub-current/obsolete-workflows"
          recipes="aiTemp/Trash/provider-hub-current/obsolete-recipes"
          mkdir -p "$workflows" "$recipes" aiTemp/evidence

          test -f .github/workflows/apply-provider-hub-current.yml
          test -f aiTemp/provider-hub-current/apply_current_release.py

          git mv .github/workflows/apply-provider-hub-current.yml \
            "$workflows/apply-provider-hub-current.yml"
          git mv aiTemp/provider-hub-current/apply_current_release.py \
            "$recipes/apply_current_release.py"

          git diff --cached -M --check
          deleted="$(git diff --cached -M --diff-filter=D --name-only)"
          if [ -n "$deleted" ]; then
            printf 'Unexpected deletion instead of preservation move:\n%s\n' "$deleted" >&2
            exit 1
          fi
          git diff --cached -M --name-status | tee aiTemp/evidence/provider-hub-current-materializer-archive.txt
          python - <<'PY'
          import subprocess

          expected = {
              'aiTemp/Trash/provider-hub-current/obsolete-workflows/apply-provider-hub-current.yml',
              'aiTemp/Trash/provider-hub-current/obsolete-recipes/apply_current_release.py',
          }
          rows = subprocess.check_output(
              ['git', 'diff', '--cached', '-M', '--name-status'], text=True
          ).splitlines()
          targets = set()
          for row in rows:
              parts = row.split('\t')
              if not parts or parts[0].startswith('D'):
                  raise SystemExit(f'ARCHIVE_DELETE_FORBIDDEN:{row}')
              if parts[0].startswith('R') and len(parts) == 3:
                  targets.add(parts[2])
          missing = sorted(expected - targets)
          if missing:
              raise SystemExit(f'ARCHIVE_TARGETS_MISSING:{missing}')
          print('PROVIDER_HUB_CURRENT_MATERIALIZER_ARCHIVED')
          PY

      - name: Commit preservation moves safely
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(provider-hub): preserve completed current materializer in Trash'

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            remote_head="$(git rev-parse FETCH_HEAD)"
            if ! git merge-base --is-ancestor "$remote_head" HEAD; then
              git rebase "$remote_head"
            fi
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              exit 0
            fi
          done
          echo 'Unable to publish preservation move after three race-safe attempts' >&2
          exit 1
