name: Apply Paseo and Anneal 0.7 headless bridge

on:
  push:
    branches:
      - fix/0.7-paseo-anneal-wiring
    paths:
      - .github/workflows/apply-paseo-anneal-0.7-headless-bridge.yml
      - aiTemp/paseo-anneal-0.7/apply_headless_bridge.py
      - aiTemp/paseo-anneal-0.7/wiring_contract.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-paseo-anneal-07-headless-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt

      - name: Apply exact-count headless bridge
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/Trash/paseo-anneal-07
          python aiTemp/paseo-anneal-0.7/apply_headless_bridge.py \
            2>&1 | tee aiTemp/evidence/paseo-anneal-headless-bridge.txt
          test "$(grep -Ec 'PASEO_ANNEAL_BRIDGE_(APPLIED|ALREADY_APPLIED)' aiTemp/evidence/paseo-anneal-headless-bridge.txt)" -eq 5

      - name: Format and verify source contract
        run: |
          set -euo pipefail
          rustfmt --edition 2021 \
            src-tauri/src/commands/execution.rs \
            rust-core/coding-tools-core/src/lib.rs \
            rust-core/coding-tools-headless/src/lib.rs
          python aiTemp/paseo-anneal-0.7/wiring_contract.py \
            2>&1 | tee aiTemp/evidence/paseo-anneal-wiring-contract.txt
          grep -F PASEO_ANNEAL_07_WIRING_CONTRACT_OK \
            aiTemp/evidence/paseo-anneal-wiring-contract.txt
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"

      - name: Enforce bounded bridge diff
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              'src-tauri/src/lib.rs',
              'src-tauri/src/commands/execution.rs',
              'rust-core/coding-tools-core/src/lib.rs',
              'rust-core/coding-tools-headless/src/lib.rs',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'UNEXPECTED_HEADLESS_BRIDGE_PATHS:{unexpected}')
          required = {
              'src-tauri/src/lib.rs',
              'rust-core/coding-tools-headless/src/lib.rs',
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f'MISSING_HEADLESS_BRIDGE_PATHS:{missing}')
          print('PASEO_ANNEAL_HEADLESS_BRIDGE_DIFF_BOUNDED')
          PY

      - name: Commit verified bridge only
        run: |
          set -euo pipefail
          git add \
            src-tauri/src/lib.rs \
            src-tauri/src/commands/execution.rs \
            rust-core/coding-tools-core/src/lib.rs \
            rust-core/coding-tools-headless/src/lib.rs
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          git commit -m 'feat: expose bounded Paseo and Anneal reads through the headless sidecar'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
