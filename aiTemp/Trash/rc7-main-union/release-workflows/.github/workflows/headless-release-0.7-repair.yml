name: Headless 0.7 release repair

on:
  push:
    branches:
      - fix/0.7-materialize-headless-compile-repairs
    paths:
      - .github/workflows/headless-release-0.7-repair.yml
      - aiTemp/headless-release-0.7.0-rc.1/**
      - rust-core/coding-tools-headless/**
      - rust-core/coding-tools-core/**
      - src-tauri/src/data/store.rs
      - Trash/headless-release-0.7.0-rc.1/**
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: headless-release-0.7-repair-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/headless-release-target
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      source_sha: ${{ steps.retain.outputs.source_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - name: Install retained Tauri compatibility libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy

      - name: Materialize the deterministic retained repair
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence/headless-release-repair
          python aiTemp/headless-release-0.7.0-rc.1/apply_compile_fixes.py \
            2>&1 | tee aiTemp/evidence/headless-release-repair/materialize.txt
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"

      - name: Verify Linux core and headless contracts
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust-core/coding-tools-core/Cargo.toml \
            -- --test-threads=1 --nocapture \
            2>&1 | tee aiTemp/evidence/headless-release-repair/core-tests-linux.txt
          cargo test --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            -- --test-threads=1 --nocapture \
            2>&1 | tee aiTemp/evidence/headless-release-repair/headless-tests-linux.txt
          cargo clippy --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            --all-targets -- -D warnings \
            2>&1 | tee aiTemp/evidence/headless-release-repair/headless-clippy-linux.txt
          grep -F 'test result: ok' aiTemp/evidence/headless-release-repair/headless-tests-linux.txt

      - name: Retain only verified source changes
        id: retain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- \
            rust-core/coding-tools-headless/src/lib.rs \
            Trash/headless-release-0.7.0-rc.1
          staged="$(git diff --cached --name-only)"
          allowed='^(rust-core/coding-tools-headless/src/lib\.rs|Trash/headless-release-0\.7\.0-rc\.1/[0-9]+/rust-core/coding-tools-headless/src/lib\.rs)$'
          if [ -n "$staged" ]; then
            while IFS= read -r file; do
              test -z "$file" || printf '%s\n' "$file" | grep -Eq "$allowed"
            done <<< "$staged"
            git diff --cached --check
            test -z "$(git diff --cached --diff-filter=D --name-only)"
            git config user.name 'p90-lover'
            git config user.email '146848721+p90-lover@users.noreply.github.com'
            git commit -m 'fix: materialize verified headless release compile repair'
            gh auth setup-git
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > aiTemp/evidence/headless-release-repair/source.commit

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: headless-release-repair-linux-${{ github.run_id }}
          path: aiTemp/evidence/headless-release-repair/
          if-no-files-found: error
          retention-days: 14

  windows-release-verify:
    needs: materialize
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.materialize.outputs.source_sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy

      - name: Verify Windows tests, strict Clippy, and release build
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence/headless-release-repair
          cargo test --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            -- --test-threads=1 --nocapture \
            2>&1 | tee aiTemp/evidence/headless-release-repair/headless-tests-windows.txt
          cargo clippy --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            --all-targets -- -D warnings \
            2>&1 | tee aiTemp/evidence/headless-release-repair/headless-clippy-windows.txt
          cargo build --release --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            2>&1 | tee aiTemp/evidence/headless-release-repair/headless-release-windows.txt
          grep -F 'test result: ok' aiTemp/evidence/headless-release-repair/headless-tests-windows.txt
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          git rev-parse HEAD > aiTemp/evidence/headless-release-repair/source.commit

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: headless-release-repair-windows-${{ github.run_id }}
          path: aiTemp/evidence/headless-release-repair/
          if-no-files-found: error
          retention-days: 14
