name: Rust core in-memory isolation
on:
  push:
    branches: [subagent/rust-core-extraction-0.6.0-20260914]
    paths: [.github/workflows/rust-core-memory-isolation.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: rust-core-memory-isolation-060rc1
  cancel-in-progress: false
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/rust-core-memory-target
  CARGO_INCREMENTAL: '0'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  isolate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions: {contents: write}
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - name: Install retained desktop compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libpipewire-0.3-dev libgbm-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1', components: 'rustfmt,clippy'}
      - name: Reproduce the unsafe missing memory-only contract
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          set +e
          cargo test --manifest-path rust-core/coding-tools-core/Cargo.toml \
            --test in_memory_store > aiTemp/evidence/in-memory-red.txt 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -F 'no method named `is_persistent`' aiTemp/evidence/in-memory-red.txt
          echo 'IN_MEMORY_RED_PASS: an isolated store has no explicit non-persistent boundary yet'
      - name: Retain originals and implement explicit memory-only save and refresh behavior
        run: python aiTemp/rust-core-extraction/isolate_memory_store.py
      - name: Verify isolated state and existing tool-catalogue compatibility
        run: |
          set -euo pipefail
          cargo test --manifest-path rust-core/coding-tools-core/Cargo.toml \
            --test in_memory_store -- --nocapture 2>&1 | tee aiTemp/evidence/in-memory-green.txt
          cargo test --manifest-path rust-core/coding-tools-core/Cargo.toml \
            --test catalog_compat -- --nocapture 2>&1 | tee aiTemp/evidence/catalog-green.txt
          grep -F '1 passed; 0 failed' aiTemp/evidence/in-memory-green.txt
          grep -F '1 passed; 0 failed' aiTemp/evidence/catalog-green.txt
      - name: Verify persistent desktop-store regressions and compilation
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked \
            data::store::tests -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/data-store-tests.txt
          cargo check --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee aiTemp/evidence/tauri-check.txt
          cargo clippy --manifest-path rust-core/coding-tools-core/Cargo.toml --all-targets -- -D warnings \
            2>&1 | tee aiTemp/evidence/core-clippy.txt
      - name: Keep generated lock and build status under aiTemp
        if: always()
        run: |
          if test -f rust-core/coding-tools-core/Cargo.lock; then
            mkdir -p "aiTemp/Trash/rust-core-lock/$GITHUB_RUN_ID"
            mv rust-core/coding-tools-core/Cargo.lock "aiTemp/Trash/rust-core-lock/$GITHUB_RUN_ID/Cargo.lock"
          fi
          git status --short > aiTemp/evidence/status-before-commit.txt
      - name: Commit verified memory isolation only on this subagent branch
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME --jq .object.sha)" = "$GITHUB_SHA"
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: keep isolated Rust core state memory-only'
          fi
          gh auth setup-git
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > aiTemp/evidence/source.commit
      - name: Preserve exact review source even on failure
        if: always()
        run: |
          mkdir -p aiTemp/review
          git bundle create aiTemp/review/source.bundle HEAD
          git diff HEAD --binary > aiTemp/review/materialized.patch
          git status --short > aiTemp/review/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-core-memory-evidence-${{ github.run_id }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-core-memory-source-${{ github.run_id }}
          path: aiTemp/source/aiTemp/review/
          if-no-files-found: error
          retention-days: 14
