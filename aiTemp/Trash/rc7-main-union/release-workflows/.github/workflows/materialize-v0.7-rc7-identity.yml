name: Materialize and verify v0.7.0-rc.7 release source

on:
  push:
    branches:
      - release/codex-router-multiprovider-0.7.0-rc.7
    paths:
      - aiTemp/rc7-release/apply_release_identity.py
      - aiTemp/rc7-release/materialize_release_workflow.py
      - .github/workflows/materialize-v0.7-rc7-identity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-v0.7.0-rc.7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Preserve or materialize rc.7 identity
        run: |
          set -euo pipefail
          mkdir -p aiTemp/rc7-release/evidence aiTemp/Trash/rc7-release
          if grep -Fq '"version": "0.7.0-rc.7"' desktop-electron/package.json \
            && test -s docs/releases/v0.7.0-rc.7.md; then
            echo RC7_RELEASE_IDENTITY_ALREADY_READY \
              | tee aiTemp/rc7-release/evidence/materialization.txt
          else
            python aiTemp/rc7-release/apply_release_identity.py \
              | tee aiTemp/rc7-release/evidence/materialization.txt
            grep -F RC7_RELEASE_IDENTITY_READY \
              aiTemp/rc7-release/evidence/materialization.txt
          fi

      - name: Materialize the exact-source rc.7 release workflow
        run: |
          set -euo pipefail
          python aiTemp/rc7-release/materialize_release_workflow.py \
            | tee aiTemp/rc7-release/evidence/release-workflow.txt
          grep -E 'RC7_RELEASE_WORKFLOW_(READY|ALREADY_MATERIALIZED)' \
            aiTemp/rc7-release/evidence/release-workflow.txt

      - name: Verify focused identity and integrated UI contracts
        run: |
          set -euo pipefail
          node --test \
            desktop-electron/tests/product-identity.test.cjs \
            desktop-electron/tests/installer-upgrade-migration.test.cjs \
            desktop-electron/tests/legacy-msi-upgrade-contract.test.cjs \
            desktop-electron/tests/provider-center-account-wiring.test.cjs \
            desktop-electron/tests/commandcode-provider-session.test.cjs \
            desktop-electron/tests/rc7-full-integration-contract.test.cjs \
            desktop-electron/tests/rc2-paseo-anneal-network-surfaces.test.cjs \
            desktop-electron/tests/orchestration-localization-layout.test.cjs \
            2>&1 | tee aiTemp/rc7-release/evidence/contracts.txt
          grep -F '# fail 0' aiTemp/rc7-release/evidence/contracts.txt
          node --check desktop-electron/electron/provider-network.cjs
          node --check desktop-electron/electron/upstream-tools.cjs
          test -s .github/workflows/codex-router-multiprovider-release-rc7.yml
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"

      - name: Commit verified release material without deleting retained source
        run: |
          set -euo pipefail
          git add \
            desktop-electron/package.json \
            desktop-electron/electron/product.cjs \
            desktop-electron/scripts/prepare-package-resources.cjs \
            desktop-electron/scripts/verify-package.cjs \
            desktop-electron/tests/product-identity.test.cjs \
            desktop-electron/tests/installer-upgrade-migration.test.cjs \
            desktop-electron/tests/package-contents.test.cjs \
            desktop-electron/tests/package-resource-preparation.test.cjs \
            docs/releases/v0.7.0-rc.7.md \
            .github/workflows/codex-router-multiprovider-release-rc7.yml \
            aiTemp/Trash/rc7-release
          if git diff --cached --quiet; then
            echo RC7_RELEASE_SOURCE_ALREADY_COMMITTED
            exit 0
          fi
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release(rc7): materialize exact-source Windows workflow'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc7-materialization-${{ github.sha }}
          path: aiTemp/rc7-release/evidence/
          if-no-files-found: error
          retention-days: 14
