# Archived after the superseded top-level renderer was preserved in aiTemp/Trash.
# This file is evidence only and is intentionally outside .github/workflows.
name: Archive superseded Provider Hub renderer

on:
  push:
    branches:
      - feature/v0.7.0-provider-multiaccount-global-proxy
    paths:
      - .github/workflows/apply-provider-hub-ui.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-provider-hub-duplicates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive-preserved-duplicates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - name: Move superseded files into aiTemp Trash
        run: |
          set -euo pipefail
          target="aiTemp/Trash/provider-hub/superseded-renderer"
          recipes="aiTemp/Trash/provider-hub/obsolete-recipes"
          workflows="aiTemp/Trash/provider-hub/obsolete-workflows"
          mkdir -p "$target" "$recipes" "$workflows" aiTemp/evidence

          test -f desktop-electron/src/ProviderManagerSurface.tsx
          test -f desktop-electron/src/ProviderManagerSurface.css
          test -f aiTemp/provider-hub/apply_provider_hub.py
          test -f .github/workflows/apply-provider-hub-ui.yml

          git mv desktop-electron/src/ProviderManagerSurface.tsx "$target/ProviderManagerSurface.tsx"
          git mv desktop-electron/src/ProviderManagerSurface.css "$target/ProviderManagerSurface.css"
          git mv aiTemp/provider-hub/apply_provider_hub.py "$recipes/apply_provider_hub.py"
          git mv .github/workflows/apply-provider-hub-ui.yml "$workflows/apply-provider-hub-ui.yml"

          git diff --cached -M --check
          deleted="$(git diff --cached -M --diff-filter=D --name-only)"
          if [ -n "$deleted" ]; then
            printf 'Unexpected deletion instead of preservation move:\n%s\n' "$deleted" >&2
            exit 1
          fi
          git diff --cached -M --name-status | tee aiTemp/evidence/provider-hub-archive.txt
          python - <<'PY'
          import subprocess

          expected_targets = {
              'aiTemp/Trash/provider-hub/superseded-renderer/ProviderManagerSurface.tsx',
              'aiTemp/Trash/provider-hub/superseded-renderer/ProviderManagerSurface.css',
              'aiTemp/Trash/provider-hub/obsolete-recipes/apply_provider_hub.py',
              'aiTemp/Trash/provider-hub/obsolete-workflows/apply-provider-hub-ui.yml',
          }
          rows = subprocess.check_output(
              ['git', 'diff', '--cached', '-M', '--name-status'], text=True
          ).splitlines()
          targets = set()
          for row in rows:
              parts = row.split('\t')
              if not parts or parts[0].startswith('D'):
                  raise SystemExit(f'ARCHIVE_DELETE_FORBIDDEN:{row}')
              if parts[0].startswith('R') and len(parts) == 3:
                  targets.add(parts[2])
          missing = sorted(expected_targets - targets)
          if missing:
              raise SystemExit(f'ARCHIVE_TARGETS_MISSING:{missing}')
          print('PROVIDER_HUB_DUPLICATES_ARCHIVED')
          PY

      - name: Commit preservation moves safely
        run: |
          set -euo pipefail
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          git commit -m 'chore(provider-hub): preserve superseded renderer in Trash'

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            remote_head="$(git rev-parse FETCH_HEAD)"
            if ! git merge-base --is-ancestor "$remote_head" HEAD; then
              git rebase "$remote_head"
            fi
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              exit 0
            fi
          done
          echo 'Unable to publish preservation move after three race-safe attempts' >&2
          exit 1
