name: Apply Runtime Version Probe Fix

on:
  push:
    branches:
      - fix/codex-router-0.7-runtime-version-probe-20260916
    paths:
      - aiTemp/codex-router-0.7-runtime-version-probe/apply-runtime-version-probe-fix.py
      - .github/workflows/codex-router-0.7-runtime-version-probe-apply.yml
      - .github/workflows/codex-router-0.7-release-tooling-ci.yml
      - desktop-electron/electron/main.cjs
      - desktop-electron/electron/runtime-command.cjs
      - desktop-electron/tests/runtime-version-probe.test.cjs

permissions:
  contents: write

concurrency:
  group: runtime-version-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Apply exact runtime version probe patch
        run: |
          set -euo pipefail
          mkdir -p aiTemp/codex-router-0.7-runtime-version-probe/evidence
          python aiTemp/codex-router-0.7-runtime-version-probe/apply-runtime-version-probe-fix.py \
            | tee aiTemp/codex-router-0.7-runtime-version-probe/evidence/apply.log
          grep -F 'RUNTIME_VERSION_PROBE_FIX_OK' \
            aiTemp/codex-router-0.7-runtime-version-probe/evidence/apply.log

      - name: Verify focused runtime contracts
        run: |
          set -euo pipefail
          node --check desktop-electron/electron/main.cjs
          node --check desktop-electron/electron/runtime-command.cjs
          node --check desktop-electron/tests/runtime-version-probe.test.cjs
          node --test \
            desktop-electron/tests/runtime-version-probe.test.cjs \
            desktop-electron/tests/launcher-smoke-exit.test.cjs \
            2>&1 | tee aiTemp/codex-router-0.7-runtime-version-probe/evidence/tests.log
          grep -F '# fail 0' aiTemp/codex-router-0.7-runtime-version-probe/evidence/tests.log

      - name: Enforce narrow no-delete patch
        run: |
          set -euo pipefail
          test -z "$(git diff --diff-filter=D --name-only)"
          unexpected="$(git diff --name-only | grep -Ev '^(.github/workflows/codex-router-0\.7-release-tooling-ci\.yml|desktop-electron/electron/main\.cjs|desktop-electron/electron/runtime-command\.cjs|desktop-electron/tests/runtime-version-probe\.test\.cjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected tracked changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Commit verified source patch
        env:
          TARGET_BRANCH: fix/codex-router-0.7-runtime-version-probe-20260916
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "::error::Branch advanced while validation was running; refusing to overwrite it."
            exit 1
          fi
          git add \
            .github/workflows/codex-router-0.7-release-tooling-ci.yml \
            desktop-electron/electron/main.cjs \
            desktop-electron/electron/runtime-command.cjs \
            desktop-electron/tests/runtime-version-probe.test.cjs
          if git diff --cached --quiet; then
            echo 'Runtime version probe patch is already applied.'
            exit 0
          fi
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): validate the bundled runtime own version'
          git push origin "HEAD:$TARGET_BRANCH"
