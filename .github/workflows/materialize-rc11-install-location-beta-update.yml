name: Materialize rc.11 installer and beta updater repair

on:
  push:
    branches:
      - fix/rc11-install-location-beta-update-current
    paths:
      - .github/workflows/materialize-rc11-install-location-beta-update.yml
      - aiTemp/rc11-install-location-beta-update/materialize-current.py
      - desktop-electron/tests/rc11-install-location-beta-update.test.cjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-rc11-install-location-beta-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Apply guarded current-main materializer
        run: |
          set -euo pipefail
          mkdir -p aiTemp/rc11-install-location-beta-update/evidence
          python aiTemp/rc11-install-location-beta-update/materialize-current.py \
            2>&1 | tee aiTemp/rc11-install-location-beta-update/evidence/materialize.txt
          grep -F RC11_INSTALL_LOCATION_BETA_UPDATE_MATERIALIZED \
            aiTemp/rc11-install-location-beta-update/evidence/materialize.txt

      - name: Run focused RED-to-GREEN contracts
        run: |
          set -euo pipefail
          (
            node --check desktop-electron/electron/main.cjs
            node --check desktop-electron/electron/update.cjs
            node --check desktop-electron/electron/update-worker.cjs
            node --test \
              desktop-electron/tests/rc11-install-location-beta-update.test.cjs \
              desktop-electron/tests/installer-upgrade-migration.test.cjs \
              desktop-electron/tests/legacy-msi-upgrade-contract.test.cjs \
              desktop-electron/tests/update.test.cjs
          ) 2>&1 | tee aiTemp/rc11-install-location-beta-update/evidence/materialized-tests.txt
          grep -F '# fail 0' aiTemp/rc11-install-location-beta-update/evidence/materialized-tests.txt

      - name: Enforce preservation and diff safety
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only origin/main...HEAD)"
          test -z "$(git diff --diff-filter=D --name-only)"

      - name: Commit verified production source
        run: |
          set -euo pipefail
          git add \
            desktop-electron/build/installer.nsh \
            desktop-electron/electron/main.cjs \
            desktop-electron/electron/update.cjs \
            desktop-electron/electron/update-worker.cjs
          if git diff --cached --quiet; then
            echo 'installer and beta updater repair already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rc11): preserve install location and prompt for beta updates'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: materialize-rc11-install-location-beta-update-${{ github.sha }}
          path: aiTemp/rc11-install-location-beta-update/evidence/
          if-no-files-found: error
          retention-days: 14
