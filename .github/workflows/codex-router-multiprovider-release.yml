name: Codex Router multi-provider release candidate

on:
  push:
    branches:
      - release/codex-router-multiprovider-0.7.0-rc.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-router-multiprovider-release-0.7.0-rc.1
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.0'
  NODE_VERSION: '22'
  RUST_TOOLCHAIN: '1.98.1'
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/bun-cache
  PYTHONDONTWRITEBYTECODE: '1'
  RELEASE_VERSION: '0.7.0-rc.1'
  SOURCE_SHA: ${{ github.sha }}
  WINDOWS_INSTALLER: Coding.Tools_0.7.0-rc.1_windows_x64_setup.exe
  TUNNEL_ARCHIVE: tunnel-client-v0.0.12-windows-amd64.zip
  TUNNEL_ARCHIVE_SHA256: '2a2804933924e38a502d62b61f0266cb80d56d65744f4c29876b2bf9c1544356'
  TUNNEL_RELEASE_URL: https://github.com/openai/tunnel-client/releases/download/v0.0.12
  CARGO_TERM_COLOR: always

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Prepare retained work roots
        run: |
          set -euo pipefail
          mkdir -p aiTemp/tmp aiTemp/evidence aiTemp/Trash/release-0.7.0-rc.1

      - name: Apply exact release identity patch
        run: |
          set -euo pipefail
          python aiTemp/codex-router-multiprovider/apply-release-identity.py \
            | tee aiTemp/evidence/release-identity-patch.txt
          grep -F CODEX_ROUTER_RELEASE_IDENTITY_PATCH_OK aiTemp/evidence/release-identity-patch.txt
          test -z "$(git diff --diff-filter=D --name-only)"
          git diff --check

      - name: Install focused runtime and desktop dependencies
        run: |
          set -euo pipefail
          preload="$PWD/runtime-web/scripts/no-delete-preload.mjs"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun install --cwd runtime-web --frozen-lockfile \
            2>&1 | tee aiTemp/evidence/runtime-install.txt
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun install --cwd desktop-electron --frozen-lockfile \
            2>&1 | tee aiTemp/evidence/desktop-install.txt

      - name: Run release identity contract
        run: |
          set -euo pipefail
          preload="$PWD/runtime-web/scripts/no-delete-preload.mjs"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun test --cwd runtime-web tests/runtime-bundle-version.test.ts \
            2>&1 | tee aiTemp/evidence/release-identity-test.txt
          grep -F '0 fail' aiTemp/evidence/release-identity-test.txt
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd runtime-web typecheck \
            2>&1 | tee aiTemp/evidence/runtime-typecheck.txt
          node --test \
            desktop-electron/tests/product-identity.test.cjs \
            desktop-electron/tests/package-resource-preparation.test.cjs \
            desktop-electron/tests/packaging-contract.test.cjs \
            desktop-electron/tests/prepare-runtime.test.cjs \
            2>&1 | tee aiTemp/evidence/desktop-release-tests.txt
          grep -E '^# pass [1-9][0-9]*$' aiTemp/evidence/desktop-release-tests.txt
          grep -F '# fail 0' aiTemp/evidence/desktop-release-tests.txt
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron typecheck \
            2>&1 | tee aiTemp/evidence/desktop-typecheck.txt
          node --input-type=module <<'NODE' | tee aiTemp/evidence/desktop-release-version.txt
          import fs from 'node:fs';
          const desktop = JSON.parse(fs.readFileSync('desktop-electron/package.json', 'utf8'));
          if (desktop.version !== process.env.RELEASE_VERSION) {
            throw new Error(`DESKTOP_RELEASE_VERSION_MISMATCH:${desktop.version}`);
          }
          process.stdout.write(`DESKTOP_RELEASE_VERSION_OK ${desktop.version}\n`);
          NODE

      - name: Commit only verified release identity files
        run: |
          set -euo pipefail
          test -z "$(git diff --diff-filter=D --name-only)"
          git diff --check
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git add \
            desktop-electron/package.json \
            desktop-electron/electron/product.cjs \
            desktop-electron/scripts/prepare-package-resources.cjs \
            desktop-electron/scripts/runtime-preparation.cjs \
            desktop-electron/scripts/verify-package.cjs \
            desktop-electron/tests/package-contents.test.cjs \
            desktop-electron/tests/package-resource-preparation.test.cjs \
            desktop-electron/tests/product-identity.test.cjs \
            runtime-web/scripts/build-runtime-bundle.ts \
            runtime-web/src/runtime-bundle-version.ts \
            runtime-web/tests/runtime-bundle-version.test.ts
          if ! git diff --cached --quiet; then
            git config user.name 'p90-lover'
            git config user.email '146848721+p90-lover@users.noreply.github.com'
            git commit -m 'build: align Coding Tools 0.7 package identity'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: codex-router-release-contract-${{ github.sha }}
          path: aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14

  windows-package:
    name: Windows x64 installer and packaged smoke
    needs: release-contract
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CODING_TOOLS_RETENTION_ROOT: ${{ github.workspace }}/aiTemp/Trash/release-0.7.0-rc.1-windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Prepare retained package roots and dependencies
        run: |
          set -euo pipefail
          mkdir -p \
            aiTemp/evidence \
            aiTemp/tmp \
            aiTemp/Trash/release-0.7.0-rc.1-windows \
            aiTemp/release-output
          printf 'source=%s\nrunner=%s\n' "$SOURCE_SHA" "$RUNNER_OS" \
            > aiTemp/evidence/windows-run-identity.txt
          preload="$(node -e 'const {pathToFileURL}=require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href)' "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          export NODE_OPTIONS="--import=$preload"
          absolute_tmp="$PWD/aiTemp/tmp"
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd runtime-web \
            2>&1 | tee aiTemp/evidence/runtime-install-windows.txt
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd runtime-web/launcher \
            2>&1 | tee aiTemp/evidence/launcher-install-windows.txt
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd desktop-electron \
            2>&1 | tee aiTemp/evidence/desktop-install-windows.txt

      - name: Acquire checksum-pinned official tunnel-client archive
        run: |
          set -euo pipefail
          input_dir="aiTemp/input/tunnel-client/v0.0.12/windows-amd64"
          archive="$input_dir/$TUNNEL_ARCHIVE"
          partial_archive="$archive.partial"
          asset_url="$TUNNEL_RELEASE_URL/$TUNNEL_ARCHIVE"
          test ! -e "$archive"
          test ! -e "$partial_archive"
          mkdir -p "$input_dir"
          command -v curl.exe >/dev/null
          curl.exe --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$partial_archive" "$asset_url"
          test -s "$partial_archive"
          actual_sha256="$(sha256sum "$partial_archive" | awk '{print $1}')"
          test "$actual_sha256" = "$TUNNEL_ARCHIVE_SHA256"
          mv --no-clobber "$partial_archive" "$archive"
          test ! -e "$partial_archive"
          test -s "$archive"
          final_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          test "$final_sha256" = "$TUNNEL_ARCHIVE_SHA256"
          echo "CODING_TOOLS_TUNNEL_CLIENT_ARCHIVE=$PWD/$archive" >> "$GITHUB_ENV"
          printf 'archive=%s\nsha256=%s\nurl=%s\n' \
            "$archive" "$final_sha256" "$asset_url" \
            > aiTemp/evidence/tunnel-client-archive.txt

      - name: Build the Rust sidecar and Electron installer
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            2>&1 | tee aiTemp/evidence/rust-headless-release.txt
          preload="$(node -e 'const {pathToFileURL}=require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href)' "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron package:win \
            2>&1 | tee aiTemp/evidence/windows-package.txt

      - name: Verify package contents, identity, and launcher smoke
        run: |
          set -euo pipefail
          mapfile -t package_roots < <(
            for candidate in desktop-electron/artifacts desktop-electron/release; do
              test -d "$candidate" && printf '%s\n' "$candidate"
            done
          )
          test "${#package_roots[@]}" -eq 1
          package_root="${package_roots[0]}"
          printf '%s\n' "$package_root" > aiTemp/evidence/package-root.txt
          node desktop-electron/scripts/verify-package.cjs "$package_root" \
            --source "$SOURCE_SHA" \
            --json-out aiTemp/evidence/package-verification.json \
            2>&1 | tee aiTemp/evidence/package-verification.txt
          test -s aiTemp/evidence/package-verification.json
          node --test desktop-electron/tests/package-contents.test.cjs \
            2>&1 | tee aiTemp/evidence/package-contents-tests.txt
          preload="$(node -e 'const {pathToFileURL}=require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href)' "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron smoke:package \
            2>&1 | tee aiTemp/evidence/package-smoke.txt
          mapfile -t installers < <(
            find "$package_root" -maxdepth 1 -type f -iname '*.exe' -print
          )
          test "${#installers[@]}" -eq 1
          printf '%s\n' "${installers[0]}" > aiTemp/evidence/original-installer-path.txt
          release_installer="aiTemp/release-output/$WINDOWS_INSTALLER"
          test ! -e "$release_installer"
          cp --no-clobber "${installers[0]}" "$release_installer"
          test -s "$release_installer"
          sha256sum "$release_installer" > aiTemp/evidence/windows-installer.sha256
          printf 'source=%s\ninstaller=%s\n' "$SOURCE_SHA" "$WINDOWS_INSTALLER" \
            > aiTemp/evidence/windows-installer-source.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coding-tools-0.7.0-rc.1-windows-x64-${{ github.sha }}
          path: aiTemp/release-output/Coding.Tools_0.7.0-rc.1_windows_x64_setup.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coding-tools-0.7.0-rc.1-windows-evidence-${{ github.sha }}
          path: aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14

  publish-beta:
    name: Publish exact-SHA beta prerelease
    needs: [release-contract, windows-package]
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-beta]')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: v0.7.0-rc.1
      VALIDATION_WORKFLOW: .github/workflows/codex-router-multiprovider-release.yml
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coding-tools-0.7.0-rc.1-windows-x64-${{ github.sha }}
          path: aiTemp/publish/assets

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coding-tools-0.7.0-rc.1-windows-evidence-${{ github.sha }}
          path: aiTemp/publish/windows-evidence

      - name: Bind installer and evidence to the exact release-branch head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote_head="$(git ls-remote origin refs/heads/release/codex-router-multiprovider-0.7.0-rc.1 | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          test -f "aiTemp/publish/assets/$WINDOWS_INSTALLER"
          mapfile -t source_receipts < <(
            find aiTemp/publish/windows-evidence -type f -name windows-installer-source.txt -print
          )
          mapfile -t hash_receipts < <(
            find aiTemp/publish/windows-evidence -type f -name windows-installer.sha256 -print
          )
          test "${#source_receipts[@]}" -eq 1
          test "${#hash_receipts[@]}" -eq 1
          grep -Fqx "source=$SOURCE_SHA" "${source_receipts[0]}"
          grep -Fqx "installer=$WINDOWS_INSTALLER" "${source_receipts[0]}"
          expected_sha256="$(awk 'NR == 1 {print $1}' "${hash_receipts[0]}")"
          actual_sha256="$(sha256sum "aiTemp/publish/assets/$WINDOWS_INSTALLER" | awk '{print $1}')"
          test "$expected_sha256" = "$actual_sha256"
          printf 'source=%s\ninstaller=%s\nsha256=%s\n' \
            "$SOURCE_SHA" "$WINDOWS_INSTALLER" "$actual_sha256" \
            > aiTemp/publish/exact-source-receipt.txt

      - name: Generate immutable provenance, validation, and checksums
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve('aiTemp/publish/assets');
          const installer = process.env.WINDOWS_INSTALLER;
          const installerPath = path.join(root, installer);
          const installerBytes = fs.readFileSync(installerPath);
          const installerSha256 = crypto.createHash('sha256').update(installerBytes).digest('hex');
          const sourceSha = process.env.SOURCE_SHA;
          const validationRunId = Number(process.env.GITHUB_RUN_ID);
          if (!Number.isSafeInteger(validationRunId) || validationRunId < 1) {
            throw new Error(`VALIDATION_RUN_ID_INVALID:${process.env.GITHUB_RUN_ID}`);
          }

          const provenance = {
            schema: 1,
            release_tag: process.env.RELEASE_TAG,
            version: process.env.RELEASE_VERSION,
            source_sha: sourceSha,
            product: {
              name: 'Coding Tools',
              app_id: 'dev.codingtools.fullharness',
            },
            upstream: {
              repository: 'miuuyy/codex-chatgpt-web',
              version: 'v5.0.6',
              commit: 'e85e3693fdb4e3e033348c08df0298c20fcdb612',
            },
            validation_run: {
              id: validationRunId,
              workflow: process.env.VALIDATION_WORKFLOW,
            },
            assets: [{
              name: installer,
              sha256: installerSha256,
              size: installerBytes.length,
            }],
          };
          const validation = {
            schema: 1,
            automated_gates: 'passed',
            live_account_acceptance: 'pending_manual',
            source_sha: sourceSha,
            validation_run_id: validationRunId,
            validation_workflow: process.env.VALIDATION_WORKFLOW,
            validation_conclusion: 'success',
            release_contract_job: 'success',
            windows_package_job: 'success',
          };
          fs.writeFileSync(
            path.join(root, 'provenance.json'),
            `${JSON.stringify(provenance, null, 2)}\n`,
          );
          fs.writeFileSync(
            path.join(root, 'validation-evidence.json'),
            `${JSON.stringify(validation, null, 2)}\n`,
          );
          const names = [installer, 'provenance.json', 'validation-evidence.json'];
          const checksums = names.map((name) => {
            const bytes = fs.readFileSync(path.join(root, name));
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            return `${digest}  ${name}`;
          }).join('\n');
          fs.writeFileSync(path.join(root, 'SHA256SUMS.txt'), `${checksums}\n`);
          NODE
          test -f aiTemp/publish/assets/Coding.Tools_0.7.0-rc.1_windows_x64_setup.exe
          test -f aiTemp/publish/assets/SHA256SUMS.txt
          test -f aiTemp/publish/assets/provenance.json
          test -f aiTemp/publish/assets/validation-evidence.json

      - name: Verify assets and publish the prerelease with remote readback
        run: |
          set -euo pipefail
          node scripts/release/verify-assets.mjs \
            --directory aiTemp/publish/assets \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --source "$SOURCE_SHA" \
            --json-out aiTemp/publish/pre-publication-verification.json
          node scripts/release/publish-v0.6.0-rc.1.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --source "$SOURCE_SHA" \
            --assets aiTemp/publish/assets \
            --notes docs/releases/v0.7.0-rc.1.md \
            --json-out aiTemp/publish/publisher-result.json

      - name: Record independent public release and tag receipt
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const apiRoot = 'https://api.github.com';
          const repository = process.env.GITHUB_REPOSITORY;
          const tag = process.env.RELEASE_TAG;
          const sourceSha = process.env.SOURCE_SHA;
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'x-github-api-version': '2022-11-28',
            'user-agent': 'coding-tools-0.7-beta-readback',
          };
          async function readJson(url) {
            const response = await fetch(url, { headers });
            const text = await response.text();
            if (!response.ok) throw new Error(`HTTP_${response.status}:${text.slice(0, 500)}`);
            return JSON.parse(text);
          }
          const release = await readJson(
            `${apiRoot}/repos/${repository}/releases/tags/${encodeURIComponent(tag)}`,
          );
          const tagRef = await readJson(
            `${apiRoot}/repos/${repository}/git/ref/tags/${encodeURIComponent(tag)}`,
          );
          if (release.draft !== false || release.prerelease !== true || !release.published_at) {
            throw new Error('PUBLIC_PRERELEASE_STATE_INVALID');
          }
          if (String(tagRef.object?.sha ?? '').toLowerCase() !== sourceSha.toLowerCase()) {
            throw new Error(`PUBLIC_TAG_SHA_MISMATCH:${tagRef.object?.sha}`);
          }
          const expectedNames = [
            'Coding.Tools_0.7.0-rc.1_windows_x64_setup.exe',
            'SHA256SUMS.txt',
            'provenance.json',
            'validation-evidence.json',
          ].sort();
          const actualNames = (release.assets ?? []).map((asset) => asset.name).sort();
          if (JSON.stringify(actualNames) !== JSON.stringify(expectedNames)) {
            throw new Error(`PUBLIC_ASSET_INVENTORY_MISMATCH:${JSON.stringify(actualNames)}`);
          }
          const publisher = JSON.parse(fs.readFileSync('aiTemp/publish/publisher-result.json', 'utf8'));
          const receipt = {
            schema: 1,
            url: release.html_url,
            release_id: release.id,
            tag,
            source_sha: sourceSha,
            draft: release.draft,
            prerelease: release.prerelease,
            published_at: release.published_at,
            assets: release.assets.map((asset) => ({
              name: asset.name,
              size: asset.size,
              digest: asset.digest ?? null,
              browser_download_url: asset.browser_download_url,
            })),
            publisher,
          };
          fs.writeFileSync(
            'aiTemp/publish/publication-receipt.json',
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          process.stdout.write(`${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coding-tools-0.7.0-rc.1-publication-${{ github.sha }}
          path: |
            aiTemp/publish/publication-receipt.json
            aiTemp/publish/publisher-result.json
            aiTemp/publish/pre-publication-verification.json
            aiTemp/publish/exact-source-receipt.txt
          if-no-files-found: warn
          retention-days: 14
