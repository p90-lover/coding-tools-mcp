name: Materialize rerun-safe release publisher

on:
  pull_request:
    branches: [automation/release-publish-idempotent]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: materialize-release-publish-idempotent
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply rerun-safe publish state machine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release.yml')
          text = path.read_text()
          marker = '          gh release create "$TAG" --verify-tag --draft --title "Coding Tools MCP $TAG" --notes-file aiTemp/release-notes.md aiTemp/release-assets/*\n'
          if marker not in text:
              required = [
                  'RELEASE_STATE="$(python - <<\'PY\'',
                  'if [ "$RELEASE_STATE" = "missing" ]; then',
                  'RELEASE_KIND="${RELEASE_STATE%%:*}"',
                  'if [ "$RELEASE_KIND" = "draft" ]; then',
                  'releases/$RELEASE_ID',
                  "p.name.replace(' ', '.')",
              ]
              assert all(item in text for item in required), 'neither original nor materialized publish block is present'
              print('release publish block already materialized')
              raise SystemExit(0)

          start = text.index(marker)
          replacement = r'''          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > aiTemp/release-meta/releases.json
          RELEASE_STATE="$(python - <<'PY'
          import json, os, pathlib
          releases=json.loads(pathlib.Path('aiTemp/release-meta/releases.json').read_text())
          matches=[r for r in releases if r.get('tag_name')==os.environ['TAG']]
          assert len(matches)<=1, f"expected at most one release for {os.environ['TAG']}, found {len(matches)}"
          if not matches:
              print('missing')
          else:
              release=matches[0]
              assert release.get('name')==f"Coding Tools MCP {os.environ['TAG']}", release.get('name')
              assert release.get('prerelease') is False
              kind='draft' if release.get('draft') is True else 'published'
              if kind=='published':
                  assert release.get('published_at'), 'published release is missing published_at'
              print(f"{kind}:{release['id']}")
          PY
          )"
          if [ "$RELEASE_STATE" = "missing" ]; then
            gh release create "$TAG" --verify-tag --draft --title "Coding Tools MCP $TAG" --notes-file aiTemp/release-notes.md aiTemp/release-assets/*
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > aiTemp/release-meta/releases.json
            RELEASE_STATE="$(python - <<'PY'
          import json, os, pathlib
          releases=json.loads(pathlib.Path('aiTemp/release-meta/releases.json').read_text())
          matches=[r for r in releases if r.get('tag_name')==os.environ['TAG'] and r.get('draft') is True]
          assert len(matches)==1, f"expected exactly one new draft for {os.environ['TAG']}, found {len(matches)}"
          release=matches[0]
          assert release.get('name')==f"Coding Tools MCP {os.environ['TAG']}", release.get('name')
          assert release.get('prerelease') is False
          print(f"draft:{release['id']}")
          PY
            )"
          fi
          case "$RELEASE_STATE" in
            draft:*|published:*) ;;
            *) echo "Unexpected release state: $RELEASE_STATE" >&2; exit 1 ;;
          esac
          RELEASE_KIND="${RELEASE_STATE%%:*}"
          RELEASE_ID="${RELEASE_STATE#*:}"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > aiTemp/release-meta/uploaded.json
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('aiTemp/release-assets')
          release=json.loads(pathlib.Path('aiTemp/release-meta/uploaded.json').read_text())
          assert release['tag_name']==os.environ['TAG']
          assert release['name']==f"Coding Tools MCP {os.environ['TAG']}"
          actual={p['name']:p for p in release['assets']}
          expected={p.name.replace(' ', '.'):p for p in root.iterdir()}
          assert set(actual)==set(expected), (set(actual),set(expected))
          for uploaded_name,path in expected.items():
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual[uploaded_name]['size']==path.stat().st_size, uploaded_name
              assert actual[uploaded_name]['digest']=='sha256:'+digest, uploaded_name
          PY
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE"
          if [ "$RELEASE_KIND" = "draft" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true > aiTemp/release-meta/published.json
          else
            cp aiTemp/release-meta/uploaded.json aiTemp/release-meta/published.json
          fi
          python - <<'PY'
          import json,os,pathlib
          release=json.loads(pathlib.Path('aiTemp/release-meta/published.json').read_text())
          expected={p.name.replace(' ', '.') for p in pathlib.Path('aiTemp/release-assets').iterdir()}
          assert release['tag_name']==os.environ['TAG']
          assert release['draft'] is False and release['published_at']
          assert {a['name'] for a in release['assets']}==expected
          PY
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > aiTemp/release-meta/by-tag.json
          python - <<'PY'
          import json,os,pathlib
          release=json.loads(pathlib.Path('aiTemp/release-meta/by-tag.json').read_text())
          expected={p.name.replace(' ', '.') for p in pathlib.Path('aiTemp/release-assets').iterdir()}
          assert release['tag_name']==os.environ['TAG']
          assert release['draft'] is False and release['published_at']
          assert {a['name'] for a in release['assets']}==expected
          PY
'''
          path.write_text(text[:start] + replacement)
          PY
          git diff --check -- .github/workflows/release.yml
          if git diff --quiet -- .github/workflows/release.yml; then
            echo 'No materialization change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml
          git commit -m 'fix: make release publishing safe to rerun'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
