name: Trace only the isolated sandbox runtime
on:
  push:
    branches: [audit/remembered-036-runtime-access]
    paths: ['.github/workflows/remembered-nt-runtime.yml','aiTemp/release-verification/nt_runtime_trace.cpp']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OTEL_SDK_DISABLED: 'true'
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          persist-credentials: false
          clean: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: microsoft/Detours
          ref: e4bfd6b03e50de46b47abfbd1e46b384f0c5f833
          path: aiTemp/diagnostic-library
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 34222575916
          name: remembered-native-helpers-34222575916
          path: aiTemp/checkout/src-tauri/aiTemp/native-sandbox
      - name: Compile self-observing fixture against pinned Microsoft library
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          pushd "%GITHUB_WORKSPACE%\aiTemp\diagnostic-library\src"
          nmake /nologo
          if errorlevel 1 exit /b 1
          popd
          mkdir aiTemp\tools
          cl /nologo /std:c++17 /O2 /MT /EHsc /I"%GITHUB_WORKSPACE%\aiTemp\diagnostic-library\include" aiTemp\release-verification\nt_runtime_trace.cpp /FoaiTemp\tools\nt-runtime.obj /FeaiTemp\tools\nt-runtime-probe.exe /link "%GITHUB_WORKSPACE%\aiTemp\diagnostic-library\lib.X64\detours.lib" ws2_32.lib
          if errorlevel 1 exit /b 1
      - name: Observe only current fixture object-access results
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python - <<'PY' 2>&1 | tee aiTemp/evidence/nt-runtime.txt
          from pathlib import Path
          import sys,shutil
          sys.argv=['aiTemp/release-verification/runtime_provider_probe.py',str(Path('src-tauri/aiTemp/native-sandbox/coding-tools-codex-sandbox.exe').resolve()),str(Path('aiTemp/nt-runtime').resolve())]
          source=Path(sys.argv[0]).read_text(encoding='utf-8')
          old="subprocess.run(['rustc', '--edition', '2021', 'aiTemp/release-verification/winsock_resource_probe.rs', '-o', str(executable)], check=True)"
          new="shutil.copy2('aiTemp/tools/nt-runtime-probe.exe',executable)\n    print('UNRESTRICTED FIXTURE',flush=True)\n    subprocess.run([str(executable)],check=True)"
          assert source.count(old)==1
          exec(compile(source.replace(old,new),sys.argv[0],'exec'),globals())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remembered-nt-runtime-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
