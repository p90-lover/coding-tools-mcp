name: MCP dual-era full catalog

on:
  push:
    branches:
      - fix/mcp-dual-era-full-catalog-0.4.1-rc.3
    paths:
      - .github/workflows/mcp-dual-era-full-catalog.yml
      - aiTemp/dual-era/ci.py
      - aiTemp/connection-tests/http.rs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcp-dual-era-full-catalog
  cancel-in-progress: false

env:
  VERSION: 0.4.1-rc.3
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  windows:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE: ${{ github.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
    defaults:
      run:
        working-directory: aiTemp/checkout
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Red contracts
        run: python aiTemp/dual-era/ci.py red
      - name: Materialize production source
        run: |
          set -euo pipefail
          python aiTemp/dual-era/ci.py materialize
          rustfmt --edition 2021 --config skip_children=true src-tauri/src/mcp/server.rs src-tauri/src/mcp/listener.rs src-tauri/src/mcp/transport.rs src-tauri/src/tools/registry_definitions.rs aiTemp/connection-tests/http.rs
          git diff --check
      - name: Green protocol and catalog tests
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib connection_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/connection-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib full_profile_really_exposes_the_complete_catalog -- --test-threads=1 2>&1 | tee aiTemp/evidence/catalog-tests.txt
          grep -F 'test result: ok.' aiTemp/evidence/connection-tests.txt
      - name: Frontend and Windows installer
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
          npm run tauri -- build --bundles nsis -- --locked 2>&1 | tee aiTemp/evidence/installer.txt
      - name: Commit tested production source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/installer
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess
          root=Path(os.environ['CARGO_TARGET_DIR'])/'release'
          binary=root/'coding-tools-mcp-desktop.exe'
          actual=subprocess.check_output([str(binary),'--version'],text=True,timeout=20).strip()
          assert actual=='coding-tools-mcp-desktop '+os.environ['VERSION']
          matches=list(root.glob('bundle/nsis/*.exe'))
          assert len(matches)==1 and matches[0].stat().st_size>100000
          name='Coding.Tools.MCP_'+os.environ['VERSION']+'_x64-setup.exe'
          target=Path('aiTemp/installer')/name
          shutil.copy2(matches[0],target)
          proof={'version':os.environ['VERSION'],'base_source':os.environ['SOURCE'],'workflow_run':int(os.environ['GITHUB_RUN_ID']),'asset':name,'size':target.stat().st_size,'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'legacy_versions':['2025-11-25','2025-06-18'],'modern_version':'2026-07-28','full_catalog_verified':True,'codex_invoked':False,'live_chatgpt_verified':False}
          Path('aiTemp/installer/proof.json').write_text(json.dumps(proof,indent=2)+'\n',encoding='utf-8')
          PY
          git add -- src-tauri/src/mcp/server.rs src-tauri/src/mcp/listener.rs src-tauri/src/mcp/transport.rs src-tauri/src/tools/registry_definitions.rs aiTemp/connection-tests/http.rs package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git diff --cached --check
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          git commit -m 'fix: negotiate modern MCP and expose the actual full tool catalog'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin refs/heads/fix/mcp-dual-era-full-catalog-0.4.1-rc.3 | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/mcp-dual-era-full-catalog-0.4.1-rc.3
          git rev-parse HEAD > aiTemp/evidence/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dual-era-windows-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/installer/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dual-era-evidence-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: warn
          retention-days: 14
