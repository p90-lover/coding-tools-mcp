name: Trigger verified v0.6 stable release

on:
  workflow_dispatch:
  push:
    branches:
      - release/v0.6.0
    paths:
      - .github/workflows/v060-trigger-stable-release.yml

permissions:
  contents: write

concurrency:
  group: v060-trigger-stable-release
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  trigger:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: release/v0.6.0
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - name: Touch only the stable release workflow
        env:
          RELEASE_TRIGGER_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path('.github/workflows/electron-full-harness-ci.yml')
          text = path.read_text(encoding='utf-8')
          marker = f"# stable-release-trigger: {os.environ['RELEASE_TRIGGER_ID']}\n"
          if marker in text:
              raise SystemExit('Trigger marker already exists')
          path.write_text(text.rstrip() + '\n\n' + marker, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = '.github/workflows/electron-full-harness-ci.yml'
          test -z "$(git diff --diff-filter=D --name-only)"
      - name: Commit stable release trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- .github/workflows/electron-full-harness-ci.yml
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          git commit -m 'ci: run verified v0.6 stable release pipeline'
          gh auth setup-git
          git push origin HEAD:refs/heads/release/v0.6.0
