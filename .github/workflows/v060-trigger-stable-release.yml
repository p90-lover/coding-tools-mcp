name: Trigger verified v0.6 stable release

on:
  workflow_dispatch:
  push:
    branches:
      - release/v0.6.0
    paths:
      - .github/workflows/v060-trigger-stable-release.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: v060-trigger-stable-release
  cancel-in-progress: false

jobs:
  trigger:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch exact stable release workflow on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/electron-full-harness-ci.yml/dispatches" \
            -f ref='release/v0.6.0'
          echo 'DISPATCH_ACCEPTED'
