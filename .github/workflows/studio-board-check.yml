name: Studio board contracts
on:
  push:
    branches: [release/studio-integration-0.4.2-rc.1]
    paths: ['.github/workflows/studio-board-check.yml', 'src-tauri/src/integrations/board.rs', 'aiTemp/release-verification/board_flow.rs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  board:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: aiTemp/checkout
          ref: ${{ github.sha }}
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Compile production reducer with focused regression fixture
        run: |
          set -euo pipefail
          mkdir -p aiTemp/board-probe aiTemp/evidence
          python - <<'PY'
          from pathlib import Path
          root=Path.cwd()
          (root/'aiTemp/board-probe/Cargo.toml').write_text('''[package]
          name = "studio-board-contract"
          version = "0.1.0"
          edition = "2021"
          [workspace]
          [lib]
          path = "lib.rs"
          [dependencies]
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          uuid = { version = "1", features = ["v4"] }
          ''')
          board=root/'src-tauri/src/integrations/board.rs'
          tests=root/'aiTemp/release-verification/board_flow.rs'
          (root/'aiTemp/board-probe/lib.rs').write_text('pub mod error { pub type AppResult<T> = Result<T, String>; }\nfn err(s:&str)->String{s.into()}\nfn now()->u64{1}\nmod production {\ninclude!('+repr(str(board)).replace("'",'"')+');\n#[cfg(test)] mod regression { include!('+repr(str(tests)).replace("'",'"')+'); }\n}\n')
          # Inner module docs are preserved as ordinary docs in this isolated compile view.
          text=board.read_text().replace('//!','//',1)
          (root/'aiTemp/board-probe/board.rs').write_text(text)
          text=tests.read_text().replace('//!','//',1)
          (root/'aiTemp/board-probe/tests.rs').write_text(text)
          (root/'aiTemp/board-probe/lib.rs').write_text('pub mod error { pub type AppResult<T> = Result<T, String>; }\nfn err(s:&str)->String{s.into()}\nfn now()->u64{1}\nmod production { include!("board.rs"); #[cfg(test)] mod regression { include!("tests.rs"); } }\n')
          PY
          cargo test --manifest-path aiTemp/board-probe/Cargo.toml board_flow_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/board.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-board-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          retention-days: 14
          if-no-files-found: error
