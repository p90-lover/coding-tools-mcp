name: Main preservation redirected callback check
on:
  push:
    branches: [fix/main-preservation-0.4.3-rc.4]
    paths: ['.github/workflows/main-preservation-browser-green.yml']
permissions:
  contents: read
  actions: read
jobs:
  browser:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE: 7cf7b375808ec1f727bd38490a6201e31e1a061f
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/aiTemp/pip-cache
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - name: Check real redirect with all external browser traffic blocked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/browser-fixture aiTemp/evidence
          gh run download 34453654250 --repo "$GITHUB_REPOSITORY" --name oauth-popup-browser-fixture-34453654250 --dir aiTemp/browser-fixture
          python -c "import ast; from pathlib import Path; ast.parse(Path('aiTemp/oauth-popup/browser_test.py').read_text())"
          python -m pip install playwright==1.57.0
          python aiTemp/oauth-popup/browser_test.py 2>&1 | tee aiTemp/evidence/browser-test.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: main-preservation-browser-green-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
