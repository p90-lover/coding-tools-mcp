name: Apply v0.7 rc.2 execution bridge compile fix

on:
  push:
    branches:
      - fix/v0.7-rc2-execution-bridge
    paths:
      - aiTemp/v0.7-rc2-execution-bridge/apply_compile_fix.py
      - .github/workflows/apply-v0.7-rc2-execution-bridge-compile-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v0.7-rc2-execution-bridge-compile-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/fix/v0.7-rc2-execution-bridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Install Linux Rust system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            patchelf

      - name: Apply exact source repair
        run: python3 aiTemp/v0.7-rc2-execution-bridge/apply_compile_fix.py

      - name: Verify Node and execution bridge contracts
        run: |
          set -euo pipefail
          node --check desktop-electron/electron/headless-host.cjs
          node --check desktop-electron/electron/ipc-schema.cjs
          node --check desktop-electron/electron/main.cjs
          node --check desktop-electron/electron/preload.cjs
          node --test desktop-electron/tests/execution-bridge-contract.test.cjs

      - name: Verify locked headless Rust service
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust-core/coding-tools-headless/Cargo.toml -- --check
          cargo test --manifest-path rust-core/coding-tools-headless/Cargo.toml --locked

      - name: Enforce no-delete source repair
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          changed="$(git diff --name-only)"
          test "${changed}" = "rust-core/coding-tools-headless/src/lib.rs"

      - name: Commit verified source repair
        run: |
          set -euo pipefail
          if git diff --quiet -- rust-core/coding-tools-headless/src/lib.rs; then
            echo "Execution bridge compile repair is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-core/coding-tools-headless/src/lib.rs
          git diff --cached --check
          git commit -m "fix(rc2): repair headless execution bridge compilation"
          git push origin "HEAD:${{ github.ref_name }}"
