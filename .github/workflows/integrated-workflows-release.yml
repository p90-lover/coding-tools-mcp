name: Integrated workflows release
on:
  push:
    branches: [release/integrated-workflows-0.4.2-rc.1]
    paths: ['.github/workflows/integrated-workflows-release.yml', 'aiTemp/integrated-delivery/**', 'src/**', 'src-tauri/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  board-contract:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Three production-board behavioral regressions
        working-directory: aiTemp/checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/board-probe aiTemp/evidence
          python - <<'PY'
          from pathlib import Path
          root=Path.cwd()
          probe=root/'aiTemp/board-probe'
          (probe/'Cargo.toml').write_text('[package]\nname="work-board-contract"\nversion="0.1.0"\nedition="2021"\n[lib]\npath="lib.rs"\n[dependencies]\nserde={version="1",features=["derive"]}\nserde_json="1"\nuuid={version="1",features=["v4"]}\n')
          (probe/'lib.rs').write_text('pub mod error {pub type AppResult<T> = Result<T,String>;}\nmod integrations {pub fn err(s:&str)->String{s.into()} pub fn now()->u64{1700000000}\n#[path="'+str(root/'src-tauri/src/integrations/board.rs')+'"] pub mod board;}\n#[cfg(test)]\n#[path="'+str(root/'aiTemp/release-verification/work_board_contract.rs')+'"]mod tests;\n')
          PY
          cargo test --manifest-path aiTemp/board-probe/Cargo.toml work_board_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/board-contract.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: work-board-contract-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: warn
          retention-days: 14
