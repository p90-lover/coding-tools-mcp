name: Apply Headless Configured Data Root

on:
  push:
    branches:
      - fix/v0.7-rc2-headless-data-root
    paths:
      - aiTemp/headless-data-root/apply_patch.py
      - .github/workflows/apply-headless-configured-data-root.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-headless-configured-data-root-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-headless-data-root

jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/fix/v0.7-rc2-headless-data-root'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          ref: ${{ github.ref_name }}
      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
      - name: Apply deterministic data-root repair twice
        run: |
          python3 aiTemp/headless-data-root/apply_patch.py
          python3 aiTemp/headless-data-root/apply_patch.py
      - name: Verify Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path rust-core/coding-tools-headless/Cargo.toml --check
      - name: Run headless Rust tests
        run: cargo test --manifest-path rust-core/coding-tools-headless/Cargo.toml --locked
      - name: Run strict headless Rust Clippy
        run: cargo clippy --manifest-path rust-core/coding-tools-headless/Cargo.toml --all-targets --locked -- -D warnings
      - name: Enforce no-delete patch
        shell: bash
        run: |
          deleted="$(git diff --diff-filter=D --name-only)"
          if [ -n "$deleted" ]; then
            printf 'Deleted paths are forbidden:\n%s\n' "$deleted" >&2
            exit 1
          fi
      - name: Commit verified configured-root repair
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "Configured data-root repair is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/src/data/migrate.rs \
            src-tauri/src/data/store.rs \
            rust-core/coding-tools-core/src/lib.rs \
            rust-core/coding-tools-headless/src/lib.rs \
            rust-core/coding-tools-headless/tests/control_api.rs
          git diff --cached --check
          git commit -m "fix(rc.2): bind headless state to its configured data root"
          git push origin "HEAD:${TARGET_BRANCH}"
