name: rc.11 CPA privileged clipboard boundary

on:
  push:
    branches:
      - cursor/five-stack-original-parity-rc11-2e35
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/src/lib.rs
      - src-tauri/src/commands/five_stack.rs
      - src/lib/components/control-center/OriginalUiPanel.svelte
      - tests/rc11-cpa-privileged-clipboard.test.mjs
      - .github/workflows/rc11-cpa-clipboard-boundary.yml
      - aiTemp/rc11-cpa-clipboard/**
  pull_request:
    branches:
      - main
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/src/lib.rs
      - src-tauri/src/commands/five_stack.rs
      - src/lib/components/control-center/OriginalUiPanel.svelte
      - tests/rc11-cpa-privileged-clipboard.test.mjs
      - .github/workflows/rc11-cpa-clipboard-boundary.yml
      - aiTemp/rc11-cpa-clipboard/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc11-cpa-clipboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Run privileged CPA clipboard contract
        run: |
          set -euo pipefail
          mkdir -p aiTemp/rc11-cpa-clipboard/evidence
          node --test tests/rc11-cpa-privileged-clipboard.test.mjs \
            2>&1 | tee aiTemp/rc11-cpa-clipboard/evidence/results.txt
          grep -F '# fail 0' aiTemp/rc11-cpa-clipboard/evidence/results.txt

      - name: Enforce no-delete diff
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git diff --check origin/main...HEAD
          test -z "$(git diff --diff-filter=D --name-only origin/main...HEAD)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc11-cpa-clipboard-${{ github.sha }}
          path: aiTemp/rc11-cpa-clipboard/evidence/
          if-no-files-found: error
          retention-days: 14
