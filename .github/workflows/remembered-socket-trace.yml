name: Trace isolated native socket initialization
on:
  push:
    branches: [audit/remembered-036-runtime-probe]
    paths: ['.github/workflows/remembered-socket-trace.yml']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OTEL_SDK_DISABLED: 'true'
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 34222575916
          name: remembered-native-helpers-34222575916
          path: aiTemp/checkout/src-tauri/aiTemp/native-sandbox
      - name: Obtain and authenticate Microsoft's diagnostic binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path aiTemp/procmon -Force | Out-Null
          Invoke-WebRequest 'https://download.sysinternals.com/files/ProcessMonitor.zip' -OutFile aiTemp/procmon/source.zip
          Expand-Archive aiTemp/procmon/source.zip aiTemp/procmon/unpacked
          $source = Get-Item aiTemp/procmon/unpacked/Procmon64.exe
          $signature = Get-AuthenticodeSignature $source.FullName
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Unverified diagnostic binary' }
          Copy-Item $source.FullName aiTemp/procmon/Procmon64.exe
      - name: Trace only isolated networking and retain filtered metadata
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python aiTemp/release-verification/socket_trace_probe.py "$PWD/src-tauri/aiTemp/native-sandbox/coding-tools-codex-sandbox.exe" "$PWD/aiTemp/socket-fixture" 2>&1 | tee aiTemp/evidence/trace-test.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remembered-socket-trace-${{ github.run_id }}
          path: |
            aiTemp/checkout/aiTemp/evidence/trace-test.txt
            aiTemp/checkout/aiTemp/evidence/socket-resource-failures.json
          if-no-files-found: error
          retention-days: 14
