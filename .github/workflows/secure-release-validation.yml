name: Secure desktop release validation

on:
  pull_request:
    branches:
      - feature/secure-auto-approval-persistent-auth
      - integration/xyTom-v0.3.0
    paths:
      - ".github/workflows/apply-secure-approval.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-request.yml"
      - ".github/workflows/secure-release-validation.yml"
      - "aiTemp/secure-auto-approval-persistent-auth/**"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "src-tauri/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-release-validation

jobs:
  validate-release-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify source materialization and synchronized release version
        run: |
          python aiTemp/secure-auto-approval-persistent-auth/check_persistent_oauth_state.py
          python aiTemp/secure-auto-approval-persistent-auth/apply_release_version.py --check
          git diff --exit-code

  build-windows-nsis:
    needs: validate-release-state
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-27

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: secure-release-validation-windows

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path aiTemp/npm-cache | Out-Null
          npm ci --cache aiTemp/npm-cache

      - name: Run focused release checks
        run: |
          npm run check
          node --test tests/*.test.mjs

      - name: Run locked Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Stage Windows validation artifacts
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "$env:CARGO_TARGET_DIR/release/bundle/nsis/*.exe")
          if ($files.Count -lt 1) { throw "Windows installer was not produced" }
          $checksumDir = "aiTemp/release-checksums"
          $payloadDir = "aiTemp/release-payload/windows"
          New-Item -ItemType Directory -Force -Path $checksumDir, $payloadDir | Out-Null
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksum = Join-Path $checksumDir "SHA256SUMS-windows.txt"
          $lines | Set-Content -Encoding utf8 $checksum
          Copy-Item $files.FullName -Destination $payloadDir
          Copy-Item $checksum -Destination $payloadDir

      - name: Upload Windows validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secure-windows-nsis-${{ github.sha }}
          path: aiTemp/release-payload/windows/*
          if-no-files-found: error
          retention-days: 7

  build-universal-macos-dmg:
    needs: validate-release-state
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-27
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: secure-release-validation-macos

      - name: Install frontend dependencies
        run: |
          mkdir -p aiTemp/npm-cache
          npm ci --cache aiTemp/npm-cache

      - name: Run focused release checks
        run: |
          npm run check
          node --test tests/*.test.mjs

      - name: Run locked Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build universal macOS DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: Stage macOS validation artifacts
        shell: bash
        run: |
          mkdir -p aiTemp/release-checksums aiTemp/release-payload/macos
          shopt -s nullglob
          files=("$CARGO_TARGET_DIR"/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#files[@]}" -lt 1 ]; then
            echo "macOS DMG was not produced"
            exit 1
          fi
          for file in "${files[@]}"; do
            shasum -a 256 "$file"
          done | sed 's#  .*/#  #' > aiTemp/release-checksums/SHA256SUMS-macos.txt
          cp "${files[@]}" aiTemp/release-payload/macos/
          cp aiTemp/release-checksums/SHA256SUMS-macos.txt aiTemp/release-payload/macos/

      - name: Upload macOS validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secure-macos-dmg-${{ github.sha }}
          path: aiTemp/release-payload/macos/*
          if-no-files-found: error
          retention-days: 7
