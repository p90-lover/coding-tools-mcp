name: rc.8 external services control plane

on:
  push:
    branches:
      - integration/v0.7.0-rc.8-external-services-control-plane
    paths:
      - '.github/workflows/rc8-external-services-control-plane.yml'
      - 'desktop-electron/electron/**'
      - 'desktop-electron/src/**'
      - 'desktop-electron/tests/external-services-control-plane.test.cjs'
      - 'desktop-electron/tests/rc7-full-integration-contract.test.cjs'
      - 'desktop-electron/vendor/upstream/**'
      - 'desktop-electron/scripts/package.cjs'
      - 'desktop-electron/scripts/prepare-five-stack-runtime.cjs'
      - 'desktop-electron/scripts/prepare-runtime.cjs'
      - 'desktop-electron/scripts/smoke-package.cjs'
      - 'desktop-electron/scripts/verify-package.cjs'
      - 'desktop-electron/tests/bundled-five-stack-runtime.test.cjs'
      - 'desktop-electron/tests/package-contents.test.cjs'
      - 'docs/superpowers/specs/2026-09-18-external-services-control-plane-design.md'
      - 'docs/superpowers/plans/2026-09-18-external-services-control-plane.md'
  pull_request:
    paths:
      - '.github/workflows/rc8-external-services-control-plane.yml'
      - 'desktop-electron/electron/**'
      - 'desktop-electron/src/**'
      - 'desktop-electron/tests/external-services-control-plane.test.cjs'
      - 'desktop-electron/tests/rc7-full-integration-contract.test.cjs'
      - 'desktop-electron/vendor/upstream/**'
      - 'desktop-electron/scripts/package.cjs'
      - 'desktop-electron/scripts/prepare-five-stack-runtime.cjs'
      - 'desktop-electron/scripts/prepare-runtime.cjs'
      - 'desktop-electron/scripts/smoke-package.cjs'
      - 'desktop-electron/scripts/verify-package.cjs'
      - 'desktop-electron/tests/bundled-five-stack-runtime.test.cjs'
      - 'desktop-electron/tests/package-contents.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc8-external-services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  NODE_VERSION: '22'
  RUST_TOOLCHAIN: 1.98.1
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/rc8-external-services/bun-cache

jobs:
  verify:
    name: Linux contracts and renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Prepare retained temporary directories
        run: |
          mkdir -p \
            aiTemp/rc8-external-services/renderer-dist \
            aiTemp/rc8-external-services/evidence \
            aiTemp/Trash/rc8-external-services

      - name: Install exact Electron dependencies
        run: bun install --cwd desktop-electron --frozen-lockfile

      - name: Run external-service and integration contracts
        run: |
          set -euo pipefail
          node --test \
            desktop-electron/tests/external-services-control-plane.test.cjs \
            desktop-electron/tests/rc7-full-integration-contract.test.cjs \
            desktop-electron/tests/provider-center-account-wiring.test.cjs \
            desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs \
            desktop-electron/tests/commandcode-provider-session.test.cjs \
            desktop-electron/tests/upstream-tool-runtime.test.cjs \
            2>&1 | tee aiTemp/rc8-external-services/evidence/contracts.txt

      - name: Validate runtime syntax
        run: |
          node --check desktop-electron/electron/external-services.cjs
          node --check desktop-electron/electron/provider-bootstrap.cjs
          node --check desktop-electron/electron/main.cjs
          node --check desktop-electron/electron/preload.cjs
          node --check desktop-electron/electron/upstream-tools.cjs

      - name: Typecheck and build isolated renderer
        run: |
          set -euo pipefail
          bun run --cwd desktop-electron typecheck
          renderer_dir="$GITHUB_WORKSPACE/aiTemp/rc8-external-services/renderer-dist"
          (
            cd desktop-electron
            bunx vite build --outDir "$renderer_dir" --emptyOutDir false
          )
          CODING_TOOLS_RENDERER_DIST="$renderer_dir" \
            node --test desktop-electron/tests/renderer-provider-bundle.test.cjs

      - name: Enforce no-delete contract
        run: |
          set -euo pipefail
          git diff --check
          base='origin/release/codex-router-multiprovider-0.7.0-rc.7'
          git fetch --no-tags origin \
            +refs/heads/release/codex-router-multiprovider-0.7.0-rc.7:refs/remotes/origin/release/codex-router-multiprovider-0.7.0-rc.7
          merge_base="$(git merge-base "$base" HEAD)"
          test -n "$merge_base"
          test -z "$(git diff --diff-filter=D --name-only "$merge_base"..HEAD)"
          printf 'base=%s\nmerge_base=%s\nhead=%s\n' \
            "$base" "$merge_base" "$(git rev-parse HEAD)" \
            | tee aiTemp/rc8-external-services/evidence/no-delete.txt

      - name: Preserve transient dependencies in Trash
        if: always()
        run: |
          if [ -d desktop-electron/node_modules ]; then
            mv desktop-electron/node_modules \
              "aiTemp/Trash/rc8-external-services/node_modules-$GITHUB_RUN_ID"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc8-external-services-linux-${{ github.sha }}
          path: aiTemp/rc8-external-services/evidence/
          if-no-files-found: warn
          retention-days: 14

  package-windows:
    name: Windows package and launcher smoke
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Prepare retained Windows roots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @(
            'aiTemp/rc8-external-services/windows-evidence',
            'aiTemp/rc8-external-services/tmp',
            'aiTemp/cache/electron-builder',
            'aiTemp/input/tunnel-client/v0.0.12/windows-amd64',
            'aiTemp/Trash/rc8-external-services/windows'
          )
          foreach ($root in $roots) { New-Item -ItemType Directory -Force -Path $root | Out-Null }

      - name: Install exact dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun install --cwd runtime-web --frozen-lockfile
          bun install --cwd runtime-web/launcher --frozen-lockfile
          bun install --cwd desktop-electron --frozen-lockfile

      - name: Fetch pinned tunnel client archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'aiTemp/input/tunnel-client/v0.0.12/windows-amd64/tunnel-client-v0.0.12-windows-amd64.zip'
          $url = 'https://github.com/openai/tunnel-client/releases/download/v0.0.12/tunnel-client-v0.0.12-windows-amd64.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = '2a2804933924e38a502d62b61f0266cb80d56d65744f4c29876b2bf9c1544356'
          if ($actual -ne $expected) { throw "Tunnel archive digest mismatch: $actual" }
          "archive=$archive`nsha256=$actual" | Set-Content -Encoding utf8 aiTemp/rc8-external-services/windows-evidence/tunnel-client.txt

      - name: Run focused Windows contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test `
            desktop-electron/tests/external-services-control-plane.test.cjs `
            desktop-electron/tests/rc7-full-integration-contract.test.cjs `
            desktop-electron/tests/provider-center-account-wiring.test.cjs `
            desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs `
            desktop-electron/tests/commandcode-provider-session.test.cjs `
            desktop-electron/tests/upstream-tool-runtime.test.cjs `
            desktop-electron/tests/vendor-upstream-bundles.test.cjs `
            2>&1 | Tee-Object -FilePath aiTemp/rc8-external-services/windows-evidence/contracts.txt
          if ($LASTEXITCODE -ne 0) { throw 'Focused Windows contracts failed' }
          bun run --cwd desktop-electron typecheck

      - name: Compile headless service and package Windows installer
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
          CODING_TOOLS_TUNNEL_CLIENT_ARCHIVE: ${{ github.workspace }}\aiTemp\input\tunnel-client\v0.0.12\windows-amd64\tunnel-client-v0.0.12-windows-amd64.zip
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\aiTemp\cache\electron-builder
          CODING_TOOLS_RETENTION_ROOT: ${{ github.workspace }}\aiTemp\Trash\rc8-external-services\windows
          TMP: ${{ github.workspace }}\aiTemp\rc8-external-services\tmp
          TEMP: ${{ github.workspace }}\aiTemp\rc8-external-services\tmp
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust headless release build failed' }
          $nodeExe = $null
          if ($env:RUNNER_TOOL_CACHE) {
            $toolcacheNode = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TOOL_CACHE 'node') -Recurse -Filter node.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -notmatch '\\.bun\\' -and -not (Test-Path -LiteralPath (Join-Path $_.DirectoryName 'bun.exe')) } |
              Select-Object -First 1
            if ($toolcacheNode) { $nodeExe = $toolcacheNode.FullName }
          }
          if (-not $nodeExe) {
            $nodeCmd = Get-Command node.exe -All -ErrorAction SilentlyContinue |
              Where-Object { $_.Source -notmatch '\\bun(\.exe)?$' -and $_.Source -notmatch '\\.bun\\' } |
              Select-Object -First 1
            if ($nodeCmd) { $nodeExe = $nodeCmd.Source }
          }
          if (-not $nodeExe) { throw 'Real node.exe not found (bun shims skipped)' }
          $env:CODING_TOOLS_NODE_EXE = $nodeExe
          $env:npm_node_execpath = $nodeExe
          $env:Path = "$(Split-Path -Parent $nodeExe);$env:Path"
          bun run --cwd desktop-electron package:win
          if ($LASTEXITCODE -ne 0) { throw 'Windows package build failed' }

      - name: Verify package and packaged launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node desktop-electron/scripts/verify-package.cjs desktop-electron/artifacts --source $env:GITHUB_SHA --json-out aiTemp/rc8-external-services/windows-evidence/package-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
          node --test desktop-electron/tests/package-contents.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Package contents contract failed' }
          bun run --cwd desktop-electron smoke:package
          if ($LASTEXITCODE -ne 0) { throw 'Packaged launcher smoke failed' }
          Get-ChildItem desktop-electron/artifacts -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 aiTemp/rc8-external-services/windows-evidence/SHA256SUMS.txt

      - name: Preserve generated renderer and restore tracked source
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:GITHUB_WORKSPACE "aiTemp/Trash/rc8-external-services/windows/generated-dist-$env:GITHUB_RUN_ID"
          if (Test-Path desktop-electron/dist) {
            New-Item -ItemType Directory -Force -Path (Split-Path $destination -Parent) | Out-Null
            Move-Item -LiteralPath desktop-electron/dist -Destination $destination
            git restore --source=HEAD --worktree -- desktop-electron/dist
          }
          git diff --check
          $deleted = git diff --diff-filter=D --name-only
          if ($deleted) { throw "Tracked deletions detected: $deleted" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc8-external-services-windows-${{ github.sha }}
          path: |
            desktop-electron/artifacts/
            aiTemp/rc8-external-services/windows-evidence/
          if-no-files-found: warn
          retention-days: 14
