name: Reproduce Runtime Web Goal Latency Patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          clean: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Reproduce exact request-body fast path
        run: |
          mkdir -p aiTemp/codex-web-goal-latency/evidence
          python aiTemp/codex-web-goal-latency/apply-request-body-fast-path.py \
            | tee aiTemp/codex-web-goal-latency/evidence/reproduce.log
          grep -q "REQUEST_BODY_FAST_PATH_PATCH_OK" \
            aiTemp/codex-web-goal-latency/evidence/reproduce.log
      - name: Enforce narrow no-delete reproduction
        shell: bash
        run: |
          test -z "$(git diff --diff-filter=D --name-only)"
          unexpected="$(git diff --name-only | grep -Ev '^runtime-web/src/(http-body|native-passthrough|server)\.ts$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected tracked changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git diff --check
      - name: Install locked Runtime Web dependencies
        working-directory: runtime-web
        run: bun install --frozen-lockfile
      - name: Run focused Goal and request-path regressions
        working-directory: runtime-web
        run: bun test tests/chatgpt-web-goal.test.ts tests/request-body-fast-path.test.ts tests/router-web-ingress.test.ts
      - name: Typecheck Runtime Web
        working-directory: runtime-web
        run: bun run typecheck
