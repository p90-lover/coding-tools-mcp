name: Isolate Windows command resource failure
on:
  push:
    branches: [audit/remembered-036-runtime-probe]
    paths: ['.github/workflows/remembered-runtime-probe.yml']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OTEL_SDK_DISABLED: 'true'
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 492d268705839b4f9692c2f55c2009e1ad662d43
          path: aiTemp/checkout
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 34222575916
          name: remembered-native-helpers-34222575916
          path: aiTemp/checkout/src-tauri/aiTemp/native-sandbox
      - name: Observe resource paths and keep native negative checks
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/runtime-probe
          python - <<'PY' 2>&1 | tee aiTemp/evidence/runtime-probe.txt
          import ctypes, hashlib, json, os, runpy, subprocess, sys
          from pathlib import Path
          helper=Path('src-tauri/aiTemp/native-sandbox/coding-tools-codex-sandbox.exe').resolve()
          root=Path('aiTemp/runtime-probe').resolve()
          workspace=root/'workspace';workspace.mkdir()
          home=root/'state';(home/'aiTemp').mkdir(parents=True)
          native=root/'resources.rs';probe=workspace/'resources.exe'
          native.write_text(r'''
          use std::{env,fs,path::PathBuf};
          #[link(name="kernel32")]
          unsafe extern "system" {
            fn GetFileMUIPath(flags:u32,file:*const u16,language:*mut u16,language_len:*mut u32,path:*mut u16,path_len:*mut u32,enumerator:*mut u64)->i32;
            fn GetLastError()->u32;
            fn GetUserDefaultUILanguage()->u16;
          }
          fn main(){
            let windows=PathBuf::from(env::var("SystemRoot").unwrap());
            for relative in ["System32/cmd.exe","System32/en-US/cmd.exe.mui","SystemResources/cmd.exe.mun","System32/kernelbase.dll","System32/en-US/kernelbase.dll.mui","Globalization/Sorting/SortDefault.nls","Globalization/Sorting/SortServer2003Compat.nls"] {
              let path=windows.join(relative);
              match fs::read(&path) {Ok(data)=>println!("file {} readable {}",relative,data.len()),Err(e)=>println!("file {} error {:?} {:?}",relative,e.kind(),e.raw_os_error())}
            }
            let file:Vec<u16>=windows.join("System32/cmd.exe").to_string_lossy().encode_utf16().chain(Some(0)).collect();
            let mut lang=vec![0u16;256];let mut lang_len=256u32;
            let mut path=vec![0u16;32768];let mut path_len=32768u32;let mut en=0u64;
            let ok=unsafe{GetFileMUIPath(8,file.as_ptr(),lang.as_mut_ptr(),&mut lang_len,path.as_mut_ptr(),&mut path_len,&mut en)};
            let error=unsafe{GetLastError()};
            println!("mui ok={} error={} language={} path={} user_ui_lang={}",ok,error,String::from_utf16_lossy(&lang[..lang.iter().position(|c|*c==0).unwrap_or(lang.len())]),String::from_utf16_lossy(&path[..path.iter().position(|c|*c==0).unwrap_or(path.len())]),unsafe{GetUserDefaultUILanguage()});
          }
          ''',encoding='utf-8')
          subprocess.run(['rustc','--edition','2021',str(native),'-o',str(probe)],check=True)
          keep={'SYSTEMROOT','SYSTEMDRIVE','WINDIR','PROGRAMFILES','PROGRAMFILES(X86)','PROGRAMDATA','USERNAME','USERPROFILE','LOCALAPPDATA','APPDATA'}
          env={k:v for k,v in os.environ.items() if k.upper() in keep}
          env.update({'TEMP':str(home/'aiTemp'),'TMP':str(home/'aiTemp'),'CODEX_HOME':str(home),'OTEL_SDK_DISABLED':'true'})
          def request(operation,argv=None):
              e=env.copy()
              if operation=='setup':e['CODING_TOOLS_LOCAL_SANDBOX_SETUP']='1'
              payload={'operation':operation,'workspace':str(workspace),'home':str(home),'argv':argv or [],'timeout_ms':8000}
              result=subprocess.run([str(helper)],input=json.dumps(payload).encode(),capture_output=True,env=e,timeout=120)
              value=json.loads(result.stdout);print(json.dumps({'operation':operation,'result':value}),flush=True)
              assert value['model_calls'] is False
              return value
          print('UNSANDBOXED RESOURCE POSITIVE CONTROL')
          subprocess.run([str(probe)],check=True)
          assert request('setup')['ready'] is True
          print('SANDBOXED RESOURCES')
          assert request('exec',[str(probe)])['ok']
          for cmd in ['echo command-output-fixture','ver','type sentinel.txt']:
              if cmd.startswith('type'):(workspace/'sentinel.txt').write_text('sentinel-content',encoding='utf-8')
              print('COMMAND',cmd)
              request('exec',[os.environ['COMSPEC'],'/d','/c',cmd])
          # Keep every actual confinement assertion. Defer only the already-known
          # localized-version failure so the negative checks become observable.
          source=Path('aiTemp/release-verification/sandbox_native.py').read_text(encoding='utf-8')
          old="assert command['ok'] and 'Windows' in command['stdout'], command"
          assert source.count(old)==1
          source=source.replace(old,"assert command['ok'], command\nprint('DIAGNOSTIC ONLY: localized ver check deferred; not release evidence')")
          source=source.replace("Path('aiTemp/evidence/sandbox-proof.json')","Path('aiTemp/evidence/diagnostic-only-proof.json')")
          source=source.replace("'native_windows_runtime',", "'native_localized_runtime_not_verified',")
          path=root/'negative_probe.py';path.write_text(source,encoding='utf-8')
          sys.argv=[str(path),str(helper),str(root/'negative')]
          runpy.run_path(str(path),run_name='__main__')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remembered-runtime-diagnostic-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
