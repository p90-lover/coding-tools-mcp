name: rc.9 one-app tool panels

on:
  push:
    branches:
      - integration/v0.7.0-rc.9-one-app-tool-panels-merge
    paths:
      - '.github/workflows/rc9-one-app-tool-panels.yml'
      - 'desktop-electron/electron/external-services.cjs'
      - 'desktop-electron/electron/upstream-tools.cjs'
      - 'desktop-electron/src/features/CommandCodeProxySurface.tsx'
      - 'desktop-electron/src/features/ExternalServicesSurface.tsx'
      - 'desktop-electron/src/features/UpstreamToolSurface.tsx'
      - 'desktop-electron/src/features/commandcode-proxy.css'
      - 'desktop-electron/src/features/upstream-tool.css'
      - 'desktop-electron/src/types.ts'
      - 'desktop-electron/tests/original-upstream-panels.test.cjs'
      - 'desktop-electron/tests/upstream-tools.test.cjs'
      - 'desktop-electron/vendor/upstream/anneal.json'
      - 'desktop-electron/vendor/upstream/paseo.json'
  pull_request:
    paths:
      - '.github/workflows/rc9-one-app-tool-panels.yml'
      - 'desktop-electron/electron/external-services.cjs'
      - 'desktop-electron/electron/upstream-tools.cjs'
      - 'desktop-electron/src/features/CommandCodeProxySurface.tsx'
      - 'desktop-electron/src/features/ExternalServicesSurface.tsx'
      - 'desktop-electron/src/features/UpstreamToolSurface.tsx'
      - 'desktop-electron/src/features/commandcode-proxy.css'
      - 'desktop-electron/src/features/upstream-tool.css'
      - 'desktop-electron/src/types.ts'
      - 'desktop-electron/tests/original-upstream-panels.test.cjs'
      - 'desktop-electron/tests/upstream-tools.test.cjs'
      - 'desktop-electron/vendor/upstream/anneal.json'
      - 'desktop-electron/vendor/upstream/paseo.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc9-one-app-tool-panels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Run focused panel contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            desktop-electron/tests/original-upstream-panels.test.cjs \
            desktop-electron/tests/upstream-tools.test.cjs \
            desktop-electron/tests/external-services-control-plane.test.cjs

      - name: Validate runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check desktop-electron/electron/external-services.cjs
          node --check desktop-electron/electron/upstream-tools.cjs

      - name: Enforce no tracked deletions
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git diff --diff-filter=D --exit-code "$base" HEAD
