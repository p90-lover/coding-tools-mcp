name: rc.11 managed app handle controls

on:
  push:
    branches:
      - feature/rc11-managed-app-handle-controls
    paths:
      - '.github/workflows/rc11-managed-app-handle-controls.yml'
      - 'aiTemp/rc11-managed-app-controls/**'
      - 'desktop-electron/src/features/ManagedAppsSurface.tsx'
      - 'desktop-electron/src/features/managed-apps.css'
      - 'desktop-electron/tests/rc11-managed-app-handle-controls.test.cjs'
  pull_request:
    paths:
      - '.github/workflows/rc11-managed-app-handle-controls.yml'
      - 'aiTemp/rc11-managed-app-controls/**'
      - 'desktop-electron/src/features/ManagedAppsSurface.tsx'
      - 'desktop-electron/src/features/managed-apps.css'
      - 'desktop-electron/tests/rc11-managed-app-handle-controls.test.cjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc11-managed-app-handle-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red:
    name: Managed app handle controls RED contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Prepare retained RED evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/rc11-managed-app-controls/evidence
          mkdir -p aiTemp/Trash/rc11-managed-app-controls

      - name: Prove toolbar contract is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --test desktop-electron/tests/rc11-managed-app-handle-controls.test.cjs \
            > aiTemp/rc11-managed-app-controls/evidence/red.txt 2>&1
          status=$?
          set -e
          cat aiTemp/rc11-managed-app-controls/evidence/red.txt
          if [ "$status" -eq 0 ]; then
            echo 'Managed app handle controls unexpectedly passed before implementation.' >&2
            exit 1
          fi
          grep -F 'not ok' aiTemp/rc11-managed-app-controls/evidence/red.txt
          grep -F 'managed-app-toolbar' aiTemp/rc11-managed-app-controls/evidence/red.txt

      - name: Enforce no-delete contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/rc11-managed-app-api-sensitive-values --no-tags
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only origin/fix/rc11-managed-app-api-sensitive-values...HEAD)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc11-managed-app-controls-red-${{ github.sha }}
          path: aiTemp/rc11-managed-app-controls/evidence/
          if-no-files-found: warn
          retention-days: 14
