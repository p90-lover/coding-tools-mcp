name: Image provider rc2

on:
  push:
    branches:
      - feature/0.7-rc2-image-providers
  pull_request:
    paths:
      - 'src-tauri/src/media.rs'
      - 'src-tauri/src/commands/providers.rs'
      - 'src-tauri/src/providers.rs'
      - 'src-tauri/src/lib.rs'
      - 'src/lib/provider-media.ts'
      - 'src/lib/components/AppShell.svelte'
      - 'src/routes/image-studio/**'
      - 'aiTemp/rc2/image_provider_contract.py'
      - '.github/workflows/image-provider-rc2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-provider-rc2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          clean: false
      - name: Run image provider contract
        run: python aiTemp/rc2/image_provider_contract.py
