name: Integration lifecycle regression
on:
  push:
    branches: [fix/integration-controls-0.4.4-rc.2]
    paths: [.github/workflows/integration-controls-red.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a56e30a25f16e55805e9550d319233974f11765
          path: aiTemp/source
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Require the current source to reproduce the retention leak
        working-directory: aiTemp/source
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/red-target
        run: |
          set -euo pipefail
          mkdir -p aiTemp/probe/src aiTemp/evidence
          python - <<'PY'
          from pathlib import Path
          root=Path('.').resolve()
          Path('aiTemp/probe/Cargo.toml').write_text('[package]\nname="retention-regression"\nversion="0.0.0"\nedition="2021"\n[dependencies]\nuuid={version="=1.18.1",features=["v4"]}\n')
          text='type AppResult<T> = Result<T, Box<dyn std::error::Error>>;\nfn err(s: impl Into<String>) -> Box<dyn std::error::Error> { s.into().into() }\n'
          text+='#[path = "'+str(root/'src-tauri/src/tools/sandbox_snapshot.rs')+'"]\nmod snapshot;\n'
          text+='''#[test] fn rejected_input_must_not_consume_retention() {
              let base=std::env::current_dir().unwrap().join("aiTemp").join(uuid::Uuid::new_v4().to_string());
              let root=base.join("workspace");let home=base.join("storage");
              std::fs::create_dir_all(&root).unwrap();
              let result=snapshot::prepare(&root,&home,&["../private.txt".into()]);
              assert!(result.is_err());
              let count=std::fs::read_dir(home.join("runs")).map(|d|d.count()).unwrap_or(0);
              assert_eq!(count,0,"INVALID_INPUT_CONSUMED_RETENTION_SLOT");
          }'''
          Path('aiTemp/probe/src/lib.rs').write_text(text)
          PY
          set +e
          cargo test --manifest-path aiTemp/probe/Cargo.toml -- --nocapture > aiTemp/evidence/retention-red.txt 2>&1
          result=$?
          set -e
          test "$result" -eq 101
          grep -F INVALID_INPUT_CONSUMED_RETENTION_SLOT aiTemp/evidence/retention-red.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-retention-red-${{ github.run_id }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
