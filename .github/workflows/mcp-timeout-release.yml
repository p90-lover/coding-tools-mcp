name: Verified MCP timeout recovery
on:
  push:
    branches: [fix/mcp-timeout-recovery-0.4.4-rc.2]
    paths: [.github/workflows/mcp-timeout-release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcp-timeout-recovery-044rc2
  cancel-in-progress: false
env:
  VERSION: 0.4.4-rc.2
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: write, actions: read}
    outputs:
      source: ${{ steps.source.outputs.source }}
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1', components: rustfmt}
      - name: Require reproduced lost-completion failure and prepare reviewed source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          gh run download 34550277930 --repo "$GITHUB_REPOSITORY" --name mcp-timeout-red-34550277930 --dir aiTemp/evidence
          grep -F WORKER_FINISHED_BUT_COMPLETION_WAS_LOST aiTemp/evidence/timeout-red.txt
          python - <<'PY'
          import ast
          from pathlib import Path
          for p in Path('aiTemp/timeout-recovery').glob('*.py'):ast.parse(p.read_text(encoding='utf-8'))
          PY
          if python -c "import json; from pathlib import Path; assert json.loads(Path('package.json').read_text())['version']=='0.4.4-rc.2'"; then
            git diff --exit-code
          else
            python aiTemp/timeout-recovery/prepare.py
          fi
      - name: Commit exact candidate without overwriting concurrent main or branch changes
        id: source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git diff --exit-code 7a56e30a25f16e55805e9550d319233974f11765 -- src-tauri/src/auth native-helpers src-tauri/src/tools/native_sandbox.rs src-tauri/src/tools/sandbox_runner.rs src-tauri/src/tools/sandbox_snapshot.rs src-tauri/src/tools/policy.rs src-tauri/src/tools/approval.rs src-tauri/src/tools/live_policy.rs
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then git commit -m 'fix(mcp): retain worker-owned completion and expose read-only operation recovery'; fi
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = 7a56e30a25f16e55805e9550d319233974f11765
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME --jq .object.sha)" = "$GITHUB_SHA"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --stat 7a56e30a25f16e55805e9550d319233974f11765 HEAD > aiTemp/evidence/source-scope.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'timeout-preparation-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: warn, retention-days: 14}
  unit:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/timeout-unit-target
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ env.SOURCE }}', path: aiTemp/source, clean: false, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - name: Test production receipt store and worker lifecycle before Windows build
        run: |
          set -euo pipefail
          mkdir -p aiTemp/unit/src aiTemp/evidence
          python - <<'PY'
          from pathlib import Path
          root=Path('.').resolve()
          Path('aiTemp/unit/Cargo.toml').write_text('''[package]
          name="timeout-recovery-unit"
          version="0.0.0"
          edition="2021"
          [dependencies]
          axum="0.8"
          serde_json="1"
          uuid={version="1",features=["v4"]}
          tokio={version="1",features=["rt-multi-thread","macros","sync","time"]}
          ''')
          text='pub mod mcp {\n'
          for name in ['operation_store','tracked']:
              text+='#[path = "'+(root/('src-tauri/src/mcp/'+name+'.rs')).as_posix()+'"]\npub mod '+name+';\n'
          text+='}\n#[cfg(test)]\n#[path = "'+(root/'aiTemp/timeout-recovery/contract.rs').as_posix()+'"]\nmod contract;\n'
          Path('aiTemp/unit/src/lib.rs').write_text(text)
          PY
          cargo test --manifest-path aiTemp/unit/Cargo.toml recovery_contract_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/recovery-unit.txt
          grep -F '2 passed; 0 failed' aiTemp/evidence/recovery-unit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'timeout-unit-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
  windows:
    needs: [prepare, unit]
    runs-on: windows-latest
    timeout-minutes: 40
    permissions: {contents: read, actions: read}
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      PLATFORM: windows-x64
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/timeout-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/aiTemp/pip-cache
      EXTENSION_SOURCE_DIR: ${{ github.workspace }}/aiTemp/extension
      CODING_TOOLS_COMMAND_NATIVE_SHA256: 444a3f0008050605cae73cd9b7a2dcac61294062dfaab56dd20430fd6498518b
      CODING_TOOLS_SNAPSHOT_HELPER: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-appcontainer.exe
      CODING_TOOLS_SNAPSHOT_PROBE: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-sandbox-probe.exe
      APP_CONTAINER_HELPER: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-appcontainer.exe
      APP_CONTAINER_PROBE: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-sandbox-probe.exe
      CI: 'true'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ env.SOURCE }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {repository: p90-lover/coding-tools-mcp-fast-access-extension, ref: b0d4db553227fa3c7300050b8edff6e2eb9afee4, path: aiTemp/extension, clean: false, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - name: Retain baseline failure evidence and actual native snapshot boundary
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          gh run download 34550277930 --repo "$GITHUB_REPOSITORY" --name mcp-timeout-red-34550277930 --dir aiTemp/evidence
          cmake -S native-helpers/app-container -B aiTemp/native-build -A x64 -DCODING_TOOLS_BUILD_PROBE=ON
          cmake --build aiTemp/native-build --config Release 2>&1 | tee aiTemp/evidence/native-build.txt
          python aiTemp/completion/native_test.py 2>&1 | tee aiTemp/evidence/native-tests.txt
      - name: Check unchanged frontend and prepare verification dependencies
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
          python -m pip install playwright==1.57.0 jsonschema==4.25.1
      - name: Three focused recovery groups and existing permission contracts
        run: |
          set -euo pipefail
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib recovery_contract_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/recovery-tests.txt
          grep -F '3 passed; 0 failed' aiTemp/evidence/recovery-tests.txt
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib snapshot_contract_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/snapshot-contract.txt
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib core_catalog_exposes_chatgpt_compatible_tools_without_unreleased_claims -- --test-threads=1 2>&1 | tee aiTemp/evidence/registry.txt
      - name: Preserve real-browser OAuth, extension and connection behavior
        env: {OAUTH_BROWSER_PROBE: aiTemp/origin-repair/browser_live.py}
        run: |
          set -euo pipefail
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib oauth_popup_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/oauth-tests.txt
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib catalog_exposure_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/catalog-tests.txt
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib connection_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/connection-tests.txt
      - name: Inspect actual Windows installer and validate the real recovery output schema
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles nsis -- --locked --features native-snapshot 2>&1 | tee aiTemp/evidence/installer.txt
          python aiTemp/timeout-recovery/package.py
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'timeout-installer-${{ github.run_id }}', path: 'aiTemp/source/aiTemp/installer/*', if-no-files-found: error, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'timeout-evidence-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
  publish:
    needs: [prepare, unit, windows]
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: write, actions: read}
    env: {SOURCE: '${{ needs.prepare.outputs.source }}'}
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ env.SOURCE }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - name: Verify every gate and read back uploads before fast-forwarding main
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python aiTemp/timeout-recovery/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: timeout-publication-${{ github.run_id }}
          path: |
            aiTemp/source/aiTemp/timeout-release-receipt.json
            aiTemp/source/aiTemp/timeout-release-draft.json
          if-no-files-found: warn
          retention-days: 14
