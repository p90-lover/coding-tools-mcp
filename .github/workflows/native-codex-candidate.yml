name: Native Codex bridge candidate
on:
  push:
    branches: [feature/native-codex-bridge-20260909]
    paths: ['.github/workflows/native-codex-candidate.yml', 'aiTemp/native-codex-delivery/**', 'aiTemp/release-verification/native_turn_fixture.rs', 'scripts/native_bridge_ci.py', 'src/**', 'src-tauri/**', 'README*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-codex-candidate-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
  VERSION: '0.4.2-rc.1'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Materialize and format checked source without deleting files
        id: source
        working-directory: aiTemp/checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/native_bridge_ci.py prepare
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: native dispatcher binding, focused real protocol fixture and v0.4.2 candidate'
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
            test "$remote" = "$GITHUB_SHA"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip HEAD --output=aiTemp/prepared/source.zip
          git rev-parse HEAD > aiTemp/prepared/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-codex-source-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/prepared/*
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundle: nsis
            native_asset: codex-x86_64-pc-windows-msvc.exe.tar.gz
          - os: macos-14
            platform: macos-arm64
            bundle: app,dmg
            native_asset: codex-aarch64-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Three focused bridge contracts before the desktop build
        working-directory: aiTemp/checkout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/native_bridge_ci.py probe-init
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_bridge_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/bridge-contracts.txt
      - name: Verify official native Codex bytes without inference
        working-directory: aiTemp/checkout
        shell: bash
        env:
          NATIVE_ASSET: ${{ matrix.native_asset }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/native_bridge_ci.py download-native
      - name: Actual native protocol consent and cancellation check
        working-directory: aiTemp/checkout
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_bridge_actual_app_server_handshake_and_revocation -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-handshake.txt
      - name: Native turns against one loopback fixture, no paid inference
        working-directory: aiTemp/checkout
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_bridge_actual_turns_against_loopback_fixture -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-turns-fixture.txt
          python scripts/native_bridge_ci.py proofs
      - name: Frontend and bilingual documentation
        working-directory: aiTemp/checkout
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend-check.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
          python aiTemp/release-verification/check_bilingual_docs.py 2>&1 | tee aiTemp/evidence/bilingual-docs.txt
      - name: Integrated listener and unchanged sandbox boundaries
        working-directory: aiTemp/checkout
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib native_bridge_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/integrated-bridge.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib live_policy_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/live-policy.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib core_catalog_exposes_chatgpt_compatible_tools -- --test-threads=1 2>&1 | tee aiTemp/evidence/catalog.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib sandbox_release_rejects -- --test-threads=1 2>&1 | tee aiTemp/evidence/sandbox-stays-withheld.txt
      - name: Retained isolated Windows computer control fixture
        if: runner.os == 'Windows'
        working-directory: aiTemp/checkout
        shell: bash
        env:
          COMPUTER_USE_NATIVE_SMOKE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib computer_native_fixture_round_trip -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-smoke.txt
      - name: Build and inspect native candidate without publishing a release
        working-directory: aiTemp/checkout
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          CI: 'true'
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles "$BUNDLE" -- --locked 2>&1 | tee aiTemp/evidence/installer-build.txt
          python scripts/native_bridge_ci.py installer 2>&1 | tee aiTemp/evidence/installer-inspection.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-codex-candidate-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/installer/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-codex-evidence-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
