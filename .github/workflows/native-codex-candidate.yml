name: Native Codex bridge candidate
on:
  push:
    branches: [feature/native-codex-bridge-20260909]
    paths: ['.github/workflows/native-codex-candidate.yml', 'aiTemp/native-codex-delivery/**', 'src/**', 'src-tauri/**', 'README*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-codex-candidate-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - name: Materialize checked source without deleting files
        id: source
        working-directory: aiTemp/checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/prepared
          python - <<'PY'
          import base64,hashlib,json,lzma,os,shutil,subprocess
          from pathlib import Path
          if not Path('src-tauri/src/codex_bridge/mod.rs').exists():
              raw=''.join(Path(f'aiTemp/native-codex-delivery/source.patch.xz.b64.part{i}').read_text().strip() for i in range(1,4))
              packed=base64.b64decode(raw,validate=True)
              assert hashlib.sha256(packed).hexdigest()=='8cbe342b60087080597e3f5273cb4c2add774c798ab3aedd5e4fae4e0ee39e45'
              decoded=lzma.decompress(packed,memlimit=128*1024*1024)
              assert len(decoded)<2*1024*1024
              payload=json.loads(decoded)
              assert payload['base_commit']=='fa7f323aa52ee5b5c143f61ff46fc534264f79ff'
              assert hashlib.sha256(payload['patch'].encode()).hexdigest()==payload['patch_sha256']
              assert len(payload['files'])==20
              for name,identity in payload['files'].items():
                  p=Path(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert name.startswith(('src/','src-tauri/src/','docs/')) or name in ('README.md','README.en.md')
                  if identity['before'] is None: assert not p.exists(),name
                  else:
                      assert hashlib.sha256(p.read_bytes()).hexdigest()==identity['before'],name
                      backup=Path('aiTemp/Trash/native-codex-before')/os.environ['GITHUB_RUN_ID']/p
                      backup.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,backup)
              patch=Path('aiTemp/prepared/source.patch');patch.write_text(payload['patch'],encoding='utf-8')
              subprocess.run(['git','apply','--check',str(patch)],check=True)
              subprocess.run(['git','apply',str(patch)],check=True)
              for name,identity in payload['files'].items():
                  assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==identity['after'],name
              subprocess.run(['git','add','--',*payload['files']],check=True)
              assert not subprocess.check_output(['git','diff','--cached','--diff-filter=D','--name-only']).strip()
              subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add locally opted-in native Codex App Server bridge'
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
            test "$remote" = "$GITHUB_SHA"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip HEAD --output=aiTemp/prepared/source.zip
          git rev-parse HEAD > aiTemp/prepared/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-codex-source-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/prepared/*
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundle: nsis
            native_asset: codex-x86_64-pc-windows-msvc.exe.tar.gz
          - os: macos-14
            platform: macos-arm64
            bundle: app,dmg
            native_asset: codex-aarch64-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Three focused bridge contracts before the desktop build
        working-directory: aiTemp/checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/bridge-probe
          python - <<'PY'
          from pathlib import Path
          Path('aiTemp/bridge-probe/Cargo.toml').write_text('''[package]
          name = "native-bridge-contract-probe"
          version = "0.1.0"
          edition = "2021"
          [lib]
          path = "../../src-tauri/src/codex_bridge/mod.rs"
          [dependencies]
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          sha2 = "0.10"
          [target.'cfg(unix)'.dependencies]
          libc = "0.2"
          [target.'cfg(windows)'.dependencies]
          windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }
          ''',encoding='utf-8')
          PY
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_bridge_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/bridge-contracts.txt
          python -c "from pathlib import Path; assert '3 passed; 0 failed; 1 ignored' in Path('aiTemp/evidence/bridge-contracts.txt').read_text()"
      - name: Verify official native Codex bytes and handshake without inference
        working-directory: aiTemp/checkout
        shell: bash
        env:
          NATIVE_ASSET: ${{ matrix.native_asset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,tarfile,urllib.request
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'aiTemp/native-codex-package';root.mkdir(parents=True,exist_ok=False)
          headers={'User-Agent':'coding-tools-mcp-native-verification','Authorization':'Bearer '+os.environ['GH_TOKEN']}
          req=urllib.request.Request('https://api.github.com/repos/openai/codex/releases/tags/rust-v0.153.4',headers=headers)
          release=json.load(urllib.request.urlopen(req,timeout=30))
          assert release['tag_name']=='rust-v0.153.4' and not release['draft'] and not release['prerelease']
          matches=[a for a in release['assets'] if a['name']==os.environ['NATIVE_ASSET']]
          assert len(matches)==1;asset=matches[0]
          digest=asset.get('digest','');assert digest.startswith('sha256:') and len(digest)==71
          assert asset['browser_download_url'].startswith('https://github.com/openai/codex/releases/download/rust-v0.153.4/')
          archive=root/asset['name']
          with urllib.request.urlopen(asset['browser_download_url'],timeout=60) as response,archive.open('xb') as output:
              count=0
              while chunk:=response.read(1024*1024):
                  count+=len(chunk);assert count<=256*1024*1024;output.write(chunk)
          assert archive.stat().st_size==asset['size']
          assert 'sha256:'+hashlib.sha256(archive.read_bytes()).hexdigest()==digest
          with tarfile.open(archive) as tf: tf.extractall(root/'unpacked',filter='data')
          names={'codex.exe','codex-x86_64-pc-windows-msvc.exe'} if os.name=='nt' else {'codex','codex-aarch64-apple-darwin'}
          candidates={p.resolve() for p in (root/'unpacked').rglob('*') if p.is_file() and p.name in names}
          assert len(candidates)==1,candidates
          binary=candidates.pop();binary.chmod(binary.stat().st_mode|0o111)
          binary_hash=hashlib.sha256(binary.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write(f'NATIVE_CODEX_PROBE_BIN={binary}\nNATIVE_CODEX_PROBE_SHA256={binary_hash}\n')
          Path('aiTemp/evidence/native-codex-provenance.json').write_text(json.dumps({'tag':release['tag_name'],'asset':asset['name'],'archive_sha256':digest[7:],'binary_sha256':binary_hash,'source_commit':os.environ['SOURCE'],'model_turns_submitted':0},indent=2),encoding='utf-8')
          PY
      - name: Actual native protocol consent and cancellation check
        working-directory: aiTemp/checkout
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_bridge_actual_app_server_handshake_and_revocation -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-handshake.txt
          python -c "from pathlib import Path; s=Path('aiTemp/evidence/native-handshake.txt').read_text(); assert '1 passed; 0 failed' in s and 'zero model-control requests' in s"
      - name: Frontend and bilingual documentation
        working-directory: aiTemp/checkout
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend-check.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
          python aiTemp/release-verification/check_bilingual_docs.py 2>&1 | tee aiTemp/evidence/bilingual-docs.txt
      - name: Integrated listener and unchanged sandbox boundaries
        working-directory: aiTemp/checkout
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib native_bridge_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/integrated-bridge.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib live_policy_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/live-policy.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib core_catalog_exposes_chatgpt_compatible_tools -- --test-threads=1 2>&1 | tee aiTemp/evidence/catalog.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib sandbox_release_rejects -- --test-threads=1 2>&1 | tee aiTemp/evidence/sandbox-stays-withheld.txt
      - name: Build native candidate only, without publishing a release
        working-directory: aiTemp/checkout
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          CI: 'true'
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles "$BUNDLE" -- --locked 2>&1 | tee aiTemp/evidence/installer-build.txt
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          target=Path(os.environ['CARGO_TARGET_DIR'])/'release/bundle'
          glob='nsis/*.exe' if os.name=='nt' else 'dmg/*.dmg'
          assets=list(target.glob(glob));assert len(assets)==1 and assets[0].stat().st_size>100000
          output=Path('aiTemp/candidate');output.mkdir(exist_ok=False)
          source=assets[0];dest=output/('UNRELEASED-native-bridge-'+os.environ['SOURCE'][:12]+source.suffix)
          shutil.copy2(source,dest)
          proof={'source_commit':os.environ['SOURCE'],'asset':dest.name,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'platform':os.environ['PLATFORM'],'release_published':False,'model_turns_tested':False,'native_sandbox_enabled':False,'status':'candidate_needs_provider_and_desktop_acceptance'}
          (output/'candidate-provenance.json').write_text(json.dumps(proof,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-codex-candidate-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/candidate/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-codex-evidence-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
