name: v0.7 installer upgrade migration

on:
  push:
    branches:
      - fix/v0.7-rc5-installer-upgrade-migration
    paths:
      - desktop-electron/package.json
      - desktop-electron/build/installer.nsh
      - desktop-electron/electron/product.cjs
      - desktop-electron/scripts/prepare-package-resources.cjs
      - desktop-electron/scripts/verify-package.cjs
      - desktop-electron/tests/installer-upgrade-migration.test.cjs
      - desktop-electron/tests/package-contents.test.cjs
      - desktop-electron/tests/package-resource-preparation.test.cjs
      - desktop-electron/tests/product-identity.test.cjs
      - aiTemp/installer-upgrade/**
      - .github/workflows/v0.7-installer-upgrade-migration.yml
  pull_request:
    branches:
      - release/codex-router-multiprovider-0.7.0-rc.4
    paths:
      - desktop-electron/package.json
      - desktop-electron/build/installer.nsh
      - desktop-electron/electron/product.cjs
      - desktop-electron/scripts/prepare-package-resources.cjs
      - desktop-electron/scripts/verify-package.cjs
      - desktop-electron/tests/installer-upgrade-migration.test.cjs
      - desktop-electron/tests/package-contents.test.cjs
      - desktop-electron/tests/package-resource-preparation.test.cjs
      - desktop-electron/tests/product-identity.test.cjs
      - aiTemp/installer-upgrade/**
      - .github/workflows/v0.7-installer-upgrade-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v0.7-installer-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.0'
  NODE_VERSION: '22'
  RUST_TOOLCHAIN: '1.98.1'
  TUNNEL_ARCHIVE: tunnel-client-v0.0.12-windows-amd64.zip
  TUNNEL_ARCHIVE_SHA256: '2a2804933924e38a502d62b61f0266cb80d56d65744f4c29876b2bf9c1544356'
  TUNNEL_RELEASE_URL: https://github.com/openai/tunnel-client/releases/download/v0.0.12

jobs:
  red-green-contract:
    name: Installer migration contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: ${{ github.event_name == 'push' }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Apply deterministic rc.5 migration patch
        run: |
          set -euo pipefail
          python aiTemp/installer-upgrade/apply_patch.py \
            | tee aiTemp/installer-upgrade/patch.txt
          grep -F INSTALLER_UPGRADE_MIGRATION_PATCH_OK aiTemp/installer-upgrade/patch.txt

      - name: Run installer and package identity contracts
        run: |
          set -euo pipefail
          mkdir -p aiTemp/installer-upgrade/evidence
          node --test \
            desktop-electron/tests/installer-upgrade-migration.test.cjs \
            desktop-electron/tests/product-identity.test.cjs \
            2>&1 | tee aiTemp/installer-upgrade/evidence/contract.txt
          grep -F '# fail 0' aiTemp/installer-upgrade/evidence/contract.txt
          node --check desktop-electron/scripts/prepare-package-resources.cjs
          node --check desktop-electron/scripts/verify-package.cjs

      - name: Enforce no-delete changes
        run: |
          set -euo pipefail
          git fetch origin release/codex-router-multiprovider-0.7.0-rc.4 --no-tags
          git diff --check origin/release/codex-router-multiprovider-0.7.0-rc.4...HEAD
          test -z "$(git diff --diff-filter=D --name-only origin/release/codex-router-multiprovider-0.7.0-rc.4...HEAD)"
          test -z "$(git diff --diff-filter=D --name-only)"

      - name: Commit verified migration implementation
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git add \
            desktop-electron/package.json \
            desktop-electron/build/installer.nsh \
            desktop-electron/electron/product.cjs \
            desktop-electron/scripts/prepare-package-resources.cjs \
            desktop-electron/scripts/verify-package.cjs \
            desktop-electron/tests/package-contents.test.cjs \
            desktop-electron/tests/package-resource-preparation.test.cjs \
            desktop-electron/tests/product-identity.test.cjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(rc5): migrate legacy installer before reinstall'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-upgrade-contract-${{ github.sha }}
          path: aiTemp/installer-upgrade/
          if-no-files-found: error
          retention-days: 14

  windows-migration-smoke:
    name: Legacy uninstall fixture to rc.5 reinstall
    needs: red-green-contract
    runs-on: windows-latest
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Prepare retained build roots and dependencies
        run: |
          set -euo pipefail
          mkdir -p \
            aiTemp/installer-upgrade/cache/electron-builder \
            aiTemp/installer-upgrade/evidence \
            aiTemp/installer-upgrade/input \
            aiTemp/installer-upgrade/legacy-uninstall-fixture \
            aiTemp/installer-upgrade/output \
            aiTemp/installer-upgrade/tmp \
            aiTemp/Trash/installer-upgrade/legacy-uninstall-fixture
          echo "ELECTRON_BUILDER_CACHE=$PWD/aiTemp/installer-upgrade/cache/electron-builder" >> "$GITHUB_ENV"
          absolute_tmp="$PWD/aiTemp/installer-upgrade/tmp"
          preload="$(node -e 'const {pathToFileURL}=require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href)' "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" bun install --frozen-lockfile --cwd runtime-web
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" bun install --frozen-lockfile --cwd runtime-web/launcher
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" bun install --frozen-lockfile --cwd desktop-electron

      - name: Acquire checksum-pinned tunnel client
        run: |
          set -euo pipefail
          archive="$PWD/aiTemp/installer-upgrade/input/$TUNNEL_ARCHIVE"
          curl.exe --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$archive" "$TUNNEL_RELEASE_URL/$TUNNEL_ARCHIVE"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$TUNNEL_ARCHIVE_SHA256"
          echo "CODING_TOOLS_TUNNEL_CLIENT_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Build exact rc.5 Windows installer
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          cargo build --release --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml
          preload="$(node -e 'const {pathToFileURL}=require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href)' "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/installer-upgrade/tmp" TMP="$PWD/aiTemp/installer-upgrade/tmp" TEMP="$PWD/aiTemp/installer-upgrade/tmp" \
            bun run --cwd desktop-electron package:win
          mapfile -t installers < <(find desktop-electron/release desktop-electron/artifacts -maxdepth 1 -type f -iname '*.exe' -print 2>/dev/null || true)
          test "${#installers[@]}" -eq 1
          cp --no-clobber "${installers[0]}" \
            aiTemp/installer-upgrade/output/Coding.Tools_0.7.0-rc.5_windows_x64_setup.exe

      - name: Create a legacy Tauri uninstall fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'aiTemp\installer-upgrade\legacy-uninstall-fixture'
          $trash = Join-Path $env:GITHUB_WORKSPACE 'aiTemp\Trash\installer-upgrade\legacy-uninstall-fixture'
          $install = Join-Path $root 'Coding Tools MCP'
          $marker = Join-Path $root 'legacy-uninstaller-ran.txt'
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          New-Item -ItemType Directory -Path $trash -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $install 'legacy-app.bin') -Value 'legacy payload'
          $source = @'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Reflection;
          using System.Text;
          using Microsoft.Win32;

          internal static class LegacyUninstallFixture
          {
              private static string PowerShellLiteral(string value)
              {
                  return "'" + value.Replace("'", "''") + "'";
              }

              public static int Main(string[] args)
              {
                  string marker = Environment.GetEnvironmentVariable("CODING_TOOLS_LEGACY_UNINSTALL_MARKER");
                  string install = Environment.GetEnvironmentVariable("CODING_TOOLS_LEGACY_INSTALL_LOCATION");
                  string trash = Environment.GetEnvironmentVariable("CODING_TOOLS_LEGACY_TRASH_DIR");
                  if (String.IsNullOrWhiteSpace(marker)
                      || String.IsNullOrWhiteSpace(install)
                      || String.IsNullOrWhiteSpace(trash)) return 41;

                  Directory.CreateDirectory(trash);
                  File.WriteAllText(marker, String.Join(" ", args));

                  string payload = Path.Combine(install, "legacy-app.bin");
                  string retainedPayload = Path.Combine(trash, "legacy-app.bin");
                  if (File.Exists(payload)) File.Move(payload, retainedPayload);

                  using (RegistryKey key = Registry.CurrentUser.OpenSubKey(
                      @"Software\Microsoft\Windows\CurrentVersion\Uninstall", true))
                  {
                      key?.DeleteSubKeyTree("Coding Tools MCP", false);
                  }

                  int processId = Process.GetCurrentProcess().Id;
                  string currentExecutable = Assembly.GetExecutingAssembly().Location;
                  string retainedUninstaller = Path.Combine(trash, "uninstall.exe");
                  string script = "$ErrorActionPreference='Stop'; Wait-Process -Id "
                      + processId
                      + "; Move-Item -LiteralPath "
                      + PowerShellLiteral(currentExecutable)
                      + " -Destination "
                      + PowerShellLiteral(retainedUninstaller);
                  string encodedScript = Convert.ToBase64String(Encoding.Unicode.GetBytes(script));
                  Process.Start(new ProcessStartInfo
                  {
                      FileName = "pwsh.exe",
                      Arguments = "-NoProfile -NonInteractive -EncodedCommand " + encodedScript,
                      CreateNoWindow = true,
                      UseShellExecute = false,
                  });
                  return 0;
              }
          }
          '@
          $sourcePath = Join-Path $root 'LegacyUninstallFixture.cs'
          $uninstaller = Join-Path $install 'uninstall.exe'
          Set-Content -LiteralPath $sourcePath -Value $source
          Add-Type -TypeDefinition $source -Language CSharp -OutputAssembly $uninstaller -OutputType ConsoleApplication

          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Coding Tools MCP'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DisplayName -Value 'Coding Tools MCP' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $key -Name DisplayVersion -Value '0.4.11' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $key -Name InstallLocation -Value ('"' + $install + '"') -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $key -Name UninstallString -Value ('"' + $uninstaller + '"') -PropertyType String -Force | Out-Null
          "LEGACY_FIXTURE_READY`ninstall=$install`nmarker=$marker`ntrash=$trash" | Set-Content -LiteralPath (Join-Path $root 'fixture.txt')

      - name: Run old-install removal and rc.5 reinstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'aiTemp\installer-upgrade\legacy-uninstall-fixture'
          $trash = Join-Path $env:GITHUB_WORKSPACE 'aiTemp\Trash\installer-upgrade\legacy-uninstall-fixture'
          $install = Join-Path $root 'Coding Tools MCP'
          $marker = Join-Path $root 'legacy-uninstaller-ran.txt'
          $env:CODING_TOOLS_LEGACY_UNINSTALL_MARKER = $marker
          $env:CODING_TOOLS_LEGACY_INSTALL_LOCATION = $install
          $env:CODING_TOOLS_LEGACY_TRASH_DIR = $trash
          $installer = Join-Path $env:GITHUB_WORKSPACE 'aiTemp\installer-upgrade\output\Coding.Tools_0.7.0-rc.5_windows_x64_setup.exe'
          $process = Start-Process -FilePath $installer -ArgumentList '/S', '/currentuser' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "rc.5 installer failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $marker)) { throw 'legacy uninstaller was not executed' }
          if (Test-Path -LiteralPath (Join-Path $install 'legacy-app.bin')) { throw 'legacy payload remains in the old installation' }
          if (Test-Path -LiteralPath (Join-Path $install 'uninstall.exe')) { throw 'legacy uninstaller remains in the old installation' }
          $preservedPayload = Join-Path $trash 'legacy-app.bin'
          $preservedUninstaller = Join-Path $trash 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $preservedPayload)) { throw 'legacy payload was not preserved under aiTemp/Trash' }
          if (-not (Test-Path -LiteralPath $preservedUninstaller)) { throw 'legacy uninstaller was not preserved under aiTemp/Trash' }
          $legacyKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Coding Tools MCP'
          if (Test-Path -LiteralPath $legacyKey) { throw 'legacy uninstall key remains after migration' }

          $currentKey = 'HKCU:\Software\3cb2ea96-3319-55b8-95a5-7f180a5f3ed4'
          $location = Get-ItemPropertyValue -Path $currentKey -Name InstallLocation
          $location = $location.Trim('"')
          $application = Join-Path $location 'Coding Tools.exe'
          if (-not (Test-Path -LiteralPath $application)) { throw "reinstalled application is missing: $application" }

          $evidence = [ordered]@{
            source = $env:SOURCE_SHA
            installer = $installer
            installerExitCode = $process.ExitCode
            legacyUninstallerRan = $true
            legacyRegistryRemoved = $true
            legacyPayloadPreserved = $true
            legacyUninstallerPreserved = $true
            preservedPayload = $preservedPayload
            preservedUninstaller = $preservedUninstaller
            currentInstallLocation = $location
            currentApplication = $application
          }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'aiTemp\installer-upgrade\evidence\migration-smoke.json')

      - name: Enforce exact-source and no-delete evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -s aiTemp/installer-upgrade/evidence/migration-smoke.json
          test -z "$(git diff --diff-filter=D --name-only)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-upgrade-windows-${{ github.sha }}
          path: aiTemp/installer-upgrade/
          if-no-files-found: error
          retention-days: 14
