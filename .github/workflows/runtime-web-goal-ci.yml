name: Runtime Web Goal Fast Check

on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the complete Runtime Web suite on Windows and Linux
        type: boolean
        default: false
  push:
    paths:
      - "aiTemp/codex-web-goal-latency/apply-request-body-fast-path.py"
      - "aiTemp/codex-web-send-latency/apply-send-readiness-fast-path.py"
      - "aiTemp/codex-web-effort-latency/apply-effort-readiness-fast-path.py"
      - "aiTemp/codex-web-connector-latency/apply-connector-mention-fast-path.py"
      - "aiTemp/codex-web-personalization-latency/apply-parallel-state-reads.py"
      - ".github/workflows/codex-web-goal-latency-apply.yml"
      - ".github/workflows/codex-web-send-latency-apply.yml"
      - ".github/workflows/codex-web-effort-latency-apply.yml"
      - ".github/workflows/codex-web-connector-latency-apply.yml"
      - ".github/workflows/codex-web-personalization-latency-apply.yml"
      - "runtime-web/src/adapters/chatgpt-web/**"
      - "runtime-web/src/responses/**"
      - "runtime-web/src/types.ts"
      - "runtime-web/tests/**"
      - "runtime-web/src/http-body.ts"
      - "runtime-web/src/native-passthrough.ts"
      - "runtime-web/src/router-web-ingress.ts"
      - "runtime-web/src/server.ts"
      - "runtime-web/tests/browser-personalization-latency.test.ts"
      - "runtime-web/tests/browser-connector-latency.test.ts"
      - "runtime-web/tests/browser-effort-latency.test.ts"
      - "runtime-web/tests/browser-send-latency.test.ts"
      - "runtime-web/tests/chatgpt-web-goal.test.ts"
      - "runtime-web/tests/request-body-fast-path.test.ts"
      - "runtime-web/tests/router-web-ingress.test.ts"
      - "runtime-web/src/adapters/chatgpt-web/codex-chat-send.ts"
      - "runtime-web/src/adapters/chatgpt-web/mcp-server.ts"
      - "runtime-web/tests/codex-chat-send.test.ts"
      - "runtime-web/tests/chatgpt-web-usage.test.ts"
      - "runtime-web/tests/prompt-contract.test.ts"
      - "runtime-web/tests/server-lifecycle.test.ts"
      - "runtime-web/tests/server-compaction.test.ts"
      - "runtime-web/src/adapters/chatgpt-web/prompt.ts"
      - "runtime-web/src/adapters/chatgpt-web/index.ts"
      - "runtime-web/src/adapters/chatgpt-web/turn-execution.ts"
      - "runtime-web/tests/browser-worker-contract.test.ts"
      - "runtime-web/tests/chatgpt-web-harness.test.ts"
      - ".github/workflows/runtime-web-goal-ci.yml"
  pull_request:
    paths:
      - "aiTemp/codex-web-goal-latency/apply-request-body-fast-path.py"
      - "aiTemp/codex-web-send-latency/apply-send-readiness-fast-path.py"
      - "aiTemp/codex-web-effort-latency/apply-effort-readiness-fast-path.py"
      - "aiTemp/codex-web-connector-latency/apply-connector-mention-fast-path.py"
      - "aiTemp/codex-web-personalization-latency/apply-parallel-state-reads.py"
      - ".github/workflows/codex-web-goal-latency-apply.yml"
      - ".github/workflows/codex-web-send-latency-apply.yml"
      - ".github/workflows/codex-web-effort-latency-apply.yml"
      - ".github/workflows/codex-web-connector-latency-apply.yml"
      - ".github/workflows/codex-web-personalization-latency-apply.yml"
      - "runtime-web/src/adapters/chatgpt-web/**"
      - "runtime-web/src/responses/**"
      - "runtime-web/src/types.ts"
      - "runtime-web/tests/**"
      - "runtime-web/src/http-body.ts"
      - "runtime-web/src/native-passthrough.ts"
      - "runtime-web/src/router-web-ingress.ts"
      - "runtime-web/src/server.ts"
      - "runtime-web/tests/browser-personalization-latency.test.ts"
      - "runtime-web/tests/browser-connector-latency.test.ts"
      - "runtime-web/tests/browser-effort-latency.test.ts"
      - "runtime-web/tests/browser-send-latency.test.ts"
      - "runtime-web/tests/chatgpt-web-goal.test.ts"
      - "runtime-web/tests/request-body-fast-path.test.ts"
      - "runtime-web/tests/router-web-ingress.test.ts"
      - "runtime-web/src/adapters/chatgpt-web/codex-chat-send.ts"
      - "runtime-web/src/adapters/chatgpt-web/mcp-server.ts"
      - "runtime-web/tests/codex-chat-send.test.ts"
      - "runtime-web/tests/chatgpt-web-usage.test.ts"
      - "runtime-web/tests/prompt-contract.test.ts"
      - "runtime-web/tests/server-lifecycle.test.ts"
      - "runtime-web/tests/server-compaction.test.ts"
      - "runtime-web/src/adapters/chatgpt-web/prompt.ts"
      - "runtime-web/src/adapters/chatgpt-web/index.ts"
      - "runtime-web/src/adapters/chatgpt-web/turn-execution.ts"
      - "runtime-web/tests/browser-worker-contract.test.ts"
      - "runtime-web/tests/chatgpt-web-harness.test.ts"
      - ".github/workflows/runtime-web-goal-ci.yml"

permissions:
  contents: read

concurrency:
  group: runtime-web-goal-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Goal transport and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run focused goal and request-path regressions
        run: bun test tests/browser-personalization-latency.test.ts tests/browser-connector-latency.test.ts tests/browser-effort-latency.test.ts tests/browser-send-latency.test.ts tests/chatgpt-web-goal.test.ts tests/request-body-fast-path.test.ts tests/router-web-ingress.test.ts tests/codex-chat-send.test.ts tests/chatgpt-web-usage.test.ts tests/prompt-contract.test.ts tests/server-lifecycle.test.ts tests/server-compaction.test.ts tests/browser-worker-contract.test.ts
      - name: Run rich-response, native-envelope and continuation regressions
        env:
          TMPDIR: ${{ github.workspace }}/aiTemp/r
        run: |
          mkdir -p "$TMPDIR"
          bun test tests/chatgpt-web-rich-output.test.ts tests/chatgpt-web-canvas.test.ts \
            tests/chatgpt-web-markdown.test.ts tests/native-tool-envelope.test.ts \
            tests/launcher-helper-client.test.ts tests/chatgpt-web-harness.test.ts \
            tests/chatgpt-web-computer-vision.test.ts tests/responses-lite-tools.test.ts \
            tests/retained-compaction.test.ts tests/rolling-checkpoint.test.ts --timeout 20000
      - name: Typecheck Runtime Web
        run: bun run typecheck

  full_runtime:
    name: Complete runtime suite — ${{ matrix.os }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime-web
    env:
      RUNTIME_TEST_ROOT: ${{ github.workspace }}
      NODE_PATH: ${{ github.workspace }}/desktop-electron/tests/support/electron-stub
      TEMP: ${{ github.workspace }}/aiTemp/full-runtime/tmp
      TMP: ${{ github.workspace }}/aiTemp/full-runtime/tmp
      TMPDIR: ${{ github.workspace }}/aiTemp/full-runtime/tmp
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/full-runtime/bun-cache
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: ${{ github.workspace }}/aiTemp/full-runtime/transpiler-cache
      CODEX_CHATGPT_WEB_HOME: ${{ github.workspace }}/aiTemp/full-runtime/home
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare project temporary directory
        working-directory: ${{ github.workspace }}
        run: |
          node -e "require('node:fs').mkdirSync(process.env.TMPDIR, { recursive: true })"
      - name: Use a short project path for Linux sockets
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          sudo mkdir -p /p
          sudo mount --bind "$GITHUB_WORKSPACE" /p
          {
            echo "RUNTIME_TEST_ROOT=/p"
            echo "NODE_PATH=/p/desktop-electron/tests/support/electron-stub"
            echo "TEMP=/p/aiTemp"
            echo "TMP=/p/aiTemp"
            echo "TMPDIR=/p/aiTemp"
            echo "BUN_INSTALL_CACHE_DIR=/p/aiTemp/full-runtime/bun-cache"
            echo "BUN_RUNTIME_TRANSPILER_CACHE_PATH=/p/aiTemp/full-runtime/transpiler-cache"
            echo "CODEX_CHATGPT_WEB_HOME=/p/aiTemp/home"
          } >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Prepare temporary directory
        working-directory: ${{ env.RUNTIME_TEST_ROOT }}/runtime-web
        run: |
          bun -e "require('node:fs').mkdirSync(process.env.TMPDIR, { recursive: true })"
      - name: Install locked dependencies
        working-directory: ${{ env.RUNTIME_TEST_ROOT }}/runtime-web
        run: bun install --frozen-lockfile
      - name: Prepare the existing Electron test stub for Bun
        working-directory: ${{ env.RUNTIME_TEST_ROOT }}/runtime-web
        env:
          ELECTRON_TEST_PRELOAD: |
            import { mock } from "bun:test";
            import { createRequire } from "node:module";
            import { isAbsolute, join } from "node:path";

            const stubRoot = process.env.NODE_PATH;
            if (!stubRoot || !isAbsolute(stubRoot)) throw new Error("NODE_PATH must name the absolute checked-in Electron stub root");
            const require = createRequire(import.meta.url);
            const electron = require(join(stubRoot, "electron/index.cjs"));
            mock.module("electron", () => electron);
        run: |
          bun -e 'const fs = require("node:fs"); const path = require("node:path"); const target = path.join(process.env.RUNTIME_TEST_ROOT, "aiTemp/full-runtime/electron-stub-preload.ts"); fs.mkdirSync(path.dirname(target), { recursive: true }); fs.writeFileSync(target, process.env.ELECTRON_TEST_PRELOAD);'
      - name: Run the complete runtime suite
        working-directory: ${{ env.RUNTIME_TEST_ROOT }}/runtime-web
        run: bun test --preload "${{ env.RUNTIME_TEST_ROOT }}/aiTemp/full-runtime/electron-stub-preload.ts" ./tests
      - name: Typecheck Runtime Web
        working-directory: ${{ env.RUNTIME_TEST_ROOT }}/runtime-web
        run: bun run typecheck
      - name: Remove the Linux checkout alias
        if: always() && runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          {
            echo "RUNTIME_TEST_ROOT=$GITHUB_WORKSPACE"
            echo "NODE_PATH=$GITHUB_WORKSPACE/desktop-electron/tests/support/electron-stub"
            echo "TEMP=$GITHUB_WORKSPACE/aiTemp/full-runtime/tmp"
            echo "TMP=$GITHUB_WORKSPACE/aiTemp/full-runtime/tmp"
            echo "TMPDIR=$GITHUB_WORKSPACE/aiTemp/full-runtime/tmp"
            echo "BUN_INSTALL_CACHE_DIR=$GITHUB_WORKSPACE/aiTemp/full-runtime/bun-cache"
            echo "BUN_RUNTIME_TRANSPILER_CACHE_PATH=$GITHUB_WORKSPACE/aiTemp/full-runtime/transpiler-cache"
            echo "CODEX_CHATGPT_WEB_HOME=$GITHUB_WORKSPACE/aiTemp/full-runtime/home"
          } >> "$GITHUB_ENV"
          if mountpoint -q /p; then sudo umount /p; fi
