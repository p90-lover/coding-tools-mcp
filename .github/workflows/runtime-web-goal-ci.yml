name: Runtime Web Goal Fast Check

on:
  workflow_dispatch:
  push:
    paths:
      - "aiTemp/codex-web-goal-latency/apply-request-body-fast-path.py"
      - ".github/workflows/codex-web-goal-latency-apply.yml"
      - "runtime-web/src/http-body.ts"
      - "runtime-web/src/native-passthrough.ts"
      - "runtime-web/src/router-web-ingress.ts"
      - "runtime-web/src/server.ts"
      - "runtime-web/tests/chatgpt-web-goal.test.ts"
      - "runtime-web/tests/request-body-fast-path.test.ts"
      - "runtime-web/tests/router-web-ingress.test.ts"
      - ".github/workflows/runtime-web-goal-ci.yml"
  pull_request:
    paths:
      - "aiTemp/codex-web-goal-latency/apply-request-body-fast-path.py"
      - ".github/workflows/codex-web-goal-latency-apply.yml"
      - "runtime-web/src/http-body.ts"
      - "runtime-web/src/native-passthrough.ts"
      - "runtime-web/src/router-web-ingress.ts"
      - "runtime-web/src/server.ts"
      - "runtime-web/tests/chatgpt-web-goal.test.ts"
      - "runtime-web/tests/request-body-fast-path.test.ts"
      - "runtime-web/tests/router-web-ingress.test.ts"
      - ".github/workflows/runtime-web-goal-ci.yml"

permissions:
  contents: read

concurrency:
  group: runtime-web-goal-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Goal transport and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run focused goal and request-path regressions
        run: bun test tests/chatgpt-web-goal.test.ts tests/request-body-fast-path.test.ts tests/router-web-ingress.test.ts
      - name: Typecheck Runtime Web
        run: bun run typecheck
