name: Electron Full Harness prerelease promotion

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact tested commit from feature/electron-full-codex-harness-0.6.0
        required: true
        type: string
      validation_run_id:
        description: Successful Electron Full Harness CI run for the exact source SHA
        required: true
        type: string
      release_tag:
        description: Fixed prerelease tag
        required: true
        default: v0.6.0-rc.1
        type: string
      publish_prerelease:
        description: Publish after asset readback and non-forced tag verification
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: electron-full-harness-prerelease-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: 0.6.0-rc.1
  RELEASE_TAG: ${{ inputs.release_tag }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
  WINDOWS_INSTALLER: Coding.Tools_0.6.0-rc.1_windows_x64_setup.exe
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify_exact_tested_assets:
    name: Verify exact tested Electron assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Validate fixed identity and source ancestry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/release-evidence aiTemp/release-input aiTemp/release-assets
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$VALIDATION_RUN_ID" =~ ^[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          git fetch --no-tags origin \
            refs/heads/feature/electron-full-codex-harness-0.6.0:refs/remotes/origin/feature/electron-full-codex-harness-0.6.0
          node scripts/release/verify-source-scope.mjs \
            --tag "$RELEASE_TAG" \
            --source "$SOURCE_SHA" \
            --allowed-ref origin/feature/electron-full-codex-harness-0.6.0 \
            --json-out aiTemp/release-evidence/source-scope.json
          test -f desktop-electron/scripts/verify-package.cjs
          test -f desktop-electron/tests/package-contents.test.cjs
          test -f docs/releases/v0.6.0-rc.1.md
          node scripts/verify-vendored-upstream.mjs \
            > aiTemp/release-evidence/upstream-verification.txt
          node --test \
            tests/electron-full-harness-release.test.mjs \
            tests/no-delete-policy.test.mjs \
            > aiTemp/release-evidence/release-policy-tests.txt
      - name: Require a successful exact-source CI run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID" \
            > aiTemp/release-evidence/validation-run.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync('aiTemp/release-evidence/validation-run.json', 'utf8'));
          const expectedSource = process.env.SOURCE_SHA.toLowerCase();
          if (String(run.head_sha).toLowerCase() !== expectedSource) {
            throw new Error(`VALIDATION_SOURCE_MISMATCH: ${run.head_sha}`);
          }
          if (run.conclusion !== 'success' || run.status !== 'completed') {
            throw new Error(`VALIDATION_RUN_NOT_SUCCESSFUL: ${run.status}/${run.conclusion}`);
          }
          if (run.path !== '.github/workflows/electron-full-harness-ci.yml') {
            throw new Error(`VALIDATION_WORKFLOW_MISMATCH: ${run.path}`);
          }
          if (run.event !== 'workflow_dispatch' && run.event !== 'push') {
            throw new Error(`VALIDATION_EVENT_UNEXPECTED: ${run.event}`);
          }
          NODE
      - name: Download the exact tested Windows installer and evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$VALIDATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "electron-windows-installer-$SOURCE_SHA" \
            --dir aiTemp/release-input/installer
          gh run download "$VALIDATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "electron-full-harness-validation-$SOURCE_SHA" \
            --dir aiTemp/release-input/validation
          mapfile -t installers < <(find aiTemp/release-input/installer -type f -name "$WINDOWS_INSTALLER" -print)
          test "${#installers[@]}" -eq 1
          cp "${installers[0]}" "aiTemp/release-assets/$WINDOWS_INSTALLER"
          test -n "$(find aiTemp/release-input/validation -type f -print -quit)"
      - name: Materialize provenance, validation disclosure, and checksums
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'aiTemp/release-assets';
          const installerName = process.env.WINDOWS_INSTALLER;
          const installer = fs.readFileSync(path.join(root, installerName));
          const sha256 = crypto.createHash('sha256').update(installer).digest('hex');
          const run = JSON.parse(fs.readFileSync('aiTemp/release-evidence/validation-run.json', 'utf8'));
          const provenance = {
            schema: 1,
            release_tag: process.env.RELEASE_TAG,
            version: process.env.RELEASE_VERSION,
            source_sha: process.env.SOURCE_SHA,
            product: { name: 'Coding Tools', app_id: 'dev.codingtools.fullharness' },
            upstream: {
              repository: 'miuuyy/codex-chatgpt-web',
              version: 'v5.0.6',
              commit: 'e85e3693fdb4e3e033348c08df0298c20fcdb612',
            },
            validation_run: { id: run.id, url: run.html_url, workflow: run.path },
            assets: [{ name: installerName, sha256, size: installer.length }],
          };
          const validation = {
            automated_gates: 'passed',
            live_account_acceptance: 'pending_manual',
            source_sha: process.env.SOURCE_SHA,
            validation_run_id: Number(process.env.VALIDATION_RUN_ID),
            validation_workflow: run.path,
            validation_conclusion: run.conclusion,
          };
          fs.writeFileSync(path.join(root, 'provenance.json'), `${JSON.stringify(provenance, null, 2)}\n`);
          fs.writeFileSync(path.join(root, 'validation-evidence.json'), `${JSON.stringify(validation, null, 2)}\n`);
          const names = fs.readdirSync(root).filter((name) => name !== 'SHA256SUMS.txt').sort();
          const checksums = names.map((name) => {
            const bytes = fs.readFileSync(path.join(root, name));
            return `${crypto.createHash('sha256').update(bytes).digest('hex')}  ${name}`;
          });
          fs.writeFileSync(path.join(root, 'SHA256SUMS.txt'), `${checksums.join('\n')}\n`);
          NODE
          node scripts/release/verify-assets.mjs \
            --directory aiTemp/release-assets \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --source "$SOURCE_SHA" \
            --json-out aiTemp/release-evidence/asset-verification.json
      - id: identity
        name: Record immutable artifact identity
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="verified-electron-prerelease-$SOURCE_SHA"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$SOURCE_SHA" > aiTemp/release-evidence/source.commit
          printf '%s\n' "$RELEASE_TAG" > aiTemp/release-evidence/release.tag
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-electron-prerelease-${{ inputs.source_sha }}
          path: |
            aiTemp/release-assets/
            aiTemp/release-evidence/
          if-no-files-found: error
          retention-days: 14

  publish_prerelease:
    name: Publish verified prerelease
    needs: verify_exact_tested_assets
    if: ${{ inputs.publish_prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Retrieve the already verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/release-assets aiTemp/publication-evidence
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ needs.verify_exact_tested_assets.outputs.artifact_name }}" \
            --dir aiTemp/verified-download
          mapfile -t asset_roots < <(find aiTemp/verified-download -type f -name SHA256SUMS.txt -printf '%h\n')
          test "${#asset_roots[@]}" -eq 1
          cp "${asset_roots[0]}"/* aiTemp/release-assets/
          node scripts/release/verify-assets.mjs \
            --directory aiTemp/release-assets \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --source "$SOURCE_SHA" \
            --json-out aiTemp/publication-evidence/prepublish-assets.json
      - name: Create or reuse the draft, read back assets, create the tag, then publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release/publish-v0.6.0-rc.1.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --source "$SOURCE_SHA" \
            --assets aiTemp/release-assets \
            --notes docs/releases/v0.6.0-rc.1.md \
            --json-out aiTemp/publication-evidence/publication.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: electron-prerelease-publication-${{ inputs.source_sha }}
          path: aiTemp/publication-evidence/
          if-no-files-found: error
          retention-days: 14
