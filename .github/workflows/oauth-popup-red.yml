name: OAuth popup origin regressions
on:
  push:
    branches: [fix/oauth-popup-0.4.3-rc.3]
    paths: ['.github/workflows/oauth-popup-red.yml']
permissions:
  contents: read
jobs:
  red:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/origin-target
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Prove released popup rejection and overly broad main Host acceptance
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          git fetch --no-tags origin ac6a7b21df3391277f6687a2a5a6aef0314663b7 07faa97255e6b60d909f956fa2cebd3b829bbf97
          for version in released main; do
            python aiTemp/oauth-popup/probe.py "$version"
            set +e
            cargo test --manifest-path "aiTemp/oauth-popup/probe-$version/Cargo.toml" oauth_popup_origin_ -- --test-threads=1 --nocapture > "aiTemp/evidence/$version-red.txt" 2>&1
            code=$?
            set -e
            test "$code" -eq 101
          done
          grep -F 'POPUP_ORIGIN_BLOCKED' aiTemp/evidence/released-red.txt
          grep -F '2 passed; 1 failed' aiTemp/evidence/released-red.txt
          grep -F 'HOST_MUST_NOT_SELECT_TRUST' aiTemp/evidence/main-red.txt
          grep -F 'POPUP_EXCEPTION_ESCAPED_AUTH_ROUTE' aiTemp/evidence/main-red.txt
          grep -F '1 passed; 2 failed' aiTemp/evidence/main-red.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: oauth-origin-red-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
