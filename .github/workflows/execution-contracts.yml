name: Execution contract verification
on:
  push:
    branches: [feature/paseo-anneal-execution-0.5.0]
    paths: [.github/workflows/execution-contracts.yml]
permissions: {contents: read}
jobs:
  contracts:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/execution-target
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, clean: false, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - name: Record absent production module as an unimplemented feature, not a passing runtime test
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          set +e
          python aiTemp/execution/probe.py > aiTemp/evidence/execution-red.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 101
          grep -F integrations/execution/mod.rs aiTemp/evidence/execution-red.txt
          grep -F 'No such file or directory' aiTemp/evidence/execution-red.txt
          echo 'Feature contract cannot compile: the execution API has not been implemented.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'execution-contract-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
