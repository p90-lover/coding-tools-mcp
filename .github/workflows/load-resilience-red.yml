name: Load resilience baseline
on:
  push:
    branches: [fix/load-resilience-0.4.6]
    paths: [.github/workflows/load-resilience-red.yml]
permissions: {contents: read}
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/load-target
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, clean: false, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - name: Slow trace sink and transient ownership lookup
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          set +e
          python aiTemp/load-resilience/probe.py > aiTemp/evidence/load-red.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 101
          grep -F SLOW_TRACE_BLOCKS_ASYNC_SCHEDULER aiTemp/evidence/load-red.txt
          grep -F TRANSIENT_OWNER_QUERY_PERMANENTLY_BLOCKS_RECOVERY aiTemp/evidence/load-red.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'load-red-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
