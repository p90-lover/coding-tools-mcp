name: Native Codex platform proof
on:
  push:
    branches: [feature/native-codex-runtime]
    paths: [.github/workflows/native-codex-platforms.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-codex-platforms-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'p90-lover/coding-tools-mcp' && github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: codex-npm-win32-x64-0.153.4.tgz
            digest: 05f473573f38b3f4dc9484e6807a511a1bb0e128dfa50816dafc5f79e553cdca
          - os: macos-14
            package: codex-npm-darwin-arm64-0.153.4.tgz
            digest: 535d301b49131abfda3264f959fb0defa40bbc306976d98ddbc15c424636c55c
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      CODEX_HOME: ${{ github.workspace }}/aiTemp/isolated-codex-home
      PYTHONDONTWRITEBYTECODE: '1'
      XDG_CONFIG_HOME: ${{ github.workspace }}/aiTemp/test-config
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Obtain checksum-pinned official native distribution
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence "$CODEX_HOME"
          python - <<'PY'
          import hashlib,os,pathlib,shutil,tarfile,urllib.request
          root=pathlib.Path.cwd().resolve()/'aiTemp'
          archive=root/'codex-package.tgz'
          url='https://github.com/openai/codex/releases/download/rust-v0.153.4/'+os.environ['PACKAGE']
          with urllib.request.urlopen(url,timeout=120) as response, archive.open('xb') as out:
              shutil.copyfileobj(response,out)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==os.environ['DIGEST']
          dest=root/'official-codex'
          dest.mkdir()
          with tarfile.open(archive,'r:gz') as tf:
              members=tf.getmembers()
              assert len(members)<2000 and sum(m.size for m in members)<1024*1024*1024
              for member in members:
                  p=pathlib.PurePosixPath(member.name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert member.isfile() or member.isdir(), member.name
              tf.extractall(dest,filter='data')
          name='codex.exe' if os.name=='nt' else 'codex'
          found=[p for p in dest.rglob(name) if p.is_file()]
          assert len(found)==1,found
          binary=found[0].resolve()
          binary.chmod(binary.stat().st_mode|0o700)
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('CODEX_BIN='+str(binary)+'\n')
          (root/'evidence/codex-distribution.txt').write_text(os.environ['PACKAGE']+'\nsha256:'+os.environ['DIGEST']+'\n')
          PY
      - name: Exercise production transport and policy with real Codex (no model calls)
        shell: bash
        working-directory: aiTemp/source
        run: |
          set -euo pipefail
          mkdir -p aiTemp/native-proof/src
          cp src-tauri/src/native_codex/protocol.rs aiTemp/native-proof/src/protocol.rs
          cp src-tauri/src/native_codex/transport.rs aiTemp/native-proof/src/transport.rs
          cp src-tauri/src/native_codex/session.rs aiTemp/native-proof/src/session.rs
          cat > aiTemp/native-proof/Cargo.toml <<'TOML'
          [package]
          name = "native-codex-proof"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          sha2 = "0.10"
          uuid = { version = "1", features = ["v4"] }
          TOML
          cat > aiTemp/native-proof/src/main.rs <<'RUST'
          #![allow(dead_code)]
          mod protocol;
          mod transport;
          mod session;
          use std::io::{Read,Write};
          use std::sync::{Arc,atomic::{AtomicBool,Ordering}};
          use std::time::{Duration,Instant};
          use serde_json::{json,Value};
          fn write_command(path:&std::path::Path)->Vec<String> {
              if cfg!(windows) {
                  vec!["powershell.exe".into(),"-NoProfile".into(),"-NonInteractive".into(),"-Command".into(),format!("$ErrorActionPreference='Stop'; [IO.File]::WriteAllText('{}','sandbox-proof')",path.display().to_string().replace('\'',"''"))]
              } else {
                  vec!["/bin/sh".into(),"-c".into(),"printf sandbox-proof > \"$1\"".into(),"proof".into(),path.display().to_string()]
              }
          }
          fn execute(wire:&transport::Wire,cwd:&std::path::Path,command:Vec<String>,policy:Value)->Result<Value,String> {
              wire.rpc("command/exec",json!({"command":command,"cwd":cwd,"sandboxPolicy":policy,"timeoutMs":10000}))
          }
          fn successful(value:&Result<Value,String>)->bool {
              matches!(value,Ok(v) if v["exitCode"].as_i64()==Some(0))
          }
          fn main() {
              let binary=std::path::PathBuf::from(std::env::var("CODEX_BIN").unwrap());
              let root=std::env::current_dir().unwrap().join("aiTemp/real-native-proof");
              let cwd=root.join("workspace");
              std::fs::create_dir_all(&cwd).unwrap();
              let cwd=cwd.canonicalize().unwrap();
              let root=root.canonicalize().unwrap();
              let kill:Arc<dyn Fn(u32)+Send+Sync>=Arc::new(|pid| {
                  if cfg!(windows) {
                      let _=std::process::Command::new("taskkill").args(["/PID",&pid.to_string(),"/T","/F"]).output();
                  } else {
                      let _=std::process::Command::new("/bin/kill").args(["-TERM","--",&format!("-{pid}")]).output();
                  }
              });
              let (wire,events)=transport::Wire::spawn(&binary,&cwd,kill).expect("official Codex stdio spawn");
              let policy=protocol::NativePolicy::new("workspace-write","on-request",false,cwd.clone(),vec![]);
              let native=session::NativeSession::new(wire.clone(),events,policy.clone(),"test-only".into(),"proof".into(),Arc::new(||{}));
              native.initialize().expect("production initialize and effective sandbox verification");
              println!("PASS: production transport/session accepted exact native workspace-write policy");
              if cfg!(windows) {
                  let response=wire.rpc("windowsSandbox/setupStart",json!({"mode":"elevated"})).expect("native Windows setup request");
                  assert_eq!(response["started"],true);
                  // Only this disposable CI runner is configured; no unattended host UAC interaction.
                  std::thread::sleep(Duration::from_secs(15));
              }
              for mode in ["read-only","danger-full-access"] {
                  let p=protocol::NativePolicy::new(mode,"never",false,cwd.clone(),vec![]);
                  let actual=wire.rpc("thread/start",p.thread_params()).expect("native policy negotiation");
                  p.verify_thread(&actual).expect("native effective policy must equal request");
                  println!("PASS: exact native {mode} negotiation");
              }
              let workspace_policy=json!({"type":"workspaceWrite","writableRoots":[],"networkAccess":false,"excludeTmpdirEnvVar":true,"excludeSlashTmp":true});
              let allowed=cwd.join("allowed.txt");
              let result=execute(&wire,&cwd,write_command(&allowed),workspace_policy.clone());
              assert!(successful(&result),"workspace write positive control failed: {result:?}");
              assert_eq!(std::fs::read_to_string(&allowed).unwrap(),"sandbox-proof");
              let outside=root.join("outside-denied.txt");
              let result=execute(&wire,&cwd,write_command(&outside),workspace_policy.clone());
              assert!(!successful(&result)&&!outside.exists(),"native workspace sandbox allowed external write: {result:?}");
              let readonly=cwd.join("readonly-denied.txt");
              let result=execute(&wire,&cwd,write_command(&readonly),json!({"type":"readOnly","networkAccess":false}));
              assert!(!successful(&result)&&!readonly.exists(),"native readonly sandbox allowed write: {result:?}");
              println!("PASS: real workspace write allowed; outside-root and readonly writes rejected");
              let full=root.join("full-access-control.txt");
              let result=execute(&wire,&cwd,write_command(&full),json!({"type":"dangerFullAccess"}));
              assert!(successful(&result)&&full.exists(),"native full access positive control failed: {result:?}");
              let listener=std::net::TcpListener::bind("127.0.0.1:0").unwrap();
              listener.set_nonblocking(true).unwrap();
              let addr=listener.local_addr().unwrap();
              let done=Arc::new(AtomicBool::new(false));
              let stopping=done.clone();
              let server=std::thread::spawn(move|| {
                  let deadline=Instant::now()+Duration::from_secs(60);
                  while !stopping.load(Ordering::Relaxed)&&Instant::now()<deadline {
                      match listener.accept() {
                          Ok((mut stream,_))=>{let _=stream.set_read_timeout(Some(Duration::from_secs(1)));let mut b=[0;1024];let _=stream.read(&mut b);let _=stream.write_all(b"HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok");},
                          Err(_)=>std::thread::sleep(Duration::from_millis(20)),
                      }
                  }
              });
              let curl=if cfg!(windows){"curl.exe"}else{"/usr/bin/curl"};
              let command=vec![curl.into(),"--noproxy".into(),"*".into(),"--fail".into(),"--max-time".into(),"3".into(),format!("http://{addr}/")];
              let control=execute(&wire,&cwd,command.clone(),json!({"type":"dangerFullAccess"}));
              assert!(successful(&control),"network positive control failed: {control:?}");
              let blocked=execute(&wire,&cwd,command,workspace_policy);
              done.store(true,Ordering::Relaxed);
              let _=server.join();
              assert!(!successful(&blocked),"network-disabled sandbox allowed loopback HTTP: {blocked:?}");
              println!("PASS: real network-disabled sandbox rejects HTTP while full-access control succeeds");
              native.close("Native proof completed; no inference was submitted");
              assert!(!wire.alive());
              println!("PASS: native process closed; all fixture files retained under aiTemp");
          }
          RUST
          cargo run --manifest-path aiTemp/native-proof/Cargo.toml 2>&1 | tee ../evidence/native-proof.txt
      - name: Compile and lint the application on the native OS
        shell: bash
        working-directory: aiTemp/source/src-tauri
        run: |
          set -euo pipefail
          cargo test --locked 2>&1 | tee ../../evidence/rust-tests.txt
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ../../evidence/clippy.txt
      - name: Build desktop frontend
        shell: bash
        working-directory: aiTemp/source
        run: |
          set -euo pipefail
          npm ci
          npm run check 2>&1 | tee ../evidence/frontend.txt
          npm run build 2>&1 | tee ../evidence/frontend-build.txt
          node --test tests/*.test.mjs 2>&1 | tee ../evidence/contracts.txt
          git diff --exit-code
      - name: Preserve native proof results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-platform-proof-${{ matrix.os }}-${{ github.sha }}
          path: aiTemp/evidence/
          retention-days: 14
          if-no-files-found: error
