name: Verify native Windows boundary repair
on:
  push:
    branches: [fix/sandbox-audit-20260910]
    paths: ['.github/workflows/native-boundary-fixed.yml']
permissions:
  contents: read
jobs:
  boundary:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      SOURCE: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/native-fixed-target
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Apply the minimal repair and attach its real boundary fixture
        run: |
          set -euo pipefail
          python scripts/native_bridge_ci.py probe-init
          python - <<'PY'
          from pathlib import Path
          import shutil,subprocess
          for name in ['src-tauri/src/codex_bridge/mod.rs','src-tauri/src/codex_bridge/native_command.rs','aiTemp/sandbox-audit/native_boundary_fixture.rs']:
              p=Path(name);b=Path('aiTemp/Trash/boundary-fixed-before')/p;b.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,b)
          subprocess.run(['git','apply','--check','aiTemp/sandbox-audit/native-launch.patch'],check=True)
          subprocess.run(['git','apply','aiTemp/sandbox-audit/native-launch.patch'],check=True)
          with Path('src-tauri/src/codex_bridge/native_command.rs').open('a') as f:
              f.write('\n#[cfg(test)]\n#[path="../../../aiTemp/sandbox-audit/native_boundary_fixture.rs"]\nmod audit_boundary_fixture;\n')
          p=Path('aiTemp/sandbox-audit/native_boundary_fixture.rs');s=p.read_text()
          old='    std::fs::write("aiTemp/evidence/native-boundary.json",serde_json::to_vec_pretty(&evidence).unwrap()).unwrap();'
          assert s.count(old)==1
          p.write_text(s.replace(old,'    println!("NATIVE_BOUNDARY_EVIDENCE {evidence}");'))
          PY
          rustc --edition 2021 aiTemp/sandbox-audit/boundary_child.rs -o aiTemp/boundary-child.exe
          echo "BOUNDARY_CHILD=$PWD/aiTemp/boundary-child.exe" >> "$GITHUB_ENV"
      - name: Verify official binary without account credentials
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ASSET: codex-x86_64-pc-windows-msvc.exe.tar.gz
        run: python scripts/native_bridge_ci.py download-native
      - name: Verify actual boundary not a failed shell command
        run: |
          set -euo pipefail
          export CODING_TOOLS_COMMAND_NATIVE_SHA256="$NATIVE_CODEX_PROBE_SHA256"
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml audit_native_readonly_network_timeout_and_no_model -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-fixed.txt
          python - <<'PY'
          from pathlib import Path
          import json
          text=Path('aiTemp/evidence/native-fixed.txt').read_text()
          lines=[line.split('NATIVE_BOUNDARY_EVIDENCE ',1)[1] for line in text.splitlines() if 'NATIVE_BOUNDARY_EVIDENCE ' in line]
          assert len(lines)==1
          Path('aiTemp/evidence/native-boundary.json').write_text(json.dumps(json.loads(lines[0]),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-boundary-fixed-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
