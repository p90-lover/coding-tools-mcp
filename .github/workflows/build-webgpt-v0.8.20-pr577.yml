name: Build merged WebGPT and AO fixes - Coding Tools v0.8.20

on:
  push:
    branches:
      - build/webgpt-v0.8.20-pr577-20261024

permissions:
  contents: read

concurrency:
  group: webgpt-merged-windows-v0.8.20
  cancel-in-progress: false

jobs:
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\\aiTemp\\cargo-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}\\aiTemp\\npm-cache
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}\\aiTemp\\bun-cache
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact merged main commit (no working-tree cleanup)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4d22d694f72d4d833a5a3894161eef925dec79a9
          fetch-depth: 0
          submodules: recursive
          clean: false
          persist-credentials: false

      - name: Install Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.4.3'

      - name: Install Go 1.27.3 required by Agent Orchestrator
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false

      - name: Verify required Go toolchain
        run: |
          $go = (go version)
          if ($go -notmatch 'go1\.27\.3') { throw "Agent Orchestrator requires Go 1.27.3: $go" }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'

      - name: Prepare isolated temporary paths and preserve old renderer output
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:GITHUB_WORKSPACE 'aiTemp'
          foreach ($folder in @('tmp', 'build-evidence', 'Trash')) {
            New-Item -ItemType Directory -Force -Path (Join-Path $base $folder) | Out-Null
          }
          $tempDir = Join-Path $base 'tmp'
          "TMP=$tempDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tempDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $oldRenderer = Join-Path $env:GITHUB_WORKSPACE 'desktop-electron/dist'
          if (Test-Path $oldRenderer) {
            Move-Item -LiteralPath $oldRenderer -Destination (Join-Path $base 'Trash/desktop-renderer-from-source') -ErrorAction Stop
          }

      - name: Download and verify official tunnel-client v0.0.12 Windows archive
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = 'tunnel-client-v0.0.12-windows-amd64.zip'
          $archiveDirectory = Join-Path $env:GITHUB_WORKSPACE 'aiTemp/input'
          New-Item -ItemType Directory -Force -Path $archiveDirectory | Out-Null
          $archivePath = Join-Path $archiveDirectory $archiveName
          $url = "https://github.com/openai/tunnel-client/releases/download/v0.0.12/$archiveName"
          $expectedSha256 = '2a2804933924e38a502d62b61f0266cb80d56d65744f4c29876b2bf9c1544356'
          if (-not (Test-Path -LiteralPath $archivePath)) {
            Invoke-WebRequest -Uri $url -OutFile $archivePath -ErrorAction Stop
          }
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Official tunnel-client archive hash mismatch: $actualSha256"
          }
          if ((Get-Item -LiteralPath $archivePath).Length -ne 26603136) {
            throw 'Official tunnel-client archive size mismatch'
          }

      - name: Install pinned runtime and desktop dependencies
        run: |
          bun install --cwd runtime-web --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'runtime dependency install failed' }
          # Runtime's third-party notices include launcher packages, so install its own lockfile too.
          bun install --cwd runtime-web/launcher --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'launcher dependency install failed' }
          if (-not (Test-Path 'runtime-web/launcher/node_modules/motion/package.json')) { throw 'launcher motion dependency missing' }
          bun install --cwd desktop-electron --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'desktop dependency install failed' }

      - name: Verify exact merged source and selected runtime regression
        run: |
          if ((git rev-parse HEAD).Trim() -ne '4d22d694f72d4d833a5a3894161eef925dec79a9') { throw 'Unexpected source revision' }
          $version = (Get-Content desktop-electron/package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.8.20') { throw "Unexpected desktop version: $version" }
          bun test --cwd runtime-web tests/environment.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Trusted environment regression failed' }
          bun run --cwd runtime-web typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Runtime typecheck failed' }

      - name: Build native helper required by packaged app
        run: |
          cargo build --release --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Headless native helper build failed' }

      - name: Build packaged Windows desktop and update artifacts
        run: |
          bun run --cwd desktop-electron package:win
          if ($LASTEXITCODE -ne 0) { throw 'Windows desktop packaging failed' }
          $artifacts = Get-ChildItem desktop-electron/artifacts -File
          if (-not ($artifacts | Where-Object { $_.Extension -eq '.exe' })) { throw 'No Windows installer produced' }
          $lines = $artifacts | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content -Encoding utf8 'aiTemp/build-evidence/SHA256SUMS.txt'
          git rev-parse HEAD | Set-Content -Encoding ascii 'aiTemp/build-evidence/source.sha'
          'v0.8.20' | Set-Content -Encoding ascii 'aiTemp/build-evidence/version.txt'

      - name: Upload Windows package (do not publish an unverified release)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Coding-Tools-v0.8.20-windows-merged-pr579
          path: |
            desktop-electron/artifacts/*
            aiTemp/build-evidence/*
          retention-days: 14
          if-no-files-found: error
