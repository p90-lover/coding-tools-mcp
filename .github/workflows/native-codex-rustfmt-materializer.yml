name: Native Codex rustfmt materializer

on:
  pull_request:
    branches:
      - automation/native-codex-rustfmt-base
    paths:
      - "aiTemp/Trash/native-codex-rustfmt/**"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/native-codex-long-session
          persist-credentials: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Repair exact EOF formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/tools/registry_definitions.rs')
          data = path.read_bytes()
          if data.endswith(b'\n'):
              raise SystemExit('registry_definitions.rs already ends with newline; refusing unrelated write')
          path.write_bytes(data + b'\n')
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src-tauri/src/tools/registry_definitions.rs"
          git diff -- src-tauri/src/tools/registry_definitions.rs
      - name: Commit exact formatting fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/tools/registry_definitions.rs
          git commit -m "style: restore registry EOF newline"
          git push origin HEAD:feat/native-codex-long-session
