name: Native read-only profile fix
on:
  push:
    branches: [feature/native-codex-bridge-20260909]
    paths: ['.github/workflows/native-readonly-profile-fix.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-readonly-profile-fix
  cancel-in-progress: false
jobs:
  fix-and-prove:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SOURCE: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Apply the minimal root-cause fix and preserve the original
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, shutil
          p=Path('src-tauri/src/codex_bridge/mod.rs')
          backup=Path('aiTemp/Trash/native-readonly-profile-before')/os.environ['GITHUB_RUN_ID']/p
          backup.parent.mkdir(parents=True,exist_ok=True)
          assert not backup.exists() and not p.is_symlink()
          shutil.copy2(p,backup)
          text=p.read_text(encoding='utf-8')
          start='''            // Named permissions replace removed readOnly.access in native 0.153.4.\n            // A fresh profile avoids inheriting another configured profile's rules.\n            let nonce = std::time::SystemTime::now()\n                .duration_since(std::time::UNIX_EPOCH)\n                .map_err(|_| "System clock unavailable")?\n                .as_nanos();\n            let profile = format!("coding_tools_readonly_{}_{nonce}", std::process::id());\n            let value = self.rpc("thread/start", json!({"cwd":self.root,"model":self.options.model,\n                "permissions":profile,\n                "config":{"permissions":{(profile.clone()):{\n                    "filesystem":{":root":"deny",":minimal":"read",":workspace_roots":{".":"read"}},\n                    "network":{"enabled":false}}}},\n                "approvalPolicy":"on-request","approvalsReviewer":"user","ephemeral":true,\n                "developerInstructions":"Work only on the explicitly requested task. Never delete files; use Trash for unwanted files and aiTemp for temporary files. Do not change permissions or use unsandboxed fallbacks. Explain evidence and uncertainty. Do not launch extra agents unless explicitly requested."}))?;\n            if value["activePermissionProfile"]["id"].as_str() != Some(profile.as_str()) {\n                self.stop("native_permission_profile_mismatch");\n                return Err("Native runtime did not confirm the requested read-only profile; no turn submitted".into());\n            }\n'''
          replacement='''            // Use Codex's built-in read-only profile rather than a custom split-read profile.\n            // Windows' unelevated restricted-token sandbox refuses split read restrictions rather\n            // than running unsandboxed, while the built-in profile is a supported native boundary.\n            const PROFILE: &str = ":read-only";\n            let value = self.rpc("thread/start", json!({"cwd":self.root,"model":self.options.model,\n                "permissions":PROFILE,\n                "approvalPolicy":"on-request","approvalsReviewer":"user","ephemeral":true,\n                "developerInstructions":"Work only on the explicitly requested task. Never delete files; use Trash for unwanted files and aiTemp for temporary files. Do not change permissions or use unsandboxed fallbacks. Explain evidence and uncertainty. Do not launch extra agents unless explicitly requested."}))?;\n            if value["activePermissionProfile"]["id"].as_str() != Some(PROFILE) {\n                self.stop("native_permission_profile_mismatch");\n                return Err("Native runtime did not confirm the built-in read-only profile; no turn submitted".into());\n            }\n'''
          assert text.count(start)==1
          text=text.replace(start,replacement,1)
          status='''                    thread.status = match params["turn"]["status"].as_str() {\n                        Some("completed") => "completed",\n                        Some("interrupted") => "interrupted",\n                        _ => "failed",\n                    }\n                    .into();\n'''
          diagnosed=status+'''                    #[cfg(test)]\n                    if thread.status == "failed" {\n                        if let Some(message) = params["turn"]["error"]["message"].as_str() {\n                            thread.notice = Some(bounded(message, 2048));\n                        }\n                    }\n'''
          assert text.count(status)==1
          p.write_text(text.replace(status,diagnosed,1),encoding='utf-8')
          PY
          rustfmt --edition 2021 --config skip_children=true src-tauri/src/codex_bridge/mod.rs
          git diff --check -- src-tauri/src/codex_bridge/mod.rs
      - name: Prepare isolated native bridge probe
        run: python scripts/native_bridge_ci.py probe-init
      - name: Verify official Codex native binary without account credentials
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ASSET: codex-x86_64-pc-windows-msvc.exe.tar.gz
        run: python scripts/native_bridge_ci.py download-native
      - name: Prove native start-send-review-compact-interrupt-close against loopback
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_bridge_actual_turns_against_loopback_fixture -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-lifecycle.txt
          grep -F 'PASS: real native start/send/review/compact/interrupt/unsubscribe' aiTemp/evidence/native-lifecycle.txt
      - name: Commit only after the real native lifecycle passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- src-tauri/src/codex_bridge/mod.rs
          git diff --cached --check
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          git commit -m 'fix: use native Codex built-in read-only permission profile'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin refs/heads/feature/native-codex-bridge-20260909 | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feature/native-codex-bridge-20260909
          git rev-parse HEAD > aiTemp/evidence/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-readonly-profile-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: warn
          retention-days: 14
