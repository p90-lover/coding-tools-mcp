name: materialize rc.9 one-app original UI

on:
  push:
    branches:
      - integration/v0.7.0-rc.9-one-app-original-ui-merge
    paths:
      - '.github/workflows/materialize-rc9-one-app-original-ui.yml'
      - 'aiTemp/rc9-one-app-original-ui/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc9-one-app-original-ui-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Merge and reconcile the verified original interfaces
        shell: bash
        run: |
          set -euo pipefail
          base_before="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin cursor/cpa-codex-router-parity-64e0:refs/remotes/origin/rc9-original-ui-source

          if git merge-base --is-ancestor b046ce232a6c913161ec988cc23da2d37119fb80 HEAD; then
            echo 'Original UI source is already present.'
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff refs/remotes/origin/rc9-original-ui-source
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          expected=$'desktop-electron/electron/cpa-managed.cjs\ndesktop-electron/electron/provider-bootstrap.cjs\ndesktop-electron/package.json\ndesktop-electron/src/features/ExternalServicesSurface.tsx\ndesktop-electron/tests/rc9-managed-cpa-runtime.test.cjs'
          if [ "$conflicts" != "$expected" ]; then
            echo 'Unexpected original-UI conflict inventory.' >&2
            echo 'Expected:' >&2
            printf '%s\n' "$expected" >&2
            echo 'Actual:' >&2
            printf '%s\n' "$conflicts" >&2
            exit 1
          fi
          if [ "$merge_status" -eq 0 ]; then
            echo 'Expected bounded conflicts were not reported.' >&2
            exit 1
          fi

          git checkout --theirs -- \
            desktop-electron/electron/cpa-managed.cjs \
            desktop-electron/electron/provider-bootstrap.cjs \
            desktop-electron/package.json \
            desktop-electron/src/features/ExternalServicesSurface.tsx
          git checkout --ours -- desktop-electron/tests/rc9-managed-cpa-runtime.test.cjs
          python3 aiTemp/rc9-one-app-original-ui/reconcile.py
          git add -A

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo 'Unresolved conflicts remain:' >&2
            printf '%s\n' "$unresolved" >&2
            exit 1
          fi

          git diff --cached --diff-filter=D --exit-code "$base_before"
          node --check desktop-electron/electron/main.cjs
          node --check desktop-electron/electron/original-ui.cjs
          node --check desktop-electron/electron/codex-router-original-ui.cjs
          node --check desktop-electron/electron/cpa-managed.cjs
          node --test \
            desktop-electron/tests/desktop-shell-fidelity.test.cjs \
            desktop-electron/tests/rc10-cpa-codex-original-ui.test.cjs \
            desktop-electron/tests/rc9-managed-cpa-runtime.test.cjs \
            desktop-electron/tests/external-services-control-plane.test.cjs \
            desktop-electron/tests/preload-boundary.test.cjs

          git commit -m 'merge(rc9): add original CPA and Codex Router interfaces'
          git push origin HEAD:integration/v0.7.0-rc.9-one-app-original-ui-merge
