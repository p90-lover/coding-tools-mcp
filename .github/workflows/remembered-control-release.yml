name: Remembered control and native sandbox release

on:
  push:
    branches: [release/remembered-control-0.3.6-rc.1]
    paths: ['.github/workflows/remembered-control-release.yml', 'aiTemp/remembered-delivery/**', 'native-helpers/**', 'src/**', 'src-tauri/**', 'package*.json']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: remembered-${{ github.ref }}
  cancel-in-progress: false
env:
  VERSION: 0.3.6-rc.1
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Materialize exact reviewed production source
        id: source
        working-directory: aiTemp/source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/prepared
          python - <<'PYCODE'
          import base64,hashlib,lzma,os,re,shutil,subprocess
          from pathlib import Path,PurePosixPath
          payload=''.join(Path(f'aiTemp/remembered-delivery/source.patch.xz.b64.part{i}').read_text().strip() for i in (1,2,3))
          data=lzma.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(data).hexdigest()=='23f595bf64de28a3393a15a8a6802371e9007a91af33dc4972bf807bc6d099ff'
          assert not re.search(rb'^(deleted file mode|rename |copy |old mode|new mode|\+\+\+ /dev/null)',data,re.M)
          paths=[n.decode() for n in re.findall(rb'^\+\+\+ b/(.+)$',data,re.M)]
          assert len(paths)==36 and len(set(paths))==36
          for name in paths:
              p=PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name.startswith(('src/','src-tauri/','native-helpers/','docs/features/','docs/releases/')) or name in ('package.json','package-lock.json')
              assert not Path(name).is_symlink()
          patch=Path('aiTemp/prepared/input.patch');patch.write_bytes(data)
          if not Path('docs/features/remembered-control.md').exists():
              subprocess.run(['git','apply','--check',str(patch)],check=True)
              for name in paths:
                  p=Path(name)
                  if p.exists():
                      old=Path('aiTemp/Trash/remembered-originals')/os.environ['GITHUB_RUN_ID']/name
                      old.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,old)
              subprocess.run(['git','apply',str(patch)],check=True)
          for name in paths:
              if name.endswith('.rs'):
                  subprocess.run(['rustfmt','--edition','2024' if name.startswith('native-helpers/') else '2021','--config','skip_children=true',name],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PYCODE
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: remembered app control, background discovery and pinned native command sandbox'
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
            test "$remote" = "$GITHUB_SHA"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip HEAD --output=aiTemp/prepared/source.zip
          git rev-parse HEAD > aiTemp/prepared/source-sha.txt
          git ls-tree -r HEAD > aiTemp/prepared/tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remembered-source-${{ github.run_id }}
          path: aiTemp/source/aiTemp/prepared/*
          retention-days: 14
          if-no-files-found: error

  native:
    needs: prepare
    if: github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: aiTemp/checkout
        shell: bash
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      CARGO_BUILD_JOBS: '2'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Frontend and RAM-only source contract
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/installer
          python - <<'PYCODE'
          import json,os,re,subprocess,tomllib
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['SOURCE']
          versions=[json.loads(Path(p).read_text())['version'] for p in ['package.json','package-lock.json','src-tauri/tauri.conf.json']]
          versions.append(tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version'])
          assert all(v==os.environ['VERSION'] for v in versions)
          for name in ['src-tauri/src/tools/computer/capture.rs','src-tauri/src/tools/computer/native_capture.rs','src-tauri/src/tools/screen_tool.rs']:
              s=Path(name).read_text().split('#[cfg(test)]')[0]
              assert not re.search(r'(File::create|OpenOptions|\.save\(|temp_dir\(|tempfile|Command::)',s)
          s=Path('src/lib/components/ComputerOverlay.svelte').read_text()
          assert not re.search(r'(localStorage|sessionStorage|indexedDB|writeFile|download=)',s)
          Path('aiTemp/evidence/source.txt').write_text('PASS: exact source/version and RAM-only capture/preview contract\n'+os.environ['SOURCE']+'\n')
          PYCODE
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
          node --input-type=module <<'JS' 2>&1 | tee aiTemp/evidence/ui-contract.txt
          import assert from 'node:assert/strict';
          import {rememberedGrantLabel,windowAvailability,frameSource} from './src/lib/computer-view.js';
          assert.match(rememberedGrantLabel({remembered:true,restore_on_start:true,suspended:false}),/restart/i);
          assert.match(rememberedGrantLabel({remembered:true,restore_on_start:true,suspended:true}),/suspend/i);
          assert.match(windowAvailability({minimized:true}),/not capturable/i);
          assert.match(windowAvailability({minimized:false,foreground:false}),/background/i);
          assert.equal(frameSource({mime_type:'image/png',base64:'AAAA',persisted:true,capture_storage:'memory_only'}),null);
          console.log('PASS: explicit persistent grants, background/minimized labels, no persistent image rendering');
          JS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: runner.os == 'Windows'
        with:
          repository: openai/codex
          ref: 3caf9f9586baedb4158a7b91545ead3dd320c348
          path: aiTemp/upstream
          clean: false
          persist-credentials: false
      - name: Build only the native sandbox helpers and verify isolation
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          python native-helpers/prepare_upstream.py "$GITHUB_WORKSPACE/aiTemp/upstream" "$PWD/native-helpers/codex_sandbox_bridge.rs"
          cargo build --locked --release --jobs 2 --manifest-path "$GITHUB_WORKSPACE/aiTemp/upstream/codex-rs/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/aiTemp/upstream-target" -p codex-windows-sandbox --bin coding-tools-codex-sandbox --bin codex-command-runner --bin codex-windows-sandbox-setup 2>&1 | tee aiTemp/evidence/sandbox-build.txt
          python - <<'PYCODE'
          import hashlib,json,os,shutil
          from pathlib import Path
          source=Path(os.environ['GITHUB_WORKSPACE'])/'aiTemp/upstream-target/release'
          dest=Path('src-tauri/aiTemp/native-sandbox');dest.mkdir(parents=True,exist_ok=False)
          files={}
          for name in ['coding-tools-codex-sandbox.exe','codex-command-runner.exe','codex-windows-sandbox-setup.exe']:
              p=source/name;assert p.is_file() and p.stat().st_size<150_000_000
              shutil.copy2(p,dest/name);files[name]=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={'upstream_commit':'3caf9f9586baedb4158a7b91545ead3dd320c348','files':files}
          body=(json.dumps(manifest,sort_keys=True,indent=2)+'\n').encode()
          (dest/'manifest.json').write_bytes(body)
          for name in ['LICENSE-Codex','NOTICE.md']:shutil.copy2(Path('native-helpers')/name,dest/name)
          digest=hashlib.sha256(body).hexdigest()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('CODING_TOOLS_SANDBOX_MANIFEST_SHA256='+digest+'\n')
          Path('aiTemp/native-bundle.json').write_text(json.dumps({'bundle':{'resources':{dest.resolve().as_posix()+'/':'native-sandbox/'}}}))
          Path('aiTemp/evidence/sandbox-manifest.json').write_bytes(body)
          PYCODE
          python - "$PWD/src-tauri/aiTemp/native-sandbox/coding-tools-codex-sandbox.exe" "$PWD/aiTemp/isolation" <<'PYCODE' 2>&1 | tee aiTemp/evidence/sandbox-smoke.txt
          import hashlib,json,os,socket,subprocess,sys
          from pathlib import Path
          helper=Path(sys.argv[1]).resolve();base=Path(sys.argv[2]).resolve()
          root=base/'workspace';home=base/'sandbox-state';outside=base/'outside-private.txt'
          root.mkdir(parents=True,exist_ok=False);(home/'aiTemp').mkdir(parents=True,exist_ok=False)
          inside=root/'sentinel.txt';inside.write_text('unchanged-sandbox-fixture',encoding='utf-8')
          outside.write_text('private-outside-fixture',encoding='utf-8')
          expected_inside=hashlib.sha256(inside.read_bytes()).hexdigest();expected_outside=hashlib.sha256(outside.read_bytes()).hexdigest()
          env={k:v for k,v in os.environ.items() if k.upper() in ('SYSTEMROOT','SYSTEMDRIVE','WINDIR','PROGRAMFILES','PROGRAMFILES(X86)','PROGRAMDATA','USERNAME','USERPROFILE','LOCALAPPDATA','APPDATA')}
          env.update({'TEMP':str(home/'aiTemp'),'TMP':str(home/'aiTemp'),'CODEX_HOME':str(home),'OTEL_SDK_DISABLED':'true','DO_NOT_TRACK':'1'})
          ps=str(Path(os.environ['SystemRoot'])/'System32/WindowsPowerShell/v1.0/powershell.exe')
          def request(operation,script=None):
              cmd=[] if script is None else [ps,'-NoLogo','-NoProfile','-NonInteractive','-Command',script]
              e=env.copy()
              if operation=='setup':e['CODING_TOOLS_LOCAL_SANDBOX_SETUP']='1'
              data={'operation':operation,'workspace':str(root),'home':str(home),'argv':cmd,'timeout_ms':8000}
              result=subprocess.run([str(helper)],input=json.dumps(data).encode(),capture_output=True,env=e,timeout=180 if operation=='setup' else 60)
              assert len(result.stdout)<=4194304 and len(result.stderr)<=65536
              try:value=json.loads(result.stdout)
              except Exception:print(result.stdout.decode(errors='replace'));print(result.stderr.decode(errors='replace'));raise
              print(json.dumps({'operation':operation,'exit_code':result.returncode,'result':value}))
              assert value['upstream_commit']=='3caf9f9586baedb4158a7b91545ead3dd320c348' and value['model_calls'] is False
              return value
          q=lambda p:str(p).replace("'","''")
          assert request('setup').get('ready') is True
          assert request('status').get('ready') is True
          read=request('exec',f"$ErrorActionPreference='Stop'; [Console]::Write([System.IO.File]::ReadAllText('{q(inside)}'))")
          assert read['ok'] and read['stdout']=='unchanged-sandbox-fixture',read
          print('PASS: permitted workspace read through actual upstream sandbox backend')
          script=f"""$ErrorActionPreference='Stop';
          try {{[System.IO.File]::WriteAllText('{q(inside)}','unexpected-write');exit 21}} catch {{[Console]::Write('write-denied;')}};
          try {{$text=[System.IO.File]::ReadAllText('{q(outside)}');exit 22}} catch {{[Console]::Write('outside-read-denied')}}; exit 0"""
          denied=request('exec',script)
          assert denied['ok'] and 'write-denied;outside-read-denied' in denied['stdout'],denied
          assert hashlib.sha256(inside.read_bytes()).hexdigest()==expected_inside and hashlib.sha256(outside.read_bytes()).hexdigest()==expected_outside
          print('PASS: readonly workspace and outside-scope read denial; sentinel files unchanged')
          with socket.socket() as listener:
              listener.bind(('127.0.0.1',0));listener.listen(1);listener.settimeout(.3)
              port=listener.getsockname()[1]
              script=f"""$ErrorActionPreference='Stop'; $c=[System.Net.Sockets.TcpClient]::new();
              try {{$a=$c.BeginConnect('127.0.0.1',{port},$null,$null);if ($a.AsyncWaitHandle.WaitOne(1200)) {{$c.EndConnect($a);exit 23}}}} catch {{}} finally {{$c.Dispose()}};
              [Console]::Write('direct-network-denied');exit 0"""
              network=request('exec',script)
              assert network['ok'] and 'direct-network-denied' in network['stdout'],network
              try:
                  connection,_=listener.accept();connection.close();raise AssertionError('Sandbox unexpectedly reached loopback listener')
              except socket.timeout:pass
          print('PASS: restricted network blocks a real loopback connection')
          assert not any(p.suffix.lower() in ('.png','.jpg','.jpeg','.webp') for p in base.rglob('*') if p.is_file())
          Path('aiTemp/evidence/sandbox-proof.json').write_text(json.dumps({'upstream_commit':'3caf9f9586baedb4158a7b91545ead3dd320c348','native_verified':True,'model_session_invoked':False,'checks':['allowed_read','write_and_outside_read_denied','loopback_denied']},indent=2)+'\n')
          PYCODE
      - name: Focused policy, vision and catalog checks
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib computer_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/computer-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib sandbox_contract_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/sandbox-contract.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib vision_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/vision-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib core_catalog_exposes_chatgpt_compatible_tools -- --test-threads=1 2>&1 | tee aiTemp/evidence/catalog.txt
      - name: Real Windows background observation and input fixture
        if: runner.os == 'Windows'
        env:
          COMPUTER_USE_NATIVE_SMOKE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib computer_native_fixture_round_trip -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-smoke.txt
          python - <<'PYCODE'
          from pathlib import Path
          assert '1 passed; 0 failed' in Path('aiTemp/evidence/native-smoke.txt').read_text()
          PYCODE
      - name: Build and inspect exact installer including native resources
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = 'windows-x64' ]; then
            npm run tauri -- build --config aiTemp/native-bundle.json --bundles nsis -- --locked 2>&1 | tee aiTemp/evidence/installer.txt
          else
            npm run tauri -- build --bundles app,dmg -- --locked 2>&1 | tee aiTemp/evidence/installer.txt
          fi
          git diff --exit-code -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          python - <<'PYCODE'
          import hashlib,json,os,plistlib,shutil,subprocess
          from pathlib import Path
          target=Path(os.environ['CARGO_TARGET_DIR'])/'release';windows=os.environ['PLATFORM']=='windows-x64'
          assets=list(target.glob('bundle/nsis/*.exe' if windows else 'bundle/dmg/*.dmg'));assert len(assets)==1
          asset=assets[0];assert asset.stat().st_size>100000
          binaries=[target/'coding-tools-mcp-desktop.exe'] if windows else list(target.glob('bundle/macos/*.app/Contents/MacOS/coding-tools-mcp-desktop'))
          assert len(binaries)==1 and binaries[0].is_file()
          expected='coding-tools-mcp-desktop '+os.environ['VERSION']
          actual=subprocess.run([str(binaries[0]),'--version'],capture_output=True,text=True,check=True,timeout=20).stdout.strip();assert actual==expected
          if not windows:
              info=plistlib.loads(subprocess.check_output(['hdiutil','attach','-readonly','-nobrowse','-plist',str(asset)]))
              mounts=[Path(e['mount-point']) for e in info['system-entities'] if 'mount-point' in e];assert len(mounts)==1
              try:
                  apps=list(mounts[0].glob('*.app/Contents/MacOS/coding-tools-mcp-desktop'));assert len(apps)==1
                  assert subprocess.run([str(apps[0]),'--version'],capture_output=True,text=True,check=True,timeout=20).stdout.strip()==expected
                  assert hashlib.sha256(apps[0].read_bytes()).digest()==hashlib.sha256(binaries[0].read_bytes()).digest()
              finally:subprocess.run(['hdiutil','detach',str(mounts[0])],check=True)
          else:
              assert len(os.environ.get('CODING_TOOLS_SANDBOX_MANIFEST_SHA256',''))==64
              extract=Path('aiTemp/installer-inspection');extract.mkdir(exist_ok=False)
              subprocess.run(['7z','x',str(asset),'-o'+str(extract.resolve()),'-y'],check=True,stdout=subprocess.DEVNULL)
              manifest=json.loads(Path('src-tauri/aiTemp/native-sandbox/manifest.json').read_text())
              for name,digest in manifest['files'].items():
                  matches=list(extract.rglob(name));assert len(matches)==1,(name,[str(p) for p in matches])
                  assert hashlib.sha256(matches[0].read_bytes()).hexdigest()==digest
              matches=list(extract.rglob('manifest.json'))
              assert any(hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['CODING_TOOLS_SANDBOX_MANIFEST_SHA256'] for p in matches)
          name='Coding.Tools.MCP_'+os.environ['VERSION']+('_x64-setup.exe' if windows else '_aarch64.dmg')
          dest=Path('aiTemp/installer')/name;assert not dest.exists();shutil.copy2(asset,dest)
          proof={'source_commit':os.environ['SOURCE'],'version':os.environ['VERSION'],'platform':os.environ['PLATFORM'],'asset':name,'size':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'screenshot_storage':'memory_only','native_fixture_verified':windows,'native_sandbox_verified':windows,'sandbox_manifest_sha256':os.environ.get('CODING_TOOLS_SANDBOX_MANIFEST_SHA256') if windows else None,'user_chatgpt_connection_verified':False,'codex_agent_invoked':False,'publisher_signed':False}
          for directory in ['aiTemp/installer','aiTemp/evidence']:Path(directory,'proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          Path('aiTemp/evidence/binary-version.txt').write_text(actual+'\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remembered-installer-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/installer/*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remembered-evidence-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: [prepare, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: remembered-installer-*-${{ github.run_id }}
          path: aiTemp/installers
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: remembered-evidence-*-${{ github.run_id }}
          path: aiTemp/evidence
      - name: Verify native assets and publish by release ID
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/release-assets
          python - <<'PYCODE'
          import base64,hashlib,json,os,shutil,subprocess,zipfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];source=os.environ['SOURCE'];version=os.environ['VERSION'];tag='v'+version
          root=Path('aiTemp/installers');dest=Path('aiTemp/release-assets')
          proofs=[json.loads(p.read_text()) for p in root.glob('*/proof.json')]
          assert len(proofs)==2 and {p['platform'] for p in proofs}=={'windows-x64','macos-arm64'}
          for p in proofs:
              assert p['source_commit']==source and p['version']==version and p['screenshot_storage']=='memory_only' and not p['codex_agent_invoked']
              if p['platform']=='windows-x64':assert p['native_fixture_verified'] and p['native_sandbox_verified'] and len(p['sandbox_manifest_sha256'])==64
              assert Path(p['asset']).name==p['asset'];matches=list(root.glob('*/'+p['asset']));assert len(matches)==1
              asset=matches[0];assert not asset.is_symlink() and asset.stat().st_size==p['size'] and hashlib.sha256(asset.read_bytes()).hexdigest()==p['sha256']
              shutil.copy2(asset,dest/asset.name)
          (dest/'release-provenance.json').write_text(json.dumps({'version':version,'source_commit':source,'workflow_run':int(os.environ['GITHUB_RUN_ID']),'prerelease':True,'installers':proofs},indent=2)+'\n')
          with zipfile.ZipFile(dest/'computer-use-validation.zip','x',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(Path('aiTemp/evidence').rglob('*')):
                  if p.is_file():
                      assert p.suffix in {'.json','.txt'} and not p.is_symlink();z.write(p,p.relative_to('aiTemp/evidence').as_posix())
          files=sorted(dest.iterdir());(dest/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          def api(path,method='GET',body=None):
              args=['gh','api',f'repos/{repo}/{path}','--method',method];payload=None
              if body is not None:args+=['--input','-'];payload=json.dumps(body).encode()
              return json.loads(subprocess.check_output(args,input=payload,timeout=90))
          assert api('git/ref/heads/release/remembered-control-0.3.6-rc.1')['object']['sha']==source
          assert not api('git/matching-refs/tags/'+tag),'Existing tag is never replaced'
          notes=base64.b64decode(api(f'contents/docs/releases/{tag}.md?ref={source}')['content']).decode()
          api('git/refs','POST',{'ref':'refs/tags/'+tag,'sha':source})
          draft=api('releases','POST',{'tag_name':tag,'target_commitish':source,'name':f'Coding Tools MCP {tag} — remembered control + background observation','body':notes,'draft':True,'prerelease':True,'make_latest':'false'})
          ident=draft['id'];expected={};Path('aiTemp/draft-id.txt').write_text(str(ident)+'\n')
          for p in sorted(dest.iterdir()):
              digest='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest();expected[p.name]=(p.stat().st_size,digest)
              url=f'https://uploads.github.com/repos/{repo}/releases/{ident}/assets?name={p.name}'
              asset=json.loads(subprocess.check_output(['gh','api',url,'--method','POST','--header','Content-Type: application/octet-stream','--input',str(p)],timeout=180))
              assert asset['name']==p.name and (asset['size'],asset['digest'])==expected[p.name]
              downloaded=subprocess.check_output(['gh','api',f'repos/{repo}/releases/assets/{asset["id"]}','--header','Accept: application/octet-stream'],timeout=180)
              assert len(downloaded)==p.stat().st_size and 'sha256:'+hashlib.sha256(downloaded).hexdigest()==digest
          current=api('releases/'+str(ident));assert current['draft'] and current['tag_name']==tag
          assert {a['name']:(a['size'],a['digest']) for a in current['assets']}==expected
          assert api('git/ref/tags/'+tag)['object']['sha']==source
          assert api('git/ref/heads/release/remembered-control-0.3.6-rc.1')['object']['sha']==source
          api('releases/'+str(ident),'PATCH',{'draft':False,'prerelease':True,'make_latest':'false','target_commitish':source})
          public=api('releases/tags/'+tag);assert public['id']==ident and not public['draft'] and public['published_at']
          assert {a['name']:(a['size'],a['digest']) for a in public['assets']}==expected
          receipt={'source_commit':source,'release_id':ident,'url':public['html_url'],'draft':False,'prerelease':True,'assets':[{k:a[k] for k in ('name','size','digest','browser_download_url')} for a in public['assets']]}
          Path('aiTemp/publication-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt,indent=2))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remembered-publication-${{ github.run_id }}
          path: |
            aiTemp/publication-receipt.json
            aiTemp/draft-id.txt
          retention-days: 14
          if-no-files-found: warn
