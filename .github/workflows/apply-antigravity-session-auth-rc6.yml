name: Apply Antigravity session management on rc.6

on:
  push:
    branches:
      - fix/rc6-antigravity-session-auth
    paths:
      - .github/workflows/apply-antigravity-session-auth-rc6.yml
      - aiTemp/antigravity-session-auth/apply_patch.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: antigravity-session-auth-rc6-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/antigravity-session-auth/bun-cache

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/rc6-antigravity-session-auth
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Prepare retained work roots
        run: |
          mkdir -p \
            aiTemp/antigravity-session-auth/evidence \
            aiTemp/Trash/antigravity-session-auth

      - name: Apply the retained Antigravity patch
        run: |
          set -euo pipefail
          python aiTemp/antigravity-session-auth/apply_patch.py \
            | tee aiTemp/antigravity-session-auth/evidence/materializer.txt
          grep -F ANTIGRAVITY_SESSION_PATCH_APPLIED \
            aiTemp/antigravity-session-auth/evidence/materializer.txt

      - name: Check the bounded source diff
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          git diff --name-only | tee aiTemp/antigravity-session-auth/evidence/changed-files.txt
          grep -Fx desktop-electron/electron/provider-network.cjs \
            aiTemp/antigravity-session-auth/evidence/changed-files.txt
          grep -Fx desktop-electron/electron/provider-bootstrap.cjs \
            aiTemp/antigravity-session-auth/evidence/changed-files.txt
          grep -Fx desktop-electron/electron/preload.cjs \
            aiTemp/antigravity-session-auth/evidence/changed-files.txt
          grep -Fx desktop-electron/src/providers/provider-types.ts \
            aiTemp/antigravity-session-auth/evidence/changed-files.txt
          grep -Fx desktop-electron/src/types.ts \
            aiTemp/antigravity-session-auth/evidence/changed-files.txt
          grep -Fx desktop-electron/src/features/ProviderHubSaasSurface.tsx \
            aiTemp/antigravity-session-auth/evidence/changed-files.txt

      - name: Install exact Electron dependencies
        run: bun install --cwd desktop-electron --frozen-lockfile

      - name: Run Antigravity and Provider Hub regression contracts
        run: >-
          node --test
          desktop-electron/tests/antigravity-provider-session.test.cjs
          desktop-electron/tests/provider-console-saas.test.cjs
          desktop-electron/tests/provider-center-account-wiring.test.cjs
          desktop-electron/tests/provider-execution-router.test.cjs
          desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs
          desktop-electron/tests/proxy-provider-contract.test.cjs
          desktop-electron/tests/execution-bridge-contract.test.cjs
          desktop-electron/tests/renderer-wiring.test.cjs

      - name: Validate runtime syntax, types, and production renderer
        shell: bash
        run: |
          set -euo pipefail
          node --check desktop-electron/electron/provider-network.cjs
          node --check desktop-electron/electron/provider-bootstrap.cjs
          node --check desktop-electron/electron/preload.cjs
          bun run --cwd desktop-electron typecheck

          original_dist="aiTemp/Trash/antigravity-session-auth/original-dist-$GITHUB_RUN_ID"
          validated_dist="aiTemp/Trash/antigravity-session-auth/validated-renderer-$GITHUB_RUN_ID"
          had_original_dist=false
          if [ -d desktop-electron/dist ]; then
            mv desktop-electron/dist "$original_dist"
            had_original_dist=true
          fi

          restore_original_dist() {
            if [ -d desktop-electron/dist ]; then
              mv desktop-electron/dist "$validated_dist"
            fi
            if [ "$had_original_dist" = true ] && [ -d "$original_dist" ]; then
              mv "$original_dist" desktop-electron/dist
            fi
          }
          trap restore_original_dist EXIT

          (
            cd desktop-electron
            bunx vite build
          )
          node --test desktop-electron/tests/renderer-provider-bundle.test.cjs
          restore_original_dist
          trap - EXIT

      - name: Enforce no file deletion
        run: |
          set -euo pipefail
          test -z "$(git diff --diff-filter=D --name-only)"
          test -z "$(git diff --cached --diff-filter=D --name-only)"

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git add \
            desktop-electron/electron/provider-network.cjs \
            desktop-electron/electron/provider-bootstrap.cjs \
            desktop-electron/electron/preload.cjs \
            desktop-electron/src/providers/provider-types.ts \
            desktop-electron/src/types.ts \
            desktop-electron/src/features/ProviderHubSaasSurface.tsx
          if git diff --cached --quiet; then
            echo ANTIGRAVITY_SESSION_IMPLEMENTATION_ALREADY_COMMITTED
            exit 0
          fi
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          git commit -m 'fix(rc6): manage Antigravity OAuth sessions'
          git push origin HEAD:refs/heads/fix/rc6-antigravity-session-auth

      - name: Preserve transient dependencies and build output in Trash
        if: always()
        shell: bash
        run: |
          mkdir -p aiTemp/Trash/antigravity-session-auth
          if [ -d desktop-electron/dist ]; then
            mv desktop-electron/dist \
              "aiTemp/Trash/antigravity-session-auth/renderer-$GITHUB_RUN_ID"
          fi
          if [ -d desktop-electron/node_modules ]; then
            mv desktop-electron/node_modules \
              "aiTemp/Trash/antigravity-session-auth/node_modules-$GITHUB_RUN_ID"
          fi
