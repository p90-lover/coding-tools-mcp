name: Live refresh focused preflight
on:
  push:
    branches: [fix/live-refresh-long-tasks-0.4.4-rc.5]
    paths: [.github/workflows/live-refresh-preflight.yml]
permissions: {contents: read, actions: read}
jobs:
  preflight:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/preflight-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1', components: rustfmt}
      - name: Confirm actual baseline regressions then materialize reviewed changes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          gh run download 34657052928 --repo "$GITHUB_REPOSITORY" --name live-refresh-red-34657052928 --dir aiTemp/evidence
          gh run download 34658078350 --repo "$GITHUB_REPOSITORY" --name live-context-red-34658078350 --dir aiTemp/context-baseline
          grep -F BASELINE_SCAN_UNBOUNDED aiTemp/evidence/red.txt
          grep -F READ_HOLDS_PERMISSION_FENCE aiTemp/evidence/red.txt
          cp aiTemp/context-baseline/* aiTemp/evidence/
          python aiTemp/live-refresh/finish_prepare.py
      - name: Test actual bounded harness and context without desktop dependencies
        run: |
          set -euo pipefail
          mkdir -p aiTemp/probe/src
          python - <<'PY'
          from pathlib import Path
          root=Path('.').resolve()
          Path('aiTemp/probe/Cargo.toml').write_text('[package]\nname="live-refresh-preflight"\nversion="0.0.0"\nedition="2021"\n[dependencies]\nuuid={version="1",features=["v4"]}\nserde={version="1",features=["derive"]}\nserde_json="1"\nthiserror="2"\nsha2="0.10"\nwalkdir="2"\ndirs="6"\ntempfile="3"\n')
          text='pub mod harness {\n'
          for name in ['model','store','bounded_scan','state']:
              text+='#[path="'+(root/f'src-tauri/src/harness/{name}.rs').as_posix()+'"] pub mod '+name+';\n'
          text+='pub use state::Harness; }\n'
          text+='include!("'+(root/'aiTemp/live-refresh/scan_contract.rs').as_posix()+'");\n'
          code=Path('src-tauri/src/tools/live_policy.rs').read_text()
          text+=code[code.index('pub fn refreshable_observation('):code.index('/// Acquire all changed contexts')]
          text+='\n#[test] fn refresh_contract_observation_releases_fence(){for n in ["project_state","harness_status","read_file","search_text"]{assert!(!fence_entire_call(n));}assert!(fence_entire_call("apply_patch"));}\n'
          Path('aiTemp/probe/src/lib.rs').write_text(text)
          PY
          cargo test --manifest-path aiTemp/probe/Cargo.toml refresh_contract_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/preflight.txt
          grep -F '2 passed; 0 failed' aiTemp/evidence/preflight.txt
          python aiTemp/live-refresh/context_probe.py 2>&1 | tee aiTemp/evidence/context-green.txt
          grep -F '1 passed; 0 failed' aiTemp/evidence/context-green.txt
      - name: Validate refresh coalescing and Svelte compilation
        run: |
          set -euo pipefail
          npm ci > aiTemp/evidence/npm.txt 2>&1
          node --test aiTemp/live-refresh/refresh-ui.test.mjs 2>&1 | tee aiTemp/evidence/refresh-ui.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
      - name: Preserve exact source and full diff for review without advancing main
        if: always()
        run: |
          set -euo pipefail
          mkdir -p aiTemp/source-review
          git bundle create aiTemp/source-review/source.bundle HEAD
          git diff HEAD --binary > aiTemp/source-review/materialized.patch
          git status --short > aiTemp/source-review/status.txt
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'live-refresh-preflight-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: warn, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'live-refresh-source-${{ github.run_id }}', path: aiTemp/source/aiTemp/source-review/, if-no-files-found: warn, retention-days: 14}
