name: rc.7 five-stack Windows package smoke

on:
  push:
    branches:
      - fix/rc7-complete-five-stack-integration
    paths:
      - '.github/workflows/five-stack-windows-package-smoke.yml'
      - 'desktop-electron/**'
      - 'runtime-web/**'
      - 'rust-core/**'
  pull_request:
    paths:
      - '.github/workflows/five-stack-windows-package-smoke.yml'
      - 'desktop-electron/**'
      - 'runtime-web/**'
      - 'rust-core/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc7-five-stack-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.0'
  NODE_VERSION: '22'
  RUST_TOOLCHAIN: '1.98.1'
  SOURCE_SHA: ${{ github.sha }}
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/source/aiTemp/five-stack-cargo-target
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/source/aiTemp/five-stack-bun-cache
  CODING_TOOLS_RETENTION_ROOT: ${{ github.workspace }}/aiTemp/source/aiTemp/Trash/five-stack-package
  TUNNEL_ARCHIVE: tunnel-client-v0.0.12-windows-amd64.zip
  TUNNEL_ARCHIVE_SHA256: '2a2804933924e38a502d62b61f0266cb80d56d65744f4c29876b2bf9c1544356'
  TUNNEL_RELEASE_URL: https://github.com/openai/tunnel-client/releases/download/v0.0.12
  OUTPUT_INSTALLER: Coding.Tools_0.7.0-rc.7_five-stack_windows_x64_setup.exe
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  package-windows:
    name: Build and verify Windows x64 five-stack package
    runs-on: windows-2022
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Prepare retained temporary roots and install exact dependencies
        run: |
          set -euo pipefail
          mkdir -p \
            aiTemp/evidence \
            aiTemp/tmp \
            aiTemp/Trash/five-stack-package \
            aiTemp/release-output
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          preload="$(node -e 'const { pathToFileURL } = require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href);' "$preload")"
          export NODE_OPTIONS="--import=$preload"
          absolute_tmp="$PWD/aiTemp/tmp"
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd runtime-web \
            2>&1 | tee aiTemp/evidence/runtime-install.txt
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd runtime-web/launcher \
            2>&1 | tee aiTemp/evidence/runtime-launcher-install.txt
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd desktop-electron \
            2>&1 | tee aiTemp/evidence/desktop-install.txt

      - name: Run exact five-stack source verification
        run: |
          set -euo pipefail
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          preload="$(node -e 'const { pathToFileURL } = require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href);' "$preload")"
          export NODE_OPTIONS="--import=$preload"
          node --check desktop-electron/scripts/verify-five-stack-package.cjs
          node --test \
            desktop-electron/tests/five-stack-managed-integration.test.cjs \
            desktop-electron/tests/five-stack-package-contract.test.cjs \
            desktop-electron/tests/commandcode-provider-session.test.cjs \
            desktop-electron/tests/provider-execution-router.test.cjs \
            desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs \
            desktop-electron/tests/rc7-full-integration-contract.test.cjs \
            desktop-electron/tests/upstream-tools.test.cjs \
            2>&1 | tee aiTemp/evidence/five-stack-source-tests.txt
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron typecheck \
            2>&1 | tee aiTemp/evidence/desktop-typecheck.txt
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd runtime-web verify \
            2>&1 | tee aiTemp/evidence/runtime-verify.txt

      - name: Acquire checksum-pinned official tunnel client
        run: |
          set -euo pipefail
          input_dir="aiTemp/input/tunnel-client/v0.0.12/windows-amd64"
          archive="$input_dir/$TUNNEL_ARCHIVE"
          partial="$archive.partial"
          url="$TUNNEL_RELEASE_URL/$TUNNEL_ARCHIVE"
          mkdir -p "$input_dir"
          test ! -e "$archive"
          test ! -e "$partial"
          curl.exe --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$partial" "$url"
          test -s "$partial"
          actual="$(sha256sum "$partial" | awk '{print $1}')"
          test "$actual" = "$TUNNEL_ARCHIVE_SHA256"
          mv --no-clobber "$partial" "$archive"
          echo "CODING_TOOLS_TUNNEL_CLIENT_ARCHIVE=$PWD/$archive" >> "$GITHUB_ENV"
          printf 'url=%s\nsha256=%s\n' "$url" "$actual" \
            > aiTemp/evidence/tunnel-client.txt

      - name: Build Rust sidecar and integrated Windows package
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            2>&1 | tee aiTemp/evidence/headless-build.txt
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          preload="$(node -e 'const { pathToFileURL } = require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href);' "$preload")"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron package:win \
            2>&1 | tee aiTemp/evidence/windows-package.txt

      - name: Verify packaged product and materialize installer artifact
        run: |
          set -euo pipefail
          mapfile -t roots < <(
            for candidate in desktop-electron/artifacts desktop-electron/release; do
              test -d "$candidate" && printf '%s\n' "$candidate"
            done
          )
          test "${#roots[@]}" -eq 1
          package_root="${roots[0]}"
          node desktop-electron/scripts/verify-package.cjs "$package_root" \
            --source "$SOURCE_SHA" \
            --json-out aiTemp/evidence/package-verification.json \
            2>&1 | tee aiTemp/evidence/package-verification.txt
          node desktop-electron/scripts/verify-five-stack-package.cjs "$package_root" \
            --json-out aiTemp/evidence/five-stack-package-verification.json \
            2>&1 | tee aiTemp/evidence/five-stack-package-verification.txt
          node --test \
            desktop-electron/tests/package-contents.test.cjs \
            desktop-electron/tests/five-stack-package-contract.test.cjs \
            2>&1 | tee aiTemp/evidence/package-contract-tests.txt
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          preload="$(node -e 'const { pathToFileURL } = require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href);' "$preload")"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron smoke:package \
            2>&1 | tee aiTemp/evidence/package-smoke.txt
          mapfile -t installers < <(find "$package_root" -maxdepth 1 -type f -iname '*.exe' -print)
          test "${#installers[@]}" -eq 1
          output="aiTemp/release-output/$OUTPUT_INSTALLER"
          test ! -e "$output"
          cp --no-clobber "${installers[0]}" "$output"
          test -s "$output"
          head -c 2 "$output" | grep -F 'MZ'
          sha256sum "$output" | tee aiTemp/release-output/SHA256SUMS.txt
          printf '%s\n' "$SOURCE_SHA" > aiTemp/release-output/source.commit
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          git diff --exit-code
          git diff --cached --exit-code

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc7-five-stack-windows-installer-${{ github.sha }}
          path: aiTemp/source/aiTemp/release-output/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc7-five-stack-windows-evidence-${{ github.sha }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: warn
          retention-days: 14
