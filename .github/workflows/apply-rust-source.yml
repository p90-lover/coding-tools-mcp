name: Verify native Codex combined fixes

on:
  push:
    branches:
      - aiTemp/native-codex-review-fix
    paths:
      - ".github/workflows/apply-rust-source.yml"
      - "aiTemp/Trash/native-codex-review-fix/combined.patch"

permissions:
  contents: write

concurrency:
  group: native-codex-combined-fix-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-native-codex-combined-fix

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aiTemp/native-codex-review-fix
          fetch-depth: 0
          persist-credentials: true

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '20'
          cache: npm

      - name: Apply reviewed combined patch
        shell: bash
        run: |
          set -euo pipefail
          patch_path="aiTemp/Trash/native-codex-review-fix/combined.patch"
          git apply --check "$patch_path"
          git apply "$patch_path"
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Run native Codex Rust tests
        working-directory: src-tauri
        run: "cargo test --locked codex_bridge::tests::"

      - name: Run registry catalog tests
        working-directory: src-tauri
        run: "cargo test --locked tools::registry::"

      - name: Run strict Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Install frontend dependencies
        run: |
          mkdir -p aiTemp/npm-cache
          npm ci --cache aiTemp/npm-cache

      - name: Run Svelte checks
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Commit verified product source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src-tauri/src/codex_bridge/mod.rs src-tauri/src/tools/registry_definitions.rs src/lib/components/CodexRuntimePanel.svelte
          if git diff --cached --quiet; then
            echo "Combined fixes already applied."
            exit 0
          fi
          if git diff --cached --name-status | grep -q '^D'; then
            echo "Refusing to commit a deletion."
            exit 1
          fi
          git commit -m "fix: address native Codex CI and review findings"
          git push origin HEAD:"${GITHUB_REF_NAME}"
