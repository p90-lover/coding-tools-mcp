name: Apply Paseo and Anneal 0.7 wiring

on:
  push:
    branches:
      - fix/0.7-paseo-anneal-wiring
    paths:
      - .github/workflows/apply-paseo-anneal-0.7-wiring.yml
      - aiTemp/execution/wire_app.py
      - aiTemp/paseo-anneal-0.7/wiring_contract.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-paseo-anneal-07-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt

      - name: Apply preserved execution wiring recipe
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/Trash/execution-wire
          python aiTemp/execution/wire_app.py \
            2>&1 | tee aiTemp/evidence/paseo-anneal-wire.txt
          grep -F EXECUTION_WIRED aiTemp/evidence/paseo-anneal-wire.txt

      - name: Verify bounded source mutation
        run: |
          set -euo pipefail
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          python - <<'PY'
          import subprocess
          allowed = {
              'aiTemp/execution/probe.py',
              'src-tauri/src/integrations/mod.rs',
              'src-tauri/src/integrations/execution/mod.rs',
              'src-tauri/src/data/model.rs',
              'src-tauri/src/data/migrate.rs',
              'src-tauri/src/data/mod.rs',
              'src-tauri/src/tools/workflow.rs',
              'src-tauri/src/tools/approval.rs',
              'src-tauri/src/tools/registry_definitions.rs',
              'src-tauri/src/commands/mod.rs',
              'src-tauri/src/lib.rs',
              'src/lib/components/AppShell.svelte',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'UNEXPECTED_WIRING_PATHS:{unexpected}')
          required = {
              'src-tauri/src/integrations/mod.rs',
              'src-tauri/src/data/model.rs',
              'src-tauri/src/tools/workflow.rs',
              'src-tauri/src/commands/mod.rs',
              'src-tauri/src/lib.rs',
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f'MISSING_WIRING_PATHS:{missing}')
          print('PASEO_ANNEAL_WIRING_DIFF_BOUNDED')
          PY

      - name: Commit verified wiring only
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          git commit -m 'feat: wire Paseo and Anneal execution into the 0.7 desktop core'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
