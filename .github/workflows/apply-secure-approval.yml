name: Apply secure approval feature

on:
  push:
    branches:
      - feature/secure-auto-approval-persistent-auth
    paths:
      - "aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch.py"
      - ".github/workflows/apply-secure-approval.yml"
  pull_request:
    branches:
      - integration/xyTom-v0.3.0
    paths:
      - "aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch.py"
      - ".github/workflows/apply-secure-approval.yml"

permissions:
  contents: write

concurrency:
  group: apply-secure-approval-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-approval

jobs:
  apply-test-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'feature/secure-auto-approval-persistent-auth' }}
          fetch-depth: 0

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: secure-approval-linux

      - name: Apply approval patch without deleting files
        run: |
          python aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check
          if git diff --name-status | grep -q '^D'; then
            echo "Refusing to continue because the patch deleted a file."
            exit 1
          fi

      - name: Run focused approval and policy tests
        working-directory: src-tauri
        run: |
          cargo test --locked tools::approval
          cargo test --locked elevation_requests_are_always_blocked

      - name: Run complete Rust tests and Clippy
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run frontend checks and build
        run: |
          mkdir -p aiTemp/npm-cache
          npm ci --cache aiTemp/npm-cache
          npm run check
          npm run build
          node --test tests/*.test.mjs

      - name: Commit verified approval source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src-tauri src
          if git diff --cached --quiet; then
            echo "Approval source is already committed."
            exit 0
          fi
          if git diff --cached --name-status | grep -q '^D'; then
            echo "Refusing to commit a deletion."
            exit 1
          fi
          git commit -m "feat: add Codex-style scoped auto approval"
          git push origin HEAD:feature/secure-auto-approval-persistent-auth
