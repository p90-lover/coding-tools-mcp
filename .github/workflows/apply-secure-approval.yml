name: Materialize secure release source

on:
  push:
    branches:
      - automation/secure-source-v0.3.0-rc1
    paths:
      - "aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch_v2.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch_v3.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_persistent_store_patch.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_persistent_oauth_patch.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_release_version.py"
      - "aiTemp/secure-auto-approval-persistent-auth/release_version.txt"
      - ".github/workflows/apply-secure-approval.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-request.yml"
  pull_request:
    branches:
      - feature/secure-auto-approval-persistent-auth
      - integration/xyTom-v0.3.0
    paths:
      - "aiTemp/secure-auto-approval-persistent-auth/**"
      - ".github/workflows/apply-secure-approval.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-request.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "src-tauri/**"

permissions:
  contents: write

concurrency:
  group: materialize-secure-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-secure-release
  TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  apply-test-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: secure-release-linux

      - name: Apply secure source and synchronized release version
        run: |
          python aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch_v3.py
          python aiTemp/secure-auto-approval-persistent-auth/apply_persistent_store_patch.py
          python aiTemp/secure-auto-approval-persistent-auth/apply_persistent_oauth_patch.py
          python aiTemp/secure-auto-approval-persistent-auth/apply_release_version.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check
          if git diff --name-status | grep -q '^D'; then
            echo "Refusing to continue because a patch deleted a file."
            exit 1
          fi

      - name: Test scoped approval and elevation interception
        working-directory: src-tauri
        run: |
          cargo test --locked tools::approval -- --nocapture
          cargo test --locked elevation_requests_are_always_blocked -- --nocapture

      - name: Test protected deletion boundaries
        working-directory: src-tauri
        run: |
          cargo test --locked --test call_tool_security apply_patch_allows_deleting_a_normal_file -- --nocapture
          cargo test --locked --test call_tool_security deleting_readme_requires_explicit_confirmation -- --nocapture
          cargo test --locked --test call_tool_security deleting_git_assets_is_always_rejected -- --nocapture

      - name: Test persistent OAuth rotation and recovery
        working-directory: src-tauri
        run: |
          cargo test --locked auth::refresh_tokens -- --nocapture
          cargo test --locked auth::oauth_flow::tests -- --nocapture
          cargo test --locked data::store::tests -- --nocapture

      - name: Run complete Rust tests and Clippy
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run frontend checks and build
        run: |
          mkdir -p aiTemp/npm-cache
          npm ci --cache aiTemp/npm-cache
          npm run check
          npm run build
          node --test tests/*.test.mjs

      - name: Commit verified secure release source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json src-tauri src
          if git diff --cached --quiet; then
            echo "Verified secure release source is already committed."
            exit 0
          fi
          if git diff --cached --name-status | grep -q '^D'; then
            echo "Refusing to commit a deletion."
            exit 1
          fi
          git commit -m "feat: materialize secure v0.3.0-rc1 release source"

          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            if git rebase "origin/$TARGET_BRANCH" && \
               git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done

          echo "Unable to write verified source after three non-destructive retries."
          exit 1
