name: Materialize secure release source

on:
  push:
    branches:
      - automation/secure-source-v0.3.0-rc1-v2
    paths:
      - "aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch_v2.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch_v3.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_persistent_store_patch.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_persistent_oauth_patch.py"
      - "aiTemp/secure-auto-approval-persistent-auth/check_persistent_oauth_state.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_generated_source_hygiene.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_release_version.py"
      - "aiTemp/secure-auto-approval-persistent-auth/release_version.txt"
      - ".github/workflows/apply-secure-approval.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-request.yml"
      - ".github/workflows/secure-release-validation.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "src-tauri/**"
  pull_request:
    branches:
      - feature/secure-auto-approval-persistent-auth
      - integration/xyTom-v0.3.0
    paths:
      - "aiTemp/secure-auto-approval-persistent-auth/**"
      - ".github/workflows/apply-secure-approval.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-request.yml"
      - ".github/workflows/secure-release-validation.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "src-tauri/**"

permissions:
  contents: read

concurrency:
  group: materialize-secure-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-secure-release

jobs:
  validate-secure-release-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-27
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: secure-release-linux

      - name: Apply secure source and synchronized release version
        run: |
          python aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch_v3.py
          python aiTemp/secure-auto-approval-persistent-auth/apply_persistent_store_patch.py
          if python aiTemp/secure-auto-approval-persistent-auth/check_persistent_oauth_state.py; then
            echo "Persistent OAuth source is already complete; generator safely skipped."
          else
            oauth_state=$?
            if [ "$oauth_state" -eq 10 ]; then
              python aiTemp/secure-auto-approval-persistent-auth/apply_persistent_oauth_patch.py
            else
              echo "Persistent OAuth source is partial or drifted; refusing unsafe reapplication."
              exit "$oauth_state"
            fi
          fi
          python aiTemp/secure-auto-approval-persistent-auth/apply_generated_source_hygiene.py
          python aiTemp/secure-auto-approval-persistent-auth/apply_release_version.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

          if git diff --name-status | grep -q '^D'; then
            echo "Refusing to continue because an applicator deleted a tracked file."
            exit 1
          fi

          unexpected="$(git diff --name-only | grep -Ev '^(package\.json|package-lock\.json|src/|src-tauri/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Refusing unexpected generated-source changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          python aiTemp/secure-auto-approval-persistent-auth/apply_release_version.py --check
          python aiTemp/secure-auto-approval-persistent-auth/check_persistent_oauth_state.py

      - name: Test scoped approval and elevation interception
        working-directory: src-tauri
        run: |
          cargo test --locked tools::approval -- --nocapture
          cargo test --locked elevation_requests_are_always_blocked -- --nocapture

      - name: Test protected deletion boundaries
        working-directory: src-tauri
        run: |
          cargo test --locked --test call_tool_security apply_patch_allows_deleting_a_normal_file -- --nocapture
          cargo test --locked --test call_tool_security deleting_readme_requires_explicit_confirmation -- --nocapture
          cargo test --locked --test call_tool_security deleting_git_assets_is_always_rejected -- --nocapture

      - name: Test persistent OAuth rotation and recovery
        working-directory: src-tauri
        run: |
          cargo test --locked auth::refresh_tokens -- --nocapture
          cargo test --locked auth::oauth_flow::tests -- --nocapture
          cargo test --locked data::store::tests -- --nocapture

      - name: Run complete Rust tests and Clippy
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run frontend checks and build
        run: |
          mkdir -p aiTemp/npm-cache
          npm ci --cache aiTemp/npm-cache
          npm run check
          npm run build
          node --test

  commit-materialized-source:
    if: github.event_name == 'push'
    needs: validate-secure-release-source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reproduce the validated materialization
        run: |
          python aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch_v3.py
          python aiTemp/secure-auto-approval-persistent-auth/apply_persistent_store_patch.py
          if python aiTemp/secure-auto-approval-persistent-auth/check_persistent_oauth_state.py; then
            echo "Persistent OAuth source is already complete; generator safely skipped."
          else
            oauth_state=$?
            if [ "$oauth_state" -eq 10 ]; then
              python aiTemp/secure-auto-approval-persistent-auth/apply_persistent_oauth_patch.py
            else
              exit "$oauth_state"
            fi
          fi
          python aiTemp/secure-auto-approval-persistent-auth/apply_generated_source_hygiene.py
          python aiTemp/secure-auto-approval-persistent-auth/apply_release_version.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

          if git diff --name-status | grep -q '^D'; then
            echo "Refusing to commit a deletion."
            exit 1
          fi

          unexpected="$(git diff --name-only | grep -Ev '^(package\.json|package-lock\.json|src/|src-tauri/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Refusing unexpected generated-source changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit verified secure release source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json src-tauri src

          if git diff --cached --quiet; then
            echo "Verified secure release source is already committed."
            exit 0
          fi
          if git diff --cached --name-status | grep -q '^D'; then
            echo "Refusing to commit a deletion."
            exit 1
          fi

          git commit -m "feat: materialize secure v0.3.0-rc1 release source"
          expected_remote="$GITHUB_SHA"
          for attempt in 1 2 3; do
            remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
            if [ -z "$remote_sha" ]; then
              echo "Unable to resolve the remote branch head."
              exit 1
            fi
            if [ "$remote_sha" != "$expected_remote" ]; then
              echo "Branch advanced after validation; a new workflow run must validate the new head."
              exit 1
            fi
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "Unable to write verified source after three non-destructive retries."
          exit 1
