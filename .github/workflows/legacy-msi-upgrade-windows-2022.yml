name: Legacy MSI upgrade Windows 2022 gate

on:
  push:
    branches:
      - fix/rc7-legacy-msi-upgrade-detection
    paths:
      - desktop-electron/build/installer.nsh
      - desktop-electron/scripts/create-legacy-msi-upgrade-fixture.ps1
      - desktop-electron/tests/legacy-msi-upgrade-contract.test.cjs
      - .github/workflows/legacy-msi-upgrade-windows-2022.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-msi-upgrade-windows-2022-${{ github.sha }}
  cancel-in-progress: true

jobs:
  execute-production-macro:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - name: Install NSIS compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --no-progress -y

      - name: Create the exact legacy MSI registration and harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'aiTemp\legacy-msi-upgrade-windows-2022\fixture'
          $trash = Join-Path $env:GITHUB_WORKSPACE 'aiTemp\Trash\legacy-msi-upgrade-windows-2022'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'aiTemp\legacy-msi-upgrade-windows-2022\evidence'
          $include = Join-Path $env:GITHUB_WORKSPACE 'desktop-electron\build\installer.nsh'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          & (Join-Path $env:GITHUB_WORKSPACE 'desktop-electron\scripts\create-legacy-msi-upgrade-fixture.ps1') `
            -RootPath $root `
            -TrashPath $trash `
            -InstallerIncludePath $include `
            | Tee-Object -FilePath (Join-Path $evidence 'fixture.txt')

          $searchRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS'),
            (Join-Path $env:ProgramFiles 'NSIS'),
            (Join-Path $env:ChocolateyInstall 'bin')
          ) | Where-Object { -not [String]::IsNullOrWhiteSpace($_) -and (Test-Path -LiteralPath $_) }
          $makensis = $searchRoots |
            ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter 'makensis.exe' -File -Recurse -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if ($null -eq $makensis) { throw 'makensis.exe was not found after installing NSIS' }

          $harness = Join-Path $root 'legacy-msi-upgrade-harness.nsi'
          & $makensis.FullName '/V4' $harness |
            Tee-Object -FilePath (Join-Path $evidence 'makensis.txt')
          if ($LASTEXITCODE -ne 0) { throw "makensis.exe failed with exit code $LASTEXITCODE" }

      - name: Execute production customInit and verify removal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'aiTemp\legacy-msi-upgrade-windows-2022\fixture'
          $trash = Join-Path $env:GITHUB_WORKSPACE 'aiTemp\Trash\legacy-msi-upgrade-windows-2022'
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE 'aiTemp\legacy-msi-upgrade-windows-2022\evidence'
          $marker = Join-Path $root 'legacy-msiexec-ran.txt'
          $payload = Join-Path $root 'legacy-msi-payload.bin'
          $retainedPayload = Join-Path $trash 'legacy-msi-payload.bin'
          $env:CODING_TOOLS_LEGACY_MSI_MARKER = $marker
          $env:CODING_TOOLS_LEGACY_MSI_PAYLOAD = $payload
          $env:CODING_TOOLS_LEGACY_MSI_RETAINED_PAYLOAD = $retainedPayload

          $harness = Join-Path $root 'legacy-msi-upgrade-harness.exe'
          $process = Start-Process -FilePath $harness -ArgumentList '/S' -Wait -PassThru
          $markerText = if (Test-Path -LiteralPath $marker) {
            Get-Content -LiteralPath $marker -Raw
          } else {
            '<missing>'
          }

          $baseKey = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
            [Microsoft.Win32.RegistryHive]::CurrentUser,
            [Microsoft.Win32.RegistryView]::Registry64
          )
          try {
            $remaining = $baseKey.OpenSubKey('Software\Microsoft\Windows\CurrentVersion\Uninstall\{11111111-2222-3333-4444-555555555555}')
            $registryRemaining = $null -ne $remaining
            if ($null -ne $remaining) { $remaining.Dispose() }
          }
          finally {
            $baseKey.Dispose()
          }

          $record = [ordered]@{
            sourceSha = $env:GITHUB_SHA
            harnessExitCode = $process.ExitCode
            marker = $markerText.Trim()
            oldPayloadExists = Test-Path -LiteralPath $payload
            retainedPayloadExists = Test-Path -LiteralPath $retainedPayload
            registryRemaining = $registryRemaining
          }
          $record | ConvertTo-Json -Depth 3 |
            Set-Content -LiteralPath (Join-Path $evidenceRoot 'windows-harness.json') -Encoding UTF8

          if ($process.ExitCode -ne 0) { throw "migration harness failed with exit code $($process.ExitCode); marker=$markerText" }
          if ($markerText -notmatch 'LEGACY_MSIEXEC_RAN') { throw "legacy MSI executable did not run correctly: $markerText" }
          if ($markerText -notmatch '/x' -or $markerText -notmatch '/qn' -or $markerText -notmatch '/norestart') {
            throw "legacy MSI arguments were incomplete: $markerText"
          }
          if (Test-Path -LiteralPath $payload) { throw 'legacy MSI payload remains in the old location' }
          if (-not (Test-Path -LiteralPath $retainedPayload)) { throw 'legacy MSI payload was not preserved under aiTemp/Trash' }
          if ($registryRemaining) { throw 'legacy MSI registry registration remains after migration' }

      - name: Enforce exact-source and no-delete evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          test -s aiTemp/legacy-msi-upgrade-windows-2022/evidence/windows-harness.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: legacy-msi-upgrade-windows-2022-${{ github.sha }}
          path: aiTemp/legacy-msi-upgrade-windows-2022/
          if-no-files-found: error
          retention-days: 14
