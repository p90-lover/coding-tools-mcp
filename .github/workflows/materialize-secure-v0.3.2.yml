name: Materialize secure v0.3.2 port

on:
  push:
    branches:
      - security/secure-v0.3.2-port
    paths:
      - "aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch_v3.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_persistent_store_patch.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_persistent_oauth_patch.py"
      - "aiTemp/secure-auto-approval-persistent-auth/check_persistent_oauth_state.py"
      - "aiTemp/secure-auto-approval-persistent-auth/apply_generated_source_hygiene.py"
      - ".github/workflows/materialize-secure-v0.3.2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-secure-v0.3.2-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-secure-v0.3.2

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/secure-v0.3.2-port
          fetch-depth: 0

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: secure-v0.3.2-port-linux

      - name: Apply reviewed security source without deleting files
        shell: bash
        run: |
          set -euo pipefail
          python aiTemp/secure-auto-approval-persistent-auth/apply_approval_patch_v3.py
          python aiTemp/secure-auto-approval-persistent-auth/apply_persistent_store_patch.py
          if python aiTemp/secure-auto-approval-persistent-auth/check_persistent_oauth_state.py; then
            echo "Persistent OAuth source is already complete; generator safely skipped."
          else
            oauth_state=$?
            if [ "$oauth_state" -eq 10 ]; then
              python aiTemp/secure-auto-approval-persistent-auth/apply_persistent_oauth_patch.py
            else
              echo "Persistent OAuth source is partial or drifted; refusing unsafe reapplication."
              exit "$oauth_state"
            fi
          fi
          python aiTemp/secure-auto-approval-persistent-auth/apply_generated_source_hygiene.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check
          if git diff --name-status | grep -q '^D'; then
            echo "Refusing to continue because the port deleted a file."
            exit 1
          fi

      - name: Preserve the current v0.3.1 release baseline
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          tauri = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          cargo = tomllib.loads(Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"))
          expected = "0.3.1"
          actual = {
              "package.json": package.get("version"),
              "src-tauri/tauri.conf.json": tauri.get("version"),
              "src-tauri/Cargo.toml": cargo.get("package", {}).get("version"),
          }
          mismatches = {path: version for path, version in actual.items() if version != expected}
          if mismatches:
              raise SystemExit(f"security port changed the v0.3.1 baseline: {mismatches}")
          print("v0.3.1 baseline preserved")
          PY

      - name: Test scoped approval and elevation interception
        working-directory: src-tauri
        run: |
          cargo test --locked tools::approval -- --nocapture
          cargo test --locked elevation_requests_are_always_blocked -- --nocapture

      - name: Test protected deletion boundaries
        working-directory: src-tauri
        run: |
          cargo test --locked --test call_tool_security apply_patch_allows_deleting_a_normal_file -- --nocapture
          cargo test --locked --test call_tool_security deleting_readme_requires_explicit_confirmation -- --nocapture
          cargo test --locked --test call_tool_security deleting_git_assets_is_always_rejected -- --nocapture

      - name: Test persistent OAuth rotation and recovery
        working-directory: src-tauri
        run: |
          cargo test --locked auth::refresh_tokens -- --nocapture
          cargo test --locked auth::oauth_flow::tests -- --nocapture
          cargo test --locked data::store::tests -- --nocapture

      - name: Run complete Rust tests and strict Clippy
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run frontend checks and build
        run: |
          mkdir -p aiTemp/npm-cache
          npm ci --cache aiTemp/npm-cache
          npm run check
          npm run build
          node --test tests/*.test.mjs

      - name: Commit verified source without deleting files or branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src-tauri src
          if git diff --cached --quiet; then
            echo "Secure v0.3.2 source is already materialized."
            exit 0
          fi
          if git diff --cached --name-status | grep -q '^D'; then
            echo "Refusing to commit a deletion."
            exit 1
          fi
          git commit -m "feat: port secure approval and persistent authentication to v0.3.1"

          for attempt in 1 2 3; do
            git fetch origin security/secure-v0.3.2-port
            if git rebase origin/security/secure-v0.3.2-port && \
               git push origin HEAD:security/secure-v0.3.2-port; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done

          echo "Unable to publish the verified source after three non-destructive retries."
          exit 1
