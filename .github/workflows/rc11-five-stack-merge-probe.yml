name: rc.11 five-stack merge probe

on:
  push:
    branches:
      - integration/v0.7.0-rc.11-five-stack-final
    paths:
      - 'aiTemp/rc11-integration/probe-merge.sh'
      - '.github/workflows/rc11-five-stack-merge-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc11-five-stack-merge-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_BRANCH: cursor/rc11-five-stack-integrate-657e
  SOURCE_HEAD: 84a86be2dcf2baece276904fecc18dc650f62cd5

jobs:
  probe:
    name: Probe exact merge conflicts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - name: Prepare retained integration evidence
        run: mkdir -p aiTemp/rc11-integration/evidence aiTemp/Trash/rc11-integration

      - name: Probe exact-head merge
        shell: bash
        run: bash aiTemp/rc11-integration/probe-merge.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc11-five-stack-merge-probe-${{ github.sha }}
          path: aiTemp/rc11-integration/evidence/
          if-no-files-found: error
          retention-days: 14
