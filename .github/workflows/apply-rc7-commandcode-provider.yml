name: Apply rc.7 CommandCode Provider Center

on:
  push:
    branches:
      - integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater
    paths:
      - 'aiTemp/rc7-commandcode/apply_commandcode.py'
      - 'aiTemp/rc7-commandcode/fix_materializer.py'
      - '.github/workflows/apply-rc7-commandcode-provider.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rc7-commandcode-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/rc7-commandcode/bun-cache

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater
          fetch-depth: 0
          clean: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Prepare retained temporary directories
        run: mkdir -p aiTemp/rc7-commandcode/evidence aiTemp/Trash/rc7-commandcode

      - name: Repair and apply guarded Provider Center patch
        run: |
          python aiTemp/rc7-commandcode/fix_materializer.py \
            | tee aiTemp/rc7-commandcode/evidence/materializer-repair.txt
          grep -E 'RC7_COMMANDCODE_MATERIALIZER_(FIXED|ALREADY_FIXED)' \
            aiTemp/rc7-commandcode/evidence/materializer-repair.txt
          python aiTemp/rc7-commandcode/apply_commandcode.py \
            | tee aiTemp/rc7-commandcode/evidence/materializer.txt
          grep -F RC7_COMMANDCODE_PATCH_APPLIED \
            aiTemp/rc7-commandcode/evidence/materializer.txt

      - name: Validate bounded source changes
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          git diff --name-only | tee aiTemp/rc7-commandcode/evidence/changed-files.txt
          allowed='^(desktop-electron/electron/(provider-network|provider-bootstrap|preload)\.cjs|desktop-electron/src/(types\.ts|providers/provider-types\.ts|features/ProviderHubSaasSurface\.tsx|features/provider-hub-saas\.css)|aiTemp/rc7-commandcode/apply_commandcode\.py)$'
          unexpected="$(grep -Ev "$allowed" aiTemp/rc7-commandcode/evidence/changed-files.txt || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected CommandCode integration paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Validate runtime syntax
        run: |
          node --check desktop-electron/electron/provider-network.cjs
          node --check desktop-electron/electron/provider-bootstrap.cjs
          node --check desktop-electron/electron/preload.cjs

      - name: Install exact Electron dependencies
        run: bun install --cwd desktop-electron --frozen-lockfile

      - name: Run focused Provider Center contracts
        run: |
          node --test \
            desktop-electron/tests/commandcode-provider-session.test.cjs \
            desktop-electron/tests/provider-console-saas.test.cjs \
            desktop-electron/tests/provider-center-account-wiring.test.cjs \
            desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs \
            desktop-electron/tests/provider-execution-router.test.cjs
          node --test \
            --test-name-pattern='Provider Center account creation|CommandCode Proxy supports' \
            desktop-electron/tests/rc7-full-integration-contract.test.cjs

      - name: Typecheck and build production renderer
        run: |
          set -euo pipefail
          bun run --cwd desktop-electron typecheck
          original=""
          if [ -d desktop-electron/dist ]; then
            original="aiTemp/Trash/rc7-commandcode/original-dist-$GITHUB_RUN_ID"
            mv desktop-electron/dist "$original"
          fi
          restore() {
            if [ -d desktop-electron/dist ]; then
              mv desktop-electron/dist "aiTemp/Trash/rc7-commandcode/validated-dist-$GITHUB_RUN_ID"
            fi
            if [ -n "$original" ] && [ -d "$original" ]; then
              mv "$original" desktop-electron/dist
            fi
          }
          trap restore EXIT
          bun run --cwd desktop-electron build:renderer
          node --test desktop-electron/tests/renderer-provider-bundle.test.cjs
          restore
          trap - EXIT

      - name: Commit verified Provider Center implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            aiTemp/rc7-commandcode/apply_commandcode.py \
            desktop-electron/electron/provider-network.cjs \
            desktop-electron/electron/provider-bootstrap.cjs \
            desktop-electron/electron/preload.cjs \
            desktop-electron/src/providers/provider-types.ts \
            desktop-electron/src/types.ts \
            desktop-electron/src/features/ProviderHubSaasSurface.tsx \
            desktop-electron/src/features/provider-hub-saas.css
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'CommandCode Provider Center implementation already committed.'
            exit 0
          fi
          git commit -m 'fix(rc7): add CommandCode OAuth and unblock provider accounts'
          git push origin HEAD:integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater

      - name: Preserve transient dependencies in Trash
        if: always()
        run: |
          mkdir -p aiTemp/Trash/rc7-commandcode
          if [ -d desktop-electron/node_modules ]; then
            mv desktop-electron/node_modules "aiTemp/Trash/rc7-commandcode/node_modules-$GITHUB_RUN_ID"
          fi
