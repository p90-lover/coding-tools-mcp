name: Import pinned ChatGPT Web harness source
on:
  push:
    branches: [feature/electron-full-codex-harness-0.6.0]
    paths:
      - .github/workflows/electron-vendor-import.yml
      - scripts/import-codex-chatgpt-web.mjs
      - scripts/verify-vendored-upstream.mjs
      - scripts/lib/upstream-manifest.mjs
      - tests/upstream-manifest.test.mjs
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: electron-vendor-import-v506
  cancel-in-progress: false
jobs:
  import:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {contents: write}
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: miuuyy/codex-chatgpt-web
          ref: e85e3693fdb4e3e033348c08df0298c20fcdb612
          path: aiTemp/vendor-import/upstream
          fetch-depth: 1
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - name: Materialize the exact source and retain any prior snapshot
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          node scripts/import-codex-chatgpt-web.mjs \
            --source ../vendor-import/upstream \
            --destination vendor/codex-chatgpt-web-v5.0.6 \
            2>&1 | tee aiTemp/evidence/import.txt
      - name: Verify manifest license tunnel pin and mutation rejection
        run: |
          set -euo pipefail
          node scripts/verify-vendored-upstream.mjs 2>&1 | tee aiTemp/evidence/verify.txt
          node --test tests/upstream-manifest.test.mjs 2>&1 | tee aiTemp/evidence/tests.txt
          grep -F UPSTREAM_VENDOR_PASS aiTemp/evidence/verify.txt
          grep -F '# fail 0' aiTemp/evidence/tests.txt
      - name: Record the verified snapshot on the feature branch only
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME --jq .object.sha)" = "$GITHUB_SHA"
          git add -- vendor/codex-chatgpt-web-v5.0.6 third_party
          if test -d Trash/vendor-import; then git add -- Trash/vendor-import; fi
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'build: vendor verified codex-chatgpt-web v5.0.6 source'
            gh auth setup-git
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          git rev-parse HEAD > aiTemp/evidence/source.commit
          git diff --stat "${GITHUB_SHA}" HEAD > aiTemp/evidence/materialized-stat.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: electron-vendor-${{ github.run_id }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
