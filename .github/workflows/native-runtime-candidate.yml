name: Native runtime bridge candidate
on:
  push:
    branches: [feature/native-runtime-0.4.2-rc.1]
    paths: [aiTemp/native-runtime-delivery/candidate-01.json.xz.b64, .github/workflows/native-runtime-candidate.yml]
permissions:
  contents: read
concurrency:
  group: native-runtime-candidate
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Materialize exact candidate source without deleting files
        id: source
        env:
          PAYLOAD_SHA256: ff17eb4bbfd24cee99215f7642a3272860dce2baa4a928a6cba06fb6b85f2c48
          PYTHONDONTWRITEBYTECODE: 1
          CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/target
        run: |
          python - <<'PYCODE'
          import base64,hashlib,json,lzma,os,subprocess
          from pathlib import Path
          raw=Path('aiTemp/native-runtime-delivery/candidate-01.json.xz.b64').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==os.environ['PAYLOAD_SHA256']
          spec=json.loads(lzma.decompress(base64.b64decode(raw)))
          assert subprocess.check_output(['git','rev-parse','HEAD^^'],text=True).strip()==spec['base']
          for name,content in spec['files'].items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts and name.startswith(('src-tauri/src/codex_runtime/','native-helpers/codex-runtime-diagnostic/'))
              assert not p.exists(), 'Refuse to overwrite a candidate from another edit'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content,encoding='utf-8')
          subprocess.run(['rustfmt','--edition','2021','native-helpers/codex-runtime-diagnostic/src/main.rs'],check=True)
          subprocess.run(['cargo','generate-lockfile','--manifest-path','native-helpers/codex-runtime-diagnostic/Cargo.toml'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*spec['files'],'native-helpers/codex-runtime-diagnostic/Cargo.lock'],check=True)
          subprocess.run(['git','commit','-m','feat: materialize opt-in native App Server bridge candidate'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feature/native-runtime-0.4.2-rc.1'],check=True)
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('source='+source+'\n')
          PYCODE
  diagnostic:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
            binary: codex-runtime-diagnostic
          - os: windows-latest
            label: windows-x64
            binary: codex-runtime-diagnostic.exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
      - name: Build diagnostic from the exact production bridge module
        run: cargo build --locked --release --manifest-path native-helpers/codex-runtime-diagnostic/Cargo.toml
      - name: Preserve source identity and compiler output
        shell: bash
        run: |
          mkdir -p aiTemp/delivery
          git rev-parse HEAD > aiTemp/delivery/source-sha.txt
          cp "aiTemp/target/release/${{ matrix.binary }}" aiTemp/delivery/
          git archive --format=zip -o aiTemp/delivery/source.zip HEAD src-tauri/src/codex_runtime native-helpers/codex-runtime-diagnostic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-bridge-${{ matrix.label }}-${{ github.run_id }}
          path: aiTemp/delivery/*
          if-no-files-found: error
          retention-days: 14
