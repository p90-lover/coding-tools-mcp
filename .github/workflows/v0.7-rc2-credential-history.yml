name: v0.7 rc.2 credential history

on:
  push:
    branches:
      - fix/v0.7-rc2-credential-history-fixture
    paths:
      - scripts/release/scan_credential_history.py
      - tests/test_release_credential_history_scan.py
      - .github/workflows/v0.7-rc2-credential-history.yml
  pull_request:
    branches:
      - integration/v0.7.0-rc.2-all-project-work
    paths:
      - scripts/release/scan_credential_history.py
      - tests/test_release_credential_history_scan.py
      - .github/workflows/v0.7-rc2-credential-history.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0.7-rc2-credential-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Reachable-history credential scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - name: Fetch every reachable branch and tag
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' --force --prune

      - name: Run exact allowlist unit contracts
        run: |
          set -euo pipefail
          mkdir -p aiTemp/v0.7-rc2-credential-history
          python3 -m unittest tests/test_release_credential_history_scan.py -v \
            2>&1 | tee aiTemp/v0.7-rc2-credential-history/unit-results.txt

      - name: Scan all reachable Git history without emitting matched secret bytes
        run: |
          set -euo pipefail
          python3 scripts/release/scan_credential_history.py \
            --repo-root . \
            --output aiTemp/v0.7-rc2-credential-history/report.json \
            2>&1 | tee aiTemp/v0.7-rc2-credential-history/scan-results.txt

      - name: Enforce no-delete integration diff
        run: |
          set -euo pipefail
          git fetch origin integration/v0.7.0-rc.2-all-project-work --no-tags
          git diff --check origin/integration/v0.7.0-rc.2-all-project-work...HEAD
          test -z "$(git diff --diff-filter=D --name-only origin/integration/v0.7.0-rc.2-all-project-work...HEAD)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v0.7-rc2-credential-history-${{ github.sha }}
          path: aiTemp/v0.7-rc2-credential-history/
          if-no-files-found: error
          retention-days: 14
