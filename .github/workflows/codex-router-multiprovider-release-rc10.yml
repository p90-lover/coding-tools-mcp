# Exact-source Windows publish for the next version after frozen v0.7.0-rc.8 and v0.7.0-rc.9.
name: Coding Tools v0.7.0-rc.10 exact-source Windows release

on:
  push:
    branches:
      - release/codex-router-multiprovider-0.7.0-rc.8
    paths:
      - .github/workflows/codex-router-multiprovider-release-rc10.yml
      - aiTemp/rc10-release/run-windows-release.mjs
      - aiTemp/rc10-release/verify-windows-migration.ps1
      - desktop-electron/**
      - runtime-web/**
      - rust-core/**
      - scripts/release/**
      - docs/releases/v0.7.0-rc.10.md
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: coding-tools-v0.7.0-rc.10-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: 0.7.0-rc.10
  RELEASE_TAG: v0.7.0-rc.10
  NODE_VERSION: '22'
  BUN_VERSION: 1.4.0
  RUST_TOOLCHAIN: 1.98.1
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  release-windows:
    name: Verify five-stack, package, migrate, and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Validate exact release runners
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check aiTemp/rc10-release/run-windows-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Node rc.10 release runner syntax validation failed' }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'aiTemp\rc10-release\verify-windows-migration.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw 'PowerShell rc.10 migration runner syntax validation failed'
          }

      - name: Run exact-source five-stack release pipeline
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          node aiTemp/rc10-release/run-windows-release.mjs
          if ($LASTEXITCODE -ne 0) { throw "rc.10 release runner failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coding-tools-v0.7.0-rc.10-evidence-${{ github.sha }}
          path: |
            aiTemp/evidence/
            aiTemp/release-assets/
          if-no-files-found: warn
          retention-days: 14
