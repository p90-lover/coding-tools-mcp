name: Verified Electron desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Electron version tag reachable from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: electron-desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.identity.outputs.source }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - id: identity
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          version="${TAG#v}"
          source="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$source" origin/main
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('desktop-electron/package.json', 'utf8'));
          const expected = process.env.TAG.slice(1);
          if (pkg.version !== expected) throw new Error(`desktop-electron version ${pkg.version} != tag ${expected}`);
          if (pkg.build?.appId !== 'dev.codingtools.fullharness') {
            throw new Error(`unexpected Electron appId: ${pkg.build?.appId || '<missing>'}`);
          }
          NODE
          node scripts/verify-oauth-release-contract.mjs \
            --expected-version "$version" \
            --expected-app-id dev.codingtools.fullharness
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  native:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            package_script: package:win
            assets: desktop-electron/artifacts/*.exe
          - os: macos-14
            platform: macos
            package_script: package:mac
            assets: |
              desktop-electron/artifacts/*.dmg
              desktop-electron/artifacts/*-mac-*.zip
          - os: ubuntu-24.04
            platform: linux
            package_script: package:linux
            assets: desktop-electron/artifacts/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/bun-cache
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      TMPDIR: ${{ github.workspace }}/aiTemp/system-tmp
      TMP: ${{ github.workspace }}/aiTemp/system-tmp
      TEMP: ${{ github.workspace }}/aiTemp/system-tmp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.identity.outputs.source }}
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Prepare preserved temp roots
        shell: bash
        run: mkdir -p aiTemp/system-tmp aiTemp/release-evidence
      - name: Install Bun
        shell: bash
        run: npm install --global bun@1.2.22
      - name: Install Linux package prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Install Electron launcher dependencies
        shell: bash
        working-directory: desktop-electron
        run: bun install --frozen-lockfile
      - name: Verify Electron release identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/verify-oauth-release-contract.mjs \
            --expected-version "$RELEASE_VERSION" \
            --expected-app-id dev.codingtools.fullharness \
            --json | tee aiTemp/release-evidence/oauth-release-contract.json
      - name: Run Electron launcher tests
        shell: bash
        working-directory: desktop-electron
        run: |
          set -euo pipefail
          bun run typecheck 2>&1 | tee ../aiTemp/release-evidence/typecheck-${{ matrix.platform }}.txt
          bun run test 2>&1 | tee ../aiTemp/release-evidence/tests-${{ matrix.platform }}.txt
      - name: Build native Electron package
        shell: bash
        working-directory: desktop-electron
        run: |
          set -euo pipefail
          bun run ${{ matrix.package_script }} 2>&1 | tee ../aiTemp/release-evidence/package-${{ matrix.platform }}.txt
      - name: Smoke packaged launcher
        shell: bash
        working-directory: desktop-electron
        run: |
          set -euo pipefail
          bun run smoke:package 2>&1 | tee ../aiTemp/release-evidence/smoke-${{ matrix.platform }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: electron-${{ matrix.platform }}-${{ needs.identity.outputs.source }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 14
      - name: Preserve release validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: electron-evidence-${{ matrix.platform }}-${{ needs.identity.outputs.source }}
          path: |
            aiTemp/release-evidence/
            aiTemp/Trash/
          if-no-files-found: warn
          retention-days: 14

  audit:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.identity.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install Bun
        shell: bash
        run: npm install --global bun@1.2.22
      - name: Audit Electron dependency lock
        shell: bash
        working-directory: desktop-electron
        run: |
          set -euo pipefail
          mkdir -p ../aiTemp/audit-evidence
          bun install --frozen-lockfile
          bun audit 2>&1 | tee ../aiTemp/audit-evidence/bun-audit.txt
      - name: Screen reachable Git history for credential patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/audit-evidence
          python - <<'PY' > aiTemp/audit-evidence/credential-screen.json
          import json, re, subprocess, sys
          patterns = {
              'github-token': rb'\bgh[pousr]_[A-Za-z0-9]{36,255}\b',
              'github-fine-grained-token': rb'\bgithub_pat_[A-Za-z0-9_]{70,255}\b',
              'private-key-material': rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----\s+[A-Za-z0-9+/=\r\n]{100,}-----END (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
              'aws-access-key': rb'\bAKIA[A-Z0-9]{16}\b',
              'openai-key': rb'\bsk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{40,255}\b',
          }
          patterns={key:re.compile(value) for key,value in patterns.items()}
          lines=subprocess.check_output(['git','rev-list','--objects','--all']).splitlines()
          objects=list(dict.fromkeys(line.split(b' ',1)[0] for line in lines))
          process=subprocess.Popen(['git','cat-file','--batch'],stdin=subprocess.PIPE,stdout=subprocess.PIPE)
          findings=[];blobs=0
          for oid in objects:
              process.stdin.write(oid+b'\n');process.stdin.flush()
              header=process.stdout.readline().split()
              if len(header)!=3: raise RuntimeError('Git object could not be read')
              size=int(header[2]);content=process.stdout.read(size)
              if len(content)!=size or process.stdout.read(1)!=b'\n': raise RuntimeError('Incomplete Git object')
              if header[1]!=b'blob':continue
              blobs+=1
              for name,pattern in patterns.items():
                  if pattern.search(content): findings.append({'blob':oid.decode(),'kind':name})
          process.stdin.close()
          if process.wait()!=0:raise RuntimeError('Git object scan failed')
          print(json.dumps({'objects_scanned':len(objects),'blobs_scanned':blobs,'findings':findings},indent=2))
          sys.exit(1 if findings else 0)
          PY
          cat aiTemp/audit-evidence/credential-screen.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: electron-audit-${{ needs.identity.outputs.source }}
          path: aiTemp/audit-evidence/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [identity, native, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.identity.outputs.source }}
          persist-credentials: false
          clean: false
      - name: Publish verified Electron artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identity.outputs.tag }}
          SOURCE: ${{ needs.identity.outputs.source }}
          PRERELEASE: ${{ needs.identity.outputs.prerelease }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/release-assets aiTemp/release-meta
          gh run download "$GITHUB_RUN_ID" -n "electron-windows-$SOURCE" -D aiTemp/release-assets/windows
          gh run download "$GITHUB_RUN_ID" -n "electron-macos-$SOURCE" -D aiTemp/release-assets/macos
          gh run download "$GITHUB_RUN_ID" -n "electron-linux-$SOURCE" -D aiTemp/release-assets/linux
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE"
          python - <<'PY'
          import hashlib, pathlib
          root=pathlib.Path('aiTemp/release-assets')
          files=sorted(p for p in root.rglob('*') if p.is_file())
          assert any(p.suffix.lower()=='.exe' for p in files), 'missing Windows EXE'
          assert any(p.suffix.lower()=='.dmg' for p in files), 'missing macOS DMG'
          assert any(p.suffix.lower()=='.appimage' for p in files), 'missing Linux AppImage'
          assert all(p.stat().st_size > 100000 for p in files), 'release artifact unexpectedly small'
          sums=root/'SHA256SUMS.txt'
          sums.write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
          mapfile -t assets < <(find aiTemp/release-assets -type f -not -name SHA256SUMS.txt -print)
          assets+=(aiTemp/release-assets/SHA256SUMS.txt)
          flags=(--verify-tag --title "Coding Tools $TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            gh release create "$TAG" "${flags[@]}" "${assets[@]}"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > aiTemp/release-meta/by-tag.json
          python - <<'PY'
          import json, os, pathlib
          release=json.loads(pathlib.Path('aiTemp/release-meta/by-tag.json').read_text())
          names={a['name'] for a in release['assets']}
          assert release['tag_name']==os.environ['TAG']
          assert release['draft'] is False and release['published_at']
          assert 'SHA256SUMS.txt' in names
          assert any(name.lower().endswith('.exe') for name in names)
          assert any(name.lower().endswith('.dmg') for name in names)
          assert any(name.lower().endswith('.appimage') for name in names)
          assert release['prerelease'] is (os.environ['PRERELEASE']=='true')
          PY
