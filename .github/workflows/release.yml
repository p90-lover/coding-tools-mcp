name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.3.0-rc1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate synchronized versions and release tag
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG'].strip()
          if not re.fullmatch(r'v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?', tag):
              raise SystemExit(f'invalid release tag: {tag!r}')
          version = tag[1:]

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          package_lock = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))
          tauri = json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          cargo_toml = Path('src-tauri/Cargo.toml').read_text(encoding='utf-8')
          cargo_lock = Path('src-tauri/Cargo.lock').read_text(encoding='utf-8')

          observed = {
              'package.json': package.get('version'),
              'package-lock.json': package_lock.get('version'),
              'package-lock root': package_lock.get('packages', {}).get('', {}).get('version'),
              'tauri.conf.json': tauri.get('version'),
          }
          failures = {name: value for name, value in observed.items() if value != version}
          expected = f'name = "coding-tools-mcp-desktop"\nversion = "{version}"'
          if expected not in cargo_toml:
              failures['Cargo.toml'] = 'mismatch'
          if expected not in cargo_lock:
              failures['Cargo.lock'] = 'mismatch'
          if failures:
              raise SystemExit(f'release version mismatch: {failures}')
          print(f'verified synchronized release version {version}')
          PY

  build-windows:
    needs: validate-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-windows

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path aiTemp/npm-cache | Out-Null
          npm ci --cache aiTemp/npm-cache

      - name: Run focused release checks
        run: |
          npm run check
          node --test tests/*.test.mjs

      - name: Run locked Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Create Windows SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          if ($files.Count -lt 1) { throw "Windows installer was not produced" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          New-Item -ItemType Directory -Force -Path aiTemp/release-checksums | Out-Null
          $lines | Set-Content -Encoding utf8 aiTemp/release-checksums/SHA256SUMS-windows.txt

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            aiTemp/release-checksums/SHA256SUMS-windows.txt
          if-no-files-found: error

  build-universal-macos:
    needs: validate-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-macos-universal

      - name: Install frontend dependencies
        run: |
          mkdir -p aiTemp/npm-cache
          npm ci --cache aiTemp/npm-cache

      - name: Run focused release checks
        run: |
          npm run check
          node --test tests/*.test.mjs

      - name: Run locked Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build universal macOS DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: Create macOS SHA-256 checksums
        run: |
          mkdir -p aiTemp/release-checksums
          shopt -s nullglob
          files=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#files[@]}" -lt 1 ]; then
            echo "macOS DMG was not produced"
            exit 1
          fi
          for file in "${files[@]}"; do
            shasum -a 256 "$file"
          done | sed 's#  .*/#  #' > aiTemp/release-checksums/SHA256SUMS-macos.txt

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            aiTemp/release-checksums/SHA256SUMS-macos.txt
          if-no-files-found: error

  publish-release:
    needs:
      - validate-release
      - build-windows
      - build-universal-macos
    runs-on: ubuntu-24.04
    steps:
      - name: Download Windows release files
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/windows

      - name: Download macOS release files
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist/macos

      - name: Verify release payload
        run: |
          find dist -type f -maxdepth 3 -print
          compgen -G 'dist/windows/*.exe' >/dev/null
          compgen -G 'dist/macos/*.dmg' >/dev/null

      - name: Create GitHub Release and upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Coding Tools MCP ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/windows/*.exe
            dist/windows/SHA256SUMS-windows.txt
            dist/macos/*.dmg
            dist/macos/SHA256SUMS-macos.txt
