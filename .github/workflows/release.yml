name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.3.0-rc1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-release

jobs:
  validate-release:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate owner, event, main ancestry, tag state, and synchronized versions
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "Only the repository owner may publish a desktop release."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual releases must run from the main branch."
              exit 1
            fi
            if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Manual release tag already exists: $RELEASE_TAG"
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]; then
              echo "Tag release context is inconsistent."
              exit 1
            fi
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Release tag does not resolve to the workflow commit."
              exit 1
            fi
          else
            echo "Unsupported release event: $GITHUB_EVENT_NAME"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit is not contained in main."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG'].strip()
          if not re.fullmatch(r'v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?', tag):
              raise SystemExit(f'invalid release tag: {tag!r}')
          version = tag[1:]

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          package_lock = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))
          tauri = json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          cargo_toml = Path('src-tauri/Cargo.toml').read_text(encoding='utf-8')
          cargo_lock = Path('src-tauri/Cargo.lock').read_text(encoding='utf-8')

          observed = {
              'package.json': package.get('version'),
              'package-lock.json': package_lock.get('version'),
              'package-lock root': package_lock.get('packages', {}).get('', {}).get('version'),
              'tauri.conf.json': tauri.get('version'),
          }
          failures = {name: value for name, value in observed.items() if value != version}
          expected = f'name = "coding-tools-mcp-desktop"\nversion = "{version}"'
          if expected not in cargo_toml:
              failures['Cargo.toml'] = 'mismatch'
          if expected not in cargo_lock:
              failures['Cargo.lock'] = 'mismatch'
          if failures:
              raise SystemExit(f'release version mismatch: {failures}')
          print(f'verified synchronized release version {version}')
          PY

      - name: Refuse accidental overwrite of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; create a new tag instead of overwriting assets."
            exit 1
          fi

  build-windows:
    needs: validate-release
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-27

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: release-windows

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path aiTemp/npm-cache | Out-Null
          npm ci --cache aiTemp/npm-cache

      - name: Run focused release checks
        run: |
          npm run check
          node --test tests/*.test.mjs

      - name: Run locked Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Stage Windows installer and SHA-256 checksum
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "$env:CARGO_TARGET_DIR/release/bundle/nsis/*.exe")
          if ($files.Count -lt 1) { throw "Windows installer was not produced" }
          $checksumDir = "aiTemp/release-checksums"
          $payloadDir = "aiTemp/release-payload/windows"
          New-Item -ItemType Directory -Force -Path $checksumDir, $payloadDir | Out-Null
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksum = Join-Path $checksumDir "SHA256SUMS-windows.txt"
          $lines | Set-Content -Encoding utf8 $checksum
          Copy-Item $files.FullName -Destination $payloadDir
          Copy-Item $checksum -Destination $payloadDir

      - name: Upload Windows release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: aiTemp/release-payload/windows/*
          if-no-files-found: error
          retention-days: 14

  build-universal-macos:
    needs: validate-release
    runs-on: macos-14
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-27
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: release-macos-universal

      - name: Install frontend dependencies
        run: |
          mkdir -p aiTemp/npm-cache
          npm ci --cache aiTemp/npm-cache

      - name: Run focused release checks
        run: |
          npm run check
          node --test tests/*.test.mjs

      - name: Run locked Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build universal macOS DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: Stage macOS DMG and SHA-256 checksum
        shell: bash
        run: |
          mkdir -p aiTemp/release-checksums aiTemp/release-payload/macos
          shopt -s nullglob
          files=("$CARGO_TARGET_DIR"/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#files[@]}" -lt 1 ]; then
            echo "macOS DMG was not produced"
            exit 1
          fi
          for file in "${files[@]}"; do
            shasum -a 256 "$file"
          done | sed 's#  .*/#  #' > aiTemp/release-checksums/SHA256SUMS-macos.txt
          cp "${files[@]}" aiTemp/release-payload/macos/
          cp aiTemp/release-checksums/SHA256SUMS-macos.txt aiTemp/release-payload/macos/

      - name: Upload macOS release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release-${{ github.sha }}
          path: aiTemp/release-payload/macos/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs:
      - validate-release
      - build-windows
      - build-universal-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download Windows release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: dist/windows

      - name: Download macOS release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release-${{ github.sha }}
          path: dist/macos

      - name: Verify release payload and checksums
        shell: bash
        run: |
          find dist -maxdepth 3 -type f -print
          compgen -G 'dist/windows/*.exe' >/dev/null
          compgen -G 'dist/macos/*.dmg' >/dev/null
          test -f dist/windows/SHA256SUMS-windows.txt
          test -f dist/macos/SHA256SUMS-macos.txt
          (cd dist/windows && sha256sum --check SHA256SUMS-windows.txt)
          (cd dist/macos && shasum -a 256 --check SHA256SUMS-macos.txt)

      - name: Create draft GitHub Release and upload all assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Coding Tools MCP $RELEASE_TAG" \
            --generate-notes \
            --draft \
            "${prerelease[@]}" \
            dist/windows/*.exe \
            dist/windows/SHA256SUMS-windows.txt \
            dist/macos/*.dmg \
            dist/macos/SHA256SUMS-macos.txt

      - name: Verify draft release assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p aiTemp/release-verification
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,assets \
            > aiTemp/release-verification/release.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(
              Path('aiTemp/release-verification/release.json').read_text(encoding='utf-8')
          )
          expected = {
              path.name
              for folder in (Path('dist/windows'), Path('dist/macos'))
              for path in folder.iterdir()
              if path.is_file()
          }
          actual = {asset['name'] for asset in metadata.get('assets', [])}
          failures = []
          if metadata.get('tagName') != os.environ['RELEASE_TAG']:
              failures.append('release tag mismatch')
          if metadata.get('isDraft') is not True:
              failures.append('release is not a draft')
          if actual != expected:
              failures.append(f'asset mismatch: expected={sorted(expected)} actual={sorted(actual)}')
          if not any(name.endswith('.exe') for name in actual):
              failures.append('missing Windows installer')
          if not any(name.endswith('.dmg') for name in actual):
              failures.append('missing macOS DMG')
          if failures:
              raise SystemExit('; '.join(failures))
          print(f'verified {len(actual)} draft release assets')
          PY

      - name: Publish the verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"
