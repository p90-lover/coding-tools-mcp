name: Verified desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag reachable from main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.identity.outputs.source }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - id: identity
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$source" origin/main
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  native:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: --bundles nsis
            assets: aiTemp/cargo-target/release/bundle/nsis/*.exe
          - os: macos-14
            platform: macos
            args: --target universal-apple-darwin --bundles dmg
            assets: aiTemp/cargo-target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PYTHONDONTWRITEBYTECODE: '1'
      XDG_CONFIG_HOME: ${{ github.workspace }}/aiTemp/test-config
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.identity.outputs.source }}
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          components: rustfmt,clippy
      - name: Frontend and version checks
        shell: bash
        env:
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, tomllib
          root = pathlib.Path.cwd()
          versions = [json.loads((root/p).read_text())['version'] for p in ['package.json','package-lock.json','src-tauri/tauri.conf.json']]
          manifest=tomllib.loads((root/'src-tauri/Cargo.toml').read_text())['package']
          versions.append(manifest['version'])
          lock=tomllib.loads((root/'src-tauri/Cargo.lock').read_text())
          versions.extend(p['version'] for p in lock['package'] if p['name']==manifest['name'])
          versions.append(json.loads((root/'package-lock.json').read_text())['packages']['']['version'])
          assert all('v'+v == os.environ['TAG'] for v in versions), versions
          PY
          npm ci
          npm run check
          node --test tests/*.test.mjs
          npm audit --audit-level=high
      - name: Native tests and strict Clippy
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build installer
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          npm run tauri -- build $BUILD_ARGS -- --locked
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-${{ matrix.platform }}-${{ needs.identity.outputs.source }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 14
  audit:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/audit-target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.identity.outputs.source }}
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Audit Rust dependencies against RustSec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/audit-evidence
          cargo install cargo-audit --locked --version 0.22.2 --root "$PWD/aiTemp/audit-tool"
          aiTemp/audit-tool/bin/cargo-audit audit --file src-tauri/Cargo.lock 2>&1 | tee aiTemp/audit-evidence/rustsec.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-${{ needs.identity.outputs.source }}
          path: aiTemp/audit-evidence/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [identity, native, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.identity.outputs.source }}
          persist-credentials: false
          clean: false
      - name: Publish only the verified tag and matching installer pair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identity.outputs.tag }}
          SOURCE: ${{ needs.identity.outputs.source }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/release-assets
          gh run download "$GITHUB_RUN_ID" -n "installer-windows-$SOURCE" -D aiTemp/release-assets
          gh run download "$GITHUB_RUN_ID" -n "installer-macos-$SOURCE" -D aiTemp/release-assets
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE"
          python - <<'PY'
          import hashlib, pathlib
          root=pathlib.Path('aiTemp/release-assets')
          files=sorted(root.iterdir())
          assert len(files)==2 and {p.suffix for p in files}=={'.exe','.dmg'}
          assert all(p.is_file() and p.stat().st_size > 100000 for p in files)
          (root/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
          test -f "docs/releases/$TAG.md"
          gh release create "$TAG" --verify-tag --draft --title "Coding Tools MCP $TAG" --notes-file "docs/releases/$TAG.md" aiTemp/release-assets/*
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > aiTemp/release-assets/uploaded.json
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('aiTemp/release-assets')
          actual={p['name']:p for p in json.loads((root/'uploaded.json').read_text())['assets']}
          expected=[p for p in root.iterdir() if p.name!='uploaded.json']
          assert set(actual)=={p.name for p in expected}
          assert all(actual[p.name]['size']==p.stat().st_size and actual[p.name]['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest() for p in expected)
          PY
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE"
          gh release edit "$TAG" --draft=false --latest
