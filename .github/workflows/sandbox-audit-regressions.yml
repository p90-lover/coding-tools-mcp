# TDD gate: this workflow first reproduces file-safety failures on unchanged production source.
name: File safety and native boundary regressions
on:
  push:
    branches: [fix/sandbox-audit-20260910]
    paths: ['.github/workflows/sandbox-audit-regressions.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandbox-audit-regressions
  cancel-in-progress: false
env:
  SOURCE: ${{ github.sha }}
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  file_red:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/file-audit-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      CODING_TOOLS_COMMAND_NATIVE_SHA256: 444a3f0008050605cae73cd9b7a2dcac61294062dfaab56dd20430fd6498518b
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Attach regression tests without changing implementation
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python - <<'PY'
          from pathlib import Path
          import shutil
          p=Path('src-tauri/src/tools/mod.rs')
          backup=Path('aiTemp/Trash/file-audit-before/mod.rs');backup.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,backup)
          with p.open('a') as f:
              f.write('\n#[cfg(test)]\n#[path="../../../aiTemp/sandbox-audit/file_regressions.rs"]\nmod audit_file_regressions;\n')
          PY
          npm ci > aiTemp/evidence/npm.txt 2>&1
          npm run build > aiTemp/evidence/frontend-build.txt 2>&1
      - name: Observe the three concrete failures on original implementation
        run: |
          set -euo pipefail
          set +e
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib audit_ -- --test-threads=1 --nocapture > aiTemp/evidence/file-red.txt 2>&1
          code=$?
          set -e
          tail -80 aiTemp/evidence/file-red.txt
          test "$code" -eq 101
          grep -F 'AUDIT_INTERNAL_LINK_ESCAPED' aiTemp/evidence/file-red.txt
          grep -F 'AUDIT_DIRECTORY_REPLACED' aiTemp/evidence/file-red.txt
          grep -F 'AUDIT_UNBOUNDED_READ' aiTemp/evidence/file-red.txt
          grep -F '0 passed; 3 failed' aiTemp/evidence/file-red.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: file-audit-red-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
  native_boundary:
    if: github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            native: codex-x86_64-pc-windows-msvc.exe.tar.gz
            child: boundary-child.exe
          - os: macos-15
            platform: macos-aarch64
            native: codex-aarch64-apple-darwin.tar.gz
            child: boundary-child
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/native-audit-target
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Prepare actual non-destructive boundary probe
        run: |
          set -euo pipefail
          python scripts/native_bridge_ci.py probe-init
          python - <<'PY'
          from pathlib import Path
          import shutil
          p=Path('src-tauri/src/codex_bridge/native_command.rs')
          backup=Path('aiTemp/Trash/native-audit-before/native_command.rs');backup.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,backup)
          with p.open('a') as f:
              f.write('\n#[cfg(test)]\n#[path="../../../aiTemp/sandbox-audit/native_boundary_fixture.rs"]\nmod audit_boundary_fixture;\n')
          PY
          rustc --edition 2021 aiTemp/sandbox-audit/boundary_child.rs -o aiTemp/${{ matrix.child }}
          echo "BOUNDARY_CHILD=$PWD/aiTemp/${{ matrix.child }}" >> "$GITHUB_ENV"
      - name: Verify official native binary without any provider credentials
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ASSET: ${{ matrix.native }}
        run: python scripts/native_bridge_ci.py download-native
      - name: Positive and negative OS boundaries with zero inference requests
        run: |
          set -euo pipefail
          export CODING_TOOLS_COMMAND_NATIVE_SHA256="$NATIVE_CODEX_PROBE_SHA256"
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml audit_native_readonly_network_timeout_and_no_model -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-boundary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-boundary-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
