name: Verify pinned full harness parity
on:
  push:
    branches: [feature/electron-full-codex-harness-0.6.0]
    paths:
      - .github/workflows/electron-upstream-parity.yml
      - desktop-electron/electron/**
      - desktop-electron/tests/**
      - desktop-electron/package.json
      - desktop-electron/bun.lock
      - runtime-web/package.json
      - runtime-web/bun.lock
      - runtime-web/launcher/package.json
      - runtime-web/launcher/bun.lock
      - runtime-web/scripts/**
      - runtime-web/src/**
      - runtime-web/tests/**
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: electron-upstream-parity-v506
  cancel-in-progress: false
jobs:
  verify:
    if: github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/bun-cache
      CODING_TOOLS_RETENTION_ROOT: ${{ github.workspace }}/aiTemp/source/aiTemp/Trash/upstream-suite
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with: {bun-version: '1.4.0'}
      - name: Prepare retained temporary and evidence roots
        run: |
          set -euo pipefail
          # Relative TMPDIR values keep Unix-domain broker paths below the
          # platform limit while every backing directory remains under aiTemp.
          mkdir -p \
            aiTemp/evidence aiTemp/tmp aiTemp/Trash/upstream-suite \
            runtime-web/aiTemp/tmp runtime-web/launcher/aiTemp/tmp \
            desktop-electron/aiTemp/tmp
      - name: Install exact locked dependencies
        run: |
          set -euo pipefail
          preload="$PWD/runtime-web/scripts/no-delete-preload.mjs"
          if [[ "$RUNNER_OS" == "Windows" ]]; then preload="$(cygpath -w "$preload")"; fi
          export NODE_OPTIONS="--import=$preload"
          absolute_tmp="$PWD/aiTemp/tmp"
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd runtime-web 2>&1 | tee aiTemp/evidence/runtime-install.txt
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd runtime-web/launcher 2>&1 | tee aiTemp/evidence/runtime-launcher-install.txt
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd desktop-electron 2>&1 | tee aiTemp/evidence/desktop-install.txt
      - name: Run adapted Electron tests and build
        run: |
          set -euo pipefail
          preload="$PWD/runtime-web/scripts/no-delete-preload.mjs"
          if [[ "$RUNNER_OS" == "Windows" ]]; then preload="$(cygpath -w "$preload")"; fi
          export NODE_OPTIONS="--import=$preload"
          TMPDIR=aiTemp/tmp TMP=aiTemp/tmp TEMP=aiTemp/tmp \
            node --test desktop-electron/tests/*.test.cjs 2>&1 | tee aiTemp/evidence/desktop-tests.txt
          TMPDIR=../aiTemp/tmp TMP=../aiTemp/tmp TEMP=../aiTemp/tmp \
            bun run --cwd desktop-electron typecheck 2>&1 | tee aiTemp/evidence/desktop-typecheck.txt
          TMPDIR=../aiTemp/tmp TMP=../aiTemp/tmp TEMP=../aiTemp/tmp \
            bun run --cwd desktop-electron build:renderer 2>&1 | tee aiTemp/evidence/desktop-renderer-build.txt
          grep -F '# fail 0' aiTemp/evidence/desktop-tests.txt
      - name: Run the complete pinned upstream verifier
        run: |
          set -euo pipefail
          preload="$PWD/runtime-web/scripts/no-delete-preload.mjs"
          if [[ "$RUNNER_OS" == "Windows" ]]; then preload="$(cygpath -w "$preload")"; fi
          export NODE_OPTIONS="--import=$preload"
          TMPDIR=../aiTemp/tmp TMP=../aiTemp/tmp TEMP=../aiTemp/tmp \
            bun run --cwd runtime-web verify 2>&1 | tee aiTemp/evidence/runtime-verify.txt
          grep -F 'All verification steps passed' aiTemp/evidence/runtime-verify.txt || \
            grep -F 'smoke release passed' aiTemp/evidence/runtime-verify.txt || \
            grep -F 'Smoke test passed' aiTemp/evidence/runtime-verify.txt
      - name: Verify subagent compatibility and exact source pin
        run: |
          set -euo pipefail
          preload="$PWD/runtime-web/scripts/no-delete-preload.mjs"
          if [[ "$RUNNER_OS" == "Windows" ]]; then preload="$(cygpath -w "$preload")"; fi
          export NODE_OPTIONS="--import=$preload"
          TMPDIR=../aiTemp/tmp TMP=../aiTemp/tmp TEMP=../aiTemp/tmp \
            bun run --cwd runtime-web smoke:subagents 2>&1 | tee aiTemp/evidence/subagents.txt
          TMPDIR=aiTemp/tmp TMP=aiTemp/tmp TEMP=aiTemp/tmp \
            node scripts/verify-vendored-upstream.mjs 2>&1 | tee aiTemp/evidence/vendor-verify.txt
          grep -F UPSTREAM_VENDOR_PASS aiTemp/evidence/vendor-verify.txt
      - name: Prove retained cleanup and no repository deletion
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git diff --diff-filter=D --name-only)"
          find aiTemp/Trash \( -type f -o -type d \) | sort > aiTemp/evidence/retained-paths.txt
          test -s aiTemp/evidence/retained-paths.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: electron-upstream-parity-${{ matrix.os }}-${{ github.run_id }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14