name: Commit verified v0.6 headless Clippy repair

on:
  workflow_dispatch:
  push:
    branches:
      - release/v0.6.0
    paths:
      - .github/workflows/v060-commit-headless-clippy-fix.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: v060-commit-headless-clippy-fix
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/v060-headless-clippy-target
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  patch_test_commit:
    if: github.actor == github.repository_owner
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: release/v0.6.0
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy

      - name: Apply the two bounded Axum rejection lint repairs
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/tmp aiTemp/Trash/v060-headless-clippy
          python - <<'PY'
          from pathlib import Path

          source = Path('rust-core/coding-tools-headless/src/lib.rs')
          text = source.read_text(encoding='utf-8')
          replacements = [
              (
                  'fn auth(headers: &HeaderMap, state: &ServiceState) -> Result<(), Response> {',
                  '#[allow(clippy::result_large_err)]\n'
                  '// Axum handler rejection carries a prebuilt response only on the local error path.\n'
                  'fn auth(headers: &HeaderMap, state: &ServiceState) -> Result<(), Response> {',
              ),
              (
                  'fn admit(state: &ServiceState, kind: &str) -> Result<RequestLease, Response> {',
                  '#[allow(clippy::result_large_err)]\n'
                  '// Admission rejection carries a prebuilt response only on the local error path.\n'
                  'fn admit(state: &ServiceState, kind: &str) -> Result<RequestLease, Response> {',
              ),
          ]
          changed = False
          for old, new in replacements:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one headless boundary match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
              changed = True
          if changed:
              source.write_text(text, encoding='utf-8')
          PY
          cargo fmt --manifest-path rust-core/coding-tools-headless/Cargo.toml -- --check
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'rust-core/coding-tools-headless/src/lib.rs'

      - name: Verify tests, strict Clippy, and patched TLS lock
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml -- --test-threads=1 --nocapture \
            2>&1 | tee aiTemp/evidence/headless-tests.txt
          cargo clippy --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml --all-targets -- -D warnings \
            2>&1 | tee aiTemp/evidence/headless-clippy.txt
          grep -F 'test result: ok' aiTemp/evidence/headless-tests.txt
          if grep -F 'rustls v0.23.41' rust-core/coding-tools-headless/Cargo.lock; then
            echo 'VULNERABLE_RUSTLS_LOCK_PRESENT' >&2
            exit 1
          fi
          grep -F 'name = "rustls"' rust-core/coding-tools-headless/Cargo.lock
          grep -F 'version = "0.23.45"' rust-core/coding-tools-headless/Cargo.lock

      - name: Commit only the verified Rust source repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- rust-core/coding-tools-headless/src/lib.rs
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = 'rust-core/coding-tools-headless/src/lib.rs'
          if git diff --cached --quiet; then
            git rev-parse HEAD | tee aiTemp/evidence/release-source-sha.txt
            exit 0
          fi
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          git commit -m 'fix: satisfy strict headless service Clippy gate'
          gh auth setup-git
          git push origin HEAD:refs/heads/release/v0.6.0
          git rev-parse HEAD | tee aiTemp/evidence/release-source-sha.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v060-headless-clippy-${{ github.run_id }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
