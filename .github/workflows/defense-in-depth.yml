name: Defense in depth validation

on:
  push:
    branches:
      - security/defense-in-depth-v0.3.2
    paths:
      - aiTemp/release-hardening/**
      - .github/workflows/defense-in-depth.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: defense-in-depth-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-defense-in-depth
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/security/defense-in-depth-v0.3.2'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - name: Preserve exact public source snapshots for offline review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/source-review aiTemp/validation-logs
          git archive --format=tar HEAD > aiTemp/source-review/head.tar
          git archive --format=tar origin/main > aiTemp/source-review/main.tar
          base="$(git merge-base HEAD origin/main)"
          git archive --format=tar "$base" > aiTemp/source-review/base.tar
          printf 'head=%s\nmain=%s\nbase=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse origin/main)" "$base" > aiTemp/source-review/refs.txt
          sha256sum aiTemp/source-review/*.tar > aiTemp/source-review/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-review-${{ github.sha }}
          path: aiTemp/source-review/
          if-no-files-found: error
          retention-days: 7

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.98.1"
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> ../aiTemp/cargo-target-defense-in-depth
          shared-key: defense-in-depth-linux
          cache-on-failure: true

      - name: Materialize reviewed security integration
        shell: bash
        run: |
          set -euo pipefail
          {
            python aiTemp/security-hardening/fix_apply_security_hardening_v2_toml.py
            python aiTemp/security-hardening/fix_apply_security_hardening_v2_oauth_fixture.py
            python aiTemp/security-hardening/fix_apply_security_hardening_v2_rust_generation.py
            python aiTemp/security-hardening/apply_linked_root_transaction_fix.py
            python aiTemp/security-hardening/apply_frp_restore_fail_closed.py
            python aiTemp/security-hardening/apply_security_hardening_v2.py
            python aiTemp/security-hardening/apply_public_tunnel_auth_tests.py
            python aiTemp/security-hardening/apply_public_tunnel_auth_lifecycle_tests.py
            python aiTemp/security-hardening/apply_public_tunnel_auth_hardening.py
            python aiTemp/security-hardening/apply_codex_permission_tests.py
            python aiTemp/security-hardening/apply_codex_permission_model.py
            python aiTemp/release-hardening/apply_tests.py
            python aiTemp/release-hardening/apply_core_v2.py
            for patch in apply_runtime_v2.py apply_downloads_v2.py apply_release_v2.py; do
              if [ -f "aiTemp/release-hardening/$patch" ]; then
                python "aiTemp/release-hardening/$patch"
              fi
            done
          } 2>&1 | tee aiTemp/validation-logs/materialize.log

      - name: Run focused security regressions
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib release_hardening_ -- --nocapture 2>&1 | tee ../aiTemp/validation-logs/focused-rust.log

      - name: Validate formatting and existing Rust release gates
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked 2>&1 | tee ../aiTemp/validation-logs/rust-tests.log
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ../aiTemp/validation-logs/clippy.log

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      - name: Validate frontend and existing contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --cache aiTemp/npm-cache
          npm run check 2>&1 | tee aiTemp/validation-logs/frontend-check.log
          npm run build 2>&1 | tee aiTemp/validation-logs/frontend-build.log
          node --test tests/*.test.mjs 2>&1 | tee aiTemp/validation-logs/node-tests.log

      - name: Produce non-destructive verified source patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --name-status | grep -q '^D'; then
            echo 'Refusing to stage any deleted file'
            exit 1
          fi
          mkdir -p aiTemp/release-hardening/evidence
          git add -- src-tauri/src src-tauri/tests src tests package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git diff --cached --binary > aiTemp/release-hardening/evidence/verified-source.patch
          git diff --cached --stat > aiTemp/release-hardening/evidence/source-stat.txt
          printf '%s\n' "$GITHUB_SHA" > aiTemp/release-hardening/evidence/base-sha.txt
          git write-tree > aiTemp/release-hardening/evidence/tree-sha.txt
          sha256sum aiTemp/release-hardening/evidence/verified-source.patch > aiTemp/release-hardening/evidence/patch.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-source-${{ github.sha }}
          path: aiTemp/release-hardening/evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Retain diagnostic logs even when a gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-logs-${{ github.sha }}
          path: aiTemp/validation-logs/
          if-no-files-found: ignore
          retention-days: 7
