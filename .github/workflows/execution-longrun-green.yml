name: Long-run execution repair verification
on:
  push:
    branches: [feature/paseo-anneal-execution-0.5.0]
    paths: [.github/workflows/execution-longrun-green.yml]
permissions: {contents: read}
jobs:
  verify:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions: {contents: write, actions: read}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/longrun-target
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}',path: aiTemp/source,fetch-depth: 0,clean: false,persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1',components: rustfmt}
      - name: Require reproduced failures and apply scoped repair
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          gh run download 34686275049 --repo "$GITHUB_REPOSITORY" --name execution-longrun-red-34686275049 --dir aiTemp/baseline
          cp aiTemp/baseline/longrun-red.txt aiTemp/baseline/preview-red.txt aiTemp/evidence/
          grep -F LOST_START_MUST_REQUIRE_REVIEW_NOT_READY aiTemp/evidence/longrun-red.txt
          grep -F ANNEAL_ARCHIVE_RETURNS_TASK_DIRECTLY aiTemp/evidence/longrun-red.txt
          grep -F UNNECESSARY_COMPUTER_PREVIEW_CAPTURE aiTemp/evidence/preview-red.txt
          python aiTemp/execution/longrun_repair.py
          python aiTemp/execution/probe.py 2>&1 | tee aiTemp/evidence/execution-contracts.txt
          python - <<'PY'
          from pathlib import Path
          p=Path('aiTemp/execution-probe/src/lib.rs')
          with p.open('a') as f:f.write('\n#[cfg(test)] mod longrun { include!("'+Path('aiTemp/execution/longrun_contracts.rs').resolve().as_posix()+'");}\n')
          PY
          cargo test --manifest-path aiTemp/execution-probe/Cargo.toml longrun_contract_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/longrun-green.txt
          node --test aiTemp/execution/computer_preview.test.mjs 2>&1 | tee aiTemp/evidence/preview-green.txt
      - name: Commit verified repair only to feature branch
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME --jq .object.sha)" = "$GITHUB_SHA"
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then git commit -m 'fix: recover uncertain agent attempts and reduce optional computer preview load'; fi
          gh auth setup-git
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > aiTemp/evidence/source.commit
      - name: Preserve exact source even on failure
        if: always()
        run: |
          mkdir -p aiTemp/review
          git bundle create aiTemp/review/source.bundle HEAD
          git diff HEAD --binary > aiTemp/review/materialized.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'execution-longrun-${{ github.run_id }}',path: aiTemp/source/aiTemp/evidence/,if-no-files-found: error,retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'execution-longrun-source-${{ github.run_id }}',path: aiTemp/source/aiTemp/review/,if-no-files-found: error,retention-days: 14}
