name: Verified local OAuth form Origin repair
on:
  push:
    branches: [fix/oauth-form-origin-0.4.3-rc.5]
    paths: [.github/workflows/oauth-form-origin-release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oauth-form-origin-rc5
  cancel-in-progress: false
env:
  VERSION: 0.4.3-rc.5
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  windows:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    outputs:
      source: ${{ steps.source.outputs.source }}
    env:
      PLATFORM: windows-x64
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/origin-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/aiTemp/pip-cache
      EXTENSION_SOURCE_DIR: ${{ github.workspace }}/aiTemp/extension
      CODING_TOOLS_COMMAND_NATIVE_SHA256: 444a3f0008050605cae73cd9b7a2dcac61294062dfaab56dd20430fd6498518b
      CI: 'true'
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: p90-lover/coding-tools-mcp-fast-access-extension
          ref: b0d4db553227fa3c7300050b8edff6e2eb9afee4
          path: aiTemp/extension
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Require reproduced browser failure before applying the bounded repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          gh run download 34467925847 --repo "$GITHUB_REPOSITORY" --name oauth-form-origin-red-34467925847 --dir aiTemp/evidence
          python - <<'PY'
          from pathlib import Path
          import ast,json
          proof=json.loads(Path('aiTemp/evidence/referrer-red.json').read_text())
          assert proof['rc4_source']=='595728146355170aeaa4c563e179c66d670b3b30'
          assert proof['observations'][0]['origin']=='null' and proof['observations'][0]['consent_cookie_present']
          assert proof['observations'][1]['origin']=='https://old-popup.example'
          for path in Path('aiTemp/origin-repair').glob('*.py'):ast.parse(path.read_text(encoding='utf-8'))
          PY
          python aiTemp/origin-repair/prepare.py
      - name: Record exact candidate source and verify no unrelated implementation changed
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git diff --exit-code ccfa3e7cee5f917f3ad4584c5ec2a5a91d87f8f4 -- src src-tauri/src/tools src-tauri/src/runtime src-tauri/src/workspace src-tauri/src/auth/oauth.rs src-tauri/src/auth/oauth_flow.rs src-tauri/src/auth/redirects.rs src-tauri/src/auth/refresh_tokens.rs
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          git commit -m 'fix(auth): preserve browser Origin on validated consent forms without allowing null origins'
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = ccfa3e7cee5f917f3ad4584c5ec2a5a91d87f8f4
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME --jq .object.sha)" = "$GITHUB_SHA"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --stat ccfa3e7cee5f917f3ad4584c5ec2a5a91d87f8f4 HEAD > aiTemp/evidence/source-scope.txt
      - name: Build existing frontend and prepare browser dependency
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
          python -m pip install playwright==1.57.0
      - name: Real browser to live Rust consent and existing targeted regressions
        env:
          OAUTH_BROWSER_PROBE: aiTemp/origin-repair/browser_live.py
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib oauth_popup_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/oauth-tests.txt
          grep -F '5 passed; 0 failed' aiTemp/evidence/oauth-tests.txt
          grep -F 'PASS: real browser Origin through real Rust guard' aiTemp/evidence/oauth-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib catalog_exposure_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/catalog-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib connection_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/connection-tests.txt
      - name: Build and inspect exact-source Windows installer
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles nsis -- --locked 2>&1 | tee aiTemp/evidence/installer.txt
          python aiTemp/origin-repair/package.py
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: origin-repair-installer-${{ github.run_id }}
          path: aiTemp/source/aiTemp/installer/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: origin-repair-evidence-${{ github.run_id }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: windows
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    env:
      SOURCE: ${{ needs.windows.outputs.source }}
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - name: Read back verified assets then advance main without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python aiTemp/origin-repair/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: origin-repair-publication-${{ github.run_id }}
          path: |
            aiTemp/source/aiTemp/origin-release-receipt.json
            aiTemp/source/aiTemp/origin-release-draft.json
          if-no-files-found: warn
          retention-days: 14
