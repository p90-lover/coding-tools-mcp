name: v0.6 Windows EXE only now

on:
  push:
    branches:
      - subagent/v0.6-electron-release-continuation-20260916
    paths:
      - .github/workflows/v060-windows-only-now.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v060-windows-only-now
  cancel-in-progress: false

env:
  BUN_VERSION: '1.4.0'
  NODE_VERSION: '22'
  RUST_TOOLCHAIN: '1.98.1'
  SOURCE_SHA: ${{ github.sha }}
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/source/aiTemp/v060-windows-cargo-target
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/source/aiTemp/v060-windows-bun-cache
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/aiTemp/source/aiTemp/electron-builder-cache
  CODING_TOOLS_RETENTION_ROOT: ${{ github.workspace }}/aiTemp/source/aiTemp/Trash/v060-windows-package
  TUNNEL_ARCHIVE: tunnel-client-v0.0.12-windows-amd64.zip
  TUNNEL_ARCHIVE_SHA256: '2a2804933924e38a502d62b61f0266cb80d56d65744f4c29876b2bf9c1544356'
  TUNNEL_RELEASE_URL: https://github.com/openai/tunnel-client/releases/download/v0.0.12
  OUTPUT_INSTALLER: Coding.Tools_0.6.0-rc.1_full-harness_fast_x64_setup.exe

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Prepare retained temporary roots and dependencies
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/tmp aiTemp/Trash/v060-windows-package aiTemp/release-output aiTemp/electron-builder-cache
          test -d aiTemp/electron-builder-cache
          printf 'electron_builder_cache=%s\nretention_root=%s\n' "$ELECTRON_BUILDER_CACHE" "$CODING_TOOLS_RETENTION_ROOT" \
            | tee aiTemp/evidence/cache-volume-contract.txt
          node --input-type=module <<'NODE'
          import path from 'node:path';
          const cache = path.parse(process.env.ELECTRON_BUILDER_CACHE).root.toLowerCase();
          const retained = path.parse(process.env.CODING_TOOLS_RETENTION_ROOT).root.toLowerCase();
          if (!cache || cache !== retained) throw new Error(`NSIS cache and retention roots must share a volume: ${cache} != ${retained}`);
          console.log(`NSIS_CACHE_VOLUME_OK ${cache}`);
          NODE
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          preload="$(node -e 'const { pathToFileURL } = require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href);' "$preload")"
          export NODE_OPTIONS="--import=$preload"
          absolute_tmp="$PWD/aiTemp/tmp"
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" bun install --frozen-lockfile --cwd runtime-web 2>&1 | tee aiTemp/evidence/runtime-install.txt
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" bun install --frozen-lockfile --cwd runtime-web/launcher 2>&1 | tee aiTemp/evidence/runtime-launcher-install.txt
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" bun install --frozen-lockfile --cwd desktop-electron 2>&1 | tee aiTemp/evidence/desktop-install.txt

      - name: Verify runtime release-version contract
        run: |
          set -euo pipefail
          bun test runtime-web/tests/runtime-bundle-version.test.ts 2>&1 | tee aiTemp/evidence/runtime-bundle-version-test.txt
          node --check desktop-electron/scripts/runtime-preparation.cjs

      - name: Acquire pinned Windows tunnel client
        run: |
          set -euo pipefail
          input_dir="aiTemp/input/tunnel-client/v0.0.12/windows-amd64"
          archive="$input_dir/$TUNNEL_ARCHIVE"
          partial="$archive.partial"
          mkdir -p "$input_dir"
          curl.exe --fail --location --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --connect-timeout 30 --output "$partial" "$TUNNEL_RELEASE_URL/$TUNNEL_ARCHIVE"
          test -s "$partial"
          actual="$(sha256sum "$partial" | awk '{print $1}')"
          test "$actual" = "$TUNNEL_ARCHIVE_SHA256"
          mv --no-clobber "$partial" "$archive"
          echo "CODING_TOOLS_TUNNEL_CLIENT_ARCHIVE=$PWD/$archive" >> "$GITHUB_ENV"

      - name: Apply minimal v0.6 headless compile repairs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('rust-core/coding-tools-headless/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'tools::call_tool_mcp(&context, &tool, &arguments)',
                  'tools::dispatch::call_tool_mcp(&context, &tool, &arguments)',
              ),
              (
                  '        let join = tokio::spawn(async move {\n',
                  '        let service_shutdown_tx = shutdown_tx.clone();\n        let join = tokio::spawn(async move {\n',
              ),
              (
                  '            let reason = shutdown_tx\n                .borrow()\n',
                  '            let reason = service_shutdown_tx\n                .borrow()\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one compile-repair match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff -- rust-core/coding-tools-headless/src/lib.rs | tee aiTemp/evidence/headless-compile-repair.diff
          git diff --check -- rust-core/coding-tools-headless/src/lib.rs

      - name: Build Windows integrated installer
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml 2>&1 | tee aiTemp/evidence/headless-build.txt
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          preload="$(node -e 'const { pathToFileURL } = require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href);' "$preload")"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" bun run --cwd desktop-electron package:win 2>&1 | tee aiTemp/evidence/windows-package.txt

      - name: Materialize fast EXE immediately after successful package
        run: |
          set -euo pipefail
          package_root="desktop-electron/artifacts"
          test -d "$package_root"
          mapfile -t installers < <(find "$package_root" -maxdepth 1 -type f -iname '*.exe' -print)
          test "${#installers[@]}" -eq 1
          output="aiTemp/release-output/$OUTPUT_INSTALLER"
          cp --no-clobber "${installers[0]}" "$output"
          test -s "$output"
          head -c 2 "$output" | grep -F 'MZ'
          sha256sum "$output" | tee aiTemp/release-output/SHA256SUMS.txt
          printf '%s\n' "$SOURCE_SHA" > aiTemp/release-output/source.commit
          printf 'original=%s\noutput=%s\n' "${installers[0]}" "$output" | tee aiTemp/evidence/fast-exe-materialization.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v060-windows-exe-${{ github.sha }}
          path: aiTemp/source/aiTemp/release-output/
          if-no-files-found: error
          retention-days: 14

      - name: Align source-backed ASAR verifier and run deep validation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('desktop-electron/scripts/verify-package.cjs')
          text = path.read_text(encoding='utf-8')
          stale = [
              '  "electron/migration-manager.cjs",\n',
              '  "electron/rollback-manager.cjs",\n',
              '  "electron/rust-core-client.cjs",\n',
              '  "electron/rust-core-state.cjs",\n',
              '  "electron/rust-core-supervisor.cjs",\n',
          ]
          for entry in stale:
              count = text.count(entry)
              if count != 1:
                  raise SystemExit(f'expected exactly one stale ASAR verifier entry, found {count}: {entry!r}')
              text = text.replace(entry, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --input-type=module <<'NODE' | tee aiTemp/evidence/asar-source-inventory.txt
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const { REQUIRED_ASAR_FILES } = require('./desktop-electron/scripts/verify-package.cjs');
          if (!Array.isArray(REQUIRED_ASAR_FILES) || REQUIRED_ASAR_FILES.length === 0) throw new Error('ASAR required-file inventory is empty');
          for (const relativePath of REQUIRED_ASAR_FILES) {
            const sourcePath = path.join('desktop-electron', ...relativePath.split('/'));
            if (!fs.statSync(sourcePath).isFile()) throw new Error(`Required ASAR entry is not a source file: ${relativePath}`);
          }
          for (const stale of [
            'electron/migration-manager.cjs',
            'electron/rollback-manager.cjs',
            'electron/rust-core-client.cjs',
            'electron/rust-core-state.cjs',
            'electron/rust-core-supervisor.cjs',
          ]) {
            if (REQUIRED_ASAR_FILES.includes(stale)) throw new Error(`Stale ASAR verifier entry remains: ${stale}`);
          }
          console.log(`ASAR_SOURCE_INVENTORY_OK ${REQUIRED_ASAR_FILES.join(',')}`);
          NODE
          git diff -- desktop-electron/scripts/verify-package.cjs | tee aiTemp/evidence/asar-verifier-repair.diff
          git diff --check -- desktop-electron/scripts/verify-package.cjs
          package_root="desktop-electron/artifacts"
          node desktop-electron/scripts/verify-package.cjs "$package_root" --source "$SOURCE_SHA" --json-out aiTemp/evidence/package-verification.json 2>&1 | tee aiTemp/evidence/package-verification.txt
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          preload="$(node -e 'const { pathToFileURL } = require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href);' "$preload")"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" bun run --cwd desktop-electron smoke:package 2>&1 | tee aiTemp/evidence/package-smoke.txt
          test -z "$(git diff --diff-filter=D --name-only)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v060-windows-evidence-${{ github.sha }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: warn
          retention-days: 14
