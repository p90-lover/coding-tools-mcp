name: Task monitor focused preflight
on:
  push:
    branches: [fix/task-monitor-latest-0.4.4]
    paths: [.github/workflows/task-monitor-preflight.yml]
permissions: {contents: read, actions: read}
jobs:
  preflight:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      SOURCE: ${{ github.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/probe-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/aiTemp/pip-cache
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1', components: rustfmt}
      - name: Require baseline failures and verify actual source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          gh run download 34675865304 --repo "$GITHUB_REPOSITORY" --name task-monitor-red-34675865304 --dir aiTemp/red
          cp aiTemp/red/update-red.txt aiTemp/red/monitor-red.txt aiTemp/evidence/
          grep -F UPDATER_PRERELEASE_COLLISION aiTemp/evidence/update-red.txt
          grep -F MONITOR_NAVIGATION_MISSING aiTemp/evidence/monitor-red.txt
          python -m pip install playwright==1.57.0
          python aiTemp/task-monitor/preflight.py
      - name: Preserve exact reviewed source, including a failed materialization
        if: always()
        run: |
          mkdir -p aiTemp/review
          git bundle create aiTemp/review/source.bundle HEAD
          git diff HEAD --binary > aiTemp/review/materialized.patch
          git status --short > aiTemp/review/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'task-monitor-preflight-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'task-monitor-source-${{ github.run_id }}', path: aiTemp/source/aiTemp/review/, if-no-files-found: error, retention-days: 14}
