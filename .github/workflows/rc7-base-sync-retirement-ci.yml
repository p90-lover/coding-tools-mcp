name: rc.7 legacy base-sync retirement CI

on:
  push:
    branches:
      - fix/rc7-retire-obsolete-base-sync
    paths:
      - .github/workflows/rc7-provider-updater-base-sync.yml
      - .github/workflows/rc7-provider-updater-base-sync-v2.yml
      - .github/workflows/rc7-base-sync-retirement-ci.yml
      - desktop-electron/tests/rc7-base-sync-retirement-contract.test.cjs
  pull_request:
    branches:
      - integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater
    paths:
      - .github/workflows/rc7-provider-updater-base-sync.yml
      - .github/workflows/rc7-provider-updater-base-sync-v2.yml
      - .github/workflows/rc7-base-sync-retirement-ci.yml
      - desktop-electron/tests/rc7-base-sync-retirement-contract.test.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc7-base-sync-retirement-${{ github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Run focused retirement contract
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/aiTemp/rc7-base-sync-retirement/evidence"
          mkdir -p "$evidence"
          node --test desktop-electron/tests/rc7-base-sync-retirement-contract.test.cjs \
            2>&1 | tee "$evidence/contract.txt"
          grep -F '# fail 0' "$evidence/contract.txt"

      - name: Enforce exact source and no project-file deletion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater
          git diff --check origin/integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater...HEAD
          test -z "$(git diff --diff-filter=D --name-only origin/integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater...HEAD)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc7-base-sync-retirement-${{ github.sha }}
          path: aiTemp/rc7-base-sync-retirement/evidence/
          if-no-files-found: error
          retention-days: 14
