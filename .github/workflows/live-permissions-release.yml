name: Live permissions native release
on:
  push:
    branches: [release/live-permissions-0.4.1-rc.1]
    paths: ['.github/workflows/live-permissions-release.yml', 'aiTemp/live-permissions-delivery/**', 'src/**', 'src-tauri/**', 'scripts/check-control-center.mjs', 'third_party/**', 'package*.json', 'README*.md', 'docs/**', 'aiTemp/release-verification/check_bilingual_docs.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-permissions-${{ github.ref }}
  cancel-in-progress: false
env:
  VERSION: 0.4.1-rc.1
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Materialize checked source without deleting files
        id: source
        working-directory: aiTemp/checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/prepared
          python - <<'PYCODE'
          import base64,hashlib,lzma,os,re,shutil,subprocess
          from pathlib import Path,PurePosixPath
          encoded=''.join(Path(f'aiTemp/live-permissions-delivery/source.patch.xz.b64.part{i}').read_text().strip() for i in (1,2,3))
          data=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(data)==65044 and hashlib.sha256(data).hexdigest()=='c4bcfa554c0cd25f59951dcb2366d54b275f968e137d0f42b90b7f57e35ad635'
          assert not re.search(rb'^(deleted file mode|rename |copy |old mode|new mode|\+\+\+ /dev/null)',data,re.M)
          paths=[p.decode() for p in re.findall(rb'^\+\+\+ b/(.+)$',data,re.M)]
          assert len(paths)==24 and len(set(paths))==24
          for name in paths:
              p=PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and not Path(name).is_symlink()
              assert name.startswith(('src/','src-tauri/','docs/features/','docs/releases/')) or name in ('package.json','package-lock.json')
          patch=Path('aiTemp/prepared/input.patch');patch.write_bytes(data)
          if not Path('src-tauri/src/tools/live_policy.rs').exists():
              subprocess.run(['git','apply','--check',str(patch)],check=True)
              for name in paths:
                  original=Path(name)
                  if original.exists():
                      backup=Path('aiTemp/Trash/before-live-policy')/os.environ['GITHUB_RUN_ID']/name
                      backup.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(original,backup)
              subprocess.run(['git','apply',str(patch)],check=True)
          fix=Path('aiTemp/live-permissions-delivery/documentation-fixes.patch')
          assert hashlib.sha256(fix.read_bytes()).hexdigest()=='3b8b0de1939acc033d2b3660f7e59c21761c718ede0fac72cf9f70bcbe79de22'
          fix_paths=['src-tauri/src/tools/dispatch.rs','src-tauri/src/tunnel/supervisor.rs']
          if 'mod live_permission_recovery_test' not in Path(fix_paths[1]).read_text():
              subprocess.run(['git','apply','--check',str(fix)],check=True)
              for name in fix_paths:
                  backup=Path('aiTemp/Trash/before-documentation-fixes')/os.environ['GITHUB_RUN_ID']/name
                  backup.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(name,backup)
              subprocess.run(['git','apply',str(fix)],check=True)
          doc_additions = {
              'docs/features/live-permissions.md': '\n## 繁體中文摘要\n\n權限是每個監聽服務共用的即時狀態，不是啟動後便固定的副本。只變更權限時，\n儲存會先完成持久化，再發佈新的修訂版；不重啟 MCP／Actions、不更換隧道網址，\n也不重建 OAuth。短操作忙碌時會回傳 LIVE_POLICY_BUSY，可重試儲存。\n舊操作批准會撤銷，所屬命令會拒絕新輸入並收到終止要求，既有輸出仍保留。\n已送出的作業系統動作不能追回；不要因回應不明而自動重播。\n\nserver_info.live_permissions 顯示實際權限與修訂版。改變工具設定檔可能需要\n用戶端刷新清單；認證、目錄或連接埠改動則屬於另一類服務生命週期變更。\n已記住的應用程式批准仍與安全設定綁定，可能需要本機重新批准，但不是重新連接 MCP。\n\n新增本機計劃、計劃讀取、工具搜尋、系統時間及能力清單。這不是完整 Codex 執行環境，\n不會呼叫模型／子 Agent；原生命令沙箱仍未納入。截圖只在記憶體處理，\n作業系統分頁／傾印及用戶端保留不屬於程式的截圖不落地保證。\n\n使用方式與人類／AI 如何從證據修正理解，參見\n[繁體中文協作指南](../guides/ai-human-workflow.zh-Hant.md)及\n[English workflow guide](../guides/ai-human-workflow.en.md)。記錄歷史是重用上下文，\n不是訓練模型或更新權重。\n',
              'docs/releases/v0.4.1-rc.1.md': '\n## Documentation / 文件\n\nThe release includes rewritten English and Traditional Chinese READMEs plus matching\nAI–human workflow guides: roles, the twelve-stage operator board, session handoff,\nworked tool examples, review/learning notes and explicit capability boundaries.\nThese describe reusable project context, not automatic model training. Historical\nREADME copies are preserved under aiTemp/Trash rather than deleted.\n\n本版本更新英文及繁體中文 README，並提供對應協作指南，說明角色、十二階段看板、\n會話交接、工具實例、審查／學習筆記及明確能力界線。這是重用專案上下文，\n不是自動訓練模型；舊 README 保留在 aiTemp/Trash，沒有刪除。\n',
          }
          for name, addition in doc_additions.items():
              document=Path(name)
              if addition.splitlines()[1] not in document.read_text():
                  document.write_text(document.read_text()+addition)
          paths=list(dict.fromkeys(paths+fix_paths))
          for name in paths:
              if name.endswith('.rs'):subprocess.run(['rustfmt','--edition','2021','--config','skip_children=true',name],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PYCODE
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: verified live-permission corrections and bilingual workflow documentation'
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
            test "$remote" = "$GITHUB_SHA"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip HEAD --output=aiTemp/prepared/source.zip
          git rev-parse HEAD > aiTemp/prepared/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-permissions-source-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/prepared/*
          if-no-files-found: error
          retention-days: 14
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundle: nsis
          - os: macos-14
            platform: macos-arm64
            bundle: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
    defaults:
      run:
        working-directory: aiTemp/checkout
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Frontend and source privacy contracts
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          test "$(git rev-parse HEAD)" = "$SOURCE"
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
          node scripts/check-control-center.mjs 2>&1 | tee aiTemp/evidence/control-center-contract.txt
          python aiTemp/release-verification/check_bilingual_docs.py 2>&1 | tee aiTemp/evidence/bilingual-documentation.txt
          python - <<'PY'
          import json,re
          from pathlib import Path
          for name in ['src-tauri/src/tools/computer/capture.rs','src-tauri/src/tools/screen_tool.rs','src-tauri/src/tools/computer/native_capture.rs']:
              s=Path(name).read_text().split('#[cfg(test)]')[0]
              assert not re.search(r'(File::create|OpenOptions|\.save\(|temp_dir\(|tempfile|Command::)',s)
          for name in ['src/lib/components/ComputerOverlay.svelte','src/lib/control-center/state.ts']:
              s=Path(name).read_text();assert not re.search(r'indexedDB|writeFile|download=',s)
          proof=json.loads(Path('docs/verification/control-center-ui.json').read_text())
          assert proof['browser_policy_changed'] is False
          Path('aiTemp/evidence/ui-verification.json').write_text(json.dumps(proof,indent=2))
          Path('aiTemp/evidence/upstreams.json').write_text(Path('src/lib/control-center/upstreams.json').read_text())
          PY
      - name: Same-listener live permission and local tool regressions
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib live_policy_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/live-policy-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib local_codex_tools_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/local-tools-tests.txt
          python - <<'PYCODE'
          from pathlib import Path
          assert '5 passed; 0 failed' in Path('aiTemp/evidence/live-policy-tests.txt').read_text()
          assert 'same HTTP listener + same bearer token' in Path('aiTemp/evidence/live-policy-tests.txt').read_text()
          assert '1 passed; 0 failed' in Path('aiTemp/evidence/local-tools-tests.txt').read_text()
          source=Path('src/routes/workspace/[id]/+page.svelte').read_text()
          mcp=source.split('async function saveMcpPolicy',1)[1].split('async function saveActionsPolicy',1)[0]
          actions=source.split('async function saveActionsPolicy',1)[1].split('async function saveMcpAuth',1)[0]
          for block in (mcp,actions):
              assert 'updateWorkspace(next)' in block
              assert 'promptServiceRestart' not in block and 'restartRuntime' not in block and 'restartTunnel' not in block
          Path('aiTemp/evidence/live-policy-proof.json').write_text('{"same_listener_verified":true,"same_bearer_token_verified":true,"permission_schema_unchanged":true,"frontend_no_permission_restart":true,"actual_chatgpt_account_verified":false}')
          PYCODE
      - name: Focused management, permission and vision tests
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib control_center_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/integration-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib computer_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/computer-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib vision_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/vision-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib core_catalog_exposes_chatgpt_compatible_tools -- --test-threads=1 2>&1 | tee aiTemp/evidence/catalog.txt
      - name: Real isolated Windows background observation and input
        if: runner.os == 'Windows'
        env:
          COMPUTER_USE_NATIVE_SMOKE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib computer_native_fixture_round_trip -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-smoke.txt
          python -c "from pathlib import Path; assert '1 passed; 0 failed' in Path('aiTemp/evidence/native-smoke.txt').read_text()"
      - name: Build and inspect actual installer and included licenses
        env:
          BUNDLE: ${{ matrix.bundle }}
          CI: 'true'
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles "$BUNDLE" -- --locked 2>&1 | tee aiTemp/evidence/installer.txt
          python aiTemp/release-verification/package_control_core.py 2>&1 | tee aiTemp/evidence/installer-inspection.txt
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          windows=os.environ['PLATFORM']=='windows-x64'
          root=Path('aiTemp/core-installer-inspection') if windows else next((Path(os.environ['CARGO_TARGET_DIR'])/'release/bundle/macos').glob('*.app'))
          licenses={}
          for source in [Path('third_party/licenses/Paseo-LICENSE'),Path('third_party/licenses/Anneal-LICENSE'),Path('third_party/CONTROL_CENTER_NOTICES.md')]:
              matches=[p for p in root.rglob(source.name) if p.is_file()]
              assert len(matches)==1 and matches[0].read_bytes()==source.read_bytes(),source.name
              licenses[source.name]=hashlib.sha256(source.read_bytes()).hexdigest()
          for directory in ['aiTemp/installer','aiTemp/evidence']:
              path=Path(directory)/'proof.json';v=json.loads(path.read_text())
              v.update({'integration_mode':'read_only_management','integration_protocol_fixture_verified':True,'provider_agent_launch_enabled':False,'bundled_license_sha256':licenses,'ui_verification':'offline_production_components_with_native_ipc_fixtures','live_upstream_instances_verified':False,'live_permission_protocol_verified':True,'local_coding_tools_verified':True})
              path.write_text(json.dumps(v,indent=2)+'\n')
          print('PASS: exact installed upstream notices; no provider-agent launch; existing memory-only vision retained')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-permissions-installer-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/installer/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-permissions-evidence-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare,native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: live-permissions-installer-*-${{ github.run_id }}
          path: aiTemp/installers
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: live-permissions-evidence-*-${{ github.run_id }}
          path: aiTemp/evidence
      - name: Verify native assets, publish new candidate and recheck downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/release-assets
          python - <<'PY'
          import base64,hashlib,json,os,shutil,subprocess,urllib.parse,zipfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];source=os.environ['SOURCE'];version=os.environ['VERSION'];tag='v'+version
          def api(path,method='GET',body=None):
              args=['gh','api',f'repos/{repo}/{path}','--method',method];payload=None
              if body is not None:args+=['--input','-'];payload=json.dumps(body).encode()
              return json.loads(subprocess.check_output(args,input=payload,timeout=90))
          assert api('git/ref/heads/release/live-permissions-0.4.1-rc.1')['object']['sha']==source
          assert not api('git/matching-refs/tags/'+tag),'Never replace an existing release or tag'
          proofs=[json.loads(p.read_text()) for p in Path('aiTemp/installers').glob('*/proof.json')]
          assert len(proofs)==2 and {p['platform'] for p in proofs}=={'windows-x64','macos-arm64'}
          dest=Path('aiTemp/release-assets')
          for p in proofs:
              assert p['source_commit']==source and p['version']==version
              assert p['screenshot_storage']=='memory_only' and p['codex_agent_invoked'] is False
              assert p['native_sandbox_bundled'] is False and p['provider_agent_launch_enabled'] is False
              assert p['integration_protocol_fixture_verified'] is True and len(p['bundled_license_sha256'])==3
              assert p['live_permission_protocol_verified'] is True and p['local_coding_tools_verified'] is True
              if p['platform']=='windows-x64':assert p['native_fixture_verified'] is True
              assert Path(p['asset']).name==p['asset'];matches=list(Path('aiTemp/installers').glob('*/'+p['asset']));assert len(matches)==1
              data=matches[0].read_bytes();assert len(data)==p['size'] and hashlib.sha256(data).hexdigest()==p['sha256']
              shutil.copy2(matches[0],dest/p['asset'])
          (dest/'release-provenance.json').write_text(json.dumps({'version':version,'source_commit':source,'workflow_run':int(os.environ['GITHUB_RUN_ID']),'prerelease':True,'installers':proofs},indent=2)+'\n')
          with zipfile.ZipFile(dest/'live-permissions-validation.zip','x',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(Path('aiTemp/evidence').rglob('*')):
                  if p.is_file():
                      assert p.suffix in {'.txt','.json'} and not p.is_symlink();z.write(p,p.relative_to('aiTemp/evidence').as_posix())
          files=sorted(dest.iterdir());(dest/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          notes=base64.b64decode(api(f'contents/docs/releases/{tag}.md?ref={source}')['content']).decode()
          api('git/refs','POST',{'ref':'refs/tags/'+tag,'sha':source})
          release=api('releases','POST',{'tag_name':tag,'target_commitish':source,'name':f'Coding Tools MCP {tag} — Live permissions + local tools','body':notes,'draft':True,'prerelease':True,'make_latest':'false'})
          ident=release['id'];Path('aiTemp/draft-id.txt').write_text(str(ident));expected={}
          for path in sorted(dest.iterdir()):
              digest='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest();expected[path.name]=(path.stat().st_size,digest)
              url=f'https://uploads.github.com/repos/{repo}/releases/{ident}/assets?name='+urllib.parse.quote(path.name,safe='')
              a=json.loads(subprocess.check_output(['gh','api',url,'--method','POST','--header','Content-Type: application/octet-stream','--input',str(path)],timeout=120))
              assert (a['size'],a['digest'])==expected[path.name]
              downloaded=subprocess.check_output(['gh','api',f'repos/{repo}/releases/assets/{a["id"]}','--header','Accept: application/octet-stream'],timeout=120)
              assert len(downloaded)==path.stat().st_size and 'sha256:'+hashlib.sha256(downloaded).hexdigest()==digest
          current=api('releases/'+str(ident));assert current['draft'] and current['prerelease']
          assert {a['name']:(a['size'],a['digest']) for a in current['assets']}==expected
          assert api('git/ref/heads/release/live-permissions-0.4.1-rc.1')['object']['sha']==source
          assert api('git/ref/tags/'+tag)['object']['sha']==source
          api('releases/'+str(ident),'PATCH',{'draft':False,'prerelease':True,'make_latest':'false'})
          public=api('releases/tags/'+tag);assert public['id']==ident and public['draft'] is False and public['published_at']
          receipt={'url':public['html_url'],'source_commit':source,'tag':tag,'draft':False,'prerelease':True,'assets':[{k:a[k] for k in ('name','size','digest','browser_download_url')} for a in public['assets']]}
          Path('aiTemp/publication-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-permissions-publication-${{ github.run_id }}
          path: |
            aiTemp/publication-receipt.json
            aiTemp/draft-id.txt
          if-no-files-found: warn
          retention-days: 14
