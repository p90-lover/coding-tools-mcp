name: Build verified v0.3.2 installers
on:
  push:
    branches: [release/security-v0.3.2-20260907]
    paths: [.github/workflows/build-verified-v032.yml]
permissions:
  contents: read
concurrency:
  group: build-verified-v032
  cancel-in-progress: false
jobs:
  source:
    if: github.actor == github.repository_owner && github.repository == 'p90-lover/coding-tools-mcp'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      source: ${{ steps.source.outputs.source }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - name: Materialize only verified application changes
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BASE: d3037a6a6cce7157a7412e1e33a4cc2263b845ff
          EXPECTED_BRANCH_HEAD: d3037a6a6cce7157a7412e1e33a4cc2263b845ff
          TESTED_BASE: c62ed6305838362d688d24986794487ea84094e4
          EXPECTED_TREE: a7d11a821c70e3b2741c093754f239ac1585d322
          VERIFIED_RUN: '34091037153'
          ARTIFACT_ID: '10007028857'
          ARTIFACT_DIGEST: 41211e68f4c1b99688d9a60accca75b21c7bf4a93888c0d4656149c4d015f37a
          PATCH_DIGEST: b6098e29d0f8de346118b1dbe4211b2820191d689544230c2f3b49161df93e96
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          mkdir -p aiTemp
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = 4053eb2a8ea1821fa184886066c82d42f20d09a6
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" > aiTemp/verified-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > aiTemp/verified-artifact.json
          python - <<'PYVERIFY'
          import json, os, pathlib
          run=json.loads(pathlib.Path('aiTemp/verified-run.json').read_text())
          artifact=json.loads(pathlib.Path('aiTemp/verified-artifact.json').read_text())
          assert run['conclusion']=='success' and run['status']=='completed'
          assert run['head_sha']==os.environ['TESTED_BASE'] and run['repository']['id']==1337266202
          assert run['head_repository']['id']==1337266202 and run['event']=='push'
          assert run['path']=='.github/workflows/security-v0.3.2.yml'
          assert artifact['workflow_run']['id']==int(os.environ['VERIFIED_RUN'])
          assert artifact['name']=='verified-v032-'+os.environ['TESTED_BASE'] and not artifact['expired']
          assert artifact['digest']=='sha256:'+os.environ['ARTIFACT_DIGEST']
          PYVERIFY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > aiTemp/source-evidence.zip
          python - <<'PYSOURCE'
          """Stage only SHA-verified production changes; never execute archive contents."""
          from pathlib import Path
          import hashlib,json,os,subprocess,zipfile
          root=Path.cwd().resolve()
          base=os.environ['SOURCE_BASE']
          tested=os.environ['TESTED_BASE']
          expected=os.environ['EXPECTED_TREE']
          archive=root/'aiTemp/source-evidence.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==os.environ['ARTIFACT_DIGEST']
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist())=={'source.patch','source-stat.txt','tree.txt','base.txt','SHA256SUMS'}
              assert z.read('base.txt').decode().strip()==tested
              assert z.read('tree.txt').decode().strip()==expected
              patch=z.read('source.patch')
              assert hashlib.sha256(patch).hexdigest()==os.environ['PATCH_DIGEST']
          patchfile=root/'aiTemp/source.patch'
          patchfile.write_bytes(patch)
          def git(*args, env=None):
              return subprocess.check_output(['git','-c','core.autocrlf=false','-c','gc.auto=0',*args],env=env).decode().strip()
          def materialize(index,ref):
              env={**os.environ,'GIT_INDEX_FILE':str(root/'aiTemp'/index)}
              git('read-tree',ref,env=env)
              git('apply','--cached','--check',str(patchfile),env=env)
              git('apply','--cached',str(patchfile),env=env)
              tree=git('write-tree',env=env)
              return tree,env
          verified,_=materialize('verified.index',tested)
          assert verified==expected, 'CI source tree mismatch'
          source_tree,env=materialize('source.index',base)
          assert not git('diff','--name-only','--diff-filter=D',base,source_tree), 'deleted path'
          paths=git('diff','--name-only',base,source_tree).splitlines()
          assert paths and all(p.startswith(('src/','src-tauri/src/','src-tauri/tests/','tests/')) or p in ('package.json','package-lock.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock','src-tauri/tauri.conf.json') for p in paths)
          assert not git('diff','--name-only',verified,source_tree,'--','src','src-tauri','tests','package.json','package-lock.json'), 'application differs from CI'
          branch='release/verified-v0.3.2'
          head=git('rev-parse',f'origin/{branch}')
          if git('rev-parse',f'{head}^{{tree}}')==source_tree:
              commit=head
          else:
              assert head==os.environ['EXPECTED_BRANCH_HEAD'], 'source branch moved'
              commit=git('commit-tree',source_tree,'-p',head,'-m',f'Security v0.3.2: verified source from Actions run {os.environ["VERIFIED_RUN"]}')
              import base64
              credential=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
              push_env={**os.environ, 'GIT_CONFIG_COUNT':'1',
                  'GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader',
                  'GIT_CONFIG_VALUE_0':f'AUTHORIZATION: basic {credential}'}
              subprocess.run(['git','push','origin',f'{commit}:refs/heads/{branch}'],check=True,env=push_env)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write(f'source={commit}\ntag=v0.3.2\n')
          print('Verified production commit:',commit)
          print('Verified application paths:',len(paths))
          PYSOURCE
  native:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: --bundles nsis
            assets: aiTemp/cargo-target/release/bundle/nsis/*.exe
          - os: macos-14
            platform: macos
            args: --target universal-apple-darwin --bundles dmg
            assets: aiTemp/cargo-target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PYTHONDONTWRITEBYTECODE: '1'
      XDG_CONFIG_HOME: ${{ github.workspace }}/aiTemp/test-config
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.source.outputs.source }}
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          components: rustfmt,clippy
      - name: Frontend and version checks
        shell: bash
        env:
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, tomllib
          root = pathlib.Path.cwd()
          versions = [json.loads((root/p).read_text())['version'] for p in ['package.json','package-lock.json','src-tauri/tauri.conf.json']]
          manifest=tomllib.loads((root/'src-tauri/Cargo.toml').read_text())['package']
          versions.append(manifest['version'])
          lock=tomllib.loads((root/'src-tauri/Cargo.lock').read_text())
          versions.extend(p['version'] for p in lock['package'] if p['name']==manifest['name'])
          versions.append(json.loads((root/'package-lock.json').read_text())['packages']['']['version'])
          assert all('v'+v == os.environ['TAG'] for v in versions), versions
          PY
          mkdir -p aiTemp/native-evidence
          npm ci
          npm run check 2>&1 | tee aiTemp/native-evidence/frontend.txt
          node --test tests/*.test.mjs 2>&1 | tee aiTemp/native-evidence/contracts.txt
          npm audit --audit-level=low
      - name: Native tests and strict Clippy
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked 2>&1 | tee ../aiTemp/native-evidence/rust-tests.txt
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ../aiTemp/native-evidence/clippy.txt
      - name: Verify shipped target dependency boundaries
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        working-directory: src-tauri
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = windows ]; then
            targets='x86_64-pc-windows-msvc'
          else
            targets='aarch64-apple-darwin x86_64-apple-darwin'
          fi
          for target in $targets; do
            cargo tree --locked --target "$target" --prefix none --format '{p}' > "../aiTemp/native-evidence/dependencies-$target.txt"
            if grep -Eq '^glib v' "../aiTemp/native-evidence/dependencies-$target.txt"; then
              echo 'Release blocked: affected GLib present in a shipped target'
              exit 1
            fi
          done
      - name: Build installer
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          npm run tauri -- build $BUILD_ARGS -- --locked 2>&1 | tee aiTemp/native-evidence/installer.txt
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-${{ matrix.platform }}-${{ needs.source.outputs.source }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-evidence-${{ matrix.platform }}-${{ needs.source.outputs.source }}
          path: aiTemp/native-evidence/
          if-no-files-found: error
          retention-days: 14
  audit:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/audit-target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.source.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Screen reachable Git history for credential patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/audit-evidence
          python - <<'PYCREDENTIALS' > aiTemp/audit-evidence/credential-screen.json
          """High-confidence credential-pattern screen, with values never printed."""
          import json, re, subprocess, sys
          patterns = {
              'github-token': rb'\bgh[pousr]_[A-Za-z0-9]{36,255}\b',
              'github-fine-grained-token': rb'\bgithub_pat_[A-Za-z0-9_]{70,255}\b',
              'private-key-material': rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----\s+[A-Za-z0-9+/=\r\n]{100,}-----END (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
              'aws-access-key': rb'\bAKIA[A-Z0-9]{16}\b',
              'openai-key': rb'\bsk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{40,255}\b',
          }
          patterns={key:re.compile(value) for key,value in patterns.items()}
          lines=subprocess.check_output(['git','rev-list','--objects','--all']).splitlines()
          objects=list(dict.fromkeys(line.split(b' ',1)[0] for line in lines))
          process=subprocess.Popen(['git','cat-file','--batch'],stdin=subprocess.PIPE,stdout=subprocess.PIPE)
          findings=[];blobs=0
          for oid in objects:
              process.stdin.write(oid+b'\n');process.stdin.flush()
              header=process.stdout.readline().split()
              if len(header)!=3: raise RuntimeError('Git object could not be read')
              size=int(header[2]);content=process.stdout.read(size)
              if len(content)!=size or process.stdout.read(1)!=b'\n': raise RuntimeError('Incomplete Git object')
              if header[1]!=b'blob':continue
              blobs+=1
              for name,pattern in patterns.items():
                  if pattern.search(content): findings.append({'blob':oid.decode(),'kind':name})
          process.stdin.close()
          if process.wait()!=0:raise RuntimeError('Git object scan failed')
          print(json.dumps({'scope':'reachable Git history; selected high-confidence patterns, not proof that every secret is absent','objects_scanned':len(objects),'blobs_scanned':blobs,'findings':findings},indent=2))
          sys.exit(1 if findings else 0)
          PYCREDENTIALS
          cat aiTemp/audit-evidence/credential-screen.json
      - name: Audit Rust dependencies against RustSec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/audit-evidence
          cargo install cargo-audit --locked --version 0.22.2 --root "$PWD/aiTemp/audit-tool"
          aiTemp/audit-tool/bin/cargo-audit audit --file src-tauri/Cargo.lock 2>&1 | tee aiTemp/audit-evidence/rustsec.txt
          aiTemp/audit-tool/bin/cargo-audit audit --file src-tauri/Cargo.lock --json > aiTemp/audit-evidence/rustsec.json
          python - <<'PYAUDIT'
          import json, pathlib
          report=json.loads(pathlib.Path('aiTemp/audit-evidence/rustsec.json').read_text())
          assert not report['vulnerabilities']['found'], 'RustSec vulnerability remains'
          warnings=report.get('warnings', {})
          assert not warnings.get('yanked', []), 'A locked crate was yanked'
          assert all(item['advisory']['id']=='RUSTSEC-2024-0429' and item['package']['name']=='glib'
            for item in warnings.get('unsound', [])), 'Unreviewed soundness warning'
          print('RustSec vulnerability/yanked gates passed; GLib exclusion is checked in each native job.')
          PYAUDIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-${{ needs.source.outputs.source }}
          path: aiTemp/audit-evidence/
          if-no-files-found: error
          retention-days: 14
