name: Isolated integration protocol probe
on:
  push:
    branches: [feature/native-codex-bridge-20260909]
    paths: ['.github/workflows/integration-native-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      SOURCE: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Add fixture-only native rejection evidence
        run: |
          set -euo pipefail
          python scripts/native_bridge_ci.py probe-init
          python - <<'PY'
          import shutil
          from pathlib import Path
          path=Path('src-tauri/src/codex_bridge/mod.rs')
          backup=Path('aiTemp/Trash/native-probe-original.rs');backup.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(path,backup)
          text=path.read_text(encoding='utf-8')
          marker='let result = if value.get("error").is_some() {'
          assert text.count(marker)==1
          text=text.replace(marker,marker+'\n #[cfg(test)] if std::env::var_os("NATIVE_CODEX_PROBE_BIN").is_some() { eprintln!("ACTUAL_NATIVE_REJECTION: {}", value["error"]); }',1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Verify official binary, without account credentials
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ASSET: codex-x86_64-pc-windows-msvc.exe.tar.gz
        run: python scripts/native_bridge_ci.py download-native
      - name: One actual loopback lifecycle regression
        run: |
          set -euo pipefail
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_bridge_actual_turns_against_loopback_fixture -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/actual-rejection.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-native-probe-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: warn
          retention-days: 14
