name: Verified integration reliability release
on:
  push:
    branches: [fix/integration-reliability-0.4.4-rc.3]
    paths: [.github/workflows/integration-reliability-release.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: integration-reliability-044rc3
  cancel-in-progress: false
env:
  VERSION: 0.4.4-rc.3
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: write, actions: read}
    outputs: {source: '${{ steps.source.outputs.source }}'}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/preflight-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1', components: rustfmt}
      - name: Require reproduced defects and materialize the bounded repair
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python aiTemp/reliability/verifier_guard_test.py 2>&1 | tee aiTemp/evidence/verifier-guard.txt
          gh run download 34553831049 --repo "$GITHUB_REPOSITORY" --name integration-reliability-red-34553831049 --dir aiTemp/baseline
          cp aiTemp/baseline/ui-red.txt aiTemp/baseline/rust-red.txt aiTemp/evidence/
          grep -F CLEARED_SNAPSHOT_RETURNED aiTemp/evidence/ui-red.txt
          grep -F INVALID_INPUT_CONSUMED_RETENTION_SLOT aiTemp/evidence/rust-red.txt
          grep -F TASK_EVENTS_OUTPUT_SCHEMA_MISSING aiTemp/evidence/rust-red.txt
          python - <<'PY'
          from pathlib import Path
          import ast,json
          for p in Path('aiTemp/reliability').glob('*.py'):ast.parse(p.read_text(encoding='utf-8'))
          PY
          if python -c "import json; from pathlib import Path; assert json.loads(Path('package.json').read_text())['version']=='0.4.4-rc.3'"; then
            git diff --exit-code
          else
            python aiTemp/reliability/prepare.py
          fi
      - name: Focused state and snapshot checks before recording the candidate
        run: |
          set -euo pipefail
          npm ci > aiTemp/evidence/npm.txt 2>&1
          node --test aiTemp/reliability/integration-state.test.mjs 2>&1 | tee aiTemp/evidence/integration-state.txt
          mkdir -p aiTemp/preflight/src
          python - <<'PY'
          from pathlib import Path
          root=Path('.').resolve()
          Path('aiTemp/preflight/Cargo.toml').write_text('[package]\nname="reliability-preflight"\nversion="0.0.0"\nedition="2021"\n[dependencies]\nuuid={version="1",features=["v4"]}\nserde_json="1"\n')
          text='type AppResult<T> = Result<T, Box<dyn std::error::Error>>;\nfn err(s: impl Into<String>) -> Box<dyn std::error::Error> {s.into().into()}\n'
          text+='#[path="'+str(root/'src-tauri/src/tools/sandbox_snapshot.rs')+'"] mod snapshot;\n'
          text+='include!("'+str(root/'aiTemp/reliability/snapshot_contract.rs')+'");\n'
          text+='#[path="'+str(root/'src-tauri/src/tools/event_output_schema.rs')+'"] mod event_output_schema;\n'
          text+='#[test] fn reliability_event_schema_shape(){let schema=event_output_schema::schema();assert_eq!(schema["properties"]["events"]["maxItems"],200);assert!(schema["allOf"].is_array());}\n'
          Path('aiTemp/preflight/src/lib.rs').write_text(text)
          PY
          cargo test --manifest-path aiTemp/preflight/Cargo.toml reliability_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/preflight.txt
          grep -F '2 passed; 0 failed' aiTemp/evidence/preflight.txt
      - name: Record exact tested candidate without overwriting concurrent work
        id: source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git diff --exit-code 13410a4cd4b148e2fa94462102056017119c94af -- src-tauri/src/auth src-tauri/src/mcp src-tauri/src/integrations native-helpers src-tauri/src/tools/sandbox_runner.rs src-tauri/src/tools/sandbox_process.rs src-tauri/src/tools/policy.rs src-tauri/src/tools/approval.rs src-tauri/src/tools/live_policy.rs aiTemp/timeout-recovery
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then git commit -m 'fix: bind integration responses, preflight snapshot inputs and expose verified result contracts'; fi
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = 13410a4cd4b148e2fa94462102056017119c94af
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME --jq .object.sha)" = "$GITHUB_SHA"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --stat 13410a4cd4b148e2fa94462102056017119c94af HEAD > aiTemp/evidence/source-scope.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'reliability-preparation-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    permissions: {contents: read, actions: read}
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      PLATFORM: windows-x64
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/reliability-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/aiTemp/pip-cache
      EXTENSION_SOURCE_DIR: ${{ github.workspace }}/aiTemp/extension
      CODING_TOOLS_COMMAND_NATIVE_SHA256: 444a3f0008050605cae73cd9b7a2dcac61294062dfaab56dd20430fd6498518b
      CODING_TOOLS_SNAPSHOT_HELPER: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-appcontainer.exe
      CODING_TOOLS_SNAPSHOT_PROBE: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-sandbox-probe.exe
      APP_CONTAINER_HELPER: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-appcontainer.exe
      APP_CONTAINER_PROBE: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-sandbox-probe.exe
      CI: 'true'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ env.SOURCE }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {repository: p90-lover/coding-tools-mcp-fast-access-extension, ref: b0d4db553227fa3c7300050b8edff6e2eb9afee4, path: aiTemp/extension, clean: false, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - name: Preserve baseline evidence and verify the actual native boundary
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python aiTemp/reliability/verifier_guard_test.py 2>&1 | tee aiTemp/evidence/verifier-guard.txt
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "reliability-preparation-$GITHUB_RUN_ID" --dir aiTemp/preparation
          cp aiTemp/preparation/ui-red.txt aiTemp/preparation/rust-red.txt aiTemp/evidence/
          gh run download 34550277930 --repo "$GITHUB_REPOSITORY" --name mcp-timeout-red-34550277930 --dir aiTemp/evidence
          cmake -S native-helpers/app-container -B aiTemp/native-build -A x64 -DCODING_TOOLS_BUILD_PROBE=ON
          cmake --build aiTemp/native-build --config Release 2>&1 | tee aiTemp/evidence/native-build.txt
          python aiTemp/completion/native_test.py 2>&1 | tee aiTemp/evidence/native-tests.txt
      - name: Verify integration state and prepare browser checks
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          node --test aiTemp/reliability/integration-state.test.mjs 2>&1 | tee aiTemp/evidence/integration-state.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
          python -m pip install playwright==1.57.0 jsonschema==4.25.1
      - name: Verify real snapshot input and event contracts plus read-only adapters
        run: |
          set -euo pipefail
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib reliability_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/reliability-tests.txt
          grep -F '2 passed; 0 failed' aiTemp/evidence/reliability-tests.txt
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib control_center_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/adapter-tests.txt
      - name: Preserve timeout recovery and shared sandbox permissions
        run: |
          set -euo pipefail
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib recovery_contract_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/recovery-tests.txt
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib snapshot_contract_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/snapshot-contract.txt
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib core_catalog_exposes_chatgpt_compatible_tools_without_unreleased_claims -- --test-threads=1 2>&1 | tee aiTemp/evidence/registry.txt
      - name: Preserve real-browser OAuth and extension connection behavior
        env: {OAUTH_BROWSER_PROBE: aiTemp/origin-repair/browser_live.py}
        run: |
          set -euo pipefail
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib oauth_popup_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/oauth-tests.txt
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib catalog_exposure_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/catalog-tests.txt
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib connection_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/connection-tests.txt
      - name: Build and inspect exact Windows installer and validate actual output schemas
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles nsis -- --locked --features native-snapshot 2>&1 | tee aiTemp/evidence/installer.txt
          python aiTemp/reliability/browser_test.py 2>&1 | tee aiTemp/evidence/integration-browser.txt
          python aiTemp/reliability/package.py
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'reliability-installer-${{ github.run_id }}', path: 'aiTemp/source/aiTemp/installer/*', if-no-files-found: error, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'reliability-evidence-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
  publish:
    needs: [prepare,windows]
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: write, actions: read}
    env: {SOURCE: '${{ needs.prepare.outputs.source }}'}
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ env.SOURCE }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - name: Verify all results, read back assets and fast-forward main without replacing history
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python aiTemp/reliability/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reliability-publication-${{ github.run_id }}
          path: |
            aiTemp/source/aiTemp/reliability-release-receipt.json
            aiTemp/source/aiTemp/reliability-release-draft.json
          if-no-files-found: warn
          retention-days: 14
