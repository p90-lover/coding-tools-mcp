name: Workflow sync red regression
on:
  push:
    branches: [release/workflow-sync-0.4.3-rc.1]
    paths: ['.github/workflows/workflow-sync-red.yml']
permissions:
  contents: read
jobs:
  red:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/red-target
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Run the missing-consent test against unmodified production code
        working-directory: aiTemp/checkout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/native_bridge_ci.py probe-init
          python - <<'PY'
          from pathlib import Path
          import shutil
          source=Path('src-tauri/src/codex_bridge/mod.rs')
          backup=Path('aiTemp/Trash/red-before/mod.rs');backup.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(source,backup)
          with source.open('a') as out:
              out.write('\n#[cfg(test)]\n#[path="../../../aiTemp/release-043/native_command_consent.rs"]\nmod native_command_consent;\n')
          PY
          set +e
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_command_separate_consent_contract -- --nocapture > aiTemp/evidence/native-command-red.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 101
          grep -F 'COMMANDS_NEED_A_SEPARATE_LOCAL_GRANT_WITHOUT_MODEL_CONSENT' aiTemp/evidence/native-command-red.txt
          grep -F '0 passed; 1 failed' aiTemp/evidence/native-command-red.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workflow-sync-red-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          retention-days: 14
          if-no-files-found: error
