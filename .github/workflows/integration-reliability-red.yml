name: Reproduce integration reliability gaps
on:
  push:
    branches: [fix/integration-reliability-0.4.4-rc.3]
    paths: [.github/workflows/integration-reliability-red.yml]
permissions: {contents: read}
jobs:
  reproduce:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/red-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - name: Reproduce stale snapshots using real Svelte stores and current application state
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          npm ci > aiTemp/evidence/npm.txt 2>&1
          set +e
          node --test aiTemp/reliability/integration-state.test.mjs > aiTemp/evidence/ui-red.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -F CLEARED_SNAPSHOT_RETURNED aiTemp/evidence/ui-red.txt
      - name: Reproduce input-retention leak and missing event output schema on current source
        run: |
          set -euo pipefail
          mkdir -p aiTemp/probe/src
          python - <<'PY'
          from pathlib import Path
          root=Path('.').resolve()
          Path('aiTemp/probe/Cargo.toml').write_text('[package]\nname="reliability-red"\nversion="0.0.0"\nedition="2021"\n[dependencies]\nuuid={version="1",features=["v4"]}\nserde_json="1"\n')
          code='type AppResult<T> = Result<T, Box<dyn std::error::Error>>;\nfn err(s: impl Into<String>) -> Box<dyn std::error::Error> {s.into().into()}\n'
          code+='#[path="'+str(root/'src-tauri/src/tools/sandbox_snapshot.rs')+'"] mod snapshot;\n'
          code+='include!("'+str(root/'aiTemp/reliability/snapshot_contract.rs')+'");\n'
          code+='pub mod mcp { #[path="'+str(root/'src-tauri/src/mcp/operation_store.rs')+'"] pub mod operation_store; }\n'
          code+='pub mod tools {\n'
          for name in ['workflow','codex_runtime','local_tools','native_sandbox']:
              code+='pub mod '+name+' {pub const NAMES:&[&str]=&[]; pub fn input_schema(_: &str)->serde_json::Value{serde_json::json!({})} pub fn input(_: &str)->serde_json::Value{serde_json::json!({})}}\n'
          code+='pub mod computer {pub mod schema {pub const NAMES:&[&str]=&[]; pub const WRITES:&[&str]=&[]; pub fn input(_: &str)->serde_json::Value{serde_json::json!({})}}}\n'
          code+='#[path="'+str(root/'src-tauri/src/tools/registry_definitions.rs')+'"] pub mod registry; }\n'
          code+='#[test] fn reliability_schema_missing(){let tool=tools::registry::list_tools().into_iter().find(|v|v["name"]=="list_task_events").unwrap(); assert!(tool["outputSchema"].is_object(),"TASK_EVENTS_OUTPUT_SCHEMA_MISSING");}\n'
          Path('aiTemp/probe/src/lib.rs').write_text(code)
          PY
          set +e
          cargo test --manifest-path aiTemp/probe/Cargo.toml reliability_ -- --test-threads=1 --nocapture > aiTemp/evidence/rust-red.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 101
          grep -F INVALID_INPUT_CONSUMED_RETENTION_SLOT aiTemp/evidence/rust-red.txt
          grep -F TASK_EVENTS_OUTPUT_SCHEMA_MISSING aiTemp/evidence/rust-red.txt
      - name: Preserve exact source for local review without running model or agents
        if: always()
        run: |
          git bundle create aiTemp/evidence/source.bundle --all
          git rev-parse HEAD > aiTemp/evidence/source.commit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'integration-reliability-red-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
