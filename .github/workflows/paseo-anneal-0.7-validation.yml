name: Paseo and Anneal 0.7 integration validation

on:
  push:
    branches:
      - fix/0.7-paseo-anneal-wiring
    paths:
      - .github/workflows/paseo-anneal-0.7-validation.yml
      - aiTemp/paseo-anneal-0.7/**
      - aiTemp/execution/**
      - src-tauri/src/integrations/**
      - src-tauri/src/commands/execution.rs
      - src-tauri/src/commands/mod.rs
      - src-tauri/src/lib.rs
      - src-tauri/src/tools/workflow.rs
      - src-tauri/src/tools/registry_definitions.rs
      - rust-core/coding-tools-core/src/lib.rs
      - rust-core/coding-tools-headless/src/lib.rs
      - src/routes/missions/+page.svelte
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paseo-anneal-07-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          clean: false
          persist-credentials: false
      - name: Require reachable integration wiring
        working-directory: aiTemp/source
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python aiTemp/paseo-anneal-0.7/wiring_contract.py \
            2>&1 | tee aiTemp/evidence/wiring-contract.txt
          grep -F PASEO_ANNEAL_07_WIRING_CONTRACT_OK aiTemp/evidence/wiring-contract.txt
          test -z "$(git diff --diff-filter=D --name-only)"

  compile-and-contracts:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/paseo-anneal-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PASEO_SOURCE_DIR: ${{ github.workspace }}/aiTemp/paseo
      ANNEAL_SOURCE_DIR: ${{ github.workspace }}/aiTemp/anneal
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: getpaseo/paseo
          ref: fa93c4290eaa87ae58452ab6e2012f85ae6e0c6b
          path: aiTemp/paseo
          clean: false
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: mosonlab/anneal
          ref: 2eaea1c7ab5fc4444beab703bf1fbab264ad3f58
          path: aiTemp/anneal
          clean: false
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
      - name: Run pinned upstream and execution contracts
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python aiTemp/execution/probe.py \
            2>&1 | tee aiTemp/evidence/execution-contracts.txt
          grep -F '3 passed; 0 failed' aiTemp/evidence/execution-contracts.txt
          npm install --ignore-scripts --no-audit --no-fund \
            --prefix aiTemp/schema-deps typescript@5.9.3 zod@4.4.3 semver@7.8.5
          node aiTemp/execution/upstream_schema.mjs \
            2>&1 | tee aiTemp/evidence/upstream-schema.txt
          node --test aiTemp/execution/computer_preview.test.mjs \
            2>&1 | tee aiTemp/evidence/computer-preview.txt
      - name: Compile the exact headless sidecar integration
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            2>&1 | tee aiTemp/evidence/headless-check.txt
          cargo test --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            2>&1 | tee aiTemp/evidence/headless-tests.txt
      - name: Exercise execution-module tests in the desktop library
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml execution \
            -- --test-threads=1 \
            2>&1 | tee aiTemp/evidence/execution-rust-tests.txt
      - name: Compile the mission controller UI
        run: |
          set -euo pipefail
          npm ci
          npm run check 2>&1 | tee aiTemp/evidence/frontend-check.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
      - name: Enforce no-deletion and clean source contracts
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paseo-anneal-07-evidence-${{ github.run_id }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: warn
          retention-days: 14
