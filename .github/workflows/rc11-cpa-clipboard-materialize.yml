name: rc.11 CPA privileged clipboard materializer

on:
  push:
    branches:
      - cursor/five-stack-original-parity-rc11-2e35
    paths:
      - aiTemp/rc11-cpa-clipboard/apply_patch.py
      - .github/workflows/rc11-cpa-clipboard-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc11-cpa-clipboard-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Apply privileged clipboard production patch
        run: |
          set -euo pipefail
          mkdir -p aiTemp/rc11-cpa-clipboard/evidence
          python aiTemp/rc11-cpa-clipboard/apply_patch.py \
            | tee aiTemp/rc11-cpa-clipboard/evidence/materializer.txt
          grep -F RC11_CPA_PRIVILEGED_CLIPBOARD_PATCH_APPLIED \
            aiTemp/rc11-cpa-clipboard/evidence/materializer.txt

      - name: Format Rust and resolve the pinned lockfile
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 \
            > aiTemp/rc11-cpa-clipboard/evidence/cargo-metadata.json
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 \
            > aiTemp/rc11-cpa-clipboard/evidence/cargo-metadata-locked.json

      - name: Run focused security and UI contracts
        run: |
          set -euo pipefail
          node --test \
            tests/rc11-cpa-privileged-clipboard.test.mjs \
            desktop-electron/tests/rc11-cpa-codex-router-lane.test.cjs \
            2>&1 | tee aiTemp/rc11-cpa-clipboard/evidence/focused-tests.txt
          grep -F '# fail 0' aiTemp/rc11-cpa-clipboard/evidence/focused-tests.txt
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Enforce bounded no-delete diff
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          git diff --name-only | tee aiTemp/rc11-cpa-clipboard/evidence/changed-files.txt
          expected='^(src-tauri/Cargo\.toml|src-tauri/Cargo\.lock|src-tauri/src/lib\.rs|src-tauri/src/commands/five_stack\.rs|src/lib/components/control-center/OriginalUiPanel\.svelte)$'
          unexpected="$(grep -Ev "$expected" aiTemp/rc11-cpa-clipboard/evidence/changed-files.txt || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected CPA clipboard paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit verified privileged clipboard implementation
        run: |
          set -euo pipefail
          git add \
            src-tauri/Cargo.toml \
            src-tauri/Cargo.lock \
            src-tauri/src/lib.rs \
            src-tauri/src/commands/five_stack.rs \
            src/lib/components/control-center/OriginalUiPanel.svelte
          if git diff --cached --quiet; then
            echo RC11_CPA_PRIVILEGED_CLIPBOARD_ALREADY_MATERIALIZED
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rc11): keep CPA management key outside renderer state'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc11-cpa-clipboard-materialize-${{ github.sha }}
          path: aiTemp/rc11-cpa-clipboard/evidence/
          if-no-files-found: error
          retention-days: 14
