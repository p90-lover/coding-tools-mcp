name: CI

on:
  workflow_dispatch:
    inputs:
      build_headless_artifact:
        description: Build the tested Windows headless component for local verification
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which parts of the repository a run has to check. The Rust jobs build src-tauri, which the
  # installer does not ship; they are skipped only when every changed file is in an area src-tauri
  # never reads (a skipped job still satisfies a required check). The desktop suite is skipped only
  # when every change is Rust-only. When the change list cannot be read, everything runs.
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      desktop: ${{ steps.areas.outputs.desktop }}
    steps:
      - id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          files=ALL
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || files=ALL
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # The compare API lists at most 300 files; a longer list runs everything.
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq 'if (.files | length) >= 300 then "ALL" else .files[].filename end') || files=ALL
          fi
          [ -n "$files" ] || files=ALL
          # "true" unless every changed file matches the pattern of files that area never reads.
          needed() { if [ "$files" = ALL ] || grep -qvE "$1" <<<"$files"; then echo true; else echo false; fi; }
          rust=$(needed '^(desktop-electron/|runtime-web/|module/agent-orchestrator$|docs/releases/)')
          desktop=$(needed '^(src-tauri/|native-helpers/|rust-core/)')
          echo "rust=$rust desktop=$desktop"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust Linux — fmt, build, test, clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-linux
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|^http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy

      - name: Rustfmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo build
        working-directory: src-tauri
        run: cargo build --locked

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  rust-windows:
    name: Rust Windows — test and clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-windows
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: clippy

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Headless private preview regressions
        env:
          TEMP: ${{ github.workspace }}/aiTemp/headless-tests
          TMP: ${{ github.workspace }}/aiTemp/headless-tests
          CODEX_HOME: ${{ github.workspace }}/aiTemp/headless-tests/codex-home
        run: |
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          cargo test --manifest-path rust-core/coding-tools-headless/Cargo.toml --locked --lib -- ao_preview_home_is_bound_to_its_workspace_loopback_server listener_status_is_readable_but_start_requires_local_confirmation a_project_folder_session_works_in_the_workspace_folder_and_nowhere_else

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build the tested headless component
        if: github.event_name == 'workflow_dispatch' && inputs.build_headless_artifact
        env:
          TEMP: ${{ github.workspace }}/aiTemp/headless-tests
          TMP: ${{ github.workspace }}/aiTemp/headless-tests
          CODEX_HOME: ${{ github.workspace }}/aiTemp/headless-tests/codex-home
          CARGO_PROFILE_RELEASE_DEBUG: '0'
        run: |
          cargo test --manifest-path rust-core/coding-tools-headless/Cargo.toml --locked --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path rust-core/coding-tools-headless/Cargo.toml --locked --release --bin coding-tools-headless
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $env:CARGO_TARGET_DIR 'release/coding-tools-headless.exe'
          $proof = [ordered]@{
            sourceSha = (git rev-parse HEAD).Trim()
            headlessSourceBlob = (git rev-parse 'HEAD:rust-core/coding-tools-headless/src/lib.rs').Trim()
            headlessLockBlob = (git rev-parse 'HEAD:rust-core/coding-tools-headless/Cargo.lock').Trim()
            coreTree = (git rev-parse 'HEAD:rust-core/coding-tools-core').Trim()
            tauriTree = (git rev-parse 'HEAD:src-tauri').Trim()
            rustc = (rustc --version)
            sha256 = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            size = (Get-Item -LiteralPath $binary).Length
          }
          $proof | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:CARGO_TARGET_DIR 'release/headless-build-proof.json')

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name == 'workflow_dispatch' && inputs.build_headless_artifact
        with:
          name: headless-windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/aiTemp/cargo-target-windows/release/coding-tools-headless.exe
            ${{ github.workspace }}/aiTemp/cargo-target-windows/release/headless-build-proof.json
          if-no-files-found: error
          retention-days: 3

  rust-macos:
    name: Rust macOS — test and clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-macos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: clippy

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  frontend:
    name: Frontend — check, build, contracts, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Verify release version alignment
        run: npm run check:version

      - name: Install frontend dependencies
        run: npm ci

      - name: Svelte type and accessibility checks
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Run Node contract tests
        run: node --test tests/*.test.mjs tests/upstream/*.test.mjs

      - name: NPM audit
        run: npm audit --audit-level=low

  # The Electron app the installer ships: its own suite, which no job ran before (#702 and #707
  # merged with about 50 of its tests failing).
  desktop:
    name: Desktop — Electron tests
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Allow long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # The AO board tests read AO's sources at the pinned submodule commit.
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26'

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.3

      # runtime-web's playwright-core drives the runner's Chrome in the connector tests.
      - name: Install desktop dependencies
        run: |
          bun install --frozen-lockfile --cwd desktop-electron
          bun install --frozen-lockfile --cwd runtime-web

      - name: Desktop tests
        working-directory: desktop-electron
        shell: bash
        env:
          # runtime-web/launcher's modules are tested without Electron installed there.
          NODE_PATH: ${{ github.workspace }}/desktop-electron/tests/support/electron-stub
        run: node --test tests/*.test.cjs
