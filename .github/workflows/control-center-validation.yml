name: Control center native and UI validation
on:
  push:
    branches: [integration/paseo-anneal-control-center]
    paths: ['.github/workflows/control-center-validation.yml', 'aiTemp/center-delivery/**', 'aiTemp/control-center/**', 'src/**', 'src-tauri/**', 'package*.json', 'third_party/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: control-center-${{ github.ref }}
  cancel-in-progress: false
env:
  VERSION: 0.4.0-rc.1
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/app
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Materialize verified source and lock dependencies
        id: commit
        working-directory: aiTemp/app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/prepared
          python - <<'PY'
          import base64,hashlib,lzma,os,re,shutil,subprocess
          from pathlib import Path,PurePosixPath
          encoded=''.join(Path(f'aiTemp/center-delivery/source.patch.xz.b64.part{i}').read_text().strip() for i in (1,2,3))
          data=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(data).hexdigest()=='283dcd3c69b7a560859e2428cd7760ebb5ff6e7d419daf59bf812e8874f776cf','Source checksum mismatch'
          assert not re.search(rb'^(deleted file mode|rename |copy |old mode|new mode|\+\+\+ /dev/null)',data,re.M)
          paths=[p.decode() for p in re.findall(rb'^\+\+\+ b/(.+)$',data,re.M)]
          assert len(paths)==33 and len(set(paths))==33
          for name in paths:
              p=PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and not Path(name).is_symlink()
              assert name.startswith(('src/','src-tauri/','docs/integrations/','docs/releases/','third_party/','aiTemp/control-center/')) or name in ('package.json','package-lock.json')
          patch=Path('aiTemp/prepared/source.patch');patch.write_bytes(data)
          if not Path('src-tauri/src/control_center/mod.rs').exists():
              subprocess.run(['git','apply','--check',str(patch)],check=True)
              for name in paths:
                  p=Path(name)
                  if p.exists():
                      backup=Path('aiTemp/Trash/before-control-center')/os.environ['GITHUB_RUN_ID']/name
                      backup.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,backup)
              subprocess.run(['git','apply',str(patch)],check=True)
          for name in paths:
              if name.endswith('.rs'):subprocess.run(['rustfmt','--edition','2021','--config','skip_children=true',name],check=True)
          subprocess.run(['cargo','update','--workspace','--manifest-path','src-tauri/Cargo.toml'],check=True)
          subprocess.run(['git','add','-f','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          Path('aiTemp/prepared/paths.txt').write_text('\n'.join(paths)+'\n')
          PY
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate read-only Paseo and Anneal controls with redesigned native UI'
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
            test "$remote" = "$GITHUB_SHA"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip HEAD --output=aiTemp/prepared/app-source.zip
          git rev-parse HEAD > aiTemp/prepared/source-sha.txt
          git ls-tree -r HEAD > aiTemp/prepared/tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: center-prepared-${{ github.run_id }}
          path: aiTemp/app/aiTemp/prepared/*
          retention-days: 14
          if-no-files-found: error

  rendered-ui:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/aiTemp/pip-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/aiTemp/browsers
    defaults:
      run:
        working-directory: aiTemp/app
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          path: aiTemp/app
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Build actual frontend and check three focused model contracts
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/process-temp
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee aiTemp/evidence/npm.txt
          node --test aiTemp/control-center/model.test.mjs 2>&1 | tee aiTemp/evidence/model-tests.txt
          npm run check 2>&1 | tee aiTemp/evidence/svelte.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
      - name: Check three rendered journeys using explicit test-only bridge data
        run: |
          set -euo pipefail
          export TMPDIR="$PWD/aiTemp/process-temp"
          export PYTHONPATH="$PWD/aiTemp/python"
          python -m pip install --target "$PYTHONPATH" 'playwright==1.55.0'
          python -m playwright install chromium
          python aiTemp/control-center/ui-qa.py 2>&1 | tee aiTemp/evidence/ui-tests.txt
          printf '%s\n' "$SOURCE" > aiTemp/evidence/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: center-rendered-ui-${{ github.run_id }}
          path: |
            aiTemp/app/aiTemp/evidence/*
            aiTemp/app/aiTemp/control-center/*-desktop.png
            aiTemp/app/aiTemp/control-center/*-mobile*.png
            aiTemp/app/aiTemp/control-center/ui-qa-results.json
          retention-days: 14
          if-no-files-found: error

  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundle: nsis
          - os: macos-14
            platform: macos-arm64
            bundle: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aiTemp/app
        shell: bash
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          path: aiTemp/app
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Validate version, unchanged screenshot privacy and withheld sandbox
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/installer
          python - <<'PY'
          import json,os,re,subprocess,tomllib
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['SOURCE']
          for p in ('package.json','package-lock.json','src-tauri/tauri.conf.json'):
              assert json.loads(Path(p).read_text(encoding='utf-8'))['version']==os.environ['VERSION']
          assert tomllib.loads(Path('src-tauri/Cargo.toml').read_text())['package']['version']==os.environ['VERSION']
          for name in ('src-tauri/src/tools/computer/capture.rs','src-tauri/src/tools/computer/native_capture.rs','src-tauri/src/tools/screen_tool.rs'):
              text=Path(name).read_text(encoding='utf-8').split('#[cfg(test)]')[0]
              assert not re.search(r'(File::create|OpenOptions|\.save\(|temp_dir\(|tempfile|Command::)',text)
          adapter=Path('src-tauri/src/control_center/adapters.rs').read_text().split('#[cfg(test)]')[0]
          assert not re.search(r'(Command::|\.post\(|\.delete\(|\.put\(|\.patch\()',adapter)
          for name in ('third_party/paseo/LICENSE','third_party/anneal/LICENSE','third_party/CONTROL_CENTER_NOTICES.md'):assert Path(name).is_file()
          config=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert config['bundle']['resources']=={'../third_party/':'third-party/'}
          Path('aiTemp/evidence/privacy.txt').write_text('PASS: identity, version, memory-only capture, observation-only adapters and license resources\n'+os.environ['SOURCE']+'\n')
          PY
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/svelte.txt
      - name: Three native integration contracts and existing vision guardrails
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib center_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/center-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib vision_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/vision-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib sandbox_contract_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/sandbox-tests.txt
      - name: Isolated Windows native computer-control regression
        if: runner.os == 'Windows'
        env:
          COMPUTER_USE_NATIVE_SMOKE: '1'
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib computer_native_fixture_round_trip -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-smoke.txt
          python -c "from pathlib import Path;assert '1 passed; 0 failed' in Path('aiTemp/evidence/native-smoke.txt').read_text(encoding='utf-8')"
      - name: Build and inspect the actual installer
        env:
          CI: 'true'
          BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles "$BUNDLE" -- --locked 2>&1 | tee aiTemp/evidence/installer.txt
          git diff --exit-code -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          python - <<'PY'
          import hashlib,json,os,plistlib,shutil,subprocess
          from pathlib import Path
          release=Path(os.environ['CARGO_TARGET_DIR'])/'release';win=os.environ['PLATFORM']=='windows-x64'
          assets=list(release.glob('bundle/nsis/*.exe' if win else 'bundle/dmg/*.dmg'));assert len(assets)==1 and assets[0].stat().st_size>100000
          binaries=[release/'coding-tools-mcp-desktop.exe'] if win else list(release.glob('bundle/macos/*.app/Contents/MacOS/coding-tools-mcp-desktop'))
          assert len(binaries)==1 and binaries[0].is_file()
          expected='coding-tools-mcp-desktop '+os.environ['VERSION']
          assert subprocess.run([str(binaries[0]),'--version'],capture_output=True,text=True,check=True,timeout=20).stdout.strip()==expected
          forbidden=('codex-command-runner.exe','codex-windows-sandbox-setup.exe','coding-tools-sandbox.exe')
          for name in forbidden:assert not list(release.rglob(name)),'Withheld sandbox helper must not be packaged'
          if not win:
              mounted=plistlib.loads(subprocess.check_output(['hdiutil','attach','-readonly','-nobrowse','-plist',str(assets[0])]))
              mounts=[Path(e['mount-point']) for e in mounted['system-entities'] if 'mount-point' in e];assert len(mounts)==1
              try:
                  apps=list(mounts[0].glob('*.app'));assert len(apps)==1
                  exe=apps[0]/'Contents/MacOS/coding-tools-mcp-desktop'
                  assert subprocess.run([str(exe),'--version'],capture_output=True,text=True,check=True,timeout=20).stdout.strip()==expected
                  assert hashlib.sha256(exe.read_bytes()).digest()==hashlib.sha256(binaries[0].read_bytes()).digest()
                  for vendor in ('paseo','anneal'):assert list(apps[0].glob('Contents/Resources/third-party/'+vendor+'/LICENSE'))
              finally:subprocess.run(['hdiutil','detach',str(mounts[0])],check=True)
          name='Coding.Tools.MCP_'+os.environ['VERSION']+('_x64-setup.exe' if win else '_aarch64.dmg')
          dest=Path('aiTemp/installer')/name;assert not dest.exists();shutil.copy2(assets[0],dest)
          proof={'source_commit':os.environ['SOURCE'],'version':os.environ['VERSION'],'platform':os.environ['PLATFORM'],'asset':name,'size':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'screenshot_storage':'memory_only','native_fixture_verified':win,'codex_invoked':False,'external_adapters':'read_only_loopback','experimental_sandbox_bundled':False,'publisher_signed':False,'actual_user_connections_verified':False}
          for folder in ('installer','evidence'):Path('aiTemp',folder,'proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: center-installer-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/app/aiTemp/installer/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: center-evidence-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/app/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
