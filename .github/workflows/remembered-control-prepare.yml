name: Remembered control preparation
on:
  push:
    branches: [release/remembered-control-0.3.6-rc.1]
    paths: ['.github/workflows/remembered-control-prepare.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remembered-control-prepare
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          path: aiTemp/source
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Preserve originals and materialize the exact staged patch
        id: source
        working-directory: aiTemp/source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/prepared
          python - <<'PY'
          import base64,hashlib,lzma,os,re,shutil,subprocess
          from pathlib import Path,PurePosixPath
          commits=['5cbfde8447e23f6367aa183d737bfd9495d85476','c62720a05a6aa04ce67de26a61472e9c553756f2','6de27068f1dc5e4bb58c9577b1e6a666978d90c8']
          parts=[]
          for commit in commits:
              names=subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r',commit],text=True).splitlines()
              assert len(names)==1 and names[0].startswith('aiTemp/') and '.b64.part' in names[0], names
              parts.append(subprocess.check_output(['git','show',commit+':'+names[0]],text=True).strip())
          data=lzma.decompress(base64.b64decode(''.join(parts),validate=True))
          assert len(data)<2000000
          assert not re.search(rb'^(deleted file mode|rename |copy |old mode|new mode|\+\+\+ /dev/null)',data,re.M)
          paths=[raw.decode() for raw in re.findall(rb'^\+\+\+ b/(.+)$',data,re.M)]
          assert paths and len(set(paths))==len(paths)
          for name in paths:
              p=PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name.startswith(('src/','src-tauri/','native-sandbox/','docs/features/','docs/releases/')) or name in ('package.json','package-lock.json')
              assert not Path(name).is_symlink()
          patch=Path('aiTemp/prepared/input.patch');patch.write_bytes(data)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          for name in paths:
              p=Path(name)
              if p.exists():
                  dest=Path('aiTemp/Trash/remembered-originals')/os.environ['GITHUB_RUN_ID']/name
                  dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,dest)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name in paths:
              if name.endswith('.rs'):subprocess.run(['rustfmt','--edition','2021','--config','skip_children=true',name],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          Path('aiTemp/prepared/input-sha256.txt').write_text(hashlib.sha256(data).hexdigest()+'\n')
          Path('aiTemp/prepared/paths.txt').write_text('\n'.join(paths)+'\n')
          print('Materialized',len(paths),'production files; patch SHA256',hashlib.sha256(data).hexdigest())
          PY
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          git commit -m 'feat: remembered application grants, background window observation and local sandbox helper'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > aiTemp/prepared/source-sha.txt
          git archive --format=zip HEAD --output=aiTemp/prepared/source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remembered-prepared-${{ github.run_id }}
          path: aiTemp/source/aiTemp/prepared/*
          if-no-files-found: error
          retention-days: 14
  sandbox:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/sandbox-target
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          path: aiTemp/source
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Compile the local-only sandbox helper
        working-directory: aiTemp/source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/sandbox-evidence
          cat native-sandbox/Cargo.toml | tee aiTemp/sandbox-evidence/manifest.txt
          cargo build --release --manifest-path native-sandbox/Cargo.toml 2>&1 | tee aiTemp/sandbox-evidence/build.txt
          git rev-parse HEAD > aiTemp/sandbox-evidence/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remembered-sandbox-${{ github.run_id }}
          path: |
            aiTemp/source/aiTemp/sandbox-evidence/*
            aiTemp/source/native-sandbox/Cargo.lock
          if-no-files-found: error
          retention-days: 14
