name: Rust port validation

on:
  pull_request:
    branches:
      - integration/xyTom-v0.3.0
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: rust-port-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'validation/rust-port-')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-rust-port-linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-port-linux

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  rust-windows:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'validation/rust-port-')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-rust-port-windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-port-windows

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  rust-macos:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'validation/rust-port-')
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-rust-port-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-port-macos

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
