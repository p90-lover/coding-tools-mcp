name: Provider Hub multi-account and global proxy

# Permanent exact-head gate for Provider Hub accounts, proxy routing, typed IPC, and renderer delivery.
on:
  push:
    branches:
      - feature/v0.7.0-provider-multiaccount-global-proxy
    paths:
      - desktop-electron/electron/main-with-provider.cjs
      - desktop-electron/electron/provider-bootstrap.cjs
      - desktop-electron/electron/provider-network.cjs
      - desktop-electron/electron/provider-execution-router.cjs
      - desktop-electron/electron/preload.cjs
      - desktop-electron/src/network/**
      - desktop-electron/src/providers/**
      - desktop-electron/src/App.tsx
      - desktop-electron/src/main.tsx
      - desktop-electron/src/types.ts
      - desktop-electron/src/styles.css
      - desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs
      - desktop-electron/tests/provider-execution-router.test.cjs
      - desktop-electron/tests/proxy-provider-contract.test.cjs
      - desktop-electron/tests/provider-proxy-domain.test.cjs
      - desktop-electron/package.json
      - desktop-electron/bun.lock
      - .github/workflows/provider-multiaccount-global-proxy.yml
  pull_request:
    paths:
      - desktop-electron/electron/main-with-provider.cjs
      - desktop-electron/electron/provider-bootstrap.cjs
      - desktop-electron/electron/provider-network.cjs
      - desktop-electron/electron/provider-execution-router.cjs
      - desktop-electron/electron/preload.cjs
      - desktop-electron/src/network/**
      - desktop-electron/src/providers/**
      - desktop-electron/src/App.tsx
      - desktop-electron/src/main.tsx
      - desktop-electron/src/types.ts
      - desktop-electron/src/styles.css
      - desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs
      - desktop-electron/tests/provider-execution-router.test.cjs
      - desktop-electron/tests/proxy-provider-contract.test.cjs
      - desktop-electron/tests/provider-proxy-domain.test.cjs
      - desktop-electron/package.json
      - desktop-electron/bun.lock
      - .github/workflows/provider-multiaccount-global-proxy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-hub-global-proxy-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/bun-cache-provider-hub

jobs:
  focused-provider-hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Prepare retained temporary directories
        run: mkdir -p aiTemp/provider-hub/renderer-dist aiTemp/Trash/provider-hub

      - name: Install exact Electron dependencies
        run: bun install --cwd desktop-electron --frozen-lockfile

      - name: Validate provider runtime syntax
        run: |
          node --check desktop-electron/electron/main-with-provider.cjs
          node --check desktop-electron/electron/provider-bootstrap.cjs
          node --check desktop-electron/electron/provider-network.cjs
          node --check desktop-electron/electron/provider-execution-router.cjs
          node --check desktop-electron/electron/preload.cjs

      - name: Run focused Provider Hub and proxy contracts
        run: |
          node --test \
            desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs \
            desktop-electron/tests/provider-execution-router.test.cjs \
            desktop-electron/tests/proxy-provider-contract.test.cjs \
            desktop-electron/tests/provider-proxy-domain.test.cjs

      - name: Typecheck Electron renderer
        run: bun run --cwd desktop-electron typecheck

      - name: Build Electron renderer into aiTemp evidence
        run: |
          cd desktop-electron
          bunx vite build \
            --outDir ../aiTemp/provider-hub/renderer-dist \
            --emptyOutDir

      - name: Enforce no file deletion
        shell: bash
        run: |
          deleted="$(git diff -M --diff-filter=D --name-only HEAD^ HEAD)"
          if [ -n "$deleted" ]; then
            printf 'Deleted paths are forbidden:\n%s\n' "$deleted" >&2
            exit 1
          fi

      - name: Preserve transient dependencies in Trash
        if: always()
        shell: bash
        run: |
          target="aiTemp/Trash/provider-hub/node_modules-$GITHUB_RUN_ID"
          if [ -d desktop-electron/node_modules ]; then
            mv desktop-electron/node_modules "$target"
          fi
