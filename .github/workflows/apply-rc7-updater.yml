name: Apply rc.7 updater repair

on:
  push:
    branches:
      - integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater
    paths:
      - 'aiTemp/rc7-updater/apply_updater.py'
      - '.github/workflows/apply-rc7-updater.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rc7-updater-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/rc7-updater/bun-cache

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater
          fetch-depth: 0
          clean: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Prepare retained temporary directories
        run: mkdir -p aiTemp/rc7-updater/evidence aiTemp/Trash/rc7-updater

      - name: Apply guarded updater patch
        run: |
          python aiTemp/rc7-updater/apply_updater.py | tee aiTemp/rc7-updater/evidence/materializer.txt
          grep -F RC7_UPDATER_PATCH_APPLIED aiTemp/rc7-updater/evidence/materializer.txt

      - name: Validate bounded source changes
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          git diff --name-only | tee aiTemp/rc7-updater/evidence/changed-files.txt
          allowed='^(desktop-electron/electron/(update|state|preload|main)\.cjs|desktop-electron/src/(types|App)\.tsx?|desktop-electron/tests/update\.test\.cjs)$'
          unexpected="$(grep -Ev "$allowed" aiTemp/rc7-updater/evidence/changed-files.txt || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected updater paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Validate runtime syntax
        run: |
          node --check desktop-electron/electron/update.cjs
          node --check desktop-electron/electron/state.cjs
          node --check desktop-electron/electron/preload.cjs
          node --check desktop-electron/electron/main.cjs

      - name: Install exact Electron dependencies
        run: bun install --cwd desktop-electron --frozen-lockfile

      - name: Run updater tests and focused rc.7 updater contract
        run: |
          node --test desktop-electron/tests/update.test.cjs
          node --test \
            --test-name-pattern='the updater supports manual refresh, periodic discovery, and one-click install' \
            desktop-electron/tests/rc7-full-integration-contract.test.cjs

      - name: Typecheck and build production renderer
        run: |
          bun run --cwd desktop-electron typecheck
          original=""
          if [ -d desktop-electron/dist ]; then
            original="aiTemp/Trash/rc7-updater/original-dist-$GITHUB_RUN_ID"
            mv desktop-electron/dist "$original"
          fi
          restore() {
            if [ -d desktop-electron/dist ]; then
              mv desktop-electron/dist "aiTemp/Trash/rc7-updater/validated-dist-$GITHUB_RUN_ID"
            fi
            if [ -n "$original" ] && [ -d "$original" ]; then
              mv "$original" desktop-electron/dist
            fi
          }
          trap restore EXIT
          bun run --cwd desktop-electron build:renderer
          restore
          trap - EXIT

      - name: Commit verified updater implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            desktop-electron/electron/update.cjs \
            desktop-electron/electron/state.cjs \
            desktop-electron/electron/preload.cjs \
            desktop-electron/electron/main.cjs \
            desktop-electron/src/types.ts \
            desktop-electron/src/App.tsx \
            desktop-electron/tests/update.test.cjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Updater implementation already committed.'
            exit 0
          fi
          git commit -m 'fix(rc7): add reliable periodic and one-click self-update'
          git push origin HEAD:integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater

      - name: Preserve transient dependencies in Trash
        if: always()
        run: |
          mkdir -p aiTemp/Trash/rc7-updater
          if [ -d desktop-electron/node_modules ]; then
            mv desktop-electron/node_modules "aiTemp/Trash/rc7-updater/node_modules-$GITHUB_RUN_ID"
          fi
