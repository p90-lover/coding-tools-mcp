name: Native final lifecycle diagnostic
on:
  push:
    branches: [release/verified-integration-0.4.2-rc.1]
    paths: ['.github/workflows/native-final-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SOURCE: ${{ github.sha }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/native-trace-cargo
    defaults:
      run:
        working-directory: aiTemp/checkout
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: aiTemp/checkout
          ref: ${{ github.sha }}
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Trace synthetic notification identity without production logging
        run: |
          set -euo pipefail
          python scripts/native_bridge_ci.py probe-init
          python - <<'PY'
          from pathlib import Path
          import shutil
          p=Path('src-tauri/src/codex_bridge/mod.rs')
          backup=Path('aiTemp/Trash/native-final-trace/mod.rs');backup.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,backup)
          s=p.read_text(encoding='utf-8')
          marker='        if let Some(method) = value["method"].as_str() {\n'
          assert s.count(marker)==1
          s=s.replace(marker,marker+'''            #[cfg(test)]
                      if std::env::var_os("NATIVE_CODEX_PROBE_BIN").is_some() {
                          let p = &value["params"];
                          eprintln!("NATIVE_IDENTITY method={} thread={} turn={} turnObj={} item={} status={}", method,
                              p["threadId"], p["turnId"], p["turn"]["id"],p["item"]["type"], p["turn"]["status"]);
                      }
          ''',1)
          marker='        match result {\n            Ok(value) => {\n'
          assert s.count(marker)==1
          s=s.replace(marker,marker+'''                #[cfg(test)]
                          eprintln!("CONTROL_RESULT operation={} response={}",request.operation,value);
          ''',1)
          p.write_text(s,encoding='utf-8')
          p=Path('aiTemp/release-verification/native_turn_fixture.rs')
          backup=Path('aiTemp/Trash/native-final-trace/fixture.rs');shutil.copy2(p,backup)
          s=p.read_text(encoding='utf-8')
          marker='    let n = count.fetch_add(1, Ordering::SeqCst) + 1;\n'
          assert s.count(marker)==1
          p.write_text(s.replace(marker,marker+'    eprintln!("SYNTHETIC_RESPONSE_NUMBER {n}");\n',1),encoding='utf-8')
          PY
      - name: Verify official native binary
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ASSET: codex-x86_64-pc-windows-msvc.exe.tar.gz
        run: python scripts/native_bridge_ci.py download-native
      - name: Trace one real lifecycle
        run: |
          set -euo pipefail
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_bridge_actual_turns_against_loopback_fixture -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-trace.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-final-trace-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          retention-days: 14
          if-no-files-found: warn
