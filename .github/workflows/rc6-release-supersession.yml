name: Supersede stale rc.6 publishers

on:
  push:
    branches:
      - release/codex-router-multiprovider-0.7.0-rc.6
    paths:
      - '.github/workflows/rc6-release-supersession.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-router-multiprovider-release-0.7.0-rc.6
  cancel-in-progress: true

jobs:
  supersede-and-retrigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/codex-router-multiprovider-0.7.0-rc.6
          fetch-depth: 0

      - name: Record the authoritative release source retrigger
        run: |
          set -euo pipefail
          mkdir -p aiTemp/release-supersession
          marker="aiTemp/release-supersession/retrigger-$GITHUB_SHA.txt"
          test ! -e "$marker"
          printf 'superseded_by=%s\nsource_branch=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" > "$marker"
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"

      - name: Push a regular-file retrigger after stale publishers are cancelled
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aiTemp/release-supersession/
          git commit -m 'release(rc6): retrigger exact UI parity source after supersession'
          git push origin HEAD:release/codex-router-multiprovider-0.7.0-rc.6
