name: Native Codex CI fix materializer

on:
  pull_request:
    branches:
      - automation/native-codex-ci-fix-base
    paths:
      - "aiTemp/Trash/native-codex-ci-fix/**"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/native-codex-long-session
          persist-credentials: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Apply exact Clippy fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/src/codex_bridge/mod.rs")
          text = path.read_text(encoding="utf-8")
          old = """        let mut memory = Memory::default();\n        memory.requests_used = 25;\n"""
          new = """        let mut memory = Memory {\n            requests_used: 25,\n            ..Default::default()\n        };\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one Clippy target, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check
          git diff --exit-code -- src-tauri/src/codex_bridge/native_command.rs src/CodexRuntimePanel.svelte docs/native-codex-app-server.md
          git diff -- src-tauri/src/codex_bridge/mod.rs
      - name: Commit exact source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/codex_bridge/mod.rs
          git commit -m "test: satisfy strict Clippy for long-session fixture"
          git push origin HEAD:feat/native-codex-long-session
