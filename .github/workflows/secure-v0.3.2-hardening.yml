name: Secure v0.3.2 hardening and portability

on:
  push:
    branches:
      - security/secure-v0.3.2-hardening
    paths:
      - "aiTemp/security-hardening/apply_post_rc1_hardening.py"
      - "aiTemp/security-hardening/apply_oauth_connection_compatibility.py"
      - "aiTemp/security-hardening/fix_dynamic_client_byte_literals.py"
      - "aiTemp/security-hardening/apply_trash_boundary_completion.py"
      - "aiTemp/security-hardening/apply_request_capacity_tests.py"
      - "aiTemp/security-hardening/apply_clippy_hygiene.py"
      - "aiTemp/security-hardening/apply_auth_and_write_queue_limits.py"
      - ".github/workflows/secure-v0.3.2-hardening.yml"

permissions: {}

concurrency:
  group: secure-v0.3.2-hardening-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  HARDENING_BRANCH: security/secure-v0.3.2-hardening

jobs:
  materialize-and-test:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.identity.outputs.base_sha }}
      patch_sha256: ${{ steps.package.outputs.patch_sha256 }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-secure-v0.3.2-hardening-linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HARDENING_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the immutable source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'base_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: secure-v0.3.2-hardening-linux

      - name: Materialize all hardening layers with recoverable backups
        shell: bash
        run: |
          set -euo pipefail
          python aiTemp/security-hardening/apply_post_rc1_hardening.py
          python aiTemp/security-hardening/apply_oauth_connection_compatibility.py
          python aiTemp/security-hardening/fix_dynamic_client_byte_literals.py
          python aiTemp/security-hardening/apply_trash_boundary_completion.py
          python aiTemp/security-hardening/apply_request_capacity_tests.py
          python aiTemp/security-hardening/apply_clippy_hygiene.py
          python aiTemp/security-hardening/apply_auth_and_write_queue_limits.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check
          if git diff --name-status | grep -q '^D'; then
            echo "Refusing security hardening because a file was deleted."
            git diff --name-status
            exit 1
          fi

      - name: Preserve the current v0.3.1 baseline before release bump
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          expected = "0.3.1"
          actual = {
              "package.json": json.loads(Path("package.json").read_text(encoding="utf-8")).get("version"),
              "src-tauri/tauri.conf.json": json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8")).get("version"),
              "src-tauri/Cargo.toml": tomllib.loads(Path("src-tauri/Cargo.toml").read_text(encoding="utf-8")).get("package", {}).get("version"),
          }
          mismatches = {path: version for path, version in actual.items() if version != expected}
          if mismatches:
              raise SystemExit(f"hardening unexpectedly changed release versions: {mismatches}")
          print("v0.3.1 baseline preserved")
          PY

      - name: Assert compatible fail-closed boundaries
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings 'CorsLayer::permissive()' \
            src-tauri/src/mcp/listener.rs src-tauri/src/actions/listener.rs; then
            echo "Permissive browser-wide CORS remains enabled."
            exit 1
          fi
          python - <<'PY'
          import re
          from pathlib import Path

          for name in ("src-tauri/src/tools/patch.rs", "src-tauri/src/tools/file.rs"):
              production = Path(name).read_text(encoding="utf-8").partition("#[cfg(test)]")[0]
              if re.search(r"(?:std::)?fs::remove_(?:file|dir|dir_all)\(", production):
                  raise SystemExit(f"irreversible deletion remains in {name}")
          print("verified: production deletion is routed to recoverable aiTemp/Trash moves")
          PY
          grep -q 'return valid_dynamic_client_id(client_id);' src-tauri/src/auth/oauth_flow.rs
          grep -q "!matches!(byte, b'&' | b'=' | b'<' | b'>' | 0x22 | 0x27)" src-tauri/src/auth/oauth_flow.rs
          if grep -q "b'''" src-tauri/src/auth/oauth_flow.rs; then
            echo "Invalid generated apostrophe byte literal remains."
            exit 1
          fi
          grep -q 'OAUTH_MAX_PENDING_CODES' src-tauri/src/auth/oauth_flow.rs
          grep -q 'redirect_uri_allowed(&params.redirect_uri)' src-tauri/src/auth/oauth_flow.rs
          grep -q 'redirect_uri_allowed(&form.redirect_uri)' src-tauri/src/auth/oauth_flow.rs
          if grep -q 'stable_oauth_client_id(' src-tauri/src/runtime/supervisor.rs; then
            echo "Hidden runtime-only OAuth client-ID substitution remains."
            exit 1
          fi
          grep -q 'DefaultBodyLimit::max' src-tauri/src/mcp/listener.rs
          grep -q 'DefaultBodyLimit::max' src-tauri/src/actions/listener.rs
          grep -q 'spawn_blocking' src-tauri/src/actions/listener.rs
          grep -q 'trash_root.starts_with(&canonical)' src-tauri/src/tools/trash.rs
          grep -q 'refusing to move Git internals into recovery Trash' src-tauri/src/tools/trash.rs
          grep -q 'ensure_no_symlink_components' src-tauri/src/tools/trash.rs
          grep -q 'std::hint::black_box(MAX_REQUEST_BODY_BYTES)' src-tauri/src/mcp/listener.rs
          grep -q 'std::hint::black_box(MAX_REQUEST_BODY_BYTES)' src-tauri/src/actions/listener.rs
          grep -q 'MAX_IN_FLIGHT_AUTH_REQUESTS' src-tauri/src/mcp/listener.rs
          grep -q 'MAX_IN_FLIGHT_AUTH_REQUESTS' src-tauri/src/actions/listener.rs
          test "$(grep -c 'acquire_oauth_slot(&state).await' src-tauri/src/mcp/listener.rs)" -ge 3
          test "$(grep -c 'acquire_oauth_slot(&state).await' src-tauri/src/actions/listener.rs)" -ge 3
          grep -q 'Actions mutating request queue is temporarily full' src-tauri/src/actions/listener.rs

      - name: Test OAuth identity redirect replay and bounded state
        working-directory: src-tauri
        run: |
          cargo test --locked security_hardening_tests -- --nocapture
          cargo test --locked auth::refresh_tokens -- --nocapture
          cargo test --locked auth::oauth_flow::tests -- --nocapture
          cargo test --locked oauth_capacity_hardening_tests -- --nocapture

      - name: Test recoverable Trash and protected deletion boundaries
        working-directory: src-tauri
        run: |
          cargo test --locked tools::trash -- --nocapture
          cargo test --locked --test call_tool_security apply_patch_allows_deleting_a_normal_file -- --nocapture
          cargo test --locked --test call_tool_security deleting_readme_requires_explicit_confirmation -- --nocapture
          cargo test --locked --test call_tool_security deleting_git_assets_is_always_rejected -- --nocapture
          cargo test --locked elevation_requests_are_always_blocked -- --nocapture

      - name: Test bounded MCP and Actions request capacity
        working-directory: src-tauri
        run: cargo test --locked request_capacity_hardening_tests -- --nocapture

      - name: Run complete locked Rust matrix and strict Clippy
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run complete frontend validation
        run: |
          mkdir -p aiTemp/npm-cache
          npm ci --cache aiTemp/npm-cache
          npm run check
          npm run build
          node --test tests/*.test.mjs

      - name: Package the exact verified source delta
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/security-hardening/verified-v0.3.2
          git diff --binary -- \
            src-tauri/src \
            src-tauri/tests \
            src > aiTemp/security-hardening/verified-v0.3.2/security-hardening.patch
          test -s aiTemp/security-hardening/verified-v0.3.2/security-hardening.patch
          git diff --name-status -- \
            src-tauri/src \
            src-tauri/tests \
            src > aiTemp/security-hardening/verified-v0.3.2/changed-files.txt
          if grep -q '^D' aiTemp/security-hardening/verified-v0.3.2/changed-files.txt; then
            echo "Refusing to package a source deletion."
            exit 1
          fi
          sha256sum aiTemp/security-hardening/verified-v0.3.2/security-hardening.patch \
            > aiTemp/security-hardening/verified-v0.3.2/SHA256SUMS.txt
          patch_sha256="$(cut -d' ' -f1 aiTemp/security-hardening/verified-v0.3.2/SHA256SUMS.txt)"
          printf 'patch_sha256=%s\n' "$patch_sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: verified-secure-v0.3.2-hardening-${{ steps.identity.outputs.base_sha }}
          path: aiTemp/security-hardening/verified-v0.3.2/
          if-no-files-found: error
          retention-days: 7

  commit-verified-source:
    needs: materialize-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      committed_sha: ${{ steps.commit.outputs.committed_sha }}
    env:
      BASE_SHA: ${{ needs.materialize-and-test.outputs.base_sha }}
      PATCH_SHA256: ${{ needs.materialize-and-test.outputs.patch_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: verified-secure-v0.3.2-hardening-${{ env.BASE_SHA }}
          path: aiTemp/security-hardening/verified-v0.3.2

      - name: Verify immutable branch and exact tested artifact
        shell: bash
        run: |
          set -euo pipefail
          live_sha="$(git ls-remote origin "refs/heads/$HARDENING_BRANCH" | cut -f1)"
          test "$live_sha" = "$BASE_SHA"
          actual_sha="$(sha256sum aiTemp/security-hardening/verified-v0.3.2/security-hardening.patch | cut -d' ' -f1)"
          test "$actual_sha" = "$PATCH_SHA256"
          (cd aiTemp/security-hardening/verified-v0.3.2 && sha256sum -c SHA256SUMS.txt)
          if grep -q '^D' aiTemp/security-hardening/verified-v0.3.2/changed-files.txt; then
            echo "Refusing to commit a deletion."
            exit 1
          fi

      - name: Apply only the already-tested source delta
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --binary aiTemp/security-hardening/verified-v0.3.2/security-hardening.patch
          git diff --cached --check
          if git diff --cached --name-status | grep -q '^D'; then
            echo "Refusing to commit a deleted file."
            exit 1
          fi
          allowed='^(src-tauri/src/|src-tauri/tests/|src/)'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Verified artifact touched unexpected paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit without force-push branch deletion or file deletion
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: prevent unauthorized auth and preserve deletion recovery"
          git push origin "HEAD:$HARDENING_BRANCH"
          printf 'committed_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  portability:
    needs: commit-verified-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-14
            label: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-secure-v0.3.2-${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit-verified-source.outputs.committed_sha }}

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: secure-v0.3.2-${{ matrix.label }}

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run locked Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Run strict Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: "20"
          cache: npm

      - name: Validate frontend on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p aiTemp/npm-cache
          npm ci --cache aiTemp/npm-cache
          npm run check
          npm run build
          node --test tests/*.test.mjs
