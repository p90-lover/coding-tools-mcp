name: Model-free commands and workflow sync
on:
  push:
    branches: [release/workflow-sync-0.4.3-rc.1]
    paths: ['.github/workflows/workflow-sync-verify.yml', 'aiTemp/release-043/**', 'src/**', 'src-tauri/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-sync-043
  cancel-in-progress: false
env:
  VERSION: 0.4.3-rc.1
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Commit verified payload as inspectable production source
        id: source
        working-directory: aiTemp/checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python aiTemp/release-043/materialize.py
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: model-free native commands and workspace-scoped shared workflow board'
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
            test "$remote" = "$GITHUB_SHA"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p aiTemp/prepared
          git archive HEAD --format=zip --output=aiTemp/prepared/source.zip
          git rev-parse HEAD > aiTemp/prepared/source.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workflow-043-source-${{ github.run_id }}
          path: |
            aiTemp/checkout/aiTemp/prepared/*
            aiTemp/checkout/aiTemp/evidence/preparation.txt
          retention-days: 14
          if-no-files-found: warn
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundle: nsis
            native: codex-x86_64-pc-windows-msvc.exe.tar.gz
          - os: macos-15
            platform: macos-aarch64
            bundle: app,dmg
            native: codex-aarch64-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/app-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      CI: 'true'
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Pin native command runtime without an agent or provider
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ASSET: ${{ matrix.native }}
        run: |
          set -euo pipefail
          python scripts/native_bridge_ci.py probe-init
          python scripts/native_bridge_ci.py download-native
      - name: Compile in the verified native runtime identity
        run: |
          set -euo pipefail
          test "${#NATIVE_CODEX_PROBE_SHA256}" -eq 64
          echo "CODING_TOOLS_COMMAND_NATIVE_SHA256=$NATIVE_CODEX_PROBE_SHA256" >> "$GITHUB_ENV"
      - name: Real native commands deny writes with zero inference requests
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/native-command-target
        run: |
          set -euo pipefail
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_043_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/native-command-contract.txt
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_043_actual_commands_no_model_and_write_denial -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-command-real.txt
          grep -F 'PASS: real native command/exec, read-only write denial, exact replay receipt, zero model/provider requests, zero threads, and Stop revocation' aiTemp/evidence/native-command-real.txt
      - name: Check and build actual bilingual frontend
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
      - name: Real persistent board permission and MCP transport checks
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib workflow_043_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/workflow-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib connection_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/connection-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib core_catalog_exposes_chatgpt_compatible_tools -- --test-threads=1 2>&1 | tee aiTemp/evidence/catalog-tests.txt
          grep -F '2 passed; 0 failed' aiTemp/evidence/workflow-tests.txt
          grep -F '2 passed; 0 failed' aiTemp/evidence/catalog-tests.txt
      - name: Build and inspect actual installer and licenses
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles ${{ matrix.bundle }} -- --locked 2>&1 | tee aiTemp/evidence/installer.txt
          python aiTemp/release-043/package_proof.py
          test -z "$(git diff --name-only)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workflow-043-installer-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/installer/*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workflow-043-evidence-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          retention-days: 14
          if-no-files-found: error
  board:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/aiTemp/pip-cache
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Build UI and provide CJK glyphs for real browser rendering
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install playwright==1.57.0
      - name: Real rendered drag and shared refresh without losing human drafts
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,sys,time,urllib.request
          from pathlib import Path
          log=Path('aiTemp/evidence/vite.txt').open('w')
          process=subprocess.Popen(['node','node_modules/vite/bin/vite.js','--host','127.0.0.1','--port','1420','--strictPort'],stdout=log,stderr=subprocess.STDOUT)
          try:
              for attempt in range(60):
                  if process.poll() is not None:raise RuntimeError('Frontend exited')
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:1420/work',timeout=2) as response:
                          if response.status==200:break
                  except OSError:time.sleep(.25)
              else:raise RuntimeError('Frontend did not become ready')
              subprocess.run([sys.executable,'aiTemp/release-043/board_ui_sync.py'],check=True)
          finally:
              process.terminate()
              try:process.wait(timeout=10)
              except subprocess.TimeoutExpired:process.kill();process.wait()
              log.close()
          PY
          test -z "$(git diff --name-only)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workflow-043-board-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: [prepare,verify,board]
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - name: Re-download verify and publish exact-source release
        working-directory: aiTemp/checkout
        run: python aiTemp/release-043/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workflow-043-receipt-${{ github.run_id }}
          path: |
            aiTemp/checkout/aiTemp/release-receipt.json
            aiTemp/checkout/aiTemp/draft-id.txt
          retention-days: 14
          if-no-files-found: warn
