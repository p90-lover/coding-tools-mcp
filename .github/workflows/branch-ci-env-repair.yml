name: Branch CI environment repair

on:
  push:
    branches:
      - subagent/electron-full-harness-ci-0.6.0-rc.1-20260914
    paths:
      - .github/workflows/branch-ci-env-repair.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          clean: false
          fetch-depth: 0

      - name: Apply exact job-context repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/electron-full-harness-ci.yml')
          source = workflow.read_text(encoding='utf-8')
          expression_open = '$' + '{{'
          expression_close = '}}'
          old = (
              'CARGO_TARGET_DIR: '
              + expression_open
              + ' github.workspace '
              + expression_close
              + '/aiTemp/cargo-target-'
              + expression_open
              + ' runner.os '
              + expression_close
          )
          new = (
              'CARGO_TARGET_DIR: '
              + expression_open
              + ' github.workspace '
              + expression_close
              + '/aiTemp/cargo-target-'
              + expression_open
              + ' matrix.os '
              + expression_close
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'EXPECTED_ONE_CARGO_TARGET_MATCH: found {count}')
          workflow.write_text(source.replace(old, new), encoding='utf-8')
          if new not in workflow.read_text(encoding='utf-8'):
              raise SystemExit('MATRIX_CONTEXT_REPAIR_NOT_WRITTEN')
          PY
          git diff --check
          git diff -- .github/workflows/electron-full-harness-ci.yml \
            | tee aiTemp/evidence/runner-context-fix.diff

      - name: Validate repaired workflow before commit
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -format '{{json .}}' \
            .github/workflows/electron-full-harness-ci.yml \
            2>&1 | tee aiTemp/evidence/actionlint-after-repair.jsonl
          node --test tests/electron-full-harness-ci.test.mjs \
            2>&1 | tee aiTemp/evidence/full-harness-ci-contract-after-repair.txt

      - name: Commit the verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/electron-full-harness-ci.yml
          git diff --cached --quiet && {
            echo 'REPAIR_PRODUCED_NO_CHANGE' >&2
            exit 1
          }
          git commit -m 'fix(ci): use matrix context for Rust target directory'
          git push origin HEAD:subagent/electron-full-harness-ci-0.6.0-rc.1-20260914

      - name: Retain repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branch-ci-env-repair-${{ github.sha }}
          path: aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
