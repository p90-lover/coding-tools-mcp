name: Reproduce Quick Tunnel responsiveness gaps
on:
  push:
    branches: [fix/quicktunnel-fast-control-0.4.4-rc.4]
    paths: [.github/workflows/quicktunnel-red.yml]
permissions: {contents: read}
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/quick-red-target
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, clean: false, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - name: Require actual released code to demonstrate each bounded defect
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python aiTemp/quicktunnel/unit_probe.py
          python aiTemp/quicktunnel/unit_schema.py
          set +e
          cargo test --manifest-path aiTemp/quick-unit/Cargo.toml quick_ -- --test-threads=1 --nocapture > aiTemp/evidence/quick-red.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 101
          grep -F CONTROL_BLOCKED_BY_BUSY_TOOL_WORKERS aiTemp/evidence/quick-red.txt
          grep -F PROBE_REBUILDS_CLIENT_EVERY_CALL aiTemp/evidence/quick-red.txt
          grep -F RECOVERABLE_SCHEMA_NOT_WIRED aiTemp/evidence/quick-red.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'quick-red-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
