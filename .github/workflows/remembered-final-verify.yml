name: Verify final remembered-control release
on:
  push:
    branches: [release/remembered-control-final]
    paths: ['.github/workflows/remembered-final-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: final-remembered-${{ github.ref }}
  cancel-in-progress: false
env:
  VERSION: 0.3.6-rc.1
  SOURCE: ${{ github.sha }}
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  OTEL_SDK_DISABLED: 'true'
jobs:
  native:
    if: github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aiTemp/checkout
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Frontend and memory-only contract
        run: |
          set -euo pipefail
          python aiTemp/release-verification/run_step.py frontend
          python - <<'PY'
          from pathlib import Path
          assert 'sandbox_account_acl_not_path_whitelist' in Path('src-tauri/src/tools/native_sandbox.rs').read_text(encoding='utf-8')
          assert 'read-only scoped filesystem' not in Path('src-tauri/src/tools/registry.rs').read_text(encoding='utf-8')
          assert 'shared readable files outside the workspace may remain accessible' in Path('src/lib/components/SandboxControl.svelte').read_text(encoding='utf-8')
          print('PASS: API and explicit local consent describe the actual Windows read boundary')
          PY
      - name: Require the exact completed helper build stage
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess,time
          repo=os.environ['GITHUB_REPOSITORY']
          for attempt in range(60):
              result=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/34206606095/jobs?per_page=100'],timeout=30))
              jobs=[j for j in result['jobs'] if j['name']=='native (windows-latest, windows-x64)']
              assert len(jobs)==1
              steps={s['name']:s for s in jobs[0]['steps']}
              required=['Compile only pinned sandbox helpers','Preserve compiled helpers before isolation testing']
              if all(steps[name]['conclusion']=='success' for name in required): break
              assert not any(steps[name]['conclusion'] in ('failure','cancelled','skipped') for name in required), 'Required helper build failed'
              time.sleep(5)
          else: raise RuntimeError('Exact helper artifact was not ready within the bounded preparation window')
          print('Exact helper compilation and preservation steps succeeded')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: runner.os == 'Windows'
        with:
          name: remembered-native-helpers-34206606095
          run-id: 34206606095
          github-token: ${{ github.token }}
          path: aiTemp/checkout/aiTemp/helper-artifact
      - name: Verify identical helper source and binary hashes
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python aiTemp/scope-correction/reuse_helpers.py
      - name: Native isolation with positive controls
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          python aiTemp/scope-correction/sandbox_native.py "$PWD/src-tauri/aiTemp/native-sandbox/coding-tools-codex-sandbox.exe" "$PWD/aiTemp/isolation" 2>&1 | tee aiTemp/evidence/sandbox-smoke.txt
      - name: Focused permission, vision and tool contracts
        run: python aiTemp/release-verification/run_step.py policy
      - name: Real Windows background observation and input
        if: runner.os == 'Windows'
        env:
          COMPUTER_USE_NATIVE_SMOKE: '1'
        run: python aiTemp/release-verification/run_step.py desktop
      - name: Build and verify actual installer resources
        env:
          CI: 'true'
        run: python aiTemp/release-verification/run_step.py installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remembered-installer-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/installer/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remembered-evidence-${{ matrix.platform }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
