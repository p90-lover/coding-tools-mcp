name: Headless Rust service RED
on:
  push:
    branches: [subagent/headless-rust-service-0.6.0-20260914]
    paths: [.github/workflows/headless-service-red.yml]
permissions: {contents: read}
jobs:
  missing_service:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/headless-red-target
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - name: Prove the approved headless service implementation does not exist yet
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          set +e
          python aiTemp/headless-service/probe.py > aiTemp/evidence/headless-red.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 101
          grep -F 'rust-core/coding-tools-headless/src/lib.rs' aiTemp/evidence/headless-red.txt
          grep -F 'No such file or directory' aiTemp/evidence/headless-red.txt
          echo 'HEADLESS_SERVICE_RED_PASS: authenticated lifecycle implementation is absent; no process, model, listener, or user data was touched'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: headless-service-red-${{ github.run_id }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
