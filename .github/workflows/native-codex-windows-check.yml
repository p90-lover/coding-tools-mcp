name: Native Codex Windows boundary recheck
on:
  push:
    branches: [feature/native-codex-runtime]
    paths: [.github/workflows/native-codex-windows-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    if: github.repository == 'p90-lover/coding-tools-mcp' && github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      CODEX_HOME: ${{ github.workspace }}/aiTemp/isolated-codex-home
      PYTHONDONTWRITEBYTECODE: '1'
      XDG_CONFIG_HOME: ${{ github.workspace }}/aiTemp/test-config
      PACKAGE: codex-npm-win32-x64-0.153.4.tgz
      DIGEST: 05f473573f38b3f4dc9484e6807a511a1bb0e128dfa50816dafc5f79e553cdca
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: aiTemp/source
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: aiTemp/source/src-tauri -> ../../../aiTemp/cargo-target
          shared-key: native-codex-windows
          cache-on-failure: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Record firewall state and enable enforcement only on this disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force aiTemp/evidence | Out-Null
          Get-NetFirewallProfile | Select-Object Name,Enabled,DefaultOutboundAction | ConvertTo-Json | Set-Content aiTemp/evidence/firewall-before.json
          Get-Service MpsSvc | Select-Object Name,Status | ConvertTo-Json | Set-Content aiTemp/evidence/firewall-service.json
          $disabled = @(Get-NetFirewallProfile | Where-Object { $_.Enabled -ne 'True' })
          if ($disabled.Count -gt 0) {
            Write-Host 'The disposable runner had disabled firewall profiles. Enabling them before native isolation tests.'
            Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          }
          Get-NetFirewallProfile | Select-Object Name,Enabled,DefaultOutboundAction | ConvertTo-Json | Set-Content aiTemp/evidence/firewall-after.json
          if (@(Get-NetFirewallProfile | Where-Object { $_.Enabled -ne 'True' }).Count -ne 0) { throw 'Firewall enforcement is unavailable' }
      - name: Reuse boundary assertions with an ordinary Windows write fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python - <<'PY'
          import pathlib,subprocess
          root=pathlib.Path.cwd()
          source=subprocess.check_output(['git','-C','aiTemp/source','show','b1dc60ca21277a48f2881e4c18df41cfb00fbb4e:.github/workflows/native-codex-platforms.yml']).decode()
          for name,out in [('Obtain checksum-pinned official native distribution','download.sh'),('Exercise production transport and policy with real Codex (no model calls)','proof.sh')]:
              section=source.split('      - name: '+name+'\n',1)[1].split('\n      - ',1)[0]
              script=section.split('        run: |\n',1)[1]
              lines=script.splitlines()
              assert all(not line or line.startswith('          ') for line in lines)
              script='\n'.join(line[10:] if line else '' for line in lines)+'\n'
              if out=='proof.sh':
                  old="[IO.File]::WriteAllText('{}','sandbox-proof')"
                  new="Set-Content -LiteralPath '{}' -Value 'sandbox-proof' -NoNewline -ErrorAction Stop"
                  assert script.count(old)==1
                  script=script.replace(old,new)
                  assert 'outside.exists()' in script and 'readonly.exists()' in script
                  assert 'successful(&blocked)' in script and 'successful(&control)' in script
                  anchor='cargo run --manifest-path aiTemp/native-proof/Cargo.toml'
                  assert script.count(anchor)==1
                  script=script.replace(anchor,"python ../native-diagnostics.py\n"+anchor)
              (root/'aiTemp'/out).write_text(script,encoding='utf-8')
          PY
          cat > aiTemp/native-diagnostics.py <<'PY'
          # Diagnostic-only copies under aiTemp with an empty isolated CODEX_HOME.
          # Production code and its error redaction remain unchanged.
          from pathlib import Path
          p=Path('aiTemp/native-proof/src/transport.rs')
          text=p.read_text()
          old='Err(format!("Codex RPC rejected the request (code {}). Check the local Codex login/configuration", message.pointer("/error/code").unwrap_or(&Value::Null)))'
          assert text.count(old)==1
          p.write_text(text.replace(old,'Err(format!("Isolated CI native error: {}", message["error"]))'))
          p=Path('aiTemp/native-proof/src/session.rs')
          text=p.read_text()
          old='fn receive(&self, message: Value) {'
          assert text.count(old)==1
          p.write_text(text.replace(old,old+'\n        if message["method"].as_str().is_some_and(|m| m.starts_with("windowsSandbox/")) { eprintln!("Isolated Windows setup event: {message}"); }'))
          PY
          bash aiTemp/download.sh
      - name: Re-run native write and network isolation with setup diagnostics
        shell: bash
        working-directory: aiTemp/source
        run: bash ../proof.sh
      - name: Record installed offline rules without account credentials
        if: always()
        shell: pwsh
        run: |
          Get-NetFirewallRule -Name 'codex_sandbox_offline*' -ErrorAction SilentlyContinue | Select-Object Name,Enabled,Profile,Direction,Action | ConvertTo-Json | Set-Content aiTemp/evidence/native-firewall-rules.json
      - name: Validate complete Windows Rust application and strict lint
        shell: bash
        working-directory: aiTemp/source/src-tauri
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked 2>&1 | tee ../../evidence/rust-tests.txt
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ../../evidence/clippy.txt
      - name: Validate production frontend
        shell: bash
        working-directory: aiTemp/source
        run: |
          set -euo pipefail
          npm ci
          npm run check 2>&1 | tee ../evidence/frontend.txt
          npm run build 2>&1 | tee ../evidence/frontend-build.txt
          node --test tests/*.test.mjs 2>&1 | tee ../evidence/contracts.txt
          git diff --exit-code
      - name: Preserve real Windows boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-native-recheck-${{ github.sha }}
          path: aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
