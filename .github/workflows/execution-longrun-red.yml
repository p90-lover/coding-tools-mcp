name: Long-run execution baseline
on:
  push:
    branches: [feature/paseo-anneal-execution-0.5.0]
    paths: [.github/workflows/execution-longrun-red.yml]
permissions: {contents: read}
jobs:
  baseline:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/longrun-target
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}',path: aiTemp/source,clean: false,persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - name: Actual lifecycle and response validation with original contract checks retained
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python aiTemp/execution/probe.py > aiTemp/evidence/original-contracts.txt 2>&1
          python - <<'PY'
          from pathlib import Path
          p=Path('aiTemp/execution-probe/src/lib.rs')
          with p.open('a') as f:f.write('\n#[cfg(test)] mod longrun { include!("'+Path('aiTemp/execution/longrun_contracts.rs').resolve().as_posix()+'");}\n')
          PY
          set +e
          cargo test --manifest-path aiTemp/execution-probe/Cargo.toml longrun_contract_ -- --test-threads=1 --nocapture > aiTemp/evidence/longrun-red.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 101
          grep -F LOST_START_MUST_REQUIRE_REVIEW_NOT_READY aiTemp/evidence/longrun-red.txt
          grep -F ANNEAL_ARCHIVE_RETURNS_TASK_DIRECTLY aiTemp/evidence/longrun-red.txt
          set +e
          node --test aiTemp/execution/computer_preview.test.mjs > aiTemp/evidence/preview-red.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -F UNNECESSARY_COMPUTER_PREVIEW_CAPTURE aiTemp/evidence/preview-red.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'execution-longrun-red-${{ github.run_id }}',path: aiTemp/source/aiTemp/evidence/,if-no-files-found: error,retention-days: 14}
