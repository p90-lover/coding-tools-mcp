name: Verified snapshot sandbox and permissions
on:
  push:
    branches: [fix/sandbox-permissions-0.4.4-rc.1]
    paths: [.github/workflows/snapshot-permission-release.yml, aiTemp/sandbox-permissions/prepare.py, 'src-tauri/src/tools/sandbox*.rs', src-tauri/src/tools/native_sandbox.rs, src-tauri/src/tools/catalog.rs, aiTemp/sandbox-permissions/contract.rs, 'native-helpers/app-container/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snapshot-sandbox-044
  cancel-in-progress: false
env:
  VERSION: 0.4.4-rc.1
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  windows:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 40
    permissions: {contents: write, actions: read}
    outputs:
      source: ${{ steps.source.outputs.source }}
    env:
      PLATFORM: windows-x64
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/snapshot-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/aiTemp/pip-cache
      EXTENSION_SOURCE_DIR: ${{ github.workspace }}/aiTemp/extension
      CODING_TOOLS_COMMAND_NATIVE_SHA256: 444a3f0008050605cae73cd9b7a2dcac61294062dfaab56dd20430fd6498518b
      CODING_TOOLS_SNAPSHOT_HELPER: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-appcontainer.exe
      CODING_TOOLS_SNAPSHOT_PROBE: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-sandbox-probe.exe
      APP_CONTAINER_HELPER: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-appcontainer.exe
      APP_CONTAINER_PROBE: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-sandbox-probe.exe
      CI: 'true'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {repository: p90-lover/coding-tools-mcp-fast-access-extension, ref: b0d4db553227fa3c7300050b8edff6e2eb9afee4, path: aiTemp/extension, clean: false, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1', components: rustfmt}
      - name: Require reproduced entry and canonical-path failures, then verify materialized source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          gh run download 34471789541 --repo "$GITHUB_REPOSITORY" --name sandbox-entry-red-34471789541 --dir aiTemp/evidence
          grep -F SANDBOX_STILL_WITHHELD aiTemp/evidence/red.txt
          gh run download 34477362614 --repo "$GITHUB_REPOSITORY" --name snapshot-canonical-34477362614 --dir aiTemp/evidence
          if node -e 'process.exit(JSON.parse(require("fs").readFileSync("package.json")).version === "0.4.4-rc.1" ? 0 : 1)'; then
            git diff --exit-code
          else
            python aiTemp/sandbox-permissions/prepare.py
            python aiTemp/sandbox-permissions/canonical_patch.py
          fi
          grep -F PathCchRemoveFileSpec native-helpers/app-container/main.cpp
          test -f src-tauri/src/tools/sandbox_runner.rs
      - name: Record exact candidate without overwriting main or branch changes
        id: source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then git commit -m 'feat: opt-in offline AppContainer snapshots with scoped grants and live revocation'; fi
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = 35b13594ddb3ba70011b2c47cec840e6a0dba3e1
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME --jq .object.sha)" = "$GITHUB_SHA"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --exit-code 35b13594ddb3ba70011b2c47cec840e6a0dba3e1 HEAD -- src-tauri/src/auth src-tauri/src/mcp aiTemp/origin-repair
          git diff --stat 35b13594ddb3ba70011b2c47cec840e6a0dba3e1 HEAD > aiTemp/evidence/source-scope.txt
      - name: Three real native boundary groups including Rust extended paths
        run: |
          set -euo pipefail
          cmake -S native-helpers/app-container -B aiTemp/native-build -A x64 -DCODING_TOOLS_BUILD_PROBE=ON
          cmake --build aiTemp/native-build --config Release 2>&1 | tee aiTemp/evidence/native-build.txt
          python aiTemp/completion/native_test.py 2>&1 | tee aiTemp/evidence/native-tests.txt
          python -c "import json; from pathlib import Path; p=json.loads(Path('aiTemp/evidence/native-proof.json').read_text()); assert p['passed_groups']==3 and p['ordinary_and_extended_paths_verified']"
      - name: Check permission UI and prepare retained OAuth browser check
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
          python -m pip install playwright==1.57.0
      - name: Three shared-dispatch snapshot groups and truthful tool metadata
        run: |
          set -euo pipefail
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib snapshot_contract_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/snapshot-contract.txt
          grep -F '3 passed; 0 failed' aiTemp/evidence/snapshot-contract.txt
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib core_catalog_exposes_chatgpt_compatible_tools_without_unreleased_claims -- --test-threads=1 2>&1 | tee aiTemp/evidence/registry.txt
      - name: Retain real-browser OAuth, catalog and connection behavior
        env: {OAUTH_BROWSER_PROBE: aiTemp/origin-repair/browser_live.py}
        run: |
          set -euo pipefail
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib oauth_popup_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/oauth-tests.txt
          grep -F '5 passed; 0 failed' aiTemp/evidence/oauth-tests.txt
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib catalog_exposure_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/catalog-tests.txt
          cargo test --locked --release --features native-snapshot --manifest-path src-tauri/Cargo.toml --lib connection_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/connection-tests.txt
      - name: Build and inspect exact tested Windows EXE and embedded helper
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles nsis -- --locked --features native-snapshot 2>&1 | tee aiTemp/evidence/installer.txt
          python aiTemp/sandbox-permissions/package.py
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'snapshot-installer-${{ github.run_id }}', path: 'aiTemp/source/aiTemp/installer/*', if-no-files-found: error, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'snapshot-evidence-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
  publish:
    needs: windows
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: write, actions: read}
    env: {SOURCE: '${{ needs.windows.outputs.source }}'}
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ env.SOURCE }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - name: Verify every gate and uploaded byte before publishing and fast-forwarding main
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python aiTemp/sandbox-permissions/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: snapshot-publication-${{ github.run_id }}
          path: |
            aiTemp/source/aiTemp/snapshot-release-receipt.json
            aiTemp/source/aiTemp/snapshot-release-draft.json
          if-no-files-found: warn
          retention-days: 14
