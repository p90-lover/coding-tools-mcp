name: Materialize v0.4.10 README metadata

on:
  pull_request:
    branches: [automation/readme-v0.4.10]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: materialize-readme-v0410
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Update bilingual release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('README.md'): (
                  '**原始碼版本：`v0.4.9`——一般任務無預設時限及 RAM 快取。** 請閱讀[版本說明](docs/releases/v0.4.9.md)及[指令／快取契約](docs/long-running-commands.md)。原始碼中的版本號不代表發佈建置已通過；只應安裝已公開且有驗證證據的檔案，本工具並非經認證的安全沙箱。',
                  '**原始碼版本：`v0.4.10`——保留 v0.4.9 一般任務無預設時限及 RAM 快取行為，並修正 Windows／macOS 發佈驗證相容性。** 請閱讀[版本說明](docs/releases/v0.4.10.md)及[指令／快取契約](docs/long-running-commands.md)。原始碼中的版本號不代表發佈建置已通過；只應安裝已公開且有驗證證據的檔案，本工具並非經認證的安全沙箱。',
              ),
              Path('README.en.md'): (
                  '**Source version: `v0.4.9` — ordinary unbounded execution and RAM cache.** Read the [release notes](docs/releases/v0.4.9.md) and [command/cache contract](docs/long-running-commands.md). A version in source code is not proof that a release build passed. Only published assets with verification evidence should be installed; this is not a certified security sandbox.',
                  '**Source version: `v0.4.10` — the v0.4.9 unbounded-command/RAM-cache behavior plus Windows/macOS release-validation portability repairs.** Read the [release notes](docs/releases/v0.4.10.md) and [command/cache contract](docs/long-running-commands.md). A version in source code is not proof that a release build passed. Only published assets with verification evidence should be installed; this is not a certified security sandbox.',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              assert text.count(old) == 1, f'expected exactly one stale release sentence in {path}'
              path.write_text(text.replace(old, new))
          PY
          git diff --check -- README.md README.en.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.en.md
          git commit -m 'docs: point README metadata at v0.4.10'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
