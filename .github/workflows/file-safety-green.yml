name: File safety green gate
on:
  push:
    branches: [fix/sandbox-audit-20260910]
    paths: ['.github/workflows/file-safety-green.yml', 'aiTemp/sandbox-audit/apply_file_safety.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: file-safety-green
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Materialize only the red-proven fixes
        run: python aiTemp/sandbox-audit/apply_file_safety.py
      - name: Commit tested candidate source without deleting files
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git commit -m 'fix: bound text reads and prevent patch staging path escapes'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin refs/heads/fix/sandbox-audit-20260910 | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/sandbox-audit-20260910
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 28
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/file-green-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      CODING_TOOLS_COMMAND_NATIVE_SHA256: 444a3f0008050605cae73cd9b7a2dcac61294062dfaab56dd20430fd6498518b
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Attach persisted audit regressions
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/src/tools/mod.rs')
          with p.open('a') as f:
              f.write('\n#[cfg(test)]\n#[path="../../../aiTemp/sandbox-audit/file_regressions.rs"]\nmod audit_file_regressions;\n')
          PY
      - name: Prove all three regressions are green
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib audit_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/file-green.txt
          grep -F '3 passed; 0 failed' aiTemp/evidence/file-green.txt
      - name: Existing focused file and patch tests
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib 'tools::file::tests' -- --test-threads=1 2>&1 | tee aiTemp/evidence/file-existing.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib 'tools::patch::tests' -- --test-threads=1 2>&1 | tee aiTemp/evidence/patch-existing.txt
      - name: Frontend and formatting sanity
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check src-tauri/src/tools/file.rs src-tauri/src/tools/patch.rs
          npm ci > aiTemp/evidence/npm.txt 2>&1
          npm run check 2>&1 | tee aiTemp/evidence/frontend-check.txt
          npm run build > aiTemp/evidence/frontend-build.txt 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: file-safety-green-${{ matrix.os }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
