name: Apply RC2 Onboarding and Traditional Chinese

on:
  push:
    branches:
      - fix/v0.7-rc2-onboarding-zhtw-links
    paths:
      - aiTemp/rc2-onboarding-zhtw/apply_patch.py
      - desktop-electron/src/i18n/locales/zh-TW.ts
      - desktop-electron/tests/rc2-onboarding-localization.test.cjs
      - .github/workflows/apply-rc2-onboarding-zhtw.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rc2-onboarding-zhtw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/fix/v0.7-rc2-onboarding-zhtw-links'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0
      - name: Install exact Electron dependencies
        run: bun install --cwd desktop-electron --frozen-lockfile
      - name: Apply deterministic production patch
        run: python3 aiTemp/rc2-onboarding-zhtw/apply_patch.py
      - name: Run focused onboarding and localization contract
        run: node --test desktop-electron/tests/rc2-onboarding-localization.test.cjs
      - name: Validate Electron main and state syntax
        run: |
          node --check desktop-electron/electron/main.cjs
          node --check desktop-electron/electron/state.cjs
      - name: Typecheck Electron renderer
        run: bun run --cwd desktop-electron typecheck
      - name: Enforce no-delete patch
        shell: bash
        run: |
          deleted="$(git diff --diff-filter=D --name-only)"
          if [ -n "$deleted" ]; then
            printf 'Deleted paths are forbidden:\n%s\n' "$deleted" >&2
            exit 1
          fi
      - name: Commit verified onboarding and localization repair
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "Onboarding and Traditional Chinese repair is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            desktop-electron/src/App.tsx \
            desktop-electron/src/i18n.ts \
            desktop-electron/src/i18n/locales/zh-TW.ts \
            desktop-electron/src/types.ts \
            desktop-electron/electron/main.cjs \
            desktop-electron/electron/state.cjs
          git diff --cached --check
          git commit -m "feat(rc.2): add optional onboarding and Traditional Chinese"
          git push origin "HEAD:${TARGET_BRANCH}"
