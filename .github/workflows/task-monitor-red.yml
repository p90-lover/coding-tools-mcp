name: Task monitor and release baseline
on:
  push:
    branches: [fix/task-monitor-latest-0.4.4]
    paths: [.github/workflows/task-monitor-red.yml]
permissions: {contents: read}
jobs:
  baseline:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      SOURCE: ${{ github.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/probe-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/aiTemp/pip-cache
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - name: Reproduce old comparator failure and actual missing compiled GUI
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          set +e
          python aiTemp/task-monitor/update_probe.py --baseline > aiTemp/evidence/update-red.txt 2>&1
          result=$?
          set -e
          test "$result" -eq 101
          grep -F UPDATER_PRERELEASE_COLLISION aiTemp/evidence/update-red.txt
          npm ci > aiTemp/evidence/npm.txt 2>&1
          npm run build > aiTemp/evidence/build.txt 2>&1
          python -m pip install playwright==1.57.0
          set +e
          python aiTemp/task-monitor/browser_probe.py --baseline > aiTemp/evidence/monitor-red.txt 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          grep -F MONITOR_NAVIGATION_MISSING aiTemp/evidence/monitor-red.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'task-monitor-red-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
