name: Apply rc.7 current upstream runtime hardening

on:
  push:
    branches:
      - fix/rc7-provider-commandcode-anneal-paseo-hardening
    paths:
      - 'aiTemp/rc7-upstream-runtime-current/apply_runtime_hardening.py'
      - '.github/workflows/apply-rc7-upstream-runtime-current.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rc7-current-upstream-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/rc7-upstream-runtime-current/bun-cache

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/rc7-provider-commandcode-anneal-paseo-hardening
          fetch-depth: 0
          clean: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Prepare retained temporary directories
        run: |
          mkdir -p \
            aiTemp/rc7-upstream-runtime-current/evidence \
            aiTemp/rc7-upstream-runtime-current/renderer-dist \
            aiTemp/Trash/rc7-upstream-runtime-current

      - name: Apply guarded IPC and lifecycle patch
        run: |
          python aiTemp/rc7-upstream-runtime-current/apply_runtime_hardening.py \
            | tee aiTemp/rc7-upstream-runtime-current/evidence/materializer.txt
          grep -F RC7_CURRENT_UPSTREAM_RUNTIME_HARDENING_APPLIED \
            aiTemp/rc7-upstream-runtime-current/evidence/materializer.txt

      - name: Validate bounded source changes
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          git diff --name-only | tee aiTemp/rc7-upstream-runtime-current/evidence/changed-files.txt
          allowed='^(desktop-electron/electron/(main|preload)\.cjs|desktop-electron/src/types\.ts)$'
          unexpected="$(grep -Ev "$allowed" aiTemp/rc7-upstream-runtime-current/evidence/changed-files.txt || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected upstream runtime patch paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Install exact Electron dependencies
        run: bun install --cwd desktop-electron --frozen-lockfile

      - name: Run focused upstream runtime contracts
        run: |
          node --test \
            desktop-electron/tests/upstream-tool-runtime.test.cjs \
            desktop-electron/tests/rc7-full-integration-contract.test.cjs

      - name: Validate Electron runtime syntax
        run: |
          node --check desktop-electron/electron/upstream-tools.cjs
          node --check desktop-electron/electron/main.cjs
          node --check desktop-electron/electron/preload.cjs

      - name: Typecheck and build retained renderer
        run: |
          set -euo pipefail
          bun run --cwd desktop-electron typecheck
          renderer_dir="$GITHUB_WORKSPACE/aiTemp/rc7-upstream-runtime-current/renderer-dist"
          (
            cd desktop-electron
            bunx vite build --outDir "$renderer_dir" --emptyOutDir false
          )
          CODING_TOOLS_RENDERER_DIST="$renderer_dir" \
            node --test desktop-electron/tests/renderer-provider-bundle.test.cjs

      - name: Enforce no-delete contract
        run: |
          set -euo pipefail
          git fetch origin release/codex-router-multiprovider-0.7.0-rc.7 --depth=1
          git diff --check origin/release/codex-router-multiprovider-0.7.0-rc.7...HEAD
          test -z "$(git diff --diff-filter=D --name-only origin/release/codex-router-multiprovider-0.7.0-rc.7...HEAD)"
          test -z "$(git diff --diff-filter=D --name-only)"

      - name: Commit verified runtime bridge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            desktop-electron/electron/main.cjs \
            desktop-electron/electron/preload.cjs \
            desktop-electron/src/types.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Current upstream runtime bridge is already committed.'
            exit 0
          fi
          git commit -m 'fix(rc7): wire restart and deterministic upstream shutdown'
          git push origin HEAD:fix/rc7-provider-commandcode-anneal-paseo-hardening

      - name: Preserve transient dependencies in Trash
        if: always()
        run: |
          mkdir -p aiTemp/Trash/rc7-upstream-runtime-current
          if [ -d desktop-electron/node_modules ]; then
            mv desktop-electron/node_modules \
              "aiTemp/Trash/rc7-upstream-runtime-current/node_modules-$GITHUB_RUN_ID"
          fi
