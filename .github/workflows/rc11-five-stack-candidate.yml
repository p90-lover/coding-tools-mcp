name: rc.11 five-stack candidate

on:
  push:
    branches:
      - integration/v0.7.0-rc.11-five-stack-final
    paths:
      - 'aiTemp/rc11-integration/validate-candidate.sh'
      - '.github/workflows/rc11-five-stack-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc11-five-stack-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_BRANCH: cursor/rc11-five-stack-integrate-657e
  SOURCE_HEAD: 8dfe7316aeaa172e254ded98bdbea3db7abfb5df
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/rc11-integration/bun-cache

jobs:
  validate:
    name: Resolve and validate exact candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Prepare retained candidate roots
        run: mkdir -p aiTemp/rc11-integration/candidate-evidence aiTemp/Trash/rc11-integration

      - name: Build and validate candidate
        shell: bash
        run: bash aiTemp/rc11-integration/validate-candidate.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc11-five-stack-candidate-${{ github.sha }}
          path: |
            aiTemp/rc11-integration/candidate-evidence/
            aiTemp/rc11-integration/renderer-build/
          if-no-files-found: warn
          retention-days: 14
