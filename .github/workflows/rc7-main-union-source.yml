name: rc.7 current-main union source

on:
  push:
    branches:
      - integration/v0.7.0-rc.7-main-union-source
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc7-main-union-source-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/rc7-main-union/cargo-target
  CARGO_TERM_COLOR: always
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/rc7-main-union/bun-cache
  npm_config_cache: ${{ github.workspace }}/aiTemp/rc7-main-union/npm-cache

jobs:
  compose-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_BRANCH: release/codex-router-multiprovider-0.7.0-rc.6
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Prepare retained temporary roots
        shell: bash
        run: mkdir -p aiTemp/rc7-main-union/renderer-dist aiTemp/Trash/rc7-main-union

      - id: compose
        name: Merge exact verified provider release into current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "$RELEASE_BRANCH" main
          release_sha="$(git rev-parse "origin/$RELEASE_BRANCH")"
          main_sha="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$release_sha" HEAD; then
            echo "already_composed=true" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff "$release_sha" \
            > aiTemp/rc7-main-union/merge.stdout.txt \
            2> aiTemp/rc7-main-union/merge.stderr.txt
          merge_status=$?
          set -e

          if [[ "$merge_status" -ne 0 ]]; then
            git diff --name-only --diff-filter=U | LC_ALL=C sort \
              > aiTemp/rc7-main-union/conflicts.txt
            cat > aiTemp/rc7-main-union/expected-conflicts.txt <<'EOF'
          src-tauri/src/auth/oauth_authorization_response.rs
          src-tauri/src/data/mod.rs
          EOF
            if ! cmp -s aiTemp/rc7-main-union/conflicts.txt aiTemp/rc7-main-union/expected-conflicts.txt; then
              echo 'Unexpected current-main union conflicts:' >&2
              cat aiTemp/rc7-main-union/conflicts.txt >&2
              exit 1
            fi

            # The main-side OAuth file differs only by an explanatory safety
            # comment and already contains the same hardened implementation.
            git checkout --ours -- src-tauri/src/auth/oauth_authorization_response.rs

            # Preserve both test helpers from the release line and the newer
            # main-line test-data path helper.
            cat > src-tauri/src/data/mod.rs <<'EOF'
          mod migrate;
          mod model;
          mod store;

          pub use model::{AppData, OAuthRefreshTokenRecord};
          pub use store::DataStore;

          #[cfg(test)]
          pub(crate) use migrate::shared_http_test_guard;
          #[cfg(test)]
          pub(crate) use migrate::{current_test_file, with_test_file};

          #[cfg(test)]
          pub(crate) fn test_data_file_path() -> Option<std::path::PathBuf> {
              migrate::data_file_path().ok()
          }
          EOF
            git add \
              src-tauri/src/auth/oauth_authorization_response.rs \
              src-tauri/src/data/mod.rs
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Union still contains unresolved paths.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          echo "merge_pending=true" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Preserve every file from both parents
        if: steps.compose.outputs.ready == 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.compose.outputs.release_sha }}
          MAIN_SHA: ${{ steps.compose.outputs.main_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.compose.outputs.merge_pending }}" == 'true' ]]; then
            deleted_from_release="$(git diff --cached --name-only --diff-filter=D "$RELEASE_SHA")"
            deleted_from_main="$(git diff --cached --name-only --diff-filter=D "$MAIN_SHA")"
          else
            deleted_from_release="$(git diff --name-only --diff-filter=D "$RELEASE_SHA"...HEAD)"
            deleted_from_main="$(git diff --name-only --diff-filter=D "$MAIN_SHA"...HEAD)"
          fi
          if [[ -n "$deleted_from_release" || -n "$deleted_from_main" ]]; then
            echo 'The union would delete a path retained by one parent:' >&2
            printf 'From release:\n%s\nFrom main:\n%s\n' "$deleted_from_release" "$deleted_from_main" >&2
            exit 1
          fi
          git diff --check

      - name: Run main-line release, OAuth, and Codex contracts
        if: steps.compose.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/native-codex-long-session-contract.test.mjs \
            tests/stable-release-workflows.test.mjs \
            tests/version-alignment.test.mjs

      - name: Verify Rust formatting and compile all targets
        if: steps.compose.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets

      - name: Run focused Rust authentication, listener, tunnel, and Codex tests
        if: steps.compose.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked oauth -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --locked listener -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --locked tunnel -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --locked codex_bridge -- --nocapture

      - name: Install exact Electron dependencies
        if: steps.compose.outputs.ready == 'true'
        run: bun install --cwd desktop-electron --frozen-lockfile

      - name: Verify Provider Hub, router, Paseo, Anneal, updater, and renderer
        if: steps.compose.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check desktop-electron/electron/provider-network.cjs
          node --check desktop-electron/electron/provider-bootstrap.cjs
          node --check desktop-electron/electron/preload.cjs
          node --check desktop-electron/electron/update.cjs
          node --check desktop-electron/electron/main.cjs
          node --test \
            desktop-electron/tests/antigravity-session-binding.test.cjs \
            desktop-electron/tests/antigravity-provider-session.test.cjs \
            desktop-electron/tests/commandcode-provider-session.test.cjs \
            desktop-electron/tests/provider-console-saas.test.cjs \
            desktop-electron/tests/provider-center-account-wiring.test.cjs \
            desktop-electron/tests/provider-execution-router.test.cjs \
            desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs \
            desktop-electron/tests/proxy-provider-contract.test.cjs \
            desktop-electron/tests/update.test.cjs \
            desktop-electron/tests/rc7-full-integration-contract.test.cjs
          bun run --cwd desktop-electron typecheck
          renderer_dir="$GITHUB_WORKSPACE/aiTemp/rc7-main-union/renderer-dist"
          (
            cd desktop-electron
            bunx vite build --outDir "$renderer_dir" --emptyOutDir false
          )
          CODING_TOOLS_RENDERER_DIST="$renderer_dir" \
            node --test desktop-electron/tests/renderer-provider-bundle.test.cjs

      - name: Commit and push exact verified history union
        if: steps.compose.outputs.merge_pending == 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.compose.outputs.release_sha }}
          MAIN_SHA: ${{ steps.compose.outputs.main_sha }}
          ORIGINAL_HEAD: ${{ steps.compose.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          remote_head="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          if [[ "$remote_head" != "$ORIGINAL_HEAD" ]]; then
            printf 'Branch advanced from %s to %s; stale verified run will not push.\n' \
              "$ORIGINAL_HEAD" "$remote_head"
            if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              git merge --abort
            fi
            exit 0
          fi
          git diff --cached --check
          git commit \
            -m 'integrate(rc7): unite current main with verified provider release' \
            -m "Merge main SHA $MAIN_SHA with release SHA $RELEASE_SHA, retaining both histories, hardened OAuth/Codex/listener changes, full Provider Hub/Codex Router/Paseo/Anneal/updater behavior, and all files from both parents."
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Preserve transient build material in Trash
        if: always()
        shell: bash
        run: |
          mkdir -p aiTemp/Trash/rc7-main-union
          if [ -d desktop-electron/node_modules ]; then
            mv desktop-electron/node_modules \
              "aiTemp/Trash/rc7-main-union/electron-node_modules-$GITHUB_RUN_ID"
          fi
          if [ -d node_modules ]; then
            mv node_modules "aiTemp/Trash/rc7-main-union/root-node_modules-$GITHUB_RUN_ID"
          fi
