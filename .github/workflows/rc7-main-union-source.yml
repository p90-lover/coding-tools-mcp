name: rc.7 current-main union source

on:
  push:
    branches:
      - integration/v0.7.0-rc.7-main-union-source
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc7-main-union-source-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/rc7-main-union/cargo-target
  CARGO_TERM_COLOR: always
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/rc7-main-union/bun-cache
  npm_config_cache: ${{ github.workspace }}/aiTemp/rc7-main-union/npm-cache

jobs:
  compose-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_BRANCH: release/codex-router-multiprovider-0.7.0-rc.7
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - name: Install Tauri Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Prepare retained temporary roots
        shell: bash
        run: mkdir -p aiTemp/rc7-main-union/renderer-dist aiTemp/Trash/rc7-main-union

      - id: compose
        name: Apply exact verified rc.7 provider release snapshot to current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "$RELEASE_BRANCH" main
          release_sha="$(git rev-parse "origin/$RELEASE_BRANCH")"
          main_sha="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          marker='aiTemp/rc7-main-union/applied-release-sha.txt'
          release_workflow_archive='aiTemp/Trash/rc7-main-union/release-workflows'
          workflow_preservation_record='aiTemp/rc7-main-union/preserved-release-workflows.txt'
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          if [[ -f "$marker" ]] && [[ "$(tr -d '\r\n' < "$marker")" == "$release_sha" ]]; then
            echo "already_composed=true" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Apply only the verified release tip's resulting file snapshot. The
          # release branch permanently retains its complete history, while this
          # main-bound branch avoids importing historical synthetic credential
          # fixtures that GitHub Push Protection correctly refuses to expose on
          # an additional ref.
          set +e
          git merge --squash --no-commit "$release_sha" \
            > aiTemp/rc7-main-union/merge.stdout.txt \
            2> aiTemp/rc7-main-union/merge.stderr.txt
          merge_status=$?
          set -e

          if [[ "$merge_status" -ne 0 ]]; then
            git diff --name-only --diff-filter=U | LC_ALL=C sort \
              > aiTemp/rc7-main-union/conflicts.txt
            cat > aiTemp/rc7-main-union/expected-conflicts.txt <<'EOF'
          desktop-electron/electron/main.cjs
          desktop-electron/electron/preload.cjs
          desktop-electron/electron/upstream-tools.cjs
          desktop-electron/src/features/UpstreamToolSurface.tsx
          desktop-electron/src/types.ts
          desktop-electron/tests/installer-upgrade-migration.test.cjs
          src-tauri/src/auth/oauth_authorization_response.rs
          src-tauri/src/commands/mod.rs
          src-tauri/src/commands/orchestrators.rs
          src-tauri/src/commands/providers.rs
          src-tauri/src/data/mod.rs
          src-tauri/src/integrations/execution/model.rs
          src-tauri/src/integrations/execution/protocol.rs
          src-tauri/src/integrations/execution/schema.rs
          src-tauri/src/integrations/execution/service.rs
          src-tauri/src/lib.rs
          src-tauri/src/media.rs
          src-tauri/src/orchestrator_run.rs
          src-tauri/src/orchestrators.rs
          src-tauri/src/providers.rs
          EOF
            if ! cmp -s aiTemp/rc7-main-union/conflicts.txt aiTemp/rc7-main-union/expected-conflicts.txt; then
              echo 'Unexpected current-main snapshot conflicts:' >&2
              cat aiTemp/rc7-main-union/conflicts.txt >&2
              exit 1
            fi

            # These paths are the rc.7 Provider Hub, CommandCode, managed
            # upstream runtime, Paseo, Anneal, image, installer-migration, and
            # orchestration surfaces. The release tip is the verified source of
            # truth and is a strict superset of the older main-side integration.
            git checkout --theirs -- \
              desktop-electron/electron/main.cjs \
              desktop-electron/electron/preload.cjs \
              desktop-electron/electron/upstream-tools.cjs \
              desktop-electron/src/features/UpstreamToolSurface.tsx \
              desktop-electron/src/types.ts \
              desktop-electron/tests/installer-upgrade-migration.test.cjs \
              src-tauri/src/commands/mod.rs \
              src-tauri/src/commands/orchestrators.rs \
              src-tauri/src/commands/providers.rs \
              src-tauri/src/integrations/execution/model.rs \
              src-tauri/src/integrations/execution/protocol.rs \
              src-tauri/src/integrations/execution/schema.rs \
              src-tauri/src/integrations/execution/service.rs \
              src-tauri/src/lib.rs \
              src-tauri/src/media.rs \
              src-tauri/src/orchestrator_run.rs \
              src-tauri/src/orchestrators.rs \
              src-tauri/src/providers.rs

            # Main contains the same hardened issuer implementation plus the
            # retained explanatory safety note.
            git checkout --ours -- src-tauri/src/auth/oauth_authorization_response.rs

            # Preserve both release test helpers and main's test-data path helper.
            cat > src-tauri/src/data/mod.rs <<'EOF'
          mod migrate;
          mod model;
          mod store;

          pub use model::{AppData, OAuthRefreshTokenRecord};
          pub use store::DataStore;

          #[cfg(test)]
          pub(crate) use migrate::shared_http_test_guard;
          #[cfg(test)]
          pub(crate) use migrate::{current_test_file, with_test_file};

          #[cfg(test)]
          pub(crate) fn test_data_file_path() -> Option<std::path::PathBuf> {
              migrate::data_file_path().ok()
          }
          EOF

            git add \
              desktop-electron/electron/main.cjs \
              desktop-electron/electron/preload.cjs \
              desktop-electron/electron/upstream-tools.cjs \
              desktop-electron/src/features/UpstreamToolSurface.tsx \
              desktop-electron/src/types.ts \
              desktop-electron/tests/installer-upgrade-migration.test.cjs \
              src-tauri/src/auth/oauth_authorization_response.rs \
              src-tauri/src/commands/mod.rs \
              src-tauri/src/commands/orchestrators.rs \
              src-tauri/src/commands/providers.rs \
              src-tauri/src/data/mod.rs \
              src-tauri/src/integrations/execution/model.rs \
              src-tauri/src/integrations/execution/protocol.rs \
              src-tauri/src/integrations/execution/schema.rs \
              src-tauri/src/integrations/execution/service.rs \
              src-tauri/src/lib.rs \
              src-tauri/src/media.rs \
              src-tauri/src/orchestrator_run.rs \
              src-tauri/src/orchestrators.rs \
              src-tauri/src/providers.rs
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Snapshot still contains unresolved paths.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          # GitHub Actions' repository token cannot create or update workflow
          # files. Keep this branch's already-authorized workflow tree exactly
          # unchanged, and preserve every differing release workflow under
          # aiTemp/Trash instead of deleting or discarding it.
          mkdir -p "$release_workflow_archive"
          : > "$workflow_preservation_record"
          while IFS= read -r workflow_path; do
            [[ -n "$workflow_path" ]] || continue
            if git cat-file -e "$release_sha:$workflow_path" 2>/dev/null; then
              archived="$release_workflow_archive/$workflow_path"
              mkdir -p "$(dirname "$archived")"
              git show "$release_sha:$workflow_path" > "$archived"
              printf '%s -> %s\n' "$workflow_path" "$archived" \
                >> "$workflow_preservation_record"
            fi
          done < <(
            git diff --name-only "$head_sha" "$release_sha" -- .github/workflows |
              LC_ALL=C sort -u
          )

          git restore --source="$head_sha" --staged --worktree -- .github/workflows
          git add -f "$release_workflow_archive" "$workflow_preservation_record"
          if git diff --cached --name-only -- .github/workflows | grep -q .; then
            echo 'The snapshot still attempts to mutate GitHub workflow files:' >&2
            git diff --cached --name-only -- .github/workflows >&2
            exit 1
          fi

          printf '%s\n' "$release_sha" > "$marker"
          git add -f "$marker"
          echo "merge_pending=true" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Preserve every file from both source tips
        if: steps.compose.outputs.ready == 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.compose.outputs.release_sha }}
          MAIN_SHA: ${{ steps.compose.outputs.main_sha }}
        run: |
          set -euo pipefail
          release_workflow_archive='aiTemp/Trash/rc7-main-union/release-workflows'
          unpreserved_release='aiTemp/rc7-main-union/unpreserved-release-deletions.txt'
          unpreserved_main='aiTemp/rc7-main-union/unpreserved-main-deletions.txt'
          preserved_workflow_deletions='aiTemp/rc7-main-union/preserved-workflow-deletions.txt'

          if [[ "${{ steps.compose.outputs.merge_pending }}" == 'true' ]]; then
            git diff --cached --name-only --diff-filter=D "$RELEASE_SHA" \
              > aiTemp/rc7-main-union/release-deletions.txt
            git diff --cached --name-only --diff-filter=D "$MAIN_SHA" \
              > aiTemp/rc7-main-union/main-deletions.txt
          else
            git diff --name-only --diff-filter=D "$RELEASE_SHA" HEAD \
              > aiTemp/rc7-main-union/release-deletions.txt
            git diff --name-only --diff-filter=D "$MAIN_SHA" HEAD \
              > aiTemp/rc7-main-union/main-deletions.txt
          fi

          : > "$unpreserved_release"
          : > "$unpreserved_main"
          : > "$preserved_workflow_deletions"

          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            if [[ "$path" == .github/workflows/* ]] &&
               [[ -f "$release_workflow_archive/$path" ]]; then
              printf '%s -> %s\n' "$path" "$release_workflow_archive/$path" \
                >> "$preserved_workflow_deletions"
            else
              printf '%s\n' "$path" >> "$unpreserved_release"
            fi
          done < aiTemp/rc7-main-union/release-deletions.txt

          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            printf '%s\n' "$path" >> "$unpreserved_main"
          done < aiTemp/rc7-main-union/main-deletions.txt

          if [[ -s "$unpreserved_release" || -s "$unpreserved_main" ]]; then
            echo 'The snapshot would discard an unpreserved path from a source tip:' >&2
            printf '%s\n' 'From release:' >&2
            cat "$unpreserved_release" >&2
            printf '%s\n' 'From main:' >&2
            cat "$unpreserved_main" >&2
            exit 1
          fi

          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git add -f \
            aiTemp/rc7-main-union/release-deletions.txt \
            aiTemp/rc7-main-union/main-deletions.txt \
            "$unpreserved_release" \
            "$unpreserved_main" \
            "$preserved_workflow_deletions"
          git diff --check

      - name: Run main-line release, OAuth, and Codex contracts
        if: steps.compose.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/native-codex-long-session-contract.test.mjs \
            tests/stable-release-workflows.test.mjs \
            tests/version-alignment.test.mjs

      - name: Normalize Rust formatting and compile all targets
        if: steps.compose.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git add src-tauri
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          git diff --cached --check -- src-tauri
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets

      - name: Run focused Rust authentication, listener, tunnel, and Codex tests
        if: steps.compose.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked oauth -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --locked listener -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --locked tunnel -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --locked codex_bridge -- --nocapture

      - name: Install exact Electron dependencies
        if: steps.compose.outputs.ready == 'true'
        run: bun install --cwd desktop-electron --frozen-lockfile

      - name: Verify Provider Hub, router, Paseo, Anneal, updater, and renderer
        if: steps.compose.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check desktop-electron/electron/provider-network.cjs
          node --check desktop-electron/electron/provider-bootstrap.cjs
          node --check desktop-electron/electron/preload.cjs
          node --check desktop-electron/electron/update.cjs
          node --check desktop-electron/electron/main.cjs
          node --test \
            desktop-electron/tests/antigravity-session-binding.test.cjs \
            desktop-electron/tests/antigravity-provider-session.test.cjs \
            desktop-electron/tests/commandcode-provider-session.test.cjs \
            desktop-electron/tests/provider-console-saas.test.cjs \
            desktop-electron/tests/provider-center-account-wiring.test.cjs \
            desktop-electron/tests/provider-execution-router.test.cjs \
            desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs \
            desktop-electron/tests/proxy-provider-contract.test.cjs \
            desktop-electron/tests/update.test.cjs \
            desktop-electron/tests/rc7-full-integration-contract.test.cjs \
            desktop-electron/tests/upstream-tool-runtime.test.cjs
          bun run --cwd desktop-electron typecheck
          renderer_dir="$GITHUB_WORKSPACE/aiTemp/rc7-main-union/renderer-dist"
          (
            cd desktop-electron
            bunx vite build --outDir "$renderer_dir" --emptyOutDir false
          )
          CODING_TOOLS_RENDERER_DIST="$renderer_dir" \
            node --test desktop-electron/tests/renderer-provider-bundle.test.cjs

      - name: Commit and push exact verified snapshot union
        if: steps.compose.outputs.merge_pending == 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.compose.outputs.release_sha }}
          MAIN_SHA: ${{ steps.compose.outputs.main_sha }}
          ORIGINAL_HEAD: ${{ steps.compose.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          remote_head="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          if [[ "$remote_head" != "$ORIGINAL_HEAD" ]]; then
            printf 'Branch advanced from %s to %s; stale verified run will not push.\n' \
              "$ORIGINAL_HEAD" "$remote_head"
            exit 0
          fi
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check -- \
            src-tauri \
            desktop-electron \
            aiTemp/rc7-main-union \
            aiTemp/Trash/rc7-main-union/release-workflows
          git commit \
            -m 'integrate(rc7): apply verified rc.7 provider snapshot to current main' \
            -m "Apply release SHA $RELEASE_SHA onto main SHA $MAIN_SHA as a push-safe file snapshot. The release branch retains full history; this commit retains all non-workflow files and archives every differing release workflow under aiTemp/Trash without mutating the authorized workflow tree."
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Preserve transient build material in Trash
        if: always()
        shell: bash
        run: |
          mkdir -p aiTemp/Trash/rc7-main-union
          if [ -d desktop-electron/node_modules ]; then
            mv desktop-electron/node_modules \
              "aiTemp/Trash/rc7-main-union/electron-node_modules-$GITHUB_RUN_ID"
          fi
          if [ -d node_modules ]; then
            mv node_modules "aiTemp/Trash/rc7-main-union/root-node_modules-$GITHUB_RUN_ID"
          fi
