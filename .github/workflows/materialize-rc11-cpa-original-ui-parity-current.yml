name: Materialize rc.11 CPA original UI parity current

on:
  push:
    branches:
      - fix/rc11-cpa-original-ui-parity-current
    paths:
      - .github/workflows/materialize-rc11-cpa-original-ui-parity-current.yml
      - aiTemp/rc11-cpa-original-ui-parity/materialize-current.mjs
      - desktop-electron/tests/rc11-cpa-original-ui-parity-current.test.cjs
      - desktop-electron/tests/rc10-cpa-codex-original-ui.test.cjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-rc11-cpa-original-ui-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Apply guarded CPA parity materializer
        run: |
          set -euo pipefail
          mkdir -p aiTemp/rc11-cpa-original-ui-parity/evidence
          node aiTemp/rc11-cpa-original-ui-parity/materialize-current.mjs \
            2>&1 | tee aiTemp/rc11-cpa-original-ui-parity/evidence/materialize.txt
          grep -F RC11_CPA_ORIGINAL_UI_PARITY_MATERIALIZED \
            aiTemp/rc11-cpa-original-ui-parity/evidence/materialize.txt

      - name: Run focused RED-to-GREEN contracts
        run: |
          set -euo pipefail
          (
            node --check desktop-electron/electron/main.cjs
            node --check desktop-electron/electron/preload.cjs
            node --test \
              desktop-electron/tests/rc11-cpa-original-ui-parity-current.test.cjs \
              desktop-electron/tests/rc10-cpa-codex-original-ui.test.cjs \
              desktop-electron/tests/rc9-managed-cpa-runtime.test.cjs
          ) 2>&1 | tee aiTemp/rc11-cpa-original-ui-parity/evidence/materialized-tests.txt
          grep -F '# fail 0' aiTemp/rc11-cpa-original-ui-parity/evidence/materialized-tests.txt

      - name: Enforce preservation and diff safety
        run: |
          set -euo pipefail
          git fetch origin feature/rc11-managed-apps-shell-current --no-tags
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only origin/feature/rc11-managed-apps-shell-current...HEAD)"
          test -z "$(git diff --diff-filter=D --name-only)"

      - name: Commit verified production source
        run: |
          set -euo pipefail
          git add \
            desktop-electron/src/features/OriginalUiSurface.tsx \
            desktop-electron/src/features/original-ui.css \
            desktop-electron/src/types.ts
          if git diff --cached --quiet; then
            echo 'CPA original-UI parity is already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(rc11): materialize CPA original UI parity'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: materialize-rc11-cpa-original-ui-parity-${{ github.sha }}
          path: aiTemp/rc11-cpa-original-ui-parity/evidence/
          if-no-files-found: error
          retention-days: 14
