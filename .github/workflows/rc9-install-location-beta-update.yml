name: RC9 Install Location and Beta Update

on:
  push:
    branches:
      - fix/v0.7.0-rc.9-install-location-beta-update-prompt
    paths:
      - aiTemp/rc9-install-location-beta-update/**
      - desktop-electron/build/installer.nsh
      - desktop-electron/electron/main.cjs
      - desktop-electron/electron/update.cjs
      - desktop-electron/electron/update-worker.cjs
      - desktop-electron/tests/install-location-beta-update-prompt.test.cjs
      - aiTemp/rc7-release/verify-windows-migration.ps1
      - .github/workflows/rc9-install-location-beta-update.yml
  pull_request:
    paths:
      - aiTemp/rc9-install-location-beta-update/**
      - desktop-electron/build/installer.nsh
      - desktop-electron/electron/main.cjs
      - desktop-electron/electron/update.cjs
      - desktop-electron/electron/update-worker.cjs
      - desktop-electron/tests/install-location-beta-update-prompt.test.cjs
      - aiTemp/rc7-release/verify-windows-migration.ps1
      - .github/workflows/rc9-install-location-beta-update.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc9-install-location-beta-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - name: Materialize the bounded upgrade repair
        run: |
          set -euo pipefail
          node aiTemp/rc9-install-location-beta-update/materialize.mjs
          node aiTemp/rc9-install-location-beta-update/materialize-legacy-location.mjs

      - name: Verify install-location and beta-popup contracts
        run: |
          node --test \
            desktop-electron/tests/install-location-beta-update-prompt.test.cjs \
            desktop-electron/tests/installer-upgrade-migration.test.cjs \
            desktop-electron/tests/legacy-msi-upgrade-contract.test.cjs

      - name: Require syntax-valid updater runtime
        run: |
          node --check desktop-electron/electron/update.cjs
          node --check desktop-electron/electron/update-worker.cjs
          node --check desktop-electron/electron/main.cjs

      - name: Enforce bounded diff and no tracked-file deletion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/codex-router-multiprovider-0.7.0-rc.8 --no-tags
          git diff --check
          deleted_branch="$(git diff --name-only --diff-filter=D origin/release/codex-router-multiprovider-0.7.0-rc.8...HEAD)"
          deleted_worktree="$(git diff --name-only --diff-filter=D)"
          if [ -n "$deleted_branch" ] || [ -n "$deleted_worktree" ]; then
            printf 'Tracked files must be retained or moved to Trash/:\nbranch=%s\nworktree=%s\n' \
              "$deleted_branch" "$deleted_worktree" >&2
            exit 1
          fi
          allowed='^(desktop-electron/build/installer\.nsh|desktop-electron/electron/(main|update|update-worker)\.cjs|aiTemp/rc7-release/verify-windows-migration\.ps1)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            printf 'Materializer changed an unexpected tracked path:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Record the exact verified source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME" --no-tags
          remote_head="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            printf 'Branch advanced from %s to %s; stale run will not push.\n' "$GITHUB_SHA" "$remote_head"
            exit 0
          fi

          git add \
            desktop-electron/build/installer.nsh \
            desktop-electron/electron/main.cjs \
            desktop-electron/electron/update.cjs \
            desktop-electron/electron/update-worker.cjs \
            aiTemp/rc7-release/verify-windows-migration.ps1
          git diff --cached --check
          test -z "$(git diff --cached --name-only --diff-filter=D)"
          if git diff --cached --quiet; then
            echo 'RC9_UPGRADE_REPAIR_ALREADY_MATERIALIZED'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rc.9): preserve install location and prompt for beta updates'
          git push origin "HEAD:$GITHUB_REF_NAME"
