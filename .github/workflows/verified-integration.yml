name: Verified MCP native and board integration
on:
  push:
    branches: [release/verified-integration-0.4.2-rc.1]
    paths: ['.github/workflows/verified-integration.yml', 'aiTemp/finalization/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-integration-042
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Integrate narrowly and preserve originals
        run: python aiTemp/finalization/prepare.py
      - name: Commit actual source to candidate branch only
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: integrate MCP discovery, persistent native read-only turns and accessible board controls'
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin refs/heads/release/verified-integration-0.4.2-rc.1 | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/release/verified-integration-0.4.2-rc.1
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-preparation-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          retention-days: 14
          if-no-files-found: warn
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            asset: codex-x86_64-pc-windows-msvc.exe.tar.gz
          - os: macos-15
            label: macos
            asset: codex-aarch64-apple-darwin.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/native-cargo
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - run: python scripts/native_bridge_ci.py probe-init
      - name: Verify pinned official native binary
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ASSET: ${{ matrix.asset }}
        run: python scripts/native_bridge_ci.py download-native
      - name: Scope and real native lifecycle against isolated loopback
        run: |
          set -euo pipefail
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_bridge_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/native-contracts.txt
          cargo test --manifest-path aiTemp/bridge-probe/Cargo.toml native_bridge_actual_turns_against_loopback_fixture -- --ignored --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/native-lifecycle.txt
          grep -F 'PASS: real native start/send/review/compact/interrupt/unsubscribe' aiTemp/evidence/native-lifecycle.txt
          test -z "$(git diff --name-only)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-native-${{ matrix.label }}-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          retention-days: 14
          if-no-files-found: warn
  board:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/board-cargo
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/aiTemp/pip-cache
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Production board reducer regressions
        run: |
          set -euo pipefail
          mkdir -p aiTemp/board-probe aiTemp/evidence
          python - <<'PY'
          from pathlib import Path
          root=Path('aiTemp/board-probe')
          (root/'Cargo.toml').write_text('[package]\nname="studio-board-contract"\nversion="0.1.0"\nedition="2021"\n[workspace]\n[lib]\npath="lib.rs"\n[dependencies]\nserde={version="1",features=["derive"]}\nserde_json="1"\nuuid={version="1",features=["v4"]}\n')
          (root/'board.rs').write_text(Path('src-tauri/src/integrations/board.rs').read_text().replace('//!','//',1))
          (root/'tests.rs').write_text(Path('aiTemp/release-verification/board_flow.rs').read_text().replace('//!','//',1))
          (root/'lib.rs').write_text('pub mod error {pub type AppResult<T>=Result<T,String>;} fn err(s:&str)->String{s.into()} fn now()->u64{1} mod production {include!("board.rs"); #[cfg(test)] mod regression {include!("tests.rs");}}')
          PY
          cargo test --manifest-path aiTemp/board-probe/Cargo.toml board_flow_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/board.txt
      - name: Typecheck and build real frontend
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
      - name: Browser creation drag persistence and bilingual controls
        run: |
          set -euo pipefail
          python -m pip install playwright==1.57.0
          python - <<'PY'
          import subprocess,sys,time,urllib.request
          from pathlib import Path
          log=Path('aiTemp/evidence/vite.txt').open('w')
          process=subprocess.Popen(['node','node_modules/vite/bin/vite.js','--host','127.0.0.1','--port','1420','--strictPort'],stdout=log,stderr=subprocess.STDOUT)
          try:
              for attempt in range(60):
                  if process.poll() is not None: raise RuntimeError('Frontend server exited')
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:1420/work',timeout=2) as r:
                          if r.status==200: break
                  except OSError: time.sleep(0.25)
              else: raise RuntimeError('Frontend did not become ready')
              subprocess.run([sys.executable,'aiTemp/release-verification/board_ui.py'],check=True)
          finally:
              process.terminate()
              try: process.wait(timeout=10)
              except subprocess.TimeoutExpired: process.kill();process.wait()
              log.close()
          PY
          test -z "$(git diff --name-only)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-board-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          retention-days: 14
          if-no-files-found: warn
