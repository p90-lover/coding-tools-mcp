name: Release request dispatcher

on:
  push:
    branches:
      - "release/**"
    paths:
      - ".github/release-request.json"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate release request
        id: request
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path('.github/release-request.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          tag = str(data.get('tag', '')).strip()
          if not re.fullmatch(r'v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?', tag):
              raise SystemExit(f'invalid release tag: {tag!r}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag={tag}\n')
          print(f'validated release request for {tag}')
          PY

      - name: Dispatch verified desktop release from main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$RELEASE_TAG"
