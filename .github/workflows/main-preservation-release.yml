name: Verified main preservation and repair release
on:
  push:
    branches: [fix/main-preservation-0.4.3-rc.4]
    paths: ['.github/workflows/main-preservation-release.yml', 'aiTemp/main-preservation/prepare.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-preservation-release-rc4
  cancel-in-progress: false
env:
  VERSION: 0.4.3-rc.4
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.source }}
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Materialize reviewed source and consistent release version
        run: |
          set -euo pipefail
          python aiTemp/main-preservation/prepare.py
      - name: Record immutable candidate source without overwriting concurrent work
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: retain released features with scoped OAuth, callback CSP and bounded safe file operations'
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: main-preservation-preparation-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/preparation.txt
          if-no-files-found: warn
          retention-days: 14
  origin:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/origin-target
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Check actual scoped origin guard and preserved main implementations
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          git fetch --no-tags origin ac6a7b21df3391277f6687a2a5a6aef0314663b7 07faa97255e6b60d909f956fa2cebd3b829bbf97
          for version in released main; do
            python aiTemp/oauth-popup/probe.py "$version"
            set +e
            cargo test --manifest-path "aiTemp/oauth-popup/probe-$version/Cargo.toml" oauth_popup_origin_ -- --test-threads=1 --nocapture > "aiTemp/evidence/$version-red.txt" 2>&1
            code=$?
            set -e
            test "$code" -eq 101
          done
          grep -F 'POPUP_ORIGIN_BLOCKED' aiTemp/evidence/released-red.txt
          grep -F 'HOST_MUST_NOT_SELECT_TRUST' aiTemp/evidence/main-red.txt
          grep -F 'POPUP_EXCEPTION_ESCAPED_AUTH_ROUTE' aiTemp/evidence/main-red.txt
          python aiTemp/oauth-popup/probe.py fixed
          cargo test --manifest-path aiTemp/oauth-popup/probe-fixed/Cargo.toml oauth_popup_origin_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/green.txt
          grep -F '3 passed; 0 failed' aiTemp/evidence/green.txt
          git diff --exit-code 07faa97255e6b60d909f956fa2cebd3b829bbf97 -- src-tauri/src/codex_bridge src-tauri/src/tools/registry.rs src-tauri/src/tools/registry_definitions.rs src-tauri/src/tools/native_sandbox.rs src-tauri/src/tools/computer src-tauri/src/auth/redirects.rs src-tauri/src/auth/refresh_tokens.rs
          test -z "$(git diff --diff-filter=D --name-only 07faa97255e6b60d909f956fa2cebd3b829bbf97 HEAD)"
          python - <<'PY'
          from pathlib import Path
          import re
          notes=Path('docs/releases/v0.4.3-rc.4.md').read_text(encoding='utf-8')
          english=notes.split('## English')[1].split('## 繁體中文')[0]
          chinese=notes.split('## 繁體中文')[1]
          references=lambda text:set(re.findall(r'^- (https://\S+)$',text,re.M))
          assert len(references(english))==4 and references(english)==references(chinese)
          Path('aiTemp/evidence/preservation.txt').write_text('PASS: existing main implementations retained; no deleted paths; bilingual scope and references checked\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: oauth-popup-origin-evidence-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      PLATFORM: windows-x64
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/oauth-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      CODING_TOOLS_COMMAND_NATIVE_SHA256: 444a3f0008050605cae73cd9b7a2dcac61294062dfaab56dd20430fd6498518b
      CI: 'true'
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Check and build retained frontend
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
      - name: Focused OAuth, catalogue, file-safety and connection regressions
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib oauth_popup_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/oauth-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib catalog_exposure_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/catalog-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib main_preservation_file_regressions -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/file-safety.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib connection_ -- --test-threads=1 2>&1 | tee aiTemp/evidence/connection-tests.txt
          grep -F '4 passed; 0 failed' aiTemp/evidence/oauth-tests.txt
          grep -F '2 passed; 0 failed' aiTemp/evidence/catalog-tests.txt
          grep -F '3 passed; 0 failed' aiTemp/evidence/file-safety.txt
      - name: Build and inspect actual Windows installer from exact tested source
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles nsis -- --locked 2>&1 | tee aiTemp/evidence/installer.txt
          python aiTemp/oauth-popup/package.py
          test -z "$(git diff --name-only)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oauth-popup-installer-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/installer/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oauth-popup-browser-fixture-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/oauth-popup/browser-fixture.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: oauth-popup-windows-evidence-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
  browser:
    needs: [prepare, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      PIP_CACHE_DIR: ${{ github.workspace }}/aiTemp/pip-cache
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - name: Read production responses recorded by this exact Windows source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "oauth-popup-browser-fixture-$GITHUB_RUN_ID" --dir aiTemp/browser-fixture
      - name: Verify actual popup redirect with CSP retained and external traffic blocked
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python -m pip install playwright==1.57.0
          python aiTemp/oauth-popup/browser_test.py 2>&1 | tee aiTemp/evidence/browser-test.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: oauth-popup-browser-evidence-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare, origin, windows, browser]
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - name: Publish verified bytes and fast-forward main without deleting files or releases
        run: python aiTemp/oauth-popup/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: main-preservation-publication-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/oauth-popup-publication-receipt.json
          if-no-files-found: warn
          retention-days: 14
