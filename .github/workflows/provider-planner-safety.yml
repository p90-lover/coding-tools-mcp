name: Provider Hub planner safety repair

on:
  push:
    branches:
      - integration/v0.7.0-rc.2-provider-hub-current
    paths:
      - aiTemp/provider-planner-safety/**
      - .github/workflows/provider-planner-safety.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-planner-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  red-green-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/bun-cache-provider-planner-safety
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Prepare retained work roots
        run: mkdir -p aiTemp/evidence aiTemp/tmp aiTemp/Trash/provider-planner-safety

      - name: Materialize regression test and prove RED
        shell: bash
        run: |
          set -euo pipefail
          cp aiTemp/provider-planner-safety/payload/desktop-electron/tests/provider-network-credentials.test.cjs \
            desktop-electron/tests/provider-network-credentials.test.cjs
          set +e
          node --test \
            desktop-electron/tests/provider-execution-router.test.cjs \
            desktop-electron/tests/provider-network-credentials.test.cjs \
            > aiTemp/evidence/provider-planner-safety-red.txt 2>&1
          status=$?
          set -e
          cat aiTemp/evidence/provider-planner-safety-red.txt
          test "$status" -ne 0

      - name: Apply minimal safety repair
        run: |
          set -euo pipefail
          python3 aiTemp/provider-planner-safety/apply_provider_planner_safety.py \
            2>&1 | tee aiTemp/evidence/provider-planner-safety-patch.txt
          grep -F PROVIDER_PLANNER_SAFETY_PATCH_OK \
            aiTemp/evidence/provider-planner-safety-patch.txt
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"

      - name: Validate JavaScript syntax
        run: |
          node --check desktop-electron/electron/provider-execution-router.cjs
          node --check desktop-electron/electron/provider-network.cjs
          node --check desktop-electron/tests/provider-network-credentials.test.cjs

      - name: Install locked Electron dependencies
        run: |
          set -euo pipefail
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun install --cwd desktop-electron --frozen-lockfile \
            2>&1 | tee aiTemp/evidence/provider-planner-safety-install.txt

      - name: Prove GREEN with focused and preserved contracts
        run: |
          set -euo pipefail
          node --test \
            desktop-electron/tests/provider-execution-router.test.cjs \
            desktop-electron/tests/provider-network-credentials.test.cjs \
            desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs \
            desktop-electron/tests/proxy-provider-contract.test.cjs \
            desktop-electron/tests/provider-proxy-domain.test.cjs \
            desktop-electron/tests/execution-bridge-contract.test.cjs \
            2>&1 | tee aiTemp/evidence/provider-planner-safety-green.txt
          grep -F '# fail 0' aiTemp/evidence/provider-planner-safety-green.txt

      - name: Typecheck and build renderer
        run: |
          set -euo pipefail
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron typecheck \
            2>&1 | tee aiTemp/evidence/provider-planner-safety-typecheck.txt
          mkdir -p aiTemp/provider-planner-safety/renderer-dist
          cd desktop-electron
          TMPDIR="$GITHUB_WORKSPACE/aiTemp/tmp" TMP="$GITHUB_WORKSPACE/aiTemp/tmp" TEMP="$GITHUB_WORKSPACE/aiTemp/tmp" \
            bunx vite build \
              --outDir ../aiTemp/provider-planner-safety/renderer-dist \
              --emptyOutDir \
            2>&1 | tee ../aiTemp/evidence/provider-planner-safety-renderer-build.txt

      - name: Enforce no deletion and exact production scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          changed="$(git diff --name-only -- desktop-electron | sort)"
          expected="$(printf '%s\n' \
            desktop-electron/electron/provider-execution-router.cjs \
            desktop-electron/electron/provider-network.cjs \
            desktop-electron/src/types.ts \
            desktop-electron/tests/provider-network-credentials.test.cjs | sort)"
          printf 'changed files:\n%s\n' "$changed" \
            | tee aiTemp/evidence/provider-planner-safety-changed-files.txt
          test "$changed" = "$expected"

      - name: Commit exact verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            desktop-electron/electron/provider-execution-router.cjs \
            desktop-electron/electron/provider-network.cjs \
            desktop-electron/src/types.ts \
            desktop-electron/tests/provider-network-credentials.test.cjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Provider planner safety repair is already committed.'
            exit 0
          fi
          git commit -m 'fix(provider-hub): enforce strict planner and credential safety'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provider-planner-safety-${{ github.sha }}
          path: aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
