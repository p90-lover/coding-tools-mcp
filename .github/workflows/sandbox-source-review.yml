name: Sandbox permission source review
on:
  push:
    branches: [fix/sandbox-permissions-0.4.4-rc.1]
    paths: [.github/workflows/sandbox-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: aiTemp/source
          clean: false
          persist-credentials: false
      - name: Export exact sources without executing app or model code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          git -C aiTemp/source bundle create ../evidence/source.bundle --all
          git -C aiTemp/source show c402cba15cb037a6240707ed9e5a313521fbbdd0:aiTemp/completion/native-source.xz.b64 > aiTemp/evidence/native-source.xz.b64
          git -C aiTemp/source show c402cba15cb037a6240707ed9e5a313521fbbdd0:aiTemp/completion/native_probe_fix.py > aiTemp/evidence/native_probe_fix.py
          git -C aiTemp/source show c402cba15cb037a6240707ed9e5a313521fbbdd0:.github/workflows/completion-native.yml > aiTemp/evidence/completion-native.yml
          git -C aiTemp/source rev-parse HEAD > aiTemp/evidence/source.commit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandbox-source-${{ github.run_id }}
          path: aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
