name: Materialize v0.7.0-rc.7 identity

on:
  push:
    branches:
      - release/codex-router-multiprovider-0.7.0-rc.7
    paths:
      - aiTemp/rc7-release/apply_release_identity.py
      - .github/workflows/materialize-v0.7-rc7-identity.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-v0.7.0-rc.7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Apply deterministic rc.7 release identity
        run: |
          set -euo pipefail
          mkdir -p aiTemp/rc7-release/evidence
          python aiTemp/rc7-release/apply_release_identity.py \
            | tee aiTemp/rc7-release/evidence/materialization.txt
          grep -F RC7_RELEASE_IDENTITY_READY \
            aiTemp/rc7-release/evidence/materialization.txt

      - name: Verify identity and installer contracts
        run: |
          set -euo pipefail
          node --test \
            desktop-electron/tests/product-identity.test.cjs \
            desktop-electron/tests/installer-upgrade-migration.test.cjs \
            desktop-electron/tests/legacy-msi-upgrade-contract.test.cjs \
            2>&1 | tee aiTemp/rc7-release/evidence/contracts.txt
          grep -F '# fail 0' aiTemp/rc7-release/evidence/contracts.txt
          test -s docs/releases/v0.7.0-rc.7.md
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"

      - name: Commit verified identity without deleting retained source
        run: |
          set -euo pipefail
          git add \
            desktop-electron/package.json \
            desktop-electron/electron/product.cjs \
            desktop-electron/scripts/prepare-package-resources.cjs \
            desktop-electron/scripts/verify-package.cjs \
            desktop-electron/tests/product-identity.test.cjs \
            desktop-electron/tests/installer-upgrade-migration.test.cjs \
            desktop-electron/tests/package-contents.test.cjs \
            desktop-electron/tests/package-resource-preparation.test.cjs \
            docs/releases/v0.7.0-rc.7.md
          if git diff --cached --quiet; then
            echo 'rc.7 release identity is already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: materialize v0.7.0-rc.7 identity'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc7-identity-${{ github.sha }}
          path: aiTemp/rc7-release/evidence/
          if-no-files-found: error
          retention-days: 14
