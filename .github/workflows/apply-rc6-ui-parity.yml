name: Apply rc.6 UI parity repair

on:
  push:
    branches:
      - fix/rc6-paseo-anneal-zhTW-ui-parity
    paths:
      - 'aiTemp/rc6-ui-parity/apply_provider_hub_i18n.py'
      - '.github/workflows/apply-rc6-ui-parity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rc6-ui-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/rc6-ui-parity/bun-cache

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/rc6-paseo-anneal-zhTW-ui-parity
          fetch-depth: 0

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Prepare retained temporary directories
        run: mkdir -p aiTemp/rc6-ui-parity/renderer-dist aiTemp/Trash/rc6-ui-parity

      - name: Apply exact Provider Hub localization patch
        run: python aiTemp/rc6-ui-parity/apply_provider_hub_i18n.py

      - name: Run focused localization and layout contracts
        run: |
          node --test \
            desktop-electron/tests/rc6-ui-parity-contract.test.cjs \
            desktop-electron/tests/rc6-provider-hub-i18n-contract.test.cjs \
            desktop-electron/tests/orchestration-localization-layout.test.cjs

      - name: Install exact Electron dependencies
        run: bun install --cwd desktop-electron --frozen-lockfile

      - name: Typecheck Electron renderer
        run: bun run --cwd desktop-electron typecheck

      - name: Build production renderer into aiTemp evidence
        run: |
          cd desktop-electron
          bunx vite build \
            --outDir ../aiTemp/rc6-ui-parity/renderer-dist \
            --emptyOutDir

      - name: Verify bounded source change and no deletion
        shell: bash
        run: |
          git diff --check
          deleted="$(git diff --diff-filter=D --name-only)"
          if [ -n "$deleted" ]; then
            printf 'Deleted paths are forbidden:\n%s\n' "$deleted" >&2
            exit 1
          fi
          unexpected="$(git diff --name-only | grep -v '^desktop-electron/src/features/ProviderHubSurface.tsx$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected modified paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit verified Provider Hub repair
        run: |
          if git diff --quiet; then
            echo 'Provider Hub localization patch is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-electron/src/features/ProviderHubSurface.tsx
          git diff --cached --check
          git commit -m 'fix(rc6): localize Provider Hub account and routing details'
          git push origin HEAD:fix/rc6-paseo-anneal-zhTW-ui-parity

      - name: Preserve transient dependencies in Trash
        if: always()
        shell: bash
        run: |
          if [ -d desktop-electron/node_modules ]; then
            mv desktop-electron/node_modules "aiTemp/Trash/rc6-ui-parity/node_modules-$GITHUB_RUN_ID"
          fi
