name: Local Codex tools and MCP recovery
on:
  push:
    branches: [release/codex-local-tools-0.4.2-rc.1]
    paths: ['.github/workflows/codex-local-tools-release.yml', 'aiTemp/codex-local-delivery/**', 'aiTemp/codex-local-integration/**', 'src/**', 'src-tauri/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-local-tools-release
  cancel-in-progress: false
env:
  VERSION: 0.4.2-rc.1
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Materialize verified source and preserve originals
        id: source
        working-directory: aiTemp/source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/prepared
          python - <<'PY'
          import base64,hashlib,lzma,os,re,shutil,subprocess
          from pathlib import Path,PurePosixPath
          encoded=''.join(Path(f'aiTemp/codex-local-delivery/source.part{i}').read_text().strip() for i in (1,2))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='782f87e7ba04bb23e4b80d712f1d7b717d556651c9671e8ebae6984566523192'
          assert not re.search(rb'^(deleted file mode|rename |copy |old mode|new mode|\+\+\+ /dev/null)',patch,re.M)
          paths=[p.decode() for p in re.findall(rb'^\+\+\+ b/(.+)$',patch,re.M)]
          assert len(paths)==25 and len(set(paths))==25
          for name in paths:
              p=PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and not Path(name).is_symlink()
              assert name.startswith(('src/','src-tauri/','docs/guides/','aiTemp/codex-local-integration/')) or name in ('README.md','README.en.md','package.json','package-lock.json')
          target=Path('aiTemp/prepared/source.patch');target.write_bytes(patch)
          if not Path('src-tauri/src/tools/codex_local.rs').exists():
              subprocess.run(['git','apply','--check',str(target)],check=True)
              for name in paths:
                  original=Path(name)
                  if original.exists():
                      backup=Path('aiTemp/Trash/tools-before')/os.environ['GITHUB_RUN_ID']/name
                      backup.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(original,backup)
              subprocess.run(['git','apply',str(target)],check=True)
          for name in paths:
              if name.endswith('.rs'):subprocess.run(['rustfmt','--edition','2021','--config','skip_children=true',name],check=True)
          assert b'0.4.2-rc.1' in Path('package.json').read_bytes()
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: quota-free resources, local human questions, bounded waits and truthful tool coverage'
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            remote="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
            test "$remote" = "$GITHUB_SHA"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip HEAD --output=aiTemp/prepared/source.zip
          git rev-parse HEAD > aiTemp/prepared/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-source-${{ github.run_id }}
          path: aiTemp/source/aiTemp/prepared/*
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aiTemp/checkout
        shell: bash
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          path: aiTemp/checkout
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Frontend and focused resource, question and connection tests
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/installers
          npm ci 2>&1 | tee aiTemp/evidence/npm.txt
          npm run check 2>&1 | tee aiTemp/evidence/frontend.txt
          npm run build 2>&1 | tee aiTemp/evidence/frontend-build.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib codex_local_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/local-tools-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib connection_repair_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/connection-tests.txt
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib core_catalog_exposes_chatgpt_compatible_tools -- --test-threads=1 2>&1 | tee aiTemp/evidence/catalog.txt
          python - <<'PY'
          from pathlib import Path
          import json,re
          for name in ('local-tools-tests.txt','connection-tests.txt'):
              assert '3 passed; 0 failed' in Path('aiTemp/evidence',name).read_text(encoding='utf-8')
          assert '2 passed; 0 failed' in Path('aiTemp/evidence/catalog.txt').read_text(encoding='utf-8')
          en=Path('docs/guides/codex-local-tools.en.md').read_text(encoding='utf-8')
          zh=Path('docs/guides/codex-local-tools.zh-Hant.md').read_text(encoding='utf-8')
          assert en.count('\n## ')==zh.count('\n## ')
          for name in ('request_user_input','read_user_input','list_mcp_resources','list_mcp_resource_templates','read_mcp_resource','clock_sleep','wait_for_environment'):
              assert name in en and name in zh
          assert '634ebc1865c6ac840ed3ba118f040d527bf4b55d' in en and '634ebc1865c6ac840ed3ba118f040d527bf4b55d' in zh
          schema=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert not any('sandbox' in k.lower() or 'codex' in k.lower() for k in schema['bundle']['resources'])
          PY
      - name: Build and inspect Windows EXE
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles nsis -- --locked 2>&1 | tee aiTemp/evidence/installer.txt
          git diff --exit-code -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,subprocess
          root=Path(os.environ['CARGO_TARGET_DIR'])/'release'
          actual=subprocess.check_output([str(root/'coding-tools-mcp-desktop.exe'),'--version'],text=True,timeout=15).strip()
          assert actual=='coding-tools-mcp-desktop '+os.environ['VERSION']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['SOURCE']
          matches=list(root.glob('bundle/nsis/*.exe'));assert len(matches)==1
          name='Coding.Tools.MCP_'+os.environ['VERSION']+'_x64-setup.exe'
          dest=Path('aiTemp/installers')/name;assert not dest.exists();shutil.copy2(matches[0],dest)
          proof={'version':os.environ['VERSION'],'source_commit':os.environ['SOURCE'],'workflow_run':int(os.environ['GITHUB_RUN_ID']),'asset':name,'size':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'focused_native_tests':8,'codex_invoked':False,'all_upstream_tools_integrated':False,'publisher_signed':False,'live_user_connection_verified':False,'upstream_inventory':'634ebc1865c6ac840ed3ba118f040d527bf4b55d'}
          for folder in ('aiTemp/installers','aiTemp/evidence'):
              Path(folder,'proof.json').write_text(json.dumps(proof,indent=2)+'\n',encoding='utf-8')
          for name in ('codex-local-tools.en.md','codex-local-tools.zh-Hant.md','mcp-connection-repair.md'):
              shutil.copy2(Path('docs/guides')/name,Path('aiTemp/installers')/name)
          Path('aiTemp/evidence/binary-version.txt').write_text(actual+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-windows-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/installers/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integrated-evidence-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
