name: Apply active Provider Hub surface

on:
  push:
    branches:
      - fix/v0.7.0-rc.4-provider-hub-account-wiring
    paths:
      - aiTemp/provider-center-account-wiring/apply_provider_hub_import.py
      - .github/workflows/apply-provider-hub-surface.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-provider-hub-surface-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/bun-cache-apply-provider-hub

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/v0.7.0-rc.4-provider-hub-account-wiring'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          clean: false
          persist-credentials: true

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Prepare retained work roots
        run: mkdir -p aiTemp/provider-center-account-wiring/renderer aiTemp/Trash/provider-center-account-wiring

      - name: Apply deterministic App import patch
        run: python aiTemp/provider-center-account-wiring/apply_provider_hub_import.py

      - name: Require only the active App import to change
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --diff-filter=D --name-only)"
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "desktop-electron/src/App.tsx"

      - name: Install exact Electron dependencies
        run: bun install --cwd desktop-electron --frozen-lockfile

      - name: Run focused Provider Hub contracts
        run: >-
          node --test
          desktop-electron/tests/provider-center-account-wiring.test.cjs
          desktop-electron/tests/provider-execution-router.test.cjs
          desktop-electron/tests/execution-bridge-contract.test.cjs

      - name: Validate Electron runtime and renderer
        shell: bash
        run: |
          set -euo pipefail
          node --check desktop-electron/electron/main.cjs
          node --check desktop-electron/electron/main-with-provider.cjs
          node --check desktop-electron/electron/provider-bootstrap.cjs
          node --check desktop-electron/electron/provider-execution-router.cjs
          node --check desktop-electron/electron/provider-network.cjs
          node --check desktop-electron/electron/preload.cjs
          bun run --cwd desktop-electron typecheck
          (
            cd desktop-electron
            bunx vite build \
              --outDir ../aiTemp/provider-center-account-wiring/renderer \
              --emptyOutDir
          )

      - name: Commit the verified App wiring
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --diff-filter=D --name-only)"
          git add desktop-electron/src/App.tsx
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          git commit -m 'fix(provider): activate encrypted Provider Hub surface'
          git push origin HEAD:refs/heads/fix/v0.7.0-rc.4-provider-hub-account-wiring

      - name: Preserve transient dependencies in Trash
        if: always()
        shell: bash
        run: |
          target="aiTemp/Trash/provider-center-account-wiring/apply-node_modules-$GITHUB_RUN_ID"
          if [ -d desktop-electron/node_modules ]; then
            mv desktop-electron/node_modules "$target"
          fi
