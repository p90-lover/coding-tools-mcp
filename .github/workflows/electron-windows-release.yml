# Builds the Windows app (portable zip, setup .exe, in-app update packs) on a clean runner and,
# when started by hand from main, publishes it as release v<desktop-electron/package.json version>.
# A pull request that changes this file runs the build only, so the pipeline is proven before merge.
name: Electron Windows release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release after the build (otherwise build only)
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - .github/workflows/electron-windows-release.yml

permissions:
  contents: read

concurrency:
  group: electron-windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  BUN_VERSION: 1.4.3
  GO_VERSION: 1.27.1
  RUST_TOOLCHAIN: 1.98.1
  TUNNEL_RELEASE_URL: https://github.com/openai/tunnel-client/releases/download/v0.0.12
  TUNNEL_ARCHIVE: tunnel-client-v0.0.12-windows-amd64.zip
  TUNNEL_ARCHIVE_SHA256: 2a2804933924e38a502d62b61f0266cb80d56d65744f4c29876b2bf9c1544356
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    name: Build Windows x64 portable app and update packs
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Allow long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
          clean: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Release identity
        id: identity
        run: |
          set -euo pipefail
          version="$(node -p 'require("./desktop-electron/package.json").version')"
          tag="v$version"
          echo "Building Coding Tools $version"
          node --test desktop-electron/tests/rc12-release-identity.test.cjs desktop-electron/tests/product-identity.test.cjs
          test -s "docs/releases/$tag.md" || { echo "::error::docs/releases/$tag.md is missing"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${{ inputs.publish }}" = true ]; then
            test "$GITHUB_REF" = refs/heads/main || { echo "::error::Publish only from main"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists; bump the version first"; exit 1
            fi
          fi
          go version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          set -euo pipefail
          # npm 10 (Node 22's) crashes resolving the AO renderer's peer dependencies
          # ("Cannot read properties of null (reading 'edgesOut')"); npm 11 installs them.
          npm install -g npm@11.21.1
          npm --version
          bun install --frozen-lockfile --cwd runtime-web
          bun install --frozen-lockfile --cwd runtime-web/launcher
          bun install --frozen-lockfile --cwd desktop-electron

      - name: Fetch the checksum-pinned tunnel-client archive
        run: |
          set -euo pipefail
          input_dir="aiTemp/input/tunnel-client/v0.0.12/windows-amd64"
          archive="$input_dir/$TUNNEL_ARCHIVE"
          mkdir -p "$input_dir"
          curl.exe --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$archive.partial" "$TUNNEL_RELEASE_URL/$TUNNEL_ARCHIVE"
          test "$(sha256sum "$archive.partial" | awk '{print $1}')" = "$TUNNEL_ARCHIVE_SHA256"
          mv "$archive.partial" "$archive"
          echo "CODING_TOOLS_TUNNEL_CLIENT_ARCHIVE=$PWD/$archive" >> "$GITHUB_ENV"

      - name: Build the Rust headless sidecar
        run: cargo build --release --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml

      - name: Package Windows app
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/tmp
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron package:win

      - name: Check release files
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          cd desktop-electron/artifacts
          ls -la
          prefix="Coding.Tools_${VERSION}_win_x64"
          test -s "${prefix}_portable.zip"
          test -s "${prefix}_update.json"
          test -s SHA256SUMS.txt
          ls ./*.ctpack >/dev/null
          rm -f ./*.blockmap
          if [ -s "${prefix}.exe" ]; then
            sha256sum "${prefix}.exe" | sed 's/ \*/  /' >> SHA256SUMS.txt
          fi
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coding-tools-${{ steps.identity.outputs.version }}-win-x64
          path: desktop-electron/artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coding-tools-${{ needs.build.outputs.version }}-win-x64
          path: aiTemp/release/assets

      # Draft first: the in-app updater skips drafts, so no client sees the release before
      # every pack is uploaded and read back.
      - name: Create draft release and verify uploaded files
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes="$PWD/docs/releases/$tag.md"
          cd aiTemp/release/assets
          sha256sum -c SHA256SUMS.txt
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Coding Tools $tag" --notes-file "$notes" ./*
          mkdir -p ../readback
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir ../readback
          cd ../readback
          sha256sum -c SHA256SUMS.txt

      - name: Publish release
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
