name: Apply archived Rust CI fix

on:
  push:
    branches:
      - integration/xyTom-v0.3.0
    paths:
      - "aiTemp/Trash/rust-ci-fix-20260818/rust-ci-fixes.patch"

permissions:
  contents: write

concurrency:
  group: apply-rust-ci-fix-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-rust-fix

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/xyTom-v0.3.0
          fetch-depth: 0

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-ci-fix-linux

      - name: Apply Rust source patch and format the crate
        shell: bash
        run: |
          set -euo pipefail
          patch_path="aiTemp/Trash/rust-ci-fix-20260818/rust-ci-fixes.patch"
          git apply --check "$patch_path"
          git apply "$patch_path"
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Run linked-root regression tests
        working-directory: src-tauri
        run: cargo test --locked tools::workspace::linked_root_tests

      - name: Run complete Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Run Clippy with warnings denied
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Commit verified Rust source without deleting files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src-tauri
          if git diff --cached --quiet; then
            echo "Rust source is already up to date."
            exit 0
          fi
          if git diff --cached --name-status | grep -q '^D'; then
            echo "Refusing to commit a deletion."
            exit 1
          fi
          git commit -m "fix(rust): normalize linked paths and satisfy CI"
          git push origin HEAD:"${GITHUB_REF_NAME}"
