name: Verified load resilience release
on:
  push:
    branches: [fix/load-resilience-0.4.6]
    paths: [.github/workflows/load-resilience-release.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: load-resilience-046
  cancel-in-progress: false
env:
  VERSION: 0.4.6
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions: {contents: write, actions: read}
    outputs: {source: '${{ steps.source.outputs.source }}'}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/load-probe-target
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1', components: rustfmt}
      - name: Require original failures and verify the actual repaired handler
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          gh run download 34683848073 --repo "$GITHUB_REPOSITORY" --name load-red-34683848073 --dir aiTemp/red
          cp aiTemp/red/load-red.txt aiTemp/evidence/
          grep -F SLOW_TRACE_BLOCKS_ASYNC_SCHEDULER aiTemp/evidence/load-red.txt
          grep -F TRANSIENT_OWNER_QUERY_PERMANENTLY_BLOCKS_RECOVERY aiTemp/evidence/load-red.txt
          python - <<'PY'
          import ast
          from pathlib import Path
          for p in Path('aiTemp/load-resilience').glob('*.py'):ast.parse(p.read_text(encoding='utf-8'))
          PY
          python aiTemp/load-resilience/prepare.py
          python aiTemp/load-resilience/probe.py 2>&1 | tee aiTemp/evidence/load-green.txt
          grep -F '3 passed; 0 failed' aiTemp/evidence/load-green.txt
      - name: Record scoped candidate without modifying concurrent work
        id: source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git diff --exit-code 541c50f2d6db720ef2e888bb3f70ede961bbae1a -- src-tauri/src/auth src-tauri/src/runtime src-tauri/src/integrations src-tauri/src/tunnel/recovery.rs src-tauri/src/tunnel/access.rs src-tauri/src/tunnel/cloudflare.rs native-helpers src-tauri/src/tools aiTemp/task-monitor aiTemp/live-refresh aiTemp/quicktunnel aiTemp/reliability aiTemp/timeout-recovery
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then git commit -m 'fix: isolate MCP trace I/O and defer transient recovery ownership errors'; fi
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = 541c50f2d6db720ef2e888bb3f70ede961bbae1a
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME --jq .object.sha)" = "$GITHUB_SHA"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve source for review
        if: always()
        run: |
          mkdir -p aiTemp/review
          git bundle create aiTemp/review/source.bundle HEAD
          git diff HEAD --binary > aiTemp/review/materialized.patch
          git status --short > aiTemp/review/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'load-preparation-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'load-source-${{ github.run_id }}', path: aiTemp/source/aiTemp/review/, if-no-files-found: error, retention-days: 14}
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    permissions: {contents: read, actions: read}
    env:
      SOURCE: ${{ needs.prepare.outputs.source }}
      PLATFORM: windows-x64
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/load-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      PIP_CACHE_DIR: ${{ github.workspace }}/aiTemp/pip-cache
      EXTENSION_SOURCE_DIR: ${{ github.workspace }}/aiTemp/extension
      CODING_TOOLS_COMMAND_NATIVE_SHA256: 444a3f0008050605cae73cd9b7a2dcac61294062dfaab56dd20430fd6498518b
      CODING_TOOLS_SNAPSHOT_HELPER: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-appcontainer.exe
      CODING_TOOLS_SNAPSHOT_PROBE: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-sandbox-probe.exe
      APP_CONTAINER_HELPER: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-appcontainer.exe
      APP_CONTAINER_PROBE: ${{ github.workspace }}/aiTemp/source/aiTemp/native-build/Release/coding-tools-sandbox-probe.exe
      CI: 'true'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ env.SOURCE }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {repository: p90-lover/coding-tools-mcp-fast-access-extension, ref: b0d4db553227fa3c7300050b8edff6e2eb9afee4, path: aiTemp/extension, clean: false, persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - name: Build current source with load regressions and retained release verification
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python aiTemp/load-resilience/windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'load-installer-${{ github.run_id }}', path: 'aiTemp/source/aiTemp/installer/*', if-no-files-found: error, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'load-evidence-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
  publish:
    needs: [prepare,windows]
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: write, actions: read}
    env: {SOURCE: '${{ needs.prepare.outputs.source }}'}
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ env.SOURCE }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - name: Verify source, read back uploaded bytes and publish stable Latest
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python aiTemp/load-resilience/publish.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: load-publication-${{ github.run_id }}
          path: |
            aiTemp/source/aiTemp/load-release-receipt.json
            aiTemp/source/aiTemp/load-release-draft.json
          if-no-files-found: warn
          retention-days: 14
