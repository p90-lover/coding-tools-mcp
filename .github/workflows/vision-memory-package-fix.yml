name: Repair vision candidate packaging
on:
  push:
    branches: [release/vision-memory-package-fix]
    paths: ['.github/workflows/vision-memory-package-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vision-memory-candidate-publication
  cancel-in-progress: false
env:
  SOURCE: 7bed552df903b0cad31a5f7f016ff2e46201e835
  VERSION: 0.3.3-rc.1
  ORIGINAL_RUN: '34139321515'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  macos-package:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/release/vision-memory-package-fix'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      GH_TOKEN: ${{ github.token }}
      CI: 'true'
    defaults:
      run:
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7bed552df903b0cad31a5f7f016ff2e46201e835
          path: aiTemp/checkout
          persist-credentials: false
          clean: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 34139321515
          github-token: ${{ github.token }}
          name: memory-validation-macos-arm64-34139321515
          path: aiTemp/checkout/aiTemp/evidence
      - name: Verify prior tests against the exact unchanged source
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" > aiTemp/original-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN/jobs?per_page=100" > aiTemp/original-jobs.json
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['SOURCE']
          run=json.loads(Path('aiTemp/original-run.json').read_text())
          assert run['head_sha']=='e329437218515698fbc25c16357c156631ae5d37'
          assert run['head_branch']=='release/vision-memory-0.3.3-rc.1'
          jobs={j['name']:j for j in json.loads(Path('aiTemp/original-jobs.json').read_text())['jobs']}
          for name in ['prepare','commit-source','native (windows-latest, windows-x64, nsis)']:
              assert jobs[name]['conclusion']=='success', name
          mac=jobs['native (macos-14, macos-arm64, dmg)']
          for name in ['Verify source identity, no-save contract, and frontend','Focused native vision tests and tool catalog (no desktop capture)']:
              assert next(s for s in mac['steps'] if s['name']==name)['conclusion']=='success'
          evidence=Path('aiTemp/evidence')
          assert '5 passed; 0 failed' in (evidence/'vision.txt').read_text()
          assert '1 passed; 0 failed' in (evidence/'catalog.txt').read_text()
          assert 'version identity, backend gate, destination rejection, no capture file/process sink' in (evidence/'source-contract.txt').read_text()
          # Preserve the failed build log; do not overwrite or delete it.
          (evidence/'installer.txt').rename(evidence/'original-installer.txt')
          print('PASS: same source and existing native vision/catalog checks; only Mac packaging is rebuilt')
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: Build both app and DMG so the app is retained
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee aiTemp/evidence/rebuild-npm.txt
          npm run tauri -- build --bundles app,dmg -- --locked 2>&1 | tee aiTemp/evidence/installer.txt
          git diff --exit-code -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
      - name: Verify the actual read-only DMG payload and preserve installer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,plistlib,shutil,subprocess
          from pathlib import Path
          target=Path(os.environ['CARGO_TARGET_DIR'])/'release'
          apps=list((target/'bundle/macos').glob('*.app'))
          dmgs=list((target/'bundle/dmg').glob('*.dmg'))
          assert len(apps)==1 and len(dmgs)==1
          assert (apps[0]/'Contents/MacOS/coding-tools-mcp-desktop').is_file()
          mount=Path('aiTemp/dmg-inspection').resolve(); mount.mkdir(parents=True,exist_ok=False)
          subprocess.run(['hdiutil','attach',str(dmgs[0]),'-readonly','-nobrowse','-mountpoint',str(mount)],check=True)
          try:
              bundled=list(mount.glob('*.app')); assert len(bundled)==1
              info=plistlib.loads((bundled[0]/'Contents/Info.plist').read_bytes())
              assert info['CFBundleExecutable']=='coding-tools-mcp-desktop'
              binary=bundled[0]/'Contents/MacOS'/info['CFBundleExecutable']
              version=subprocess.run([str(binary),'--version'],capture_output=True,text=True,check=True,timeout=20).stdout.strip()
              assert version=='coding-tools-mcp-desktop '+os.environ['VERSION'],repr(version)
              subprocess.run(['codesign','--verify','--deep','--strict',str(bundled[0])],check=True)
              Path('aiTemp/evidence/binary-version.txt').write_text(version+'\nVerified from read-only DMG mount; ad-hoc signature only.\n')
          finally:
              subprocess.run(['hdiutil','detach',str(mount)],check=True)
          dest=Path('aiTemp/installer'); dest.mkdir(exist_ok=False)
          asset=dest/dmgs[0].name; shutil.copy2(dmgs[0],asset)
          proof={'source_commit':os.environ['SOURCE'],'version':os.environ['VERSION'],'platform':'macos-arm64','asset':asset.name,'size':asset.stat().st_size,'sha256':hashlib.sha256(asset.read_bytes()).hexdigest(),'vision_tests_passed':5,'catalog_tests_passed':1,'screenshot_storage':'memory_only','interactive_capture_verified':False,'codex_invoked':False,'publisher_signed':False,'test_workflow_run':int(os.environ['ORIGINAL_RUN']),'packaging_workflow_run':int(os.environ['GITHUB_RUN_ID']),'dmg_payload_verified':True}
          for path in [dest/'proof.json',Path('aiTemp/evidence/proof.json')]:
              assert not path.exists(); path.write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repaired-mac-installer-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/installer/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repaired-mac-evidence-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: macos-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 34139321515
          github-token: ${{ github.token }}
          name: memory-installer-windows-x64-34139321515
          path: aiTemp/installers/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repaired-mac-installer-${{ github.run_id }}
          path: aiTemp/installers/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 34139321515
          github-token: ${{ github.token }}
          name: memory-validation-windows-x64-34139321515
          path: aiTemp/validation/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repaired-mac-evidence-${{ github.run_id }}
          path: aiTemp/validation/macos
      - name: Verify exact assets and publish new immutable-target candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,shutil,subprocess,zipfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; assert repo=='p90-lover/coding-tools-mcp'
          source=os.environ['SOURCE']; version=os.environ['VERSION']; tag='v'+version
          def api(path,method='GET',payload=None):
              cmd=['gh','api','--method',method,f'repos/{repo}/{path}']
              if payload is not None: cmd+=['--input','-']
              result=subprocess.run(cmd,input=json.dumps(payload).encode() if payload is not None else None,stdout=subprocess.PIPE,check=True)
              return json.loads(result.stdout)
          original=api('actions/runs/'+os.environ['ORIGINAL_RUN'])
          assert original['head_sha']=='e329437218515698fbc25c16357c156631ae5d37'
          jobs=api('actions/runs/'+os.environ['ORIGINAL_RUN']+'/jobs?per_page=100')['jobs']
          assert next(j for j in jobs if j['name']=='native (windows-latest, windows-x64, nsis)')['conclusion']=='success'
          dest=Path('aiTemp/release-assets'); dest.mkdir(parents=True,exist_ok=False)
          proofs=[]
          for platform,directory in [('windows-x64','windows'),('macos-arm64','macos')]:
              folder=Path('aiTemp/installers')/directory
              p=json.loads((folder/'proof.json').read_text())
              assert p['source_commit']==source and p['version']==version and p['platform']==platform
              assert p['vision_tests_passed']==5 and p['catalog_tests_passed']==1 and p['screenshot_storage']=='memory_only' and p['codex_invoked'] is False
              assert Path(p['asset']).name==p['asset'] and not any(c in p['asset'] for c in '\r\n')
              asset=folder/p['asset']; assert asset.is_file() and not asset.is_symlink()
              assert asset.stat().st_size==p['size'] and hashlib.sha256(asset.read_bytes()).hexdigest()==p['sha256']
              evidence=Path('aiTemp/validation')/directory
              assert '5 passed; 0 failed' in (evidence/'vision.txt').read_text()
              assert '1 passed; 0 failed' in (evidence/'catalog.txt').read_text()
              assert source==json.loads((evidence/'proof.json').read_text())['source_commit']
              if platform=='macos-arm64': assert p['dmg_payload_verified'] is True
              shutil.copy2(asset,dest/asset.name); proofs.append(p)
          provenance={'version':version,'tag':tag,'source_commit':source,'workflow_run':int(os.environ['GITHUB_RUN_ID']),'original_test_run':int(os.environ['ORIGINAL_RUN']),'prerelease':True,'installers':proofs}
          (dest/'release-provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          with zipfile.ZipFile(dest/'vision-validation.zip','x',zipfile.ZIP_DEFLATED) as z:
              for path in sorted(Path('aiTemp/validation').rglob('*')):
                  if path.is_file():
                      assert path.suffix in {'.json','.txt'} and not path.is_symlink()
                      z.write(path,path.relative_to('aiTemp/validation').as_posix())
          assets=sorted(dest.iterdir())
          (dest/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in assets))
          note=api(f'contents/docs/releases/{tag}.md?ref={source}')
          notes=base64.b64decode(note['content']).decode()
          assert not any(r['tag_name']==tag for r in api('releases?per_page=100')), 'Release already exists: no replacement allowed'
          refs=api(f'git/matching-refs/tags/{tag}')
          exact=[r for r in refs if r['ref']=='refs/tags/'+tag]
          if exact:
              assert len(exact)==1 and exact[0]['object']['type']=='commit' and exact[0]['object']['sha']==source
          else:
              api('git/refs','POST',{'ref':'refs/tags/'+tag,'sha':source})
          assert api('git/ref/tags/'+tag)['object']['sha']==source
          release=api('releases','POST',{'tag_name':tag,'target_commitish':source,'name':f'Coding Tools MCP {tag} — memory-only vision','body':notes,'draft':True,'prerelease':True,'make_latest':'false'})
          for path in sorted(dest.iterdir()):
              subprocess.run(['gh','release','upload',tag,str(path),'--repo',repo],check=True)
          uploaded=api(f"releases/{release['id']}")
          assert uploaded['draft'] is True and uploaded['prerelease'] is True
          actual={a['name']:a for a in uploaded['assets']}; files=list(dest.iterdir())
          assert len(actual)==len(uploaded['assets'])==len(files) and set(actual)=={p.name for p in files}
          for p in files:
              assert actual[p.name]['state']=='uploaded' and actual[p.name]['size']==p.stat().st_size
              assert actual[p.name]['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          assert api('git/ref/tags/'+tag)['object']['sha']==source
          published=api(f"releases/{release['id']}",'PATCH',{'draft':False,'prerelease':True,'make_latest':'false'})
          assert published['draft'] is False and published['prerelease'] is True
          print(json.dumps({'url':published['html_url'],'tag':tag,'source':source,'assets':[{'name':a['name'],'url':a['browser_download_url'],'digest':a['digest']} for a in published['assets']]},indent=2))
          Path('aiTemp/published.json').write_text(json.dumps(published,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memory-release-publication-${{ github.run_id }}
          path: aiTemp/published.json
          if-no-files-found: error
          retention-days: 14
