name: RC6 Main History Union

on:
  push:
    branches:
      - integration/v0.7.0-rc.6-main-union
    paths:
      - .github/workflows/rc6-main-history-sync.yml
      - aiTemp/rc6-main-union/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc6-main-history-union
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  BUN_VERSION: '1.4.0'
  RUST_TOOLCHAIN: '1.98.1'
  NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/cache/npm-rc6-main-union
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/cache/bun-rc6-main-union
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-rc6-main-union
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  merge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact rc.6 integration branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: integration/v0.7.0-rc.6-main-union
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install native verification dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libpipewire-0.3-dev libgbm-dev

      - name: Merge current main while preserving the verified rc.6 product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          before="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          base="$(git merge-base "$before" "$main")"

          mkdir -p \
            aiTemp/evidence/rc6-main-union \
            aiTemp/Trash/rc6-main-union/main-only \
            aiTemp/tmp/rc6-main-union \
            aiTemp/rc6-main-union/renderer

          printf '%s\n' "$before" > aiTemp/evidence/rc6-main-union/before-sha.txt
          printf '%s\n' "$main" > aiTemp/evidence/rc6-main-union/main-sha.txt
          printf '%s\n' "$base" > aiTemp/evidence/rc6-main-union/merge-base-sha.txt
          git ls-tree -r --name-only "$before" > aiTemp/evidence/rc6-main-union/rc6-files.txt
          git diff --name-only "$base"..."$main" > aiTemp/evidence/rc6-main-union/main-changed-paths.txt

          if git merge-base --is-ancestor "$main" "$before"; then
            echo 'RC6_MAIN_HISTORY_ALREADY_PRESENT'
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit -X ours "$main"
          merge_status=$?
          set -e
          printf '%s\n' "$merge_status" > aiTemp/evidence/rc6-main-union/merge-status.txt

          mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
          printf '%s\n' "${unresolved[@]:-}" > aiTemp/evidence/rc6-main-union/conflicts.txt
          for path in "${unresolved[@]}"; do
            [ -n "$path" ] || continue
            if git cat-file -e "$before:$path" 2>/dev/null; then
              git checkout "$before" -- "$path"
            elif git cat-file -e "$main:$path" 2>/dev/null; then
              mkdir -p "$(dirname "$path")"
              git show "$main:$path" > "$path"
              git add -- "$path"
            else
              echo "::error file=$path::Neither lineage contains a preservable conflict version"
              exit 1
            fi
          done

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if ! git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              git checkout "$before" -- "$path"
              printf '%s\n' "$path" >> aiTemp/evidence/rc6-main-union/restored-rc6-paths.txt
            fi
          done < aiTemp/evidence/rc6-main-union/rc6-files.txt

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if git cat-file -e "$main:$path" 2>/dev/null && \
               ! git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              retained="aiTemp/Trash/rc6-main-union/main-only/$path"
              mkdir -p "$(dirname "$retained")"
              git show "$main:$path" > "$retained"
              git add -- "$retained"
              printf '%s\n' "$path -> $retained" \
                >> aiTemp/evidence/rc6-main-union/retained-main-paths.txt
            fi
          done < aiTemp/evidence/rc6-main-union/main-changed-paths.txt

          git add -A
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          test -z "$(git diff --diff-filter=U --name-only)"
          git diff --cached --check

      - name: Install exact locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          preload="$PWD/runtime-web/scripts/no-delete-preload.mjs"
          export NODE_OPTIONS="--import=$preload"
          temp="$PWD/aiTemp/tmp/rc6-main-union"

          npm ci 2>&1 | tee aiTemp/evidence/rc6-main-union/root-install.txt
          TMPDIR="$temp" TMP="$temp" TEMP="$temp" \
            bun install --cwd runtime-web --frozen-lockfile \
            2>&1 | tee aiTemp/evidence/rc6-main-union/runtime-install.txt
          TMPDIR="$temp" TMP="$temp" TEMP="$temp" \
            bun install --cwd desktop-electron --frozen-lockfile \
            2>&1 | tee aiTemp/evidence/rc6-main-union/desktop-install.txt

      - name: Verify retained Tauri main-line contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee aiTemp/evidence/rc6-main-union/root-check.txt
          npm run build 2>&1 | tee aiTemp/evidence/rc6-main-union/root-build.txt
          cargo check --locked --manifest-path src-tauri/Cargo.toml \
            2>&1 | tee aiTemp/evidence/rc6-main-union/tauri-cargo-check.txt

      - name: Verify rc.6 runtime and Electron contracts
        shell: bash
        run: |
          set -euo pipefail
          preload="$PWD/runtime-web/scripts/no-delete-preload.mjs"
          export NODE_OPTIONS="--import=$preload"
          temp="$PWD/aiTemp/tmp/rc6-main-union"

          TMPDIR="$temp" TMP="$temp" TEMP="$temp" \
            bun run --cwd runtime-web typecheck \
            2>&1 | tee aiTemp/evidence/rc6-main-union/runtime-typecheck.txt
          TMPDIR="$temp" TMP="$temp" TEMP="$temp" \
            bun run --cwd desktop-electron typecheck \
            2>&1 | tee aiTemp/evidence/rc6-main-union/desktop-typecheck.txt

          node --test \
            desktop-electron/tests/product-identity.test.cjs \
            desktop-electron/tests/installer-upgrade-migration.test.cjs \
            desktop-electron/tests/provider-center-account-wiring.test.cjs \
            desktop-electron/tests/provider-execution-router.test.cjs \
            desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs \
            desktop-electron/tests/proxy-provider-contract.test.cjs \
            desktop-electron/tests/execution-bridge-contract.test.cjs \
            2>&1 | tee aiTemp/evidence/rc6-main-union/electron-contracts.txt
          grep -F '# fail 0' aiTemp/evidence/rc6-main-union/electron-contracts.txt

          (
            cd desktop-electron
            bunx vite build \
              --outDir ../aiTemp/rc6-main-union/renderer \
              --emptyOutDir
          ) 2>&1 | tee aiTemp/evidence/rc6-main-union/renderer-build.txt
          CODING_TOOLS_RENDERER_DIST="$PWD/aiTemp/rc6-main-union/renderer" \
            node --test desktop-electron/tests/renderer-provider-bundle.test.cjs \
            2>&1 | tee aiTemp/evidence/rc6-main-union/renderer-contract.txt
          grep -F '# fail 0' aiTemp/evidence/rc6-main-union/renderer-contract.txt

      - name: Commit and push the verified two-lineage union
        shell: bash
        run: |
          set -euo pipefail
          before="$(cat aiTemp/evidence/rc6-main-union/before-sha.txt)"
          main="$(cat aiTemp/evidence/rc6-main-union/main-sha.txt)"

          git add -A
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          test -z "$(git diff --diff-filter=U --name-only)"
          git diff --cached --check

          if git merge-base --is-ancestor "$main" HEAD; then
            echo 'RC6_MAIN_HISTORY_ALREADY_PRESENT'
            exit 0
          fi

          git commit \
            -m 'integrate(rc.6): unite verified release and current main histories' \
            -m 'Keep the exact v0.7.0-rc.6 Electron product active, retain current main history and Tauri contracts, preserve superseded material under aiTemp/Trash, and delete no project file or branch.'

          test "$(git rev-parse HEAD^2)" = "$main"
          git merge-base --is-ancestor "$main" HEAD
          test -z "$(git diff --diff-filter=D --name-only "$before" HEAD)"
          test -z "$(git status --porcelain --untracked-files=no)"
          git push origin HEAD:integration/v0.7.0-rc.6-main-union

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc6-main-union-${{ github.sha }}
          path: aiTemp/evidence/rc6-main-union/
          if-no-files-found: error
          retention-days: 14
