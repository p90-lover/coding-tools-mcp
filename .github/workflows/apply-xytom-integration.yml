name: Apply xyTom 0.3 integration payload

on:
  workflow_dispatch:
  push:
    branches:
      - integration/xyTom-v0.3.0
    paths:
      - "patches/xyTom-integration/**"
      - ".github/workflows/apply-xytom-integration.yml"

permissions:
  contents: write

concurrency:
  group: apply-xytom-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/xyTom-v0.3.0
          fetch-depth: 0

      - name: Reconstruct and verify payload
        shell: bash
        env:
          STAGE_ROOT: aiTemp/xytom-integration-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$STAGE_ROOT"
          cat patches/xyTom-integration/payload.b64.part* | base64 --decode > "$STAGE_ROOT/payload.tar.gz"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          stage_root = Path(os.environ["STAGE_ROOT"])
          archive = stage_root / "payload.tar.gz"
          extracted = stage_root / "extracted"
          extracted.mkdir(parents=True, exist_ok=True)

          expected = {
              ".github/workflows/integration-validation.yml",
              "AGENTS.md",
              "README.md",
              "README.en.md",
              "src/lib/components/ChatGptSessionPrompt.svelte",
              "tests/chatgpt-session-prompt-layout.test.mjs",
              "src-tauri/src/mcp/server.rs",
              "src-tauri/src/tools/context.rs",
              "src-tauri/src/tools/dispatch.rs",
              "src-tauri/src/tools/exec.rs",
              "src-tauri/src/tools/mod.rs",
              "src-tauri/src/tools/project_context.rs",
              "src-tauri/src/tools/registry.rs",
              "src-tauri/src/tools/session.rs",
              "src-tauri/tests/call_tool_contract.rs",
          }

          with tarfile.open(archive, "r:gz") as payload:
              members = payload.getmembers()
              names = {member.name for member in members}
              if names != expected | {"MANIFEST.sha256"}:
                  raise SystemExit(f"Unexpected payload members: {sorted(names ^ (expected | {'MANIFEST.sha256'}))}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not member.isfile():
                      raise SystemExit(f"Unsafe payload member: {member.name}")
                  source = payload.extractfile(member)
                  if source is None:
                      raise SystemExit(f"Unreadable payload member: {member.name}")
                  destination = extracted.joinpath(*path.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with destination.open("wb") as output:
                      shutil.copyfileobj(source, output)

          manifest_lines = (extracted / "MANIFEST.sha256").read_text(encoding="utf-8").splitlines()
          manifest: dict[str, str] = {}
          for line in manifest_lines:
              digest, separator, relative = line.partition("  ")
              if not separator or relative not in expected:
                  raise SystemExit(f"Invalid manifest line: {line}")
              manifest[relative] = digest
          if set(manifest) != expected:
              raise SystemExit("Manifest does not cover the exact integration file set")

          for relative in sorted(expected):
              source = extracted / relative
              actual = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual != manifest[relative]:
                  raise SystemExit(f"Checksum mismatch: {relative}")
              destination = Path(relative)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          PY

      - name: Commit integration source without deleting files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/integration-validation.yml \
            AGENTS.md \
            README.md \
            README.en.md \
            src/lib/components/ChatGptSessionPrompt.svelte \
            tests/chatgpt-session-prompt-layout.test.mjs \
            src-tauri/src/mcp/server.rs \
            src-tauri/src/tools/context.rs \
            src-tauri/src/tools/dispatch.rs \
            src-tauri/src/tools/exec.rs \
            src-tauri/src/tools/mod.rs \
            src-tauri/src/tools/project_context.rs \
            src-tauri/src/tools/registry.rs \
            src-tauri/src/tools/session.rs \
            src-tauri/tests/call_tool_contract.rs
          if git diff --cached --quiet; then
            echo "Integration payload is already applied."
            exit 0
          fi
          if git diff --cached --name-status | grep -q '^D'; then
            echo "Refusing to commit a deletion."
            exit 1
          fi
          git commit -m "feat: integrate xyTom 0.3 compatibility"
          git push origin HEAD:"${GITHUB_REF_NAME}"
