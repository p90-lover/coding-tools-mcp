name: Prepublish v0.4.10 verification

on:
  pull_request:
    branches: [release-verify/v0.4.10]

permissions:
  contents: read

concurrency:
  group: prepublish-v0410-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_args: --bundles nsis
            asset_glob: aiTemp/prepublish-target/release/bundle/nsis/*.exe
          - os: macos-14
            platform: macos
            build_args: --target universal-apple-darwin --bundles dmg
            asset_glob: aiTemp/prepublish-target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/prepublish-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
      XDG_CONFIG_HOME: ${{ github.workspace }}/aiTemp/test-config
      PLATFORM: ${{ matrix.platform }}
      BUILD_ARGS: ${{ matrix.build_args }}
      ASSET_GLOB: ${{ matrix.asset_glob }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Verify v0.4.10 identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, tomllib
          root=pathlib.Path.cwd()
          versions=[json.loads((root/p).read_text())['version'] for p in ['package.json','package-lock.json','src-tauri/tauri.conf.json']]
          manifest=tomllib.loads((root/'src-tauri/Cargo.toml').read_text())['package']
          versions.append(manifest['version'])
          lock=tomllib.loads((root/'src-tauri/Cargo.lock').read_text())
          versions.extend(p['version'] for p in lock['package'] if p['name']==manifest['name'])
          versions.append(json.loads((root/'package-lock.json').read_text())['packages']['']['version'])
          assert versions and all(v=='0.4.10' for v in versions), versions
          assert (root/'docs/releases/v0.4.10.md').is_file()
          print('v0.4.10 identity verified:', versions)
          PY
          npm ci
      - name: Verify shipped target dependency boundary
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = windows ]; then
            targets='x86_64-pc-windows-msvc'
          else
            targets='aarch64-apple-darwin x86_64-apple-darwin'
          fi
          mkdir -p ../aiTemp/prepublish-evidence
          for target in $targets; do
            cargo tree --locked --target "$target" --prefix none --format '{p}' > "../aiTemp/prepublish-evidence/dependencies-$target.txt"
            if grep -Eq '^glib v' "../aiTemp/prepublish-evidence/dependencies-$target.txt"; then
              echo 'Prepublish blocked: affected GLib present in a shipped target'
              exit 1
            fi
          done
      - name: Build installer candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run tauri -- build $BUILD_ARGS -- --locked
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
          python - <<'PY'
          import glob, os, pathlib
          files=[pathlib.Path(p) for p in glob.glob(os.environ['ASSET_GLOB'])]
          assert files, f"No installer matched {os.environ['ASSET_GLOB']}"
          assert all(p.is_file() and p.stat().st_size > 100000 for p in files), files
          print('Installer candidates:', [(p.name,p.stat().st_size) for p in files])
          PY

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/audit-target
      NPM_CONFIG_CACHE: ${{ github.workspace }}/aiTemp/npm-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - name: NPM audit
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=low
      - name: Screen reachable Git history for credential patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/audit-evidence
          python - <<'PY' > aiTemp/audit-evidence/credential-screen.json
          import json, re, subprocess, sys
          patterns={
            'github-token': rb'\bgh[pousr]_[A-Za-z0-9]{36,255}\b',
            'github-fine-grained-token': rb'\bgithub_pat_[A-Za-z0-9_]{70,255}\b',
            'private-key-material': rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----\s+[A-Za-z0-9+/=\r\n]{100,}-----END (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
            'aws-access-key': rb'\bAKIA[A-Z0-9]{16}\b',
            'openai-key': rb'\bsk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{40,255}\b',
          }
          patterns={key:re.compile(value) for key,value in patterns.items()}
          objects=list(dict.fromkeys(line.split(b' ',1)[0] for line in subprocess.check_output(['git','rev-list','--objects','--all']).splitlines()))
          process=subprocess.Popen(['git','cat-file','--batch'],stdin=subprocess.PIPE,stdout=subprocess.PIPE)
          findings=[];blobs=0
          for oid in objects:
            process.stdin.write(oid+b'\n');process.stdin.flush()
            header=process.stdout.readline().split()
            if len(header)!=3: raise RuntimeError('Git object could not be read')
            size=int(header[2]);content=process.stdout.read(size)
            if len(content)!=size or process.stdout.read(1)!=b'\n': raise RuntimeError('Incomplete Git object')
            if header[1]!=b'blob': continue
            blobs+=1
            for name,pattern in patterns.items():
              if pattern.search(content): findings.append({'blob':oid.decode(),'kind':name})
          process.stdin.close()
          if process.wait()!=0: raise RuntimeError('Git object scan failed')
          print(json.dumps({'scope':'reachable Git history; selected high-confidence patterns','objects_scanned':len(objects),'blobs_scanned':blobs,'findings':findings},indent=2))
          sys.exit(1 if findings else 0)
          PY
          cat aiTemp/audit-evidence/credential-screen.json
      - name: Audit Rust dependencies against RustSec
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --version 0.22.2 --root "$PWD/aiTemp/audit-tool"
          aiTemp/audit-tool/bin/cargo-audit audit --file src-tauri/Cargo.lock --json > aiTemp/audit-evidence/rustsec.json
          python - <<'PY'
          import json, pathlib
          report=json.loads(pathlib.Path('aiTemp/audit-evidence/rustsec.json').read_text())
          assert not report['vulnerabilities']['found'], 'RustSec vulnerability remains'
          warnings=report.get('warnings', {})
          assert not warnings.get('yanked', []), 'A locked crate was yanked'
          assert all(item['advisory']['id']=='RUSTSEC-2024-0429' and item['package']['name']=='glib' for item in warnings.get('unsound', [])), 'Unreviewed soundness warning'
          print('RustSec vulnerability/yanked gates passed; GLib exclusion is checked in native jobs.')
          PY
