name: Apply rc7 Antigravity session union

on:
  push:
    branches:
      - integration/rc7-antigravity-session-union
    paths:
      - .github/workflows/apply-rc7-antigravity-session-union.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rc7-antigravity-session-union
  cancel-in-progress: false

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/cache/bun-rc7-antigravity-session-union

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out integration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: integration/rc7-antigravity-session-union
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Prepare exact source and retained evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin \
            integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater \
            release/codex-router-multiprovider-0.7.0-rc.6 \
            --no-tags

          base_ref="origin/integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater"
          source_ref="origin/release/codex-router-multiprovider-0.7.0-rc.6"
          merge_base="$(git merge-base "$base_ref" "$source_ref")"

          mkdir -p \
            aiTemp/rc7-antigravity-session-union \
            aiTemp/antigravity-session-binding \
            aiTemp/Trash/antigravity-session-binding/obsolete-workflows \
            aiTemp/Trash/rc7-antigravity-session-union/one-shot-workflows

          printf '%s\n' "$(git rev-parse "$base_ref")" > aiTemp/rc7-antigravity-session-union/base-sha.txt
          printf '%s\n' "$(git rev-parse "$source_ref")" > aiTemp/rc7-antigravity-session-union/source-sha.txt
          printf '%s\n' "$merge_base" > aiTemp/rc7-antigravity-session-union/merge-base-sha.txt

          git diff --full-index --binary "$merge_base" "$source_ref" -- \
            desktop-electron/electron/provider-network.cjs \
            > aiTemp/rc7-antigravity-session-union/provider-network-binding.patch

          git show "$source_ref:desktop-electron/tests/antigravity-session-binding.test.cjs" \
            > desktop-electron/tests/antigravity-session-binding.test.cjs
          git show "$source_ref:aiTemp/antigravity-session-binding/apply_connected_binding.py" \
            > aiTemp/antigravity-session-binding/apply_connected_binding.py
          git show "$source_ref:aiTemp/antigravity-session-binding/apply_patch.py" \
            > aiTemp/antigravity-session-binding/apply_patch.py
          git show "$source_ref:.github/workflows/apply-antigravity-session-binding-rc6.yml" \
            > aiTemp/Trash/antigravity-session-binding/obsolete-workflows/apply-antigravity-session-binding-rc6.yml

      - name: Detect whether the binding regression remains
        id: binding_state
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --test desktop-electron/tests/antigravity-session-binding.test.cjs \
            > aiTemp/rc7-antigravity-session-union/prepatch-test.log 2>&1
          prepatch_status=$?
          set -e
          printf '%s\n' "$prepatch_status" > aiTemp/rc7-antigravity-session-union/prepatch-test-status.txt
          if [ "$prepatch_status" -eq 0 ]; then
            echo "needs_patch=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "RC7_ALREADY_SATISFIES_ANTIGRAVITY_BINDING_CONTRACT" \
              > aiTemp/rc7-antigravity-session-union/resolution.txt
          else
            grep -Eiq 'fail|assert|bound|auth_index|antigravity' \
              aiTemp/rc7-antigravity-session-union/prepatch-test.log
            echo "needs_patch=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "RC7_REQUIRES_RC6_BINDING_DELTA" \
              > aiTemp/rc7-antigravity-session-union/resolution.txt
          fi

      - name: Apply the isolated Antigravity binding delta when required
        if: steps.binding_state.outputs.needs_patch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way --index \
            aiTemp/rc7-antigravity-session-union/provider-network-binding.patch
          test -z "$(git diff --name-only --diff-filter=U)"
          ! grep -nE '^(<<<<<<<|=======|>>>>>>>)' \
            desktop-electron/electron/provider-network.cjs

      - name: Run focused and compatibility verification
        shell: bash
        run: |
          set -euo pipefail
          node --check desktop-electron/electron/provider-network.cjs
          node --test desktop-electron/tests/antigravity-session-binding.test.cjs \
            | tee aiTemp/rc7-antigravity-session-union/green-binding-test.log

          bun install --cwd desktop-electron --frozen-lockfile
          node --test \
            desktop-electron/tests/antigravity*.test.cjs \
            desktop-electron/tests/commandcode-provider-session.test.cjs \
            desktop-electron/tests/provider-execution-router.test.cjs \
            desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs \
            | tee aiTemp/rc7-antigravity-session-union/green-compatibility-tests.log
          bun run --cwd desktop-electron typecheck
          bun run --cwd desktop-electron build:renderer -- \
            --outDir ../aiTemp/rc7-antigravity-session-union/renderer-dist

      - name: Preserve temporary dependencies and one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          if [ -d desktop-electron/node_modules ]; then
            mkdir -p aiTemp/Trash/rc7-antigravity-session-union
            mv desktop-electron/node_modules \
              aiTemp/Trash/rc7-antigravity-session-union/node_modules
          fi
          cp .github/workflows/apply-rc7-antigravity-session-union.yml \
            aiTemp/Trash/rc7-antigravity-session-union/one-shot-workflows/apply-rc7-antigravity-session-union.yml

      - name: Enforce conflict-free and no-delete union
        shell: bash
        run: |
          set -euo pipefail
          base_ref="origin/integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git add -A
          test -z "$(git diff --cached --diff-filter=D --name-only "$base_ref" --)"
          git diff --cached --check

      - name: Commit verified rc7 union
        shell: bash
        run: |
          set -euo pipefail
          git commit \
            -m "test(rc.7): retain Antigravity session-binding regression gate" \
            -m "The current rc.7 Provider Hub already satisfies the exact rc.6 multi-account binding contract. Preserve the newer implementation, add the permanent focused regression, retain source material under aiTemp/Trash, and delete no base files."
          git push origin HEAD:integration/rc7-antigravity-session-union
