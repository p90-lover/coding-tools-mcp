name: Materialize runtime health grace

on:
  push:
    branches: [automation/runtime-health-grace]
    paths:
      - "aiTemp/Trash/runtime-health-grace/**"

permissions:
  contents: write

concurrency:
  group: materialize-runtime-health-grace
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/runtime-health-grace
          fetch-depth: 0
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Apply and verify runtime-health patch
        id: verify
        shell: bash
        run: |
          set +e
          log="aiTemp/Trash/runtime-health-grace/verification-${GITHUB_RUN_ID}.log"
          mkdir -p "$(dirname "$log")"
          {
            set -x
            python3 aiTemp/Trash/runtime-health-grace/apply.py
            python_status=$?
            if [ "$python_status" -eq 0 ]; then
              cargo fmt --manifest-path src-tauri/Cargo.toml --all
              fmt_status=$?
            else
              fmt_status=99
            fi
            if [ "$python_status" -eq 0 ] && [ "$fmt_status" -eq 0 ]; then
              git diff --check -- src-tauri/src/runtime/supervisor.rs
              diff_status=$?
            else
              diff_status=99
            fi
            if [ "$python_status" -eq 0 ] && [ "$fmt_status" -eq 0 ] && [ "$diff_status" -eq 0 ]; then
              cargo test --manifest-path src-tauri/Cargo.toml --lib runtime::supervisor::tests --locked -- --nocapture
              test_status=$?
            else
              test_status=99
            fi
            set +x
            echo "python_status=$python_status"
            echo "fmt_status=$fmt_status"
            echo "diff_status=$diff_status"
            echo "test_status=$test_status"
          } >"$log" 2>&1
          status=0
          for value in "$python_status" "$fmt_status" "$diff_status" "$test_status"; do
            if [ "$value" -ne 0 ]; then
              status="$value"
              break
            fi
          done
          cat "$log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "log=$log" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve verification evidence
        shell: bash
        env:
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
          VERIFY_LOG: ${{ steps.verify.outputs.log }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$VERIFY_LOG"
          git commit -m "test: preserve runtime health verification ${GITHUB_RUN_ID}"
          if [ "$VERIFY_STATUS" != "0" ]; then
            git push origin HEAD:automation/runtime-health-grace
            exit 1
          fi
      - name: Commit verified source only
        if: steps.verify.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src-tauri/src/runtime/supervisor.rs
          if git diff --cached --quiet; then
            echo 'No source change required.'
          else
            if git diff --cached --name-status | grep -q '^D'; then
              echo 'Refusing to commit a deletion.'
              exit 1
            fi
            git commit -m 'fix: tolerate transient listener port misses'
          fi
          git push origin HEAD:automation/runtime-health-grace
