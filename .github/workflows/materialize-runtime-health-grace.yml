name: Materialize runtime health grace

on:
  push:
    branches: [automation/runtime-health-grace]
    paths:
      - "aiTemp/Trash/runtime-health-grace/**"

permissions:
  contents: write

concurrency:
  group: materialize-runtime-health-grace
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: automation/runtime-health-grace
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Apply runtime-health patch
        shell: bash
        run: |
          set -euo pipefail
          python3 aiTemp/Trash/runtime-health-grace/apply.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check -- src-tauri/src/runtime/supervisor.rs
          cargo test --manifest-path src-tauri/Cargo.toml runtime::supervisor::tests --locked
      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src-tauri/src/runtime/supervisor.rs
          if git diff --cached --quiet; then
            echo 'No source change required.'
            exit 0
          fi
          if git diff --cached --name-status | grep -q '^D'; then
            echo 'Refusing to commit a deletion.'
            exit 1
          fi
          git commit -m 'fix: tolerate transient listener port misses'
          git push origin HEAD:automation/runtime-health-grace
