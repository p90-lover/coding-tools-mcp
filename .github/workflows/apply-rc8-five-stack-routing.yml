name: Apply rc.8 five-stack routing completion

on:
  push:
    branches:
      - fix/rc8-five-stack-routing-completion
    paths:
      - 'aiTemp/rc8-five-stack/apply.py'
      - 'aiTemp/rc8-five-stack/apply_provider_scope_copy.py'
      - 'desktop-electron/tests/five-stack-routing-completion.test.cjs'
      - '.github/workflows/apply-rc8-five-stack-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rc8-five-stack-routing
  cancel-in-progress: false

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/rc8-five-stack/bun-cache

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/rc8-five-stack-routing-completion
          fetch-depth: 0
          clean: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Prepare retained roots
        run: |
          mkdir -p \
            aiTemp/rc8-five-stack/evidence \
            aiTemp/rc8-five-stack/renderer-dist \
            aiTemp/Trash/rc8-five-stack

      - name: Apply guarded five-stack routing patch
        run: |
          set -euo pipefail
          python aiTemp/rc8-five-stack/apply.py \
            2>&1 | tee aiTemp/rc8-five-stack/evidence/materializer.txt
          grep -F RC8_FIVE_STACK_ROUTING_APPLIED \
            aiTemp/rc8-five-stack/evidence/materializer.txt
          python aiTemp/rc8-five-stack/apply_provider_scope_copy.py \
            2>&1 | tee aiTemp/rc8-five-stack/evidence/provider-scope-copy.txt
          grep -F RC8_PROVIDER_SCOPE_COPY_APPLIED \
            aiTemp/rc8-five-stack/evidence/provider-scope-copy.txt
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"

      - name: Enforce bounded source scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            desktop-electron/electron/external-services.cjs \
            desktop-electron/electron/provider-execution-router.cjs \
            desktop-electron/electron/provider-network.cjs \
            desktop-electron/src/agents/agent-provider-adapter.ts \
            desktop-electron/src/features/ExternalServicesSurface.tsx \
            desktop-electron/src/features/ProviderHubSaasSurface.tsx \
            desktop-electron/src/providers/ProviderHubIntegration.tsx \
            desktop-electron/src/providers/provider-types.ts \
            desktop-electron/src/types.ts | sort)"
          printf 'changed files:\n%s\n' "$changed" \
            | tee aiTemp/rc8-five-stack/evidence/changed-files.txt
          test "$changed" = "$expected"

      - name: Install exact Electron dependencies
        run: bun install --cwd desktop-electron --frozen-lockfile

      - name: Run focused five-stack contracts
        run: |
          set -euo pipefail
          node --test \
            desktop-electron/tests/five-stack-routing-completion.test.cjs \
            desktop-electron/tests/external-services-control-plane.test.cjs \
            desktop-electron/tests/provider-center-account-wiring.test.cjs \
            desktop-electron/tests/provider-multiaccount-global-proxy.test.cjs \
            desktop-electron/tests/commandcode-provider-session.test.cjs \
            desktop-electron/tests/subagent-orchestrator-contract.test.cjs \
            desktop-electron/tests/upstream-tool-runtime.test.cjs \
            2>&1 | tee aiTemp/rc8-five-stack/evidence/contracts.txt

      - name: Validate runtime syntax
        run: |
          node --check desktop-electron/electron/external-services.cjs
          node --check desktop-electron/electron/provider-execution-router.cjs
          node --check desktop-electron/electron/provider-network.cjs

      - name: Typecheck and build isolated renderer
        run: |
          set -euo pipefail
          bun run --cwd desktop-electron typecheck
          renderer_dir="$GITHUB_WORKSPACE/aiTemp/rc8-five-stack/renderer-dist"
          (
            cd desktop-electron
            bunx vite build --outDir "$renderer_dir" --emptyOutDir false
          )
          CODING_TOOLS_RENDERER_DIST="$renderer_dir" \
            node --test desktop-electron/tests/renderer-provider-bundle.test.cjs

      - name: Enforce no-delete contract from common ancestor
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/integration/v0.7.0-rc.8-external-services-control-plane:refs/remotes/origin/integration/v0.7.0-rc.8-external-services-control-plane
          base='origin/integration/v0.7.0-rc.8-external-services-control-plane'
          merge_base="$(git merge-base "$base" HEAD)"
          test -n "$merge_base"
          git diff --check "$merge_base"..HEAD
          test -z "$(git diff --diff-filter=D --name-only "$merge_base"..HEAD)"

      - name: Commit verified five-stack routing
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            desktop-electron/electron/external-services.cjs \
            desktop-electron/electron/provider-execution-router.cjs \
            desktop-electron/electron/provider-network.cjs \
            desktop-electron/src/agents/agent-provider-adapter.ts \
            desktop-electron/src/features/ExternalServicesSurface.tsx \
            desktop-electron/src/features/ProviderHubSaasSurface.tsx \
            desktop-electron/src/providers/ProviderHubIntegration.tsx \
            desktop-electron/src/providers/provider-types.ts \
            desktop-electron/src/types.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Five-stack routing completion is already committed.'
            exit 0
          fi
          git commit -m 'feat(rc8): complete CPA routing across Codex, Paseo, and Anneal'
          git push origin HEAD:fix/rc8-five-stack-routing-completion

      - name: Preserve transient dependencies in Trash
        if: always()
        run: |
          if [ -d desktop-electron/node_modules ]; then
            mv desktop-electron/node_modules \
              "aiTemp/Trash/rc8-five-stack/node_modules-$GITHUB_RUN_ID"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: apply-rc8-five-stack-routing-${{ github.sha }}
          path: aiTemp/rc8-five-stack/evidence/
          if-no-files-found: warn
          retention-days: 14
