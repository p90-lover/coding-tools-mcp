name: Mission storage baseline
on:
  push:
    branches: [feature/paseo-anneal-execution-0.5.0]
    paths: [.github/workflows/execution-book-red.yml]
permissions: {contents: read}
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/book-target
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash,working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}',path: aiTemp/source,clean: false,persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python aiTemp/execution/probe.py > aiTemp/evidence/existing-contracts.txt 2>&1
          python - <<'PY'
          from pathlib import Path
          p=Path('aiTemp/execution-probe/src/lib.rs')
          with p.open('a') as f:f.write('\n#[cfg(test)]mod book_contract {include!("'+Path('aiTemp/execution/book_contracts.rs').resolve().as_posix()+'");}\n')
          PY
          set +e
          cargo test --manifest-path aiTemp/execution-probe/Cargo.toml book_contract_ > aiTemp/evidence/book-red.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 101
          grep -F 'could not find `book`' aiTemp/evidence/book-red.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'mission-book-red-${{ github.run_id }}',path: aiTemp/source/aiTemp/evidence/,if-no-files-found: error,retention-days: 14}
