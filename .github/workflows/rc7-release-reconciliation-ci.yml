name: rc.7 release reconciliation CI

on:
  push:
    branches:
      - fix/rc7-release-reconcile-elevation-and-sync
    paths:
      - desktop-electron/tests/packaging-contract.test.cjs
      - desktop-electron/tests/rc7-release-reconciliation-contract.test.cjs
      - .github/workflows/rc7-provider-updater-base-sync.yml
      - .github/workflows/rc7-provider-updater-base-sync-v2.yml
      - .github/workflows/rc7-release-reconciliation-ci.yml
  pull_request:
    branches:
      - release/codex-router-multiprovider-0.7.0-rc.7
    paths:
      - desktop-electron/tests/packaging-contract.test.cjs
      - desktop-electron/tests/rc7-release-reconciliation-contract.test.cjs
      - .github/workflows/rc7-provider-updater-base-sync.yml
      - .github/workflows/rc7-provider-updater-base-sync-v2.yml
      - .github/workflows/rc7-release-reconciliation-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc7-release-reconciliation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Run focused release reconciliation contracts
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/aiTemp/rc7-release-reconciliation/evidence"
          mkdir -p "$evidence"
          node --test \
            desktop-electron/tests/rc7-release-reconciliation-contract.test.cjs \
            desktop-electron/tests/legacy-msi-upgrade-contract.test.cjs \
            2>&1 | tee "$evidence/contracts.txt"
          grep -F '# fail 0' "$evidence/contracts.txt"

      - name: Enforce exact source and no deletion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin release/codex-router-multiprovider-0.7.0-rc.7
          git diff --check origin/release/codex-router-multiprovider-0.7.0-rc.7...HEAD
          test -z "$(git diff --diff-filter=D --name-only origin/release/codex-router-multiprovider-0.7.0-rc.7...HEAD)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc7-release-reconciliation-${{ github.sha }}
          path: aiTemp/rc7-release-reconciliation/evidence/
          if-no-files-found: error
          retention-days: 14
