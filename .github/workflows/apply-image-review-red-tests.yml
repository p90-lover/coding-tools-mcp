name: Apply image review RED tests

on:
  push:
    branches:
      - feature/0.7-rc2-image-providers
    paths:
      - aiTemp/rc2/apply_image_review_red_tests.py
      - .github/workflows/apply-image-review-red-tests.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-image-review-red-tests
  cancel-in-progress: false

jobs:
  apply-red-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: true
      - name: Apply exact review regressions
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/Trash/image-review-red
          python aiTemp/rc2/apply_image_review_red_tests.py \
            | tee aiTemp/evidence/image-review-red-apply.txt
          grep -F 'IMAGE_REVIEW_RED_TESTS_OK changed=true' \
            aiTemp/evidence/image-review-red-apply.txt
      - name: Prove the new static contract fails on the unfixed source
        shell: bash
        run: |
          set +e
          python aiTemp/rc2/image_provider_contract.py \
            > aiTemp/evidence/image-review-red-contract.txt 2>&1
          contract_status=$?
          set -e
          cat aiTemp/evidence/image-review-red-contract.txt
          test "$contract_status" -ne 0
          grep -F 'connected_credential(&profile)' aiTemp/evidence/image-review-red-contract.txt
      - name: Enforce narrow no-delete test patch
        run: |
          set -euo pipefail
          test -z "$(git diff --diff-filter=D --name-only)"
          unexpected="$(git diff --name-only | grep -Ev '^(src-tauri/src/media\.rs|aiTemp/rc2/image_provider_contract\.py)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected tracked changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git diff --check
      - name: Commit failing regression contracts
        env:
          TARGET_BRANCH: feature/0.7-rc2-image-providers
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git add src-tauri/src/media.rs aiTemp/rc2/image_provider_contract.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(image): reproduce provider review failures'
          git push origin "HEAD:$TARGET_BRANCH"
