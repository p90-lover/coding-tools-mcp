name: v0.7 rc.7 provider orchestrator boundary

on:
  push:
    branches:
      - fix/v0.7-rc7-orchestration-credential-provider-sync
      - release/codex-router-multiprovider-0.7.0-rc.7
    paths:
      - aiTemp/rc7-provider-orchestrator-boundary/**
      - desktop-electron/electron/main.cjs
      - desktop-electron/electron/ipc-schema.cjs
      - desktop-electron/electron/provider-execution-router.cjs
      - desktop-electron/src/api/contracts.ts
      - desktop-electron/src/features/ProviderHubSaasSurface.tsx
      - desktop-electron/tests/provider-orchestrator-credential-boundary.test.cjs
      - desktop-electron/tests/provider-execution-router.test.cjs
      - desktop-electron/tests/execution-bridge-contract.test.cjs
      - .github/workflows/v0.7-rc7-provider-orchestrator-boundary.yml
  pull_request:
    branches:
      - release/codex-router-multiprovider-0.7.0-rc.7
    paths:
      - aiTemp/rc7-provider-orchestrator-boundary/**
      - desktop-electron/electron/main.cjs
      - desktop-electron/electron/ipc-schema.cjs
      - desktop-electron/electron/provider-execution-router.cjs
      - desktop-electron/src/api/contracts.ts
      - desktop-electron/src/features/ProviderHubSaasSurface.tsx
      - desktop-electron/tests/provider-orchestrator-credential-boundary.test.cjs
      - desktop-electron/tests/provider-execution-router.test.cjs
      - desktop-electron/tests/execution-bridge-contract.test.cjs
      - .github/workflows/v0.7-rc7-provider-orchestrator-boundary.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc7-provider-orchestrator-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Provider and orchestrator boundary contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: ${{ github.event_name == 'push' && github.ref_name == 'fix/v0.7-rc7-orchestration-credential-provider-sync' }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.4.0'

      - name: Materialize provider and orchestrator credential separation
        run: |
          set -euo pipefail
          mkdir -p aiTemp/rc7-provider-orchestrator-boundary/tmp
          python aiTemp/rc7-provider-orchestrator-boundary/apply_patch.py \
            | tee aiTemp/rc7-provider-orchestrator-boundary/patch.txt
          grep -F RC7_PROVIDER_ORCHESTRATOR_BOUNDARY_PATCH_OK \
            aiTemp/rc7-provider-orchestrator-boundary/patch.txt

      - name: Install locked desktop dependencies
        run: |
          set -euo pipefail
          absolute_tmp="$PWD/aiTemp/rc7-provider-orchestrator-boundary/tmp"
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --cwd desktop-electron --frozen-lockfile

      - name: Run renderer, TypeScript, routing, and credential-boundary gates
        run: |
          set -euo pipefail
          (
            bun run --cwd desktop-electron typecheck
            bun run --cwd desktop-electron build:renderer
            node --test \
              desktop-electron/tests/provider-orchestrator-credential-boundary.test.cjs \
              desktop-electron/tests/provider-execution-router.test.cjs \
              desktop-electron/tests/execution-bridge-contract.test.cjs
          ) 2>&1 | tee aiTemp/rc7-provider-orchestrator-boundary/results.txt
          grep -F '# fail 0' aiTemp/rc7-provider-orchestrator-boundary/results.txt

      - name: Enforce no-delete integration diff
        run: |
          set -euo pipefail
          git fetch origin release/codex-router-multiprovider-0.7.0-rc.7 --no-tags
          git diff --check origin/release/codex-router-multiprovider-0.7.0-rc.7...HEAD
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only origin/release/codex-router-multiprovider-0.7.0-rc.7...HEAD)"
          test -z "$(git diff --diff-filter=D --name-only)"

      - name: Commit verified provider and orchestrator boundary
        if: github.event_name == 'push' && github.ref_name == 'fix/v0.7-rc7-orchestration-credential-provider-sync'
        run: |
          set -euo pipefail
          git add \
            desktop-electron/electron/main.cjs \
            desktop-electron/electron/ipc-schema.cjs \
            desktop-electron/src/api/contracts.ts \
            desktop-electron/src/features/ProviderHubSaasSurface.tsx \
            desktop-electron/tests/provider-orchestrator-credential-boundary.test.cjs
          if git diff --cached --quiet; then
            echo 'provider/orchestrator boundary is already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rc7): separate provider and orchestrator credentials'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc7-provider-orchestrator-boundary-${{ github.sha }}
          path: aiTemp/rc7-provider-orchestrator-boundary/
          if-no-files-found: error
          retention-days: 14
