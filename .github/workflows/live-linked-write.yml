name: Verify canonical linked-root writes
on:
  push:
    branches: [fix/live-refresh-long-tasks-0.4.4-rc.5]
    paths: [.github/workflows/live-linked-write.yml]
permissions: {contents: read}
jobs:
  linked_write:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 6
    permissions: {contents: write}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/linked-write-target
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1', components: rustfmt}
      - name: Reproduce exact patch failure then verify canonical targets with boundaries retained
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          set +e
          python aiTemp/live-refresh/linked_write_probe.py --baseline > aiTemp/evidence/linked-write-red.txt 2>&1
          result=$?
          set -e
          test "$result" -eq 101
          grep -F LINKED_WRITE_PATH_REPRESENTATION_MISMATCH aiTemp/evidence/linked-write-red.txt
          python aiTemp/live-refresh/canonical_write_patch.py
          python aiTemp/live-refresh/linked_write_probe.py 2>&1 | tee aiTemp/evidence/linked-write-green.txt
          grep -F '1 passed; 0 failed' aiTemp/evidence/linked-write-green.txt
      - name: Preserve exact validated fix on candidate branch only
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = df473181ed46d764f4f54de4f597fe71c550b9a7
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME --jq .object.sha)" = "$GITHUB_SHA"
          if ! git diff --cached --quiet; then git commit -m 'fix: retain canonical Windows target paths for new approved-root writes'; fi
          gh auth setup-git
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > aiTemp/evidence/source.commit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'linked-write-evidence-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
