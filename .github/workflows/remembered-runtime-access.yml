name: Verify narrow Windows runtime read access
on:
  push:
    branches: [audit/remembered-036-runtime-access]
    paths: ['.github/workflows/remembered-runtime-access.yml','aiTemp/release-verification/runtime_acl_probe.py']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OTEL_SDK_DISABLED: 'true'
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: aiTemp/checkout
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 34222575916
          name: remembered-native-helpers-34222575916
          path: aiTemp/checkout/src-tauri/aiTemp/native-sandbox
      - name: Exact system-resource read grants with all original negative checks
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python aiTemp/release-verification/runtime_acl_probe.py "$PWD/src-tauri/aiTemp/native-sandbox/coding-tools-codex-sandbox.exe" "$PWD/aiTemp/runtime-access" 2>&1 | tee aiTemp/evidence/runtime-access.txt
      - name: Preserve production source for continuation
        if: always()
        run: |
          mkdir -p aiTemp/evidence
          git archive --format=zip 492d268705839b4f9692c2f55c2009e1ad662d43 --output=aiTemp/evidence/source.zip
          git rev-parse HEAD > aiTemp/evidence/diagnostic-source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remembered-runtime-access-${{ github.run_id }}
          path: aiTemp/checkout/aiTemp/evidence/*
          if-no-files-found: error
          retention-days: 14
