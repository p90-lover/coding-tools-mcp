name: Apply Paseo Anneal Headless Compile Fix

on:
  push:
    branches:
      - feature/v0.7-subagent-orchestrator
    paths:
      - aiTemp/paseo-anneal-electron/apply_compile_fix.py
      - .github/workflows/apply-paseo-anneal-headless-compile-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-paseo-anneal-headless-compile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-paseo-anneal-compile

jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/feature/v0.7-subagent-orchestrator'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          ref: ${{ github.ref_name }}
      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
      - name: Apply focused compile repair
        run: python3 aiTemp/paseo-anneal-electron/apply_compile_fix.py
      - name: Verify formatting
        run: |
          cargo fmt --manifest-path rust-core/coding-tools-headless/Cargo.toml
          cargo fmt --manifest-path rust-core/coding-tools-headless/Cargo.toml --check
      - name: Run headless Rust tests
        run: cargo test --manifest-path rust-core/coding-tools-headless/Cargo.toml --locked
      - name: Run strict headless Rust Clippy
        run: cargo clippy --manifest-path rust-core/coding-tools-headless/Cargo.toml --all-targets --locked -- -D warnings
      - name: Enforce no-delete patch
        shell: bash
        run: |
          deleted="$(git diff --diff-filter=D --name-only)"
          if [ -n "$deleted" ]; then
            printf 'Deleted paths are forbidden:\n%s\n' "$deleted" >&2
            exit 1
          fi
      - name: Commit verified compile repair
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "Compile repair is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            rust-core/coding-tools-headless/src/lib.rs \
            rust-core/coding-tools-headless/tests/control_api.rs \
            rust-core/coding-tools-headless/tests/lifecycle.rs
          git diff --cached --check
          git commit -m "fix(rc.2): compile the Electron execution bridge"
          git push origin "HEAD:${TARGET_BRANCH}"
