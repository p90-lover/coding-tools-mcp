name: Electron Full Harness CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/electron-full-codex-harness-0.6.0
    paths:
      - .github/workflows/electron-full-harness-ci.yml
      - desktop-electron/**
      - runtime-web/**
      - rust-core/**
      - src-tauri/**
      - scripts/**
      - tests/**
      - third_party/**
      - vendor/codex-chatgpt-web-v5.0.6/**
      - docs/releases/v0.6.0-rc.1.md
  push:
    branches:
      - feature/electron-full-codex-harness-0.6.0

permissions:
  contents: read

concurrency:
  group: electron-full-harness-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.4.0'
  NODE_VERSION: '22'
  RUST_TOOLCHAIN: '1.98.1'
  RELEASE_VERSION: '0.6.0-rc.1'
  SOURCE_SHA: ${{ github.sha }}
  WINDOWS_INSTALLER: Coding.Tools_0.6.0-rc.1_windows_x64_setup.exe
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source_contract:
    name: Exact source, identity, and release prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Prepare retained evidence paths
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/tmp aiTemp/Trash/full-harness-ci
          printf 'source_sha=%s\nworkflow=%s\nrun_id=%s\n' \
            "$SOURCE_SHA" "$GITHUB_WORKFLOW_REF" "$GITHUB_RUN_ID" \
            > aiTemp/evidence/run-identity.txt

      - name: Verify exact checkout and fixed product identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --input-type=module <<'NODE' | tee aiTemp/evidence/product-identity.txt
          import fs from 'node:fs';

          const desktop = JSON.parse(fs.readFileSync('desktop-electron/package.json', 'utf8'));
          const upstream = JSON.parse(fs.readFileSync(
            'vendor/codex-chatgpt-web-v5.0.6/UPSTREAM_MANIFEST.json',
            'utf8',
          ));
          const expected = {
            version: process.env.RELEASE_VERSION,
            appId: 'dev.codingtools.fullharness',
            productName: 'Coding Tools',
            electron: '41.10.7',
            upstreamTag: 'v5.0.6',
            upstreamCommit: 'e85e3693fdb4e3e033348c08df0298c20fcdb612',
            tunnelClient: '0.0.12',
          };
          const actual = {
            version: desktop.version,
            appId: desktop.build?.appId,
            productName: desktop.build?.productName,
            electron: desktop.devDependencies?.electron,
            upstreamTag: upstream.tag,
            upstreamCommit: upstream.commit,
            tunnelClient: upstream.tunnelClientVersion,
          };
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`ELECTRON_RELEASE_IDENTITY_MISMATCH: ${JSON.stringify(actual)}`);
          }
          if (desktop.build?.nsis?.perMachine !== false
              || desktop.build?.nsis?.allowElevation !== false) {
            throw new Error('WINDOWS_INSTALLER_MUST_REMAIN_PER_USER_WITHOUT_ELEVATION');
          }
          process.stdout.write(`${JSON.stringify(actual, null, 2)}\n`);
          NODE

      - name: Verify pinned source and focused CI contract
        run: |
          set -euo pipefail
          node scripts/verify-vendored-upstream.mjs \
            | tee aiTemp/evidence/upstream-verification.txt
          node --test tests/electron-full-harness-ci.test.mjs \
            | tee aiTemp/evidence/ci-contract-tests.txt
          grep -F UPSTREAM_VENDOR_PASS aiTemp/evidence/upstream-verification.txt
          grep -F '# fail 0' aiTemp/evidence/ci-contract-tests.txt

      - name: Require complete release producers outside PR review
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          required=(
            desktop-electron/scripts/verify-package.cjs
            desktop-electron/tests/package-contents.test.cjs
            docs/releases/v0.6.0-rc.1.md
            rust-core/coding-tools-core/Cargo.toml
            rust-core/coding-tools-headless/Cargo.toml
            third_party/THIRD_PARTY_NOTICES.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || {
              printf 'MISSING_RELEASE_PRODUCER %s\n' "$path" >&2
              exit 1
            }
          done
          printf '%s\n' "${required[@]}" \
            > aiTemp/evidence/release-producers.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: electron-source-contract-${{ github.sha }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14

  electron_runtime:
    name: Electron and pinned runtime — ${{ matrix.os }}
    if: ${{ github.event_name != 'pull_request' }}
    needs: source_contract
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/bun-cache
      CODING_TOOLS_RETENTION_ROOT: ${{ github.workspace }}/aiTemp/source/aiTemp/Trash/full-harness-runtime
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Prepare retained temporary and evidence roots
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/tmp aiTemp/Trash/full-harness-runtime
          short_tmp="$PWD/aiTemp/tmp"
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            short_tmp="$GITHUB_WORKSPACE/aiTemp/t"
            mkdir -p "$short_tmp"
          fi
          echo "CODING_TOOLS_SHORT_TMP=$short_tmp" >> "$GITHUB_ENV"

      - name: Install exact locked dependencies
        run: |
          set -euo pipefail
          preload="$PWD/runtime-web/scripts/no-delete-preload.mjs"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            preload="$(cygpath -w "$preload")"
          fi
          export NODE_OPTIONS="--import=$preload"
          absolute_tmp="$PWD/aiTemp/tmp"
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd runtime-web \
            2>&1 | tee aiTemp/evidence/runtime-install.txt
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd runtime-web/launcher \
            2>&1 | tee aiTemp/evidence/runtime-launcher-install.txt
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd desktop-electron \
            2>&1 | tee aiTemp/evidence/desktop-install.txt

      - name: Validate Electron tests, renderer, and dependency audits
        run: |
          set -euo pipefail
          preload="$PWD/runtime-web/scripts/no-delete-preload.mjs"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            preload="$(cygpath -w "$preload")"
          fi
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$CODING_TOOLS_SHORT_TMP" TMP="$CODING_TOOLS_SHORT_TMP" TEMP="$CODING_TOOLS_SHORT_TMP" \
            bun run --cwd desktop-electron test \
            2>&1 | tee aiTemp/evidence/desktop-tests.txt
          TMPDIR="$CODING_TOOLS_SHORT_TMP" TMP="$CODING_TOOLS_SHORT_TMP" TEMP="$CODING_TOOLS_SHORT_TMP" \
            bun run --cwd desktop-electron typecheck \
            2>&1 | tee aiTemp/evidence/desktop-typecheck.txt
          TMPDIR="$CODING_TOOLS_SHORT_TMP" TMP="$CODING_TOOLS_SHORT_TMP" TEMP="$CODING_TOOLS_SHORT_TMP" \
            bun run --cwd desktop-electron build:renderer \
            2>&1 | tee aiTemp/evidence/desktop-renderer-build.txt
          bun run --cwd desktop-electron audit \
            2>&1 | tee aiTemp/evidence/desktop-audit.txt

      - name: Validate pinned runtime, modes, compaction, and subagents
        run: |
          set -euo pipefail
          preload="$PWD/runtime-web/scripts/no-delete-preload.mjs"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            preload="$(cygpath -w "$preload")"
          fi
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$CODING_TOOLS_SHORT_TMP" TMP="$CODING_TOOLS_SHORT_TMP" TEMP="$CODING_TOOLS_SHORT_TMP" \
            bun run --cwd runtime-web verify \
            2>&1 | tee aiTemp/evidence/runtime-verify.txt
          TMPDIR="$CODING_TOOLS_SHORT_TMP" TMP="$CODING_TOOLS_SHORT_TMP" TEMP="$CODING_TOOLS_SHORT_TMP" \
            bun run --cwd runtime-web smoke:subagents \
            2>&1 | tee aiTemp/evidence/runtime-subagents.txt
          bun run --cwd runtime-web audit \
            2>&1 | tee aiTemp/evidence/runtime-audit.txt

      - name: Verify retained evidence and unchanged tracked source
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git diff --diff-filter=D --name-only)"
          find aiTemp/Trash \( -type f -o -type d \) \
            | sort > aiTemp/evidence/retained-paths.txt
          test -s aiTemp/evidence/retained-paths.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: electron-runtime-${{ matrix.os }}-${{ github.sha }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14

  rust_compatibility:
    name: Rust compatibility and headless core — ${{ matrix.os }}
    if: ${{ github.event_name != 'pull_request' }}
    needs: source_contract
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/cargo-target-${{ runner.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy

      - name: Validate retained Tauri compatibility shell
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          (
            cd src-tauri
            cargo fmt --all -- --check
            cargo build --locked
            cargo test --locked
            cargo clippy --locked --all-targets -- -D warnings
          ) 2>&1 | tee aiTemp/evidence/tauri-rust.txt

      - name: Validate reusable core and headless service
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path rust-core/coding-tools-core/Cargo.toml \
            2>&1 | tee aiTemp/evidence/rust-core-tests.txt
          cargo clippy --locked --manifest-path rust-core/coding-tools-core/Cargo.toml \
            --all-targets -- -D warnings \
            2>&1 | tee aiTemp/evidence/rust-core-clippy.txt
          cargo test --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            2>&1 | tee aiTemp/evidence/rust-headless-tests.txt
          cargo clippy --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            --all-targets -- -D warnings \
            2>&1 | tee aiTemp/evidence/rust-headless-clippy.txt

      - name: Verify shipped Windows headless dependency boundary
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -euo pipefail
          dependency_evidence="aiTemp/evidence/dependencies-x86_64-pc-windows-msvc.txt"
          cargo tree --locked \
            --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            --target x86_64-pc-windows-msvc \
            --prefix none \
            --format '{p}' \
            > "$dependency_evidence"
          if grep -Eq '^glib v' "$dependency_evidence"; then
            echo 'Release blocked: affected GLib present in the shipped Windows headless target'
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rust-compatibility-${{ matrix.os }}-${{ github.sha }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14

  security_audit:
    name: Security — reachable history and RustSec
    if: ${{ github.event_name != 'pull_request' }}
    needs: source_contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/audit-target
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Screen reachable Git history for credential patterns
        run: |
          set -euo pipefail
          mkdir -p aiTemp/audit-evidence aiTemp/audit-tool
          python - <<'PYCREDENTIALS' > aiTemp/audit-evidence/credential-screen.json
          import json
          import re
          import subprocess
          import sys

          patterns = {
              'github-token': rb'\bgh[pousr]_[A-Za-z0-9]{36,255}\b',
              'github-fine-grained-token': rb'\bgithub_pat_[A-Za-z0-9_]{70,255}\b',
              'private-key-material': rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----\s+[A-Za-z0-9+/=\r\n]{100,}-----END (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
              'aws-access-key': rb'\bAKIA[A-Z0-9]{16}\b',
              'openai-key': rb'\bsk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{40,255}\b',
          }
          patterns = {name: re.compile(value) for name, value in patterns.items()}
          lines = subprocess.check_output(['git', 'rev-list', '--objects', '--all']).splitlines()
          objects = list(dict.fromkeys(line.split(b' ', 1)[0] for line in lines))
          process = subprocess.Popen(
              ['git', 'cat-file', '--batch'],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
          )
          findings = []
          blobs = 0
          for oid in objects:
              process.stdin.write(oid + b'\n')
              process.stdin.flush()
              header = process.stdout.readline().split()
              if len(header) != 3:
                  raise RuntimeError('Git object could not be read')
              size = int(header[2])
              content = process.stdout.read(size)
              if len(content) != size or process.stdout.read(1) != b'\n':
                  raise RuntimeError('Incomplete Git object')
              if header[1] != b'blob':
                  continue
              blobs += 1
              for name, pattern in patterns.items():
                  if pattern.search(content):
                      findings.append({'blob': oid.decode(), 'kind': name})
          process.stdin.close()
          if process.wait() != 0:
              raise RuntimeError('Git object scan failed')
          print(json.dumps({
              'scope': 'reachable Git history; selected high-confidence patterns, not proof that every secret is absent',
              'objects_scanned': len(objects),
              'blobs_scanned': blobs,
              'findings': findings,
          }, indent=2))
          sys.exit(1 if findings else 0)
          PYCREDENTIALS
          cat aiTemp/audit-evidence/credential-screen.json

      - name: Audit Rust dependencies against RustSec
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --version 0.22.2 \
            --root "$PWD/aiTemp/audit-tool"
          aiTemp/audit-tool/bin/cargo-audit audit \
            --file src-tauri/Cargo.lock \
            2>&1 | tee aiTemp/audit-evidence/rustsec.txt
          aiTemp/audit-tool/bin/cargo-audit audit \
            --file src-tauri/Cargo.lock \
            --json > aiTemp/audit-evidence/rustsec.json
          python - <<'PYAUDIT'
          import json
          import pathlib

          report = json.loads(pathlib.Path('aiTemp/audit-evidence/rustsec.json').read_text())
          assert not report['vulnerabilities']['found'], 'RustSec vulnerability remains'
          warnings = report.get('warnings', {})
          assert not warnings.get('yanked', []), 'A locked crate was yanked'
          assert all(
              item['advisory']['id'] == 'RUSTSEC-2024-0429'
              and item['package']['name'] == 'glib'
              for item in warnings.get('unsound', [])
          ), 'Unreviewed soundness warning'
          print('RustSec vulnerability/yanked gates passed; GLib exclusion is checked in the Windows headless job.')
          PYAUDIT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: security-audit-${{ github.sha }}
          path: aiTemp/source/aiTemp/audit-evidence/
          if-no-files-found: error
          retention-days: 14

  windows_installer:
    name: Windows x64 installer and packaged smoke
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - electron_runtime
      - rust_compatibility
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: aiTemp/source
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/bun-cache
      CODING_TOOLS_RETENTION_ROOT: ${{ github.workspace }}/aiTemp/source/aiTemp/Trash/full-harness-package
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: aiTemp/source
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Prepare retained package roots and dependencies
        run: |
          set -euo pipefail
          mkdir -p \
            aiTemp/evidence \
            aiTemp/tmp \
            aiTemp/Trash/full-harness-package \
            aiTemp/release-output
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          export NODE_OPTIONS="--import=$preload"
          absolute_tmp="$PWD/aiTemp/tmp"
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd runtime-web
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd runtime-web/launcher
          TMPDIR="$absolute_tmp" TMP="$absolute_tmp" TEMP="$absolute_tmp" \
            bun install --frozen-lockfile --cwd desktop-electron

      - name: Build the exact Rust sidecar and Electron installer
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            2>&1 | tee aiTemp/evidence/rust-headless-release.txt
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron package:win \
            2>&1 | tee aiTemp/evidence/windows-package.txt

      - name: Verify package contents, identity, and launcher smoke
        run: |
          set -euo pipefail
          mapfile -t package_roots < <(
            for candidate in desktop-electron/artifacts desktop-electron/release; do
              test -d "$candidate" && printf '%s\n' "$candidate"
            done
          )
          test "${#package_roots[@]}" -eq 1
          package_root="${package_roots[0]}"
          printf '%s\n' "$package_root" > aiTemp/evidence/package-root.txt
          node desktop-electron/scripts/verify-package.cjs "$package_root" \
            --source "$SOURCE_SHA" \
            --json-out aiTemp/evidence/package-verification.json \
            2>&1 | tee aiTemp/evidence/package-verification.txt
          test -s aiTemp/evidence/package-verification.json
          node --test desktop-electron/tests/package-contents.test.cjs \
            2>&1 | tee aiTemp/evidence/package-contents-tests.txt
          preload="$(cygpath -w "$PWD/runtime-web/scripts/no-delete-preload.mjs")"
          export NODE_OPTIONS="--import=$preload"
          TMPDIR="$PWD/aiTemp/tmp" TMP="$PWD/aiTemp/tmp" TEMP="$PWD/aiTemp/tmp" \
            bun run --cwd desktop-electron smoke:package \
            2>&1 | tee aiTemp/evidence/package-smoke.txt
          mapfile -t installers < <(
            find "$package_root" -maxdepth 1 -type f -iname '*.exe' -print
          )
          test "${#installers[@]}" -eq 1
          printf '%s\n' "${installers[0]}" > aiTemp/evidence/original-installer-path.txt
          release_installer="aiTemp/release-output/$WINDOWS_INSTALLER"
          test ! -e "$release_installer"
          cp --no-clobber "${installers[0]}" "$release_installer"
          test -s "$release_installer"
          sha256sum "$release_installer" \
            > aiTemp/evidence/windows-installer.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: electron-windows-installer-${{ github.sha }}
          path: aiTemp/source/aiTemp/release-output/Coding.Tools_0.6.0-rc.1_windows_x64_setup.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: electron-windows-evidence-${{ github.sha }}
          path: aiTemp/source/aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14

  validation_evidence:
    name: Bind complete validation evidence to source SHA
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - source_contract
      - electron_runtime
      - rust_compatibility
      - security_audit
      - windows_installer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require every automated gate
        env:
          SOURCE_RESULT: ${{ needs.source_contract.result }}
          ELECTRON_RESULT: ${{ needs.electron_runtime.result }}
          RUST_RESULT: ${{ needs.rust_compatibility.result }}
          SECURITY_RESULT: ${{ needs.security_audit.result }}
          INSTALLER_RESULT: ${{ needs.windows_installer.result }}
        run: |
          set -euo pipefail
          for result in \
            "$SOURCE_RESULT" \
            "$ELECTRON_RESULT" \
            "$RUST_RESULT" \
            "$SECURITY_RESULT" \
            "$INSTALLER_RESULT"
          do
            test "$result" = success
          done

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: '*-${{ github.sha }}'
          path: aiTemp/downloaded-evidence

      - name: Create exact-source validation disclosure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aiTemp/final-validation
          test -n "$(find aiTemp/downloaded-evidence -type f -print -quit)"
          find aiTemp/downloaded-evidence -type f -print \
            | sort > aiTemp/final-validation/evidence-files.txt
          SOURCE_SHA="$SOURCE_SHA" \
          RUN_ID="$GITHUB_RUN_ID" \
          RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          REPOSITORY="$GITHUB_REPOSITORY" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const disclosure = {
            schema: 1,
            source_sha: process.env.SOURCE_SHA,
            validation_run_id: Number(process.env.RUN_ID),
            validation_run_attempt: Number(process.env.RUN_ATTEMPT),
            validation_workflow: '.github/workflows/electron-full-harness-ci.yml',
            validation_conclusion: 'success',
            automated_gates: 'passed',
            live_account_acceptance: 'pending_manual',
            product: {
              version: '0.6.0-rc.1',
              app_id: 'dev.codingtools.fullharness',
              name: 'Coding Tools',
            },
            upstream: {
              repository: 'miuuyy/codex-chatgpt-web',
              version: 'v5.0.6',
              commit: 'e85e3693fdb4e3e033348c08df0298c20fcdb612',
            },
            run_url: `https://github.com/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}`,
          };
          fs.writeFileSync(
            path.join('aiTemp', 'final-validation', 'validation-evidence.json'),
            `${JSON.stringify(disclosure, null, 2)}\n`,
          );
          NODE
          printf '%s\n' "$SOURCE_SHA" \
            > aiTemp/final-validation/source.commit
          printf '%s\n' \
            'Live ChatGPT account, browser UI eligibility, and connector reauthorization remain manual acceptance gates.' \
            > aiTemp/final-validation/manual-acceptance.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: electron-full-harness-validation-${{ github.sha }}
          path: aiTemp/final-validation/
          if-no-files-found: error
          retention-days: 14
