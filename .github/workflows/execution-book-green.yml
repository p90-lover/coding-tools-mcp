name: Mission persistence contracts
on:
  push:
    branches: [feature/paseo-anneal-execution-0.5.0]
    paths: [.github/workflows/execution-book-green.yml]
permissions: {contents: read}
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions: {contents: write, actions: read}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/book-target
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash,working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}',path: aiTemp/source,fetch-depth: 0,clean: false,persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1',components: rustfmt}
      - name: Wire core modules after the missing-storage baseline
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          gh run download 34686663835 --repo "$GITHUB_REPOSITORY" --name mission-book-red-34686663835 --dir aiTemp/baseline
          cp aiTemp/baseline/book-red.txt aiTemp/evidence/
          python - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/src/integrations/execution/mod.rs');text=p.read_text()
          for name in ['book','observation']:
            if f'pub mod {name};' not in text:text+=f'\npub mod {name};\n'
          p.write_text(text)
          PY
          python aiTemp/execution/probe.py 2>&1 | tee aiTemp/evidence/execution-contracts.txt
          python - <<'PY'
          from pathlib import Path
          p=Path('aiTemp/execution-probe/src/lib.rs')
          with p.open('a') as f:
            for name in ['book_contracts','longrun_contracts']:
              f.write('\n#[cfg(test)]mod '+name+'{include!("'+Path('aiTemp/execution/'+name+'.rs').resolve().as_posix()+'");}\n')
          PY
          cargo test --manifest-path aiTemp/execution-probe/Cargo.toml book_contract_ -- --nocapture 2>&1 | tee aiTemp/evidence/book-green.txt
          cargo test --manifest-path aiTemp/execution-probe/Cargo.toml longrun_contract_ -- --test-threads=1 --nocapture 2>&1 | tee aiTemp/evidence/longrun-green.txt
          node --test aiTemp/execution/computer_preview.test.mjs 2>&1 | tee aiTemp/evidence/preview-green.txt
      - name: Preserve verified module wiring on feature branch
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --config skip_children=true src-tauri/src/integrations/execution/book.rs src-tauri/src/integrations/execution/observation.rs src-tauri/src/integrations/execution/mod.rs
          git add -- src-tauri/src/integrations/execution/book.rs src-tauri/src/integrations/execution/observation.rs src-tauri/src/integrations/execution/mod.rs
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME --jq .object.sha)" = "$GITHUB_SHA"
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          if ! git diff --cached --quiet; then git commit -m 'feat: verify bounded persistent mission records and scoped observation modules'; fi
          gh auth setup-git
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > aiTemp/evidence/source.commit
      - name: Preserve review source even on failure
        if: always()
        run: |
          mkdir -p aiTemp/review
          git bundle create aiTemp/review/source.bundle HEAD
          git diff HEAD --binary > aiTemp/review/materialized.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'mission-book-${{ github.run_id }}',path: aiTemp/source/aiTemp/evidence/,if-no-files-found: error,retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'mission-book-source-${{ github.run_id }}',path: aiTemp/source/aiTemp/review/,if-no-files-found: error,retention-days: 14}
