name: rc.7 provider-updater base sync

on:
  push:
    branches:
      - integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater
  pull_request:
    branches:
      - integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater
    paths:
      - desktop-electron/package.json
      - desktop-electron/electron/provider-network.cjs
      - desktop-electron/tests/antigravity-session-binding.test.cjs
      - desktop-electron/tests/commandcode-provider-session.test.cjs
      - desktop-electron/tests/legacy-msi-upgrade-contract.test.cjs
      - desktop-electron/tests/packaging-contract.test.cjs
      - .github/workflows/rc7-provider-updater-base-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc7-provider-updater-base-sync-${{ github.sha }}
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Record retired synchronization boundary
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/aiTemp/rc7-provider-updater-sync/evidence"
          mkdir -p "$evidence" "$GITHUB_WORKSPACE/aiTemp/Trash/rc7-provider-updater-sync"
          {
            echo 'RC7_BASE_SYNC_RETIRED=1'
            echo 'mode=current-state-verification'
            echo "source_sha=$GITHUB_SHA"
            echo 'legacy_rc6_merge_path=retained-but-disabled'
          } | tee "$evidence/status.txt"

      - name: Verify current provider and installer migration contracts
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/aiTemp/rc7-provider-updater-sync/evidence"
          node --check desktop-electron/electron/provider-network.cjs
          node --test \
            desktop-electron/tests/antigravity-session-binding.test.cjs \
            desktop-electron/tests/commandcode-provider-session.test.cjs \
            2>&1 | tee "$evidence/provider-contracts.txt"
          grep -F '# fail 0' "$evidence/provider-contracts.txt"
          node --test \
            --test-name-pattern="launcher publishes native packages|assisted installer can elevate|legacy migration enumerates|MSI migration invokes" \
            desktop-electron/tests/packaging-contract.test.cjs \
            desktop-electron/tests/legacy-msi-upgrade-contract.test.cjs \
            2>&1 | tee "$evidence/installer-contracts.txt"
          grep -F '# fail 0' "$evidence/installer-contracts.txt"

      - name: Enforce exact source, clean tracked state, and no deletion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          parent="$(git rev-parse "${GITHUB_SHA}^1")"
          git diff --check "$parent" "$GITHUB_SHA"
          test -z "$(git diff --diff-filter=D --name-only "$parent" "$GITHUB_SHA")"
          test -z "$(git status --short --untracked-files=no)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc7-provider-updater-base-sync-${{ github.sha }}
          path: aiTemp/rc7-provider-updater-sync/evidence/
          if-no-files-found: error
          retention-days: 14
