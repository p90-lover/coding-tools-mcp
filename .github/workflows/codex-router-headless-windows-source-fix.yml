name: Codex Router headless Windows source fix

on:
  push:
    branches:
      - fix/codex-router-0.7.0-rc.1-headless-windows
    paths:
      - .github/workflows/codex-router-headless-windows-source-fix.yml
      - aiTemp/headless-service/apply_compile_fixes.py
      - rust-core/coding-tools-headless/**
      - rust-core/coding-tools-core/**
      - src-tauri/src/tools/**
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: codex-router-headless-windows-source-fix
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/headless-windows-target
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify-and-retain:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy

      - name: Prepare retained evidence roots
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence aiTemp/headless-windows-target
          printf 'source=%s\nrunner=%s\n' "$GITHUB_SHA" "$RUNNER_OS" \
            > aiTemp/evidence/source.txt

      - name: Apply the evidence-backed source repairs
        run: |
          set -euo pipefail
          python aiTemp/headless-service/apply_compile_fixes.py \
            2>&1 | tee aiTemp/evidence/source-repair.txt
          grep -F HEADLESS_COMPILE_REPAIRS aiTemp/evidence/source-repair.txt
          git diff --check
          git diff --cached --check
          test -z "$(git diff --diff-filter=D --name-only)"
          test -z "$(git diff --cached --diff-filter=D --name-only)"

      - name: Verify Windows release build and focused contracts
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            2>&1 | tee aiTemp/evidence/windows-release-build.txt
          cargo test --locked \
            --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            -- --test-threads=1 --nocapture \
            2>&1 | tee aiTemp/evidence/windows-tests.txt
          cargo clippy --locked \
            --manifest-path rust-core/coding-tools-headless/Cargo.toml \
            --all-targets -- -D warnings \
            2>&1 | tee aiTemp/evidence/windows-clippy.txt
          grep -F 'test result: ok' aiTemp/evidence/windows-tests.txt

      - name: Commit only the verified retained repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          allowed='^(rust-core/coding-tools-headless/src/lib\.rs|Trash/headless-service-0\.6\.0/[0-9]+/rust-core/coding-tools-headless/src/lib\.rs)$'
          staged="$(git diff --cached --name-only)"
          if [ -n "$staged" ]; then
            while IFS= read -r path; do
              test -z "$path" && continue
              printf 'VERIFIED_STAGED_PATH: %s\n' "$path"
              printf '%s\n' "$path" | grep -Eq "$allowed"
            done <<< "$staged"
            git diff --cached --check
            test -z "$(git diff --cached --diff-filter=D --name-only)"
            git config user.name 'p90-lover'
            git config user.email '146848721+p90-lover@users.noreply.github.com'
            git commit -m 'fix: compile the headless control service on Windows'
            gh auth setup-git
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          git rev-parse HEAD > aiTemp/evidence/verified-source.commit

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: codex-router-headless-windows-${{ github.run_id }}
          path: aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
