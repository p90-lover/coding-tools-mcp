name: Task context byte limit regression
on:
  push:
    branches: [fix/live-refresh-long-tasks-0.4.4-rc.5]
    paths: [.github/workflows/live-context-red.yml]
permissions: {contents: read}
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/context-target
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run: {shell: bash, working-directory: aiTemp/source}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: aiTemp/source, fetch-depth: 0, clean: false, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: {toolchain: '1.98.1'}
      - name: Reproduce on exact released implementation using synthetic large event
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          set +e
          python aiTemp/live-refresh/context_probe.py --baseline > aiTemp/evidence/context-red.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 101
          grep -F TASK_CONTEXT_IGNORES_MAX_BYTES aiTemp/evidence/context-red.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'live-context-red-${{ github.run_id }}', path: aiTemp/source/aiTemp/evidence/, if-no-files-found: error, retention-days: 14}
