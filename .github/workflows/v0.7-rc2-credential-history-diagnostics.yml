name: v0.7 rc.2 credential history diagnostics

on:
  push:
    branches:
      - fix/v0.7-rc2-credential-history-release
    paths:
      - aiTemp/v0.7-rc2-credential-history/locate_unexpected_blobs.py
      - .github/workflows/v0.7-rc2-credential-history-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0.7-rc2-credential-history-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locate:
    name: Locate unexpected blobs without reading contents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - name: Fetch every reachable branch and tag
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' --force --prune

      - name: Locate blob paths and introducing commits
        run: |
          set -euo pipefail
          mkdir -p aiTemp/v0.7-rc2-credential-history-diagnostics
          python3 aiTemp/v0.7-rc2-credential-history/locate_unexpected_blobs.py \
            | tee aiTemp/v0.7-rc2-credential-history-diagnostics/report.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v0.7-rc2-credential-history-diagnostics-${{ github.sha }}
          path: aiTemp/v0.7-rc2-credential-history-diagnostics/
          if-no-files-found: error
          retention-days: 14
