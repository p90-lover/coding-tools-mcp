name: v0.6 headless fast patch

on:
  workflow_dispatch:
  push:
    branches:
      - release/v0.6.0
    paths:
      - .github/workflows/v060-headless-fast-patch.yml

permissions:
  contents: write

concurrency:
  group: v060-headless-fast-patch
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  patch:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: release/v0.6.0
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - name: Apply exact compiler-diagnostic repair
        run: |
          set -euo pipefail
          mkdir -p aiTemp/evidence
          python - <<'PY'
          from pathlib import Path

          path = Path('rust-core/coding-tools-headless/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('use tokio::sync::{oneshot, Notify};', 'use tokio::sync::Notify;'),
              ('fn restrict_file(path: &Path) -> Result<(), String> {', 'fn restrict_file(_path: &Path) -> Result<(), String> {'),
              ('fs::set_permissions(path, fs::Permissions::from_mode(0o600)).map_err(text_error)?;', 'fs::set_permissions(_path, fs::Permissions::from_mode(0o600)).map_err(text_error)?;'),
              ('tools::call_tool_mcp(&context, &tool, &arguments)', 'tools::dispatch::call_tool_mcp(&context, &tool, &arguments)'),
              ('        let join = tokio::spawn(async move {\n', '        let shutdown_reason_tx = shutdown_tx.clone();\n        let join = tokio::spawn(async move {\n'),
              ('            let reason = shutdown_tx\n', '            let reason = shutdown_reason_tx\n'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          git diff -- rust-core/coding-tools-headless/src/lib.rs > aiTemp/evidence/headless-fast-patch.diff
      - name: Commit exact patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = 'rust-core/coding-tools-headless/src/lib.rs'
          git add -- rust-core/coding-tools-headless/src/lib.rs
          git diff --cached --check
          test -z "$(git diff --cached --diff-filter=D --name-only)"
          git config user.name 'p90-lover'
          git config user.email '146848721+p90-lover@users.noreply.github.com'
          git commit -m 'fix: compile authenticated headless service on Windows'
          gh auth setup-git
          git push origin HEAD:refs/heads/release/v0.6.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v060-headless-fast-patch-${{ github.run_id }}
          path: aiTemp/evidence/
          if-no-files-found: error
          retention-days: 14
