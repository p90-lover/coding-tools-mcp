name: Apply rc.7 upstream Paseo and Anneal integration

on:
  push:
    branches:
      - integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater
    paths:
      - 'aiTemp/rc7-upstream-tools/apply_upstream_tools.py'
      - 'desktop-electron/electron/upstream-tools.cjs'
      - 'desktop-electron/src/features/UpstreamToolSurface.tsx'
      - 'desktop-electron/src/features/upstream-tool.css'
      - 'desktop-electron/vendor/upstream/**'
      - 'desktop-electron/tests/upstream-tools.test.cjs'
      - '.github/workflows/apply-rc7-upstream-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rc7-upstream-tools-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/aiTemp/rc7-upstream-tools/bun-cache

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater
          fetch-depth: 0
          clean: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Prepare retained temporary directories
        run: |
          mkdir -p \
            aiTemp/rc7-upstream-tools/evidence \
            aiTemp/rc7-upstream-tools/renderer-dist \
            aiTemp/Trash/rc7-upstream-tools

      - name: Apply guarded upstream integration patch
        run: |
          set -euo pipefail
          python aiTemp/rc7-upstream-tools/apply_upstream_tools.py \
            2>&1 | tee aiTemp/rc7-upstream-tools/evidence/materializer.txt
          grep -F RC7_UPSTREAM_TOOLS_PATCH_APPLIED \
            aiTemp/rc7-upstream-tools/evidence/materializer.txt

      - name: Validate bounded source changes and no deletion
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          git diff --name-only | sort | tee aiTemp/rc7-upstream-tools/evidence/changed-files.txt
          expected="$(printf '%s\n' \
            desktop-electron/electron/main.cjs \
            desktop-electron/electron/preload.cjs \
            desktop-electron/package.json \
            desktop-electron/src/App.tsx \
            desktop-electron/src/types.ts | sort)"
          changed="$(cat aiTemp/rc7-upstream-tools/evidence/changed-files.txt)"
          test "$changed" = "$expected"

      - name: Validate runtime syntax
        run: |
          node --check desktop-electron/electron/main.cjs
          node --check desktop-electron/electron/preload.cjs
          node --check desktop-electron/electron/upstream-tools.cjs

      - name: Install exact Electron dependencies
        run: bun install --cwd desktop-electron --frozen-lockfile

      - name: Run focused upstream and packaging contracts
        run: |
          node --test \
            desktop-electron/tests/upstream-tools.test.cjs \
            desktop-electron/tests/rc7-full-integration-contract.test.cjs \
            desktop-electron/tests/packaging-contract.test.cjs \
            2>&1 | tee aiTemp/rc7-upstream-tools/evidence/contracts.txt
          grep -F '# fail 0' aiTemp/rc7-upstream-tools/evidence/contracts.txt

      - name: Typecheck and build production renderer in aiTemp
        run: |
          set -euo pipefail
          bun run --cwd desktop-electron typecheck \
            2>&1 | tee aiTemp/rc7-upstream-tools/evidence/typecheck.txt
          (
            cd desktop-electron
            bunx vite build \
              --outDir ../aiTemp/rc7-upstream-tools/renderer-dist \
              --emptyOutDir
          ) 2>&1 | tee aiTemp/rc7-upstream-tools/evidence/renderer-build.txt

      - name: Recheck exact source scope
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --diff-filter=D --name-only)"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            desktop-electron/electron/main.cjs \
            desktop-electron/electron/preload.cjs \
            desktop-electron/package.json \
            desktop-electron/src/App.tsx \
            desktop-electron/src/types.ts | sort)"
          test "$changed" = "$expected"

      - name: Commit verified upstream integration wiring
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            desktop-electron/electron/main.cjs \
            desktop-electron/electron/preload.cjs \
            desktop-electron/package.json \
            desktop-electron/src/App.tsx \
            desktop-electron/src/types.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Upstream Paseo and Anneal wiring is already committed.'
            exit 0
          fi
          git commit -m 'feat(rc7): embed pinned full Paseo and Anneal interfaces'
          git push origin HEAD:integration/v0.7.0-rc.7-full-paseo-anneal-provider-updater

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc7-upstream-tools-${{ github.sha }}
          path: aiTemp/rc7-upstream-tools/evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve transient dependencies in Trash
        if: always()
        run: |
          mkdir -p aiTemp/Trash/rc7-upstream-tools
          if [ -d desktop-electron/node_modules ]; then
            mv desktop-electron/node_modules \
              "aiTemp/Trash/rc7-upstream-tools/node_modules-$GITHUB_RUN_ID"
          fi
