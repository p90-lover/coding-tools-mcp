name: Recover verified v0.4.11 release v2

on:
  push:
    branches:
      - release/recover-v0.4.11-v2

permissions:
  contents: write
  actions: read

concurrency:
  group: recover-verified-v0.4.11-v2
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.4.11
  RELEASE_SOURCE: 546fbb37a82bd2e57ec019d8c361813af7615447
  SOURCE_RUN_ID: '34942004718'
  CARGO_TARGET_DIR: ${{ github.workspace }}/aiTemp/audit-target
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'

      - name: Verify, read back, and publish exact release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/recover_v0_4_11.sh

      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-recovery-v2-${{ github.run_id }}
          path: |
            aiTemp/recovery-evidence/
            aiTemp/source-run-meta/
            aiTemp/release-meta/
          if-no-files-found: error
          retention-days: 14
