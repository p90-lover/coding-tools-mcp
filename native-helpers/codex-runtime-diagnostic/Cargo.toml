[package]
name = "codex-runtime-diagnostic"
version = "0.4.2-rc.1"
edition = "2021"
license = "MIT"
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
uuid = { version = "=1.23.4", features = ["v4"] }
[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
