[package]
name = "coding-tools-headless"
version = "0.6.0-rc.1"
description = "Authenticated loopback control service for the Electron-first Coding Tools desktop"
authors = ["Coding Tools MCP Contributors"]
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "coding_tools_headless"
path = "src/lib.rs"

[[bin]]
name = "coding-tools-headless"
path = "src/main.rs"

[dependencies]
coding-tools-core = { path = "../coding-tools-core" }
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
